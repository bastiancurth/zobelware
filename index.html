        }

        // Wölfe spawnen - langsamer für bessere Spielbarkeit
        this.wolves = [];
        this.spawnTimer = this.time.addEvent({
            delay: 800,
            callback: () => {
                if (this.hasEnded) return;
                const side = Phaser.Math.Between(0, 3);
                let x, y, vx = 0, vy = 0;
                if (side === 0) { x = -20; y = Phaser.Math.Between(100, 500); vx = 3; }
                else if (side === 1) { x = 820; y = Phaser.Math.Between(100, 500); vx = -3; }
                else if (side === 2) { x = Phaser.Math.Between(100, 700); y = -20; vy = 3; }
                else { x = Phaser.Math.Between(100, 700); y = 620; vy = -3; }
                const wolf = this.add.circle(x, y, 15, 0x444444);
                wolf.vx = vx; wolf.vy = vy;
                this.wolves.push(wolf);
            },
            loop: true
        });

        this.cursors = this.input.keyboard.createCursorKeys();
        this.startSurvivalTimer();  // Überleben = Gewinnen!
    }
    update() {
        super.update();
        if (this.hasEnded) return;

        const speed = 5;
        if (this.isLeft()) {
            this.playerX -= speed;
            if (this.player.play) this.player.play('kaeppchen_left', true);
        } else if (this.isRight()) {
            this.playerX += speed;
            if (this.player.play) this.player.play('kaeppchen_right', true);
        } else if (this.isUp()) {
            this.playerY -= speed;
            if (this.player.play) this.player.play('kaeppchen_up', true);
        } else if (this.isDown()) {
            this.playerY += speed;
            if (this.player.play) this.player.play('kaeppchen_down', true);
        }

        this.playerX = Phaser.Math.Clamp(this.playerX, 30, 770);
        this.playerY = Phaser.Math.Clamp(this.playerY, 60, 540);
        this.player.x = this.playerX;
        this.player.y = this.playerY;

        // Wölfe bewegen und außerhalb des Bildes aufräumen
        for (let i = this.wolves.length - 1; i >= 0; i--) {
            const wolf = this.wolves[i];
            wolf.x += wolf.vx;
            wolf.y += wolf.vy;
            if (wolf.x < -60 || wolf.x > 860 || wolf.y < -60 || wolf.y > 660) {
                wolf.destroy();
                this.wolves.splice(i, 1);
                continue;
            }
            if (Phaser.Math.Distance.Between(this.playerX, this.playerY, wolf.x, wolf.y) < 30) {
                this.lose();
                return;
            }
        }
    }
}

        // Plattformen - größer für bessere Spielbarkeit
        this.platforms = [
            this.add.rectangle(150, 450, 180, 25, 0x7f8c8d),
            this.add.rectangle(400, 350, 180, 25, 0x7f8c8d),
            this.add.rectangle(650, 250, 180, 25, 0x7f8c8d)
        ];

        // Boden
        this.add.rectangle(400, 550, 800, 40, 0x2d3436);

        // Edgar
        this.edgarX = 150;
        this.edgarY = 400;
        this.velocityY = 0;
        this.onGround = true;

        if (this.textures.exists('edgar')) {
            this.edgar = this.add.image(this.edgarX, this.edgarY, 'edgar').setScale(2.0);
        } else {
            this.edgar = this.add.circle(this.edgarX, this.edgarY, 20, 0x9B59B6);
        }

        this.input.keyboard.on('keydown-SPACE', () => {
            if (this.onGround && !this.hasEnded) {
                this.velocityY = -15;
                this.onGround = false;
            }
        });

        this.cursors = this.input.keyboard.createCursorKeys();
        this.startTimer();
    }
    update() {
        super.update();
        if (this.hasEnded) return;

        // Horizontale Bewegung
        if (this.isLeft()) {
            this.edgarX -= 4;
            this.edgar.angle -= 5;
        } else if (this.isRight()) {
            this.edgarX += 4;
            this.edgar.angle += 5;
        }
        this.edgarX = Phaser.Math.Clamp(this.edgarX, 30, 770);

        // Schwerkraft
        this.velocityY += 0.8;
        this.edgarY += this.velocityY;

        // Boden-Check
        if (this.edgarY >= 510) {
            this.edgarY = 510;
            this.velocityY = 0;
            this.onGround = true;
        }

        // Plattform-Check - größerer Bereich für größere Plattformen
        this.platforms.forEach((plat, idx) => {
            if (this.velocityY > 0 &&
                this.edgarX > plat.x - 100 && this.edgarX < plat.x + 100 &&
                this.edgarY > plat.y - 30 && this.edgarY < plat.y + 15) {
                this.edgarY = plat.y - 20;
                this.velocityY = 0;
                this.onGround = true;
                // Zähle als Bounce wenn neue Plattform
                if (!plat.bounced) {
                    plat.bounced = true;
                    this.bounces++;
                    this.bounceText.setText(this.bounces + ' / ' + this.target);
                    musicEngine.playSFX('click');
                    if (this.bounces >= this.target) this.win();
                }
            }
        });

        this.edgar.x = this.edgarX;
        this.edgar.y = this.edgarY;
    }
}

class EdgarGoal extends BaseMicrogame {

    create() {

        this.cameras.main.setBackgroundColor('#27ae60');

        this.add.text(400, 30, 'Schieß ins Tor!', { font: '18px Orbitron', fill: '#fff' }).setOrigin(0.5);

        // Tor an zufälliger Position (links, mitte, rechts)
        const goalPositions = [200, 400, 600];
        this.goalX = Phaser.Utils.Array.GetRandom(goalPositions);
        this.add.rectangle(this.goalX, 80, 150, 60, 0xffffff, 0.3);
        this.add.rectangle(this.goalX, 80, 150, 60).setStrokeStyle(4, 0xffffff);

        // Edgar startet mittig
        this.edgarX = 400;
        this.edgarY = 450;
        this.velocityX = 0;
        this.velocityY = 0;
        this.kicked = false;

        if (this.textures.exists('edgar')) {
            this.edgar = this.add.image(this.edgarX, this.edgarY, 'edgar').setScale(2.5);
        } else {
            this.edgar = this.add.circle(this.edgarX, this.edgarY, 25, 0x9B59B6);
        }

        // Ziel-Pfeil
        this.arrow = this.add.triangle(this.edgarX, this.edgarY - 50, 0, 20, 10, 0, 20, 20, 0x00ff00);
        this.arrowAngle = -90;

        this.cursors = this.input.keyboard.createCursorKeys();

        this.input.keyboard.on('keydown-SPACE', () => {
            if (!this.kicked && !this.hasEnded) {
                this.kicked = true;
                const rad = this.arrowAngle * Math.PI / 180;
                this.velocityX = Math.cos(rad) * 12;
                this.velocityY = Math.sin(rad) * 12;
                this.arrow.visible = false;
            }
        });

        this.startTimer();
    }
    update() {
        super.update();
        if (this.hasEnded) return;

        if (!this.kicked) {
            // Pfeil bewegen
            if (this.isLeft()) this.arrowAngle -= 3;
            if (this.isRight()) this.arrowAngle += 3;
            this.arrowAngle = Phaser.Math.Clamp(this.arrowAngle, -150, -30);

            const rad = this.arrowAngle * Math.PI / 180;
            this.arrow.x = this.edgarX + Math.cos(rad) * 50;
            this.arrow.y = this.edgarY + Math.sin(rad) * 50;
            this.arrow.angle = this.arrowAngle + 90;
        } else {
            // Ball bewegt sich
            this.edgarX += this.velocityX;
            this.edgarY += this.velocityY;
            this.edgar.x = this.edgarX;
            this.edgar.y = this.edgarY;
            this.edgar.angle += this.velocityX * 2;

            // Tor getroffen?
            if (this.edgarY < 110 && this.edgarX > this.goalX - 75 && this.edgarX < this.goalX + 75) {
                this.win();
            }

            // Daneben?
            if (this.edgarY < 50 || this.edgarX < 0 || this.edgarX > 800) {
                this.lose();
            }
        }
    }
}

            this.swaggy = this.add.image(this.swaggyX, this.swaggyY, 'swaggy').setScale(0.06);
        } else {
            this.swaggy = this.add.circle(this.swaggyX, this.swaggyY, 20, 0xFFA500);
        }

        this.input.keyboard.on('keydown-SPACE', () => {
            if (this.hasEnded || !this.onGround) return;
            this.velY = -12;
            this.onGround = false;
        });
        this.input.on('pointerdown', () => {
            if (this.hasEnded || !this.onGround) return;
            this.velY = -12;
            this.onGround = false;
        });

        // Vorwärtstempo so wählen, dass die Zielplattform in der verfügbaren
        // Zeit erreichbar ist (vorher war das Spiel ab Tempo 1.0 unschaffbar).
        this.autoSpeed = (700 - this.swaggyX) / ((this.duration / 1000) * 0.72) / 60;
        this.startTimer();
    }
    update() {
        super.update();
        if (this.hasEnded) return;

        this.velY += 0.5; // Gravity
        this.swaggyY += this.velY;
        this.swaggyX += this.autoSpeed; // Auto move right

        // Platform collision
        this.platforms.forEach((p, i) => {
            if (this.swaggyX > p.x - 60 && this.swaggyX < p.x + 60 &&
                this.swaggyY > p.y - 30 && this.swaggyY < p.y && this.velY > 0) {
                this.swaggyY = p.y - 20;
                this.velY = 0;
                this.onGround = true;
                if (i === 4) this.win(); // Reached goal
            }
        });

        if (this.swaggyY > 600) this.lose();
        this.swaggy.x = this.swaggyX;
        this.swaggy.y = this.swaggyY;
    }
}

class DudeSlide extends BaseMicrogame {
    constructor() { super({ key: 'DudeSlide' }); }
    create() {
        super.create();
        this.cameras.main.setBackgroundColor('#1a1a2e');
        this.add.text(400, 30, 'Rutsche runter! ← →', { font: '18px Orbitron', fill: '#fff' }).setOrigin(0.5);

        // Trashi - startet höher für mehr Reaktionszeit
        this.dudeX = 400; this.dudeY = 80;
        if (this.textures.exists('dude')) {
            this.dude = this.add.sprite(this.dudeX, this.dudeY, 'dude', 4).setScale(2.5);
        } else {
            this.dude = this.add.rectangle(this.dudeX, this.dudeY, 30, 45, 0x4169E1);
        }

        // Hindernisse - erste Reihe leer, danach weniger dichte Hindernisse
        this.obstacles = [];
        // Keine Hindernisse in den ersten 150 Pixeln (Startzone)
        for (let row = 0; row < 3; row++) {
            const y = 280 + row * 90;
            // Hindernisse mit Lücken, garantiert durchquerbar
            const numObs = 2;
            const positions = Phaser.Utils.Array.Shuffle([120, 280, 400, 520, 680]).slice(0, numObs);
            positions.forEach(x => {
                const obs = this.add.rectangle(x, y, 50, 15, 0xff6b6b);
                this.obstacles.push(obs);
            });
        }

        // Ziel
        this.goal = this.add.rectangle(400, 550, 250, 30, 0x00ff88);
        this.add.text(400, 550, 'ZIEL', { font: 'bold 14px Orbitron', fill: '#000' }).setOrigin(0.5);

        // Rutschtempo an die verfügbare Zeit koppeln, damit das Ziel bei
        // jedem Spieltempo rechtzeitig erreichbar bleibt.
        this.slideSpeed = 470 / ((this.duration / 1000) * 0.78);

        this.cursors = this.input.keyboard.createCursorKeys();
        this.startTimer();
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;

        if (this.isLeft()) this.dudeX -= 360 * dt;
        if (this.isRight()) this.dudeX += 360 * dt;
        this.dudeX = Phaser.Math.Clamp(this.dudeX, 30, 770);
        this.dudeY += this.slideSpeed * dt; // Auto slide down

        this.dude.x = this.dudeX;
        this.dude.y = this.dudeY;
        if (this.dude.play && (this.isLeft() || this.isRight())) {
            this.dude.play(this.isLeft() ? 'dude_left' : 'dude_right', true);
        }

        // Check obstacle collision
        this.obstacles.forEach(obs => {
            if (Math.abs(this.dudeX - obs.x) < 45 && Math.abs(this.dudeY - obs.y) < 25) {
                this.lose();
            }
        });

        // Check goal
        if (this.dudeY > 530) this.win();
    }
}

class EdgarPinball extends BaseMicrogame {
    constructor() { super({ key: 'EdgarPinball' }); }
    create() {
        super.create();
        this.cameras.main.setBackgroundColor('#1a0a2e');
        this.add.text(400, 30, 'Triff einen Bumper! ← →', { font: '18px Orbitron', fill: '#fff' }).setOrigin(0.5);

        // Flipper
        this.flipperX = 400;
        this.flipper = this.add.rectangle(this.flipperX, 530, 120, 15, 0x9B59B6);

        // Edgar als Ball - startet oben und fällt Richtung Paddle
        this.edgarX = 400; this.edgarY = 120;
        this.velX = 0; this.velY = 2;
        if (this.textures.exists('edgar')) {
            this.edgar = this.add.image(this.edgarX, this.edgarY, 'edgar').setScale(2);
        } else {
            this.edgar = this.add.circle(this.edgarX, this.edgarY, 20, 0x9B59B6);
        }

        // 3 Leben
        this.lives = 3;
        this.livesText = this.add.text(700, 30, '❤️'.repeat(this.lives), { font: '24px Arial' }).setOrigin(0.5);

        // Bumper - 3 Stück, nur 1 treffen reicht
        this.bumpers = [];
        const positions = [[200, 280], [400, 200], [600, 280]];
        positions.forEach(p => {
            const b = this.add.circle(p[0], p[1], 30, 0xFFD700);
            b.setStrokeStyle(3, 0xffffff);
            b.hit = false;
            this.bumpers.push(b);
        });

        this.cursors = this.input.keyboard.createCursorKeys();
        this.startSurvivalTimer();
    }
    update() {
        super.update();
        if (this.hasEnded) return;

        // Flipper bewegen
        if (this.isLeft()) this.flipperX -= 8;
        if (this.isRight()) this.flipperX += 8;
        this.flipperX = Phaser.Math.Clamp(this.flipperX, 80, 720);
        this.flipper.x = this.flipperX;

        // Edgar Ball Physik
        this.edgarX += this.velX;
        this.edgarY += this.velY;
        this.velY += 0.12; // Gravity

        // Wand-Kollision
        if (this.edgarX < 30 || this.edgarX > 770) this.velX *= -1;
        if (this.edgarY < 50) this.velY *= -1;

        // Flipper Kollision
        if (this.edgarY > 510 && this.edgarY < 540 && Math.abs(this.edgarX - this.flipperX) < 70) {
            this.velY = -9;
            this.velX = (this.edgarX - this.flipperX) / 10;
            musicEngine.playSFX('click');
        }

        // Bumper Kollision - 1 Treffer = Gewonnen!
        this.bumpers.forEach(b => {
            if (!b.hit && Phaser.Math.Distance.Between(this.edgarX, this.edgarY, b.x, b.y) < 50) {
                b.hit = true;
                b.setFillStyle(0x00ff88);
                this.velY *= -1.2;
                this.velX += Phaser.Math.Between(-2, 2);
                this.win();
            }
        });

        // Ball verloren - Leben abziehen
        if (this.edgarY > 580) {
            this.lives--;
            this.livesText.setText('❤️'.repeat(this.lives));
            if (this.lives <= 0) {
                this.lose();
            } else {
                // Ball respawnen
                this.edgarX = 400;
                this.edgarY = 120;
                this.velX = 0;
                this.velY = 2;
            }
        }

        this.edgar.x = this.edgarX;
        this.edgar.y = this.edgarY;
        this.edgar.angle += this.velX * 2;
    }
}

// ReactionTest - Warten bis es grün wird, dann sofort reagieren
class ReactionTest extends BaseMicrogame {
    constructor() { super({ key: 'ReactionTest' }); }
    create() {
        super.create();
        this.gradientBackground(0x2b1a3d, 0x120a1c);
        this.gameTitle('REAKTION!', '#ffd93d');
        this.hint('Warte auf GRÜN - zu früh ist verloren!');

        this.lamp = this.add.circle(400, 300, 90, 0xff3355).setStrokeStyle(6, 0xffffff);
        this.label = this.add.text(400, 300, 'WARTE', { font: 'bold 30px Orbitron', fill: '#ffffff' }).setOrigin(0.5);
        this.isGreen = false;

        const waitTime = Phaser.Math.Between(700, Math.max(1000, this.duration * 0.55));
        this.time.delayedCall(waitTime, () => {
            if (this.hasEnded) return;

            Effects.ring(this, 400, 300, 0x00ff88, 160);
            this.tweens.add({ targets: this.lamp, scale: 1.15, duration: 120, yoyo: true, repeat: -1 });
        });

            if (this.isGreen) this.win();
            else {
                this.label.setText('ZU FRÜH!');
                this.lose();
            }
        };
        this.input.on('pointerdown', react);
        this.input.keyboard.on('keydown-SPACE', react);
        this.startTimer();
    }
}

// WhackAMole - auftauchende Ziele schnell treffen
class WhackAMole extends BaseMicrogame {
    constructor() { super({ key: 'WhackAMole' }); }
    create() {
        super.create();
        this.gradientBackground(0x3d2b1a, 0x1a1108);
        this.gameTitle('HAU DRAUF!', '#ffd93d');
        this.hits = 0;
        this.target = 4;
        this.counterText = this.counter('0 / ' + this.target, '#ffd93d');
        this.hint('Klicke die Zobel, sobald sie auftauchen');

        // Löcher im Raster
        this.holes = [];
        const cols = 4, rows = 2;
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const x = 170 + c * 155, y = 250 + r * 150;
                this.add.ellipse(x, y + 26, 108, 34, 0x1a1108).setStrokeStyle(3, 0x4a3728);
                const mole = this.add.container(x, y).setAlpha(0);
                if (this.textures.exists('zobel')) {
                    mole.add(this.add.image(0, 0, 'zobel').setScale(0.11));
                } else {
                    const g = this.add.graphics();
                    g.fillStyle(0x8B7355, 1); g.fillCircle(0, 0, 30);
                    g.fillStyle(0x000000, 1); g.fillCircle(-10, -6, 4); g.fillCircle(10, -6, 4);
                    mole.add(g);
                }
                mole.setSize(100, 90);
                mole.setInteractive(new Phaser.Geom.Rectangle(-50, -45, 100, 90), Phaser.Geom.Rectangle.Contains, { useHandCursor: true });
                mole.isUp = false;
                mole.on('pointerdown', () => this.whack(mole));
                this.holes.push(mole);
            }
        }

        this.popTimer = this.time.addEvent({
            delay: Math.max(320, 620 / this.gameSpeed),
            callback: this.popRandom, callbackScope: this, loop: true
        });
        this.popRandom();
        this.startTimer();
    }
    popRandom() {
        if (this.hasEnded) return;
        const down = this.holes.filter(m => !m.isUp);
        if (down.length === 0) return;
        const mole = Phaser.Utils.Array.GetRandom(down);
        mole.isUp = true;
        this.tweens.add({ targets: mole, alpha: 1, y: mole.y - 18, duration: 140, ease: 'Back.easeOut' });
        this.time.delayedCall(Math.max(500, 900 / this.gameSpeed), () => {
            if (this.hasEnded || !mole.isUp) return;
            mole.isUp = false;
            this.tweens.add({ targets: mole, alpha: 0, y: mole.y + 18, duration: 140 });
        });
    }
    whack(mole) {
        if (this.hasEnded || !mole.isUp || this.inputBufferActive) return;
        mole.isUp = false;
        Effects.burst(this, mole.x, mole.y, 0xffd93d, 10, 70);
        musicEngine.playSFX('click');
        this.tweens.add({ targets: mole, alpha: 0, y: mole.y + 18, duration: 120 });
        this.hits++;
        this.counterText.setText(this.hits + ' / ' + this.target);
        if (this.hits >= this.target) this.win();
    }
}

// CountThem - Objekte zählen und die richtige Zahl wählen
class CountThem extends BaseMicrogame {
    constructor() { super({ key: 'CountThem' }); }
    create() {
        super.create();
        this.gradientBackground(0x14304a, 0x081420);
        this.gameTitle('ZÄHLEN!', '#00d4ff');
        this.hint('Wie viele Nüsse liegen herum?');

        const count = Phaser.Math.Between(4, 11);
        this.correct = count;
        for (let i = 0; i < count; i++) {
            const nut = this.add.text(
                Phaser.Math.Between(80, 720), Phaser.Math.Between(130, 400),
                '🌰', { font: '34px Arial' }
            ).setOrigin(0.5);
            this.tweens.add({
                targets: nut, angle: Phaser.Math.Between(-15, 15),
                duration: Phaser.Math.Between(700, 1400), yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
            });
        }

        // Antwortmöglichkeiten: richtige Zahl plus zwei nahe Alternativen
        const options = new Set([count]);
        while (options.size < 3) {
            const alt = count + Phaser.Math.Between(-3, 3);
            if (alt > 0 && alt !== count) options.add(alt);
        }
        const shuffled = Phaser.Utils.Array.Shuffle([...options]);
        shuffled.forEach((val, i) => {
            UI.button(this, 250 + i * 150, 490, 110, 60, String(val), {
                color: UI.CYAN,
                fontSize: 26,
                onClick: () => {
                    if (this.hasEnded || this.inputBufferActive) return;
                    if (val === this.correct) this.win(); else this.lose();
                }
            });
        });
        this.startTimer();
    }
}

// AvoidLaser - angekündigten Laserstrahlen ausweichen
class AvoidLaser extends BaseMicrogame {
    constructor() { super({ key: 'AvoidLaser' }); }
    create() {
        super.create();
        this.gradientBackground(0x1b0b2b, 0x070310);
        this.gameTitle('LASER!', '#ff3355');
        this.hint('← → ausweichen und überleben');

        this.playerX = 400;
        this.player = CharacterManager.draw(this, this.playerX, 470, 0.55);
        this.lasers = [];

        this.laserTimer = this.time.addEvent({
            delay: Math.max(420, 800 / this.gameSpeed),
            callback: this.spawnLaser, callbackScope: this, loop: true
        });
        this.spawnLaser();

        this.cursors = this.input.keyboard.createCursorKeys();
        this.startSurvivalTimer();
    }
    spawnLaser() {
        if (this.hasEnded) return;
        const x = Phaser.Math.Between(80, 720);
        // Warnlinie zuerst, damit ausweichen fair möglich ist
        const warn = this.add.rectangle(x, 300, 8, 600, 0xff3355, 0.35);
        this.tweens.add({ targets: warn, alpha: 0.8, duration: 120, yoyo: true, repeat: 3 });
        this.time.delayedCall(Math.max(380, 620 / this.gameSpeed), () => {
            if (this.hasEnded) { warn.destroy(); return; }
            warn.destroy();
            const beam = this.add.rectangle(x, 300, 44, 600, 0xff3355, 0.85);
            beam.setStrokeStyle(3, 0xffffff, 0.7);
            beam.deadly = true;
            this.lasers.push(beam);
            musicEngine.playSFX('click');
            this.time.delayedCall(360, () => {
                beam.deadly = false;
                this.tweens.add({
                    targets: beam, alpha: 0, duration: 180,
                    onComplete: () => {
                        const i = this.lasers.indexOf(beam);
                        if (i >= 0) this.lasers.splice(i, 1);
                        beam.destroy();
                    }
                });
            });
        });
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;

        if (this.isLeft()) this.playerX -= 380 * dt;
        if (this.isRight()) this.playerX += 380 * dt;
        this.playerX = Phaser.Math.Clamp(this.playerX, 40, 760);
        this.player.x = this.playerX;

        for (const beam of this.lasers) {
            if (beam.deadly && Math.abs(beam.x - this.playerX) < 34) { this.lose(); return; }
        }
    }
}

// KeyDuel - Tauziehen gegen den Computer
class KeyDuel extends BaseMicrogame {
    constructor() { super({ key: 'KeyDuel' }); }
    create() {
        super.create();
        this.gradientBackground(0x1d2b1a, 0x0a1008);
        this.gameTitle('TAUZIEHEN!', '#00ff88');
        this.hint('Hämmere auf SPACE, um das Seil zu ziehen');

        this.rope = 400;            // 400 = Mitte, <200 gewonnen, >600 verloren
        this.cpuPower = 42 * this.gameSpeed;

        this.add.rectangle(400, 300, 700, 8, 0x4a4a5a);
        this.add.rectangle(200, 300, 6, 60, 0x00ff88);
        this.add.rectangle(600, 300, 6, 60, 0xff3355);
        this.knot = this.add.circle(400, 300, 20, 0xffd93d).setStrokeStyle(3, 0xffffff);

        this.you = CharacterManager.draw(this, 120, 300, 0.5);
        this.foe = this.add.text(680, 300, '👹', { font: '58px Arial' }).setOrigin(0.5);

        const pull = () => {
            if (this.hasEnded || this.inputBufferActive) return;
            this.rope -= 26;
            this.tweens.add({ targets: this.knot, scale: 1.3, duration: 70, yoyo: true });
        };
        this.input.keyboard.on('keydown-SPACE', pull);
        this.input.keyboard.on('keydown', (e) => { if (e && e.repeat) return; if (e && e.keyCode === 32) return; pull(); });
        this.input.on('pointerdown', pull);
        this.startTimer();
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;

        this.rope += this.cpuPower * dt;
        this.rope = Phaser.Math.Clamp(this.rope, 150, 650);
        this.knot.x = this.rope;
        this.you.x = this.rope - 280;
        this.foe.x = this.rope + 280;

        if (this.rope <= 200) this.win();
        else if (this.rope >= 600) this.lose();
    }
}

            musicEngine.playSFX('click');
            if (this.height >= this.targetHeight) this.win();
        });
        this.startTimer();

}

// SwaggyFlappy - durch Lücken zwischen Korallen tauchen
class SwaggyFlappy extends BaseMicrogame {
    constructor() { super({ key: 'SwaggyFlappy' }); }
    create() {
        super.create();
        this.gradientBackground(0x0a4d6e, 0x02121d);
        this.gameTitle('TAUCHEN!', '#87CEEB');
        this.hint('SPACE / Klick zum Auftauchen');

        this.fishY = 300;
        this.velY = 0;
        this.passed = 0;
        this.target = 2;
        this.counterText = this.counter('0 / ' + this.target, '#87CEEB');

        if (this.textures.exists('swaggy')) {
            this.fish = this.add.image(200, this.fishY, 'swaggy').setScale(0.09);
        } else {
            this.fish = this.add.circle(200, this.fishY, 20, 0xFFA500);
        }

        // Hindernispaare
        this.gates = [];
        this.gateSpeed = 210 * this.gameSpeed;
        this.spawnGate(560);
        this.spawnGate(880);

        const flap = () => { if (!this.hasEnded) this.velY = -260; };
        this.input.keyboard.on('keydown-SPACE', flap);
        this.input.on('pointerdown', flap);
        this.startTimer();
    }
    spawnGate(x) {
        const gapY = Phaser.Math.Between(200, 420);
        const gapH = 170;
        const top = this.add.rectangle(x, (gapY - gapH / 2) / 2, 56, gapY - gapH / 2, 0x1f7a5a).setStrokeStyle(3, 0x2ecc71);
        const bottom = this.add.rectangle(x, (gapY + gapH / 2 + 600) / 2, 56, 600 - (gapY + gapH / 2), 0x1f7a5a).setStrokeStyle(3, 0x2ecc71);
        this.gates.push({ top, bottom, x, gapY, gapH, scored: false });
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;

        this.velY += 900 * dt;
        this.fishY += this.velY * dt;
        this.fish.y = this.fishY;
        this.fish.angle = Phaser.Math.Clamp(this.velY / 14, -35, 35);

        if (this.fishY < 100 || this.fishY > 545) { this.lose(); return; }

        for (const gate of this.gates) {
            gate.x -= this.gateSpeed * dt;
            gate.top.x = gate.x;
            gate.bottom.x = gate.x;

            // Kollision
            if (Math.abs(gate.x - 200) < 46) {
                if (this.fishY < gate.gapY - gate.gapH / 2 + 14 || this.fishY > gate.gapY + gate.gapH / 2 - 14) {
                    this.lose();
                    return;
                }
            }
            // Durchgekommen
            if (!gate.scored && gate.x < 200 - 46) {
                gate.scored = true;
                this.passed++;
                this.counterText.setText(this.passed + ' / ' + this.target);
                musicEngine.playSFX('click');
                if (this.passed >= this.target) { this.win(); return; }
            }
            // Wiederverwenden
            if (gate.x < -60) {
                gate.x = 860;
                gate.gapY = Phaser.Math.Between(200, 420);
                gate.scored = false;
                gate.top.setSize(56, gate.gapY - gate.gapH / 2);
                gate.top.y = (gate.gapY - gate.gapH / 2) / 2;
                gate.bottom.setSize(56, 600 - (gate.gapY + gate.gapH / 2));
                gate.bottom.y = (gate.gapY + gate.gapH / 2 + 600) / 2;
            }
        }
    }
}

        this.fishX = 400;
        if (this.textures.exists('swaggy')) {

        } else {
            this.fish = this.add.circle(this.fishX, 470, 22, 0xFFA500);
        }

        this.hooks = [];
        this.hookTimer = this.time.addEvent({
            delay: Math.max(400, 750 / this.gameSpeed),
            callback: this.dropHook, callbackScope: this, loop: true
        });
        this.dropHook();

        this.cursors = this.input.keyboard.createCursorKeys();
        this.startSurvivalTimer();
    }
    dropHook() {
        if (this.hasEnded) return;
        const x = Phaser.Math.Between(60, 740);
        const line = this.add.rectangle(x, 100, 2, 0, 0xffffff, 0.7).setOrigin(0.5, 0);
        const hook = this.add.text(x, 110, '🪝', { font: '30px Arial' }).setOrigin(0.5);
        hook.vy = Phaser.Math.Between(190, 280) * this.gameSpeed;
        hook.line = line;
        this.hooks.push(hook);
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;

        if (this.isLeft()) this.fishX -= 340 * dt;
        if (this.isRight()) this.fishX += 340 * dt;
        this.fishX = Phaser.Math.Clamp(this.fishX, 40, 760);
        this.fish.x = this.fishX;

        for (let i = this.hooks.length - 1; i >= 0; i--) {
            const hook = this.hooks[i];
            hook.y += hook.vy * dt;
            hook.line.height = hook.y - 100;
            if (hook.y > 620) {
                hook.line.destroy(); hook.destroy();
                this.hooks.splice(i, 1);
                continue;
            }
            if (Math.abs(hook.x - this.fishX) < 30 && Math.abs(hook.y - 470) < 34) { this.lose(); return; }
        }
    }
}

        this.watching = false;
        this.scheduleWolf();

        this.cursors = this.input.keyboard.createCursorKeys();
        this.startTimer();
    }
    scheduleWolf() {
        if (this.hasEnded) return;
        const delay = this.watching
            ? Phaser.Math.Between(600, 1100)
            : Phaser.Math.Between(700, 1300) / this.gameSpeed;
        this.time.delayedCall(delay, () => {
            if (this.hasEnded) return;
            this.watching = !this.watching;
            if (this.watching) {
                this.statusText.setText('WOLF SCHAUT!').setColor('#ff3355');
                this.wolf.setText('👀');
                this.tweens.add({ targets: this.wolf, scale: 1.25, duration: 120, yoyo: true });
            } else {
                this.statusText.setText('WOLF SCHLÄFT').setColor('#00ff88');
                this.wolf.setText('🐺');
            }
            this.scheduleWolf();
        });
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;

        const moving = this.isRight() || this.isLeft();
        if (this.isRight()) this.playerX += 250 * dt;
        if (this.isLeft()) this.playerX -= 250 * dt;
        this.playerX = Phaser.Math.Clamp(this.playerX, 30, 780);
        this.player.x = this.playerX;

        if (moving && this.player.play) this.player.play('kaeppchen_right', true);
        else if (this.player.play) this.player.play('kaeppchen_idle', true);

        // Beim Blick des Wolfs ist jede Bewegung tödlich
        if (this.watching && moving && !this.inputBufferActive) {
            this.cameras.main.shake(150, 0.015);
            this.lose();
            return;
        }
        if (this.playerX >= 720) this.win();
    }
}

// EdgarGolf - Kraft dosieren und einlochen
class EdgarGolf extends BaseMicrogame {
    constructor() { super({ key: 'EdgarGolf' }); }
    create() {
        super.create();
        this.gradientBackground(0x2f8f4f, 0x14401f);
        this.gameTitle('MINIGOLF!', '#ffffff');
        this.hint('SPACE: Kraft stoppen und schlagen');

        // Loch an wechselnder Position
        this.holeX = Phaser.Math.Between(480, 700);
        this.add.ellipse(this.holeX, 420, 60, 26, 0x000000);
        this.add.rectangle(this.holeX, 375, 4, 60, 0xffffff);
        this.add.triangle(this.holeX + 16, 355, 0, 0, 0, 24, 30, 12, 0xff3355);

        this.edgarX = 130;
        this.edgar = this.textures.exists('edgar')
            ? this.add.image(this.edgarX, 420, 'edgar').setScale(2.2)
            : this.add.circle(this.edgarX, 420, 18, 0x9B59B6);

        // Kraftbalken
        this.add.rectangle(400, 520, 404, 30, 0x000000, 0.5);
        this.add.rectangle(400, 520, 404, 30).setStrokeStyle(2, 0xffffff, 0.6);
        this.powerBar = this.add.rectangle(200, 520, 0, 22, 0x00ff88).setOrigin(0, 0.5);
        // Reichweite bei voller Kraft (ergibt sich aus Anstoß + Ausrollen);
        // daraus wird die Idealmarkierung berechnet, damit sie wirklich stimmt.
        this.travelFactor = 690;
        const ideal = Phaser.Math.Clamp((this.holeX - this.edgarX) / this.travelFactor, 0, 1);
        this.add.rectangle(200 + 400 * ideal, 520, 6, 34, 0xffd93d);
        this.add.rectangle(200 + 400 * ideal, 520, 34, 30, 0xffd93d, 0.2);

        this.power = 0;
        this.powerDir = 1;
        this.shot = false;
        this.velX = 0;

        this.input.keyboard.on('keydown-SPACE', () => this.shoot());
        this.input.on('pointerdown', () => this.shoot());
        this.startTimer();
    }
    shoot() {
        if (this.hasEnded || this.shot || this.inputBufferActive) return;
        this.shot = true;
        this.velX = this.power * 620;   // Kraft in Reichweite umrechnen
        musicEngine.playSFX('click');
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;

        if (!this.shot) {
            this.power += this.powerDir * 1.1 * dt * this.gameSpeed;
            if (this.power >= 1) { this.power = 1; this.powerDir = -1; }
            if (this.power <= 0) { this.power = 0; this.powerDir = 1; }
            this.powerBar.width = 400 * this.power;
            return;
        }

        // Ausrollen
        this.velX *= 0.985;
        this.edgarX += this.velX * dt;
        this.edgar.x = this.edgarX;
        this.edgar.angle += this.velX * dt * 2;

        // Großzügige Lochweite: der Ball fällt rein, solange er nicht rast
        if (Math.abs(this.edgarX - this.holeX) < 30 && Math.abs(this.velX) < 420) {
            Effects.burst(this, this.holeX, 420, 0xffd93d, 16, 110);
            this.win();
            return;
        }
        if (this.edgarX > 790 || Math.abs(this.velX) < 8) this.lose();
    }
}

        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;

        if (this.isLeft()) this.paddleX -= 480 * dt;
        if (this.isRight()) this.paddleX += 480 * dt;
        this.paddleX = Phaser.Math.Clamp(this.paddleX, 70, 730);
        this.paddle.x = this.paddleX;

        this.ballX += this.ballVX * dt;
        this.ballY += this.ballVY * dt;

        if (this.ballX < 20 || this.ballX > 780) this.ballVX *= -1;
        if (this.ballY < 110) this.ballVY = Math.abs(this.ballVY);

        // Paddel
        if (this.ballY > 500 && this.ballY < 528 && Math.abs(this.ballX - this.paddleX) < 72 && this.ballVY > 0) {
            this.ballVY = -Math.abs(this.ballVY);
            this.ballVX = ((this.ballX - this.paddleX) / 65) * 300;
            musicEngine.playSFX('click');
        }

        // Steine treffen
        for (const b of this.bricks) {
            if (!b.alive) continue;
            if (Math.abs(this.ballX - b.x) < 56 && Math.abs(this.ballY - b.y) < 24) {
                b.alive = false;
                Effects.burst(this, b.x, b.y, b.fillColor, 8, 60);
                b.destroy();
                this.ballVY *= -1;
                this.broken++;
                this.counterText.setText(this.broken + ' / ' + this.target);
                if (this.broken >= this.target) { this.win(); return; }
                break;
            }
        }

        this.ball.x = this.ballX;
        this.ball.y = this.ballY;
        this.ball.angle += this.ballVX * dt;

        if (this.ballY > 580) this.lose();
    }
}

// BlowCandles - alle Kerzen auspusten
class BlowCandles extends BaseMicrogame {
    constructor() { super({ key: 'BlowCandles' }); }
    create() {
        super.create();
        this.gradientBackground(0x2b1b3d, 0x0d0616);
        this.hint('Hämmere SPACE zum Pusten!', 560);

        // Torte
        this.add.rectangle(400, 430, 300, 110, 0xf4a7b9).setStrokeStyle(4, 0xd6849a);
        this.add.rectangle(400, 388, 300, 22, 0xfff0f3);

        this.candles = [];
        const count = 5;
        for (let i = 0; i < count; i++) {
            const x = 290 + i * 55;
            this.add.rectangle(x, 350, 12, 60, 0xfffacd).setStrokeStyle(2, 0xd8d0a0);
            const flame = this.add.ellipse(x, 310, 16, 26, 0xffa726);
            const glow = this.add.ellipse(x, 310, 30, 44, 0xffcc33, 0.25);
            this.tweens.add({ targets: [flame, glow], scaleY: 1.25, duration: 240, yoyo: true, repeat: -1, delay: i * 60 });
            this.candles.push({ flame, glow, lit: true });
        }

        this.blow = 0;
        this.needed = 12;
        this.counterText = this.counter('Puste!', '#ffd93d');

        const doBlow = () => {
            if (this.hasEnded || this.inputBufferActive) return;
            this.blow++;
            const perCandle = this.needed / count;
            const shouldOut = Math.floor(this.blow / perCandle);
            this.candles.forEach((c, i) => {
                if (c.lit && i < shouldOut) {
                    c.lit = false;
                    this.tweens.add({
                        targets: [c.flame, c.glow], alpha: 0, scaleY: 0.2, y: '-=18', duration: 180,
                        onComplete: () => { c.flame.destroy(); c.glow.destroy(); }
                    });
                    musicEngine.playSFX('click');
                }
            });
            const left = this.candles.filter(c => c.lit).length;
            this.counterText.setText(left > 0 ? left + ' Kerzen übrig' : 'Alle aus!');
            if (left === 0) this.win();
        };
        this.input.keyboard.on('keydown-SPACE', doBlow);
        this.input.keyboard.on('keydown', (e) => { if (e && (e.repeat || e.keyCode === 32)) return; doBlow(); });
        this.input.on('pointerdown', doBlow);
        this.startTimer();
    }
}

// BOSS GAMES
class BossGame extends BaseMicrogame {
    constructor() { super({ key: 'BossGame' }); }
    create() {
        super.create();
        this.markAsBoss();
        this.cameras.main.setBackgroundColor('#000000');

        // Anleitung
        this.add.text(400, 560, '← → Bewegen | SPACE Schießen', { font: '14px Orbitron', fill: '#888' }).setOrigin(0.5);

        // Spieler
        this.player = this.add.rectangle(400, 520, 50, 50, 0x00ff88);
        this.physics.add.existing(this.player);
        this.player.body.setCollideWorldBounds(true);
        this.cursors = this.input.keyboard.createCursorKeys();

        // Boss
        this.boss = this.add.rectangle(400, 100, 100, 80, 0xff0000);
        this.boss.health = Math.floor(10 * this.gameSpeed);
        this.bossMaxHealth = this.boss.health;
        this.tweens.add({
            targets: this.boss,
            x: { from: 100, to: 700 },
            duration: 2000,
            ease: 'Sine.easeInOut',
            yoyo: true,
            repeat: -1
        });

        // Health Bar
        this.healthBar = this.add.graphics();
        this.updateHealthBar();

        // Bullet Arrays
        this.playerBullets = [];
        this.bossBullets = [];

        // Input
        this.input.keyboard.on('keydown-SPACE', () => this.shoot());

        // Boss schießt regelmäßig
        this.time.addEvent({
            delay: 1200 / this.gameSpeed,
            callback: this.bossShoot,
            callbackScope: this,
            loop: true
        });
    }
    updateHealthBar() {
        this.drawBossHealth(this.healthBar, this.boss.health, this.bossMaxHealth, 200, 20);
    }
    shoot() {
        if (this.hasEnded) return;
        const bullet = this.add.rectangle(this.player.x, this.player.y - 30, 8, 24, 0x00ffff);
        this.physics.add.existing(bullet);
        bullet.body.setVelocityY(-500);
        this.playerBullets.push(bullet);
    }
    bossShoot() {
        if (this.hasEnded) return;
        const bullet = this.add.circle(this.boss.x, this.boss.y + 50, 12, 0xff00ff);
        this.physics.add.existing(bullet);
        // Richtung zum Spieler berechnen
        const angle = Phaser.Math.Angle.Between(this.boss.x, this.boss.y, this.player.x, this.player.y);
        const speed = 250 * this.gameSpeed;
        bullet.body.setVelocity(Math.cos(angle) * speed, Math.sin(angle) * speed);
        this.bossBullets.push(bullet);
    }
    hitBoss(bullet) {
        bullet.destroy();
        this.boss.health--;
        this.updateHealthBar();
        this.cameras.main.shake(50, 0.01);
        if (this.boss.health <= 0) this.win();
    }
    win() {
        if (this.hasEnded) return;
        this.hasEnded = true;
        this.cameras.main.flash(400, 255, 215, 0);
        musicEngine.playSFX('win');
        if (this.parentScene) { this.parentScene.bossWon(); this.scene.stop(); }
    }
    lose() {
        if (this.hasEnded) return;
        this.hasEnded = true;
        this.cameras.main.shake(200, 0.02);
        this.cameras.main.flash(150, 255, 0, 0);
        musicEngine.playSFX('lose');
        if (this.parentScene) { this.parentScene.microgameLost('BossGame'); this.scene.stop(); }
    }
    update() {
        if (this.hasEnded) return;

        // Spieler Bewegung
        this.player.body.setVelocityX(0);
        if (this.isLeft()) this.player.body.setVelocityX(-400);
        else if (this.isRight()) this.player.body.setVelocityX(400);

        // Spieler-Bullets prüfen
        for (let i = this.playerBullets.length - 1; i >= 0; i--) {
            const b = this.playerBullets[i];
            if (!b.active) { this.playerBullets.splice(i, 1); continue; }
            if (b.y < 0) { b.destroy(); this.playerBullets.splice(i, 1); continue; }
            // Kollision mit Boss
            if (Phaser.Geom.Intersects.RectangleToRectangle(b.getBounds(), this.boss.getBounds())) {
                this.hitBoss(b);
                this.playerBullets.splice(i, 1);
            }
        }

        // Boss-Bullets prüfen
        for (let i = this.bossBullets.length - 1; i >= 0; i--) {
            const b = this.bossBullets[i];
            if (!b.active) { this.bossBullets.splice(i, 1); continue; }
            if (b.y > 600 || b.x < 0 || b.x > 800) { b.destroy(); this.bossBullets.splice(i, 1); continue; }
            // Kollision mit Spieler
            const dist = Phaser.Math.Distance.Between(b.x, b.y, this.player.x, this.player.y);
            if (dist < 35) {
                this.lose();
            }
        }
    }
    exitToMenu() { this.hasEnded = true; musicEngine.stopMusic(); this.scene.stop(); if (this.parentScene) this.parentScene.scene.stop(); this.scene.start('StartScreen'); }
}

        // Boss
        this.boss = this.add.rectangle(400, 300, 180, 180, 0x8b0000);
        this.boss.setStrokeStyle(4, 0xffffff);
        this.bossMaxHealth = Math.floor(12 * this.gameSpeed);
        this.boss.health = this.bossMaxHealth;
        this.boss.isBlocking = false;

        // Health Bar
        this.healthBar = this.add.graphics();
        this.updateHealthBar();

        // Block Text
        this.blockText = this.add.text(400, 300, 'BLOCK!', { font: 'bold 64px Orbitron', fill: '#ffff00' }).setOrigin(0.5).setVisible(false).setDepth(11);

        // Boss blockt regelmäßig
        this.time.addEvent({
            delay: 2500 / this.gameSpeed,
            callback: this.bossAction,
            callbackScope: this,
            loop: true
        });

        this.input.on('pointerdown', this.punch, this);
    }
    updateHealthBar() {
        this.drawBossHealth(this.healthBar, this.boss.health, this.bossMaxHealth, 200, 70);
    }
    bossAction() {
        if (this.hasEnded || this.boss.isBlocking) return;

        let count = 3;
        const countText = this.add.text(400, 150, '3', { font: 'bold 56px Orbitron', fill: '#ffff00' }).setOrigin(0.5);

        this.time.addEvent({
            delay: 400 / this.gameSpeed,
            callback: () => {
                count--;
                if (count > 0) {
                    countText.setText(count.toString());
                } else {
                    countText.destroy();
                    this.boss.isBlocking = true;
                    this.boss.setFillStyle(0xaaaaaa);
                    this.blockText.setVisible(true);
                    this.time.delayedCall(800 / this.gameSpeed, () => {
                        this.boss.isBlocking = false;
                        this.boss.setFillStyle(0x8b0000);
                        this.blockText.setVisible(false);
                    });
                }
            },
            repeat: 2
        });
    }
    punch(pointer) {
        if (this.hasEnded) return;
        if (Phaser.Geom.Rectangle.Contains(this.boss.getBounds(), pointer.x, pointer.y)) {
            if (this.boss.isBlocking) {
                this.lose();
            } else {
                this.boss.health--;
                this.updateHealthBar();
                this.cameras.main.shake(50, 0.01);
                // Treffer-Effekt
                this.boss.setFillStyle(0xff4444);
                this.time.delayedCall(100, () => {
                    if (!this.boss.isBlocking) this.boss.setFillStyle(0x8b0000);
                });
                if (this.boss.health <= 0) this.win();
            }
        }
    }
    win() {
        if (this.hasEnded) return;
        this.hasEnded = true;
        this.cameras.main.flash(400, 255, 215, 0);
        musicEngine.playSFX('win');
        if (this.parentScene) { this.parentScene.bossWon(); this.scene.stop(); }
    }
    lose() {
        if (this.hasEnded) return;
        this.hasEnded = true;
        this.cameras.main.shake(200, 0.02);
        this.cameras.main.flash(150, 255, 0, 0);
        musicEngine.playSFX('lose');
        if (this.parentScene) { this.parentScene.microgameLost('BoxingBoss'); this.scene.stop(); }
    }
    exitToMenu() { this.hasEnded = true; musicEngine.stopMusic(); this.scene.stop(); if (this.parentScene) this.parentScene.scene.stop(); this.scene.start('StartScreen'); }
}

        this.boss.x += this.bossVX;
        this.boss.y += this.bossVY;
        if (this.boss.x < 450 || this.boss.x > 720) this.bossVX *= -1;
        if (this.boss.y < 150 || this.boss.y > 450) this.bossVY *= -1;

        // Spieler-Projektile (rückwärts, damit splice keine Einträge überspringt)
        for (let i = this.playerBullets.length - 1; i >= 0; i--) {
            const bullet = this.playerBullets[i];
            bullet.x += bullet.vx;
            if (bullet.x > 800) {
                bullet.destroy();
                this.playerBullets.splice(i, 1);
            } else if (Phaser.Math.Distance.Between(bullet.x, bullet.y, this.boss.x, this.boss.y) < 80) {
                Effects.burst(this, bullet.x, bullet.y, 0xffd93d, 8, 60);
                bullet.destroy();
                this.playerBullets.splice(i, 1);
                this.bossHealth--;
                this.updateHealthBar();
                this.cameras.main.shake(50, 0.005);
                if (this.bossHealth <= 0) { this.win(); return; }
            }
        }

        // Boss-Projektile
        for (let i = this.bossBullets.length - 1; i >= 0; i--) {
            const bullet = this.bossBullets[i];
            bullet.x += bullet.vx;
            bullet.y += bullet.vy;
            if (bullet.x < 0) {
                bullet.destroy();
                this.bossBullets.splice(i, 1);
            } else if (Phaser.Math.Distance.Between(bullet.x, bullet.y, this.swaggyX, this.swaggyY) < 25) {
                this.lose();
                return;
            }
        }
    }

    win() {
        if (this.hasEnded) return;
        this.hasEnded = true;
        this.cameras.main.flash(400, 255, 165, 0);
        musicEngine.playSFX('win');
        if (this.parentScene) { this.parentScene.bossWon(); this.scene.stop(); }
    }

    lose() {
        if (this.hasEnded) return;
        this.hasEnded = true;
        this.cameras.main.shake(200, 0.02);
        this.cameras.main.flash(150, 255, 0, 0);
        musicEngine.playSFX('lose');
        if (this.parentScene) { this.parentScene.microgameLost('SwaggyBoss'); this.scene.stop(); }
    }

    exitToMenu() {
        this.hasEnded = true;
        musicEngine.stopMusic();
        this.scene.stop();
        if (this.parentScene) this.parentScene.scene.stop();
        this.scene.start('StartScreen');
    }
}

// Käppchen Boss - Der böse Wolf
class KaeppchenBoss extends BaseMicrogame {
    constructor() { super({ key: 'KaeppchenBoss' }); }
    create() {
        super.create();
        this.markAsBoss();
        this.cameras.main.setBackgroundColor('#1a3d1a');

        this.add.text(400, 30, 'WOLF BOSS!', { font: 'bold 34px Orbitron', fill: '#E63946' }).setOrigin(0.5);
        this.add.text(400, 560, '← ↑ → ↓ Ausweichen | Sammle Äpfel zum Werfen!', { font: '12px Orbitron', fill: '#888' }).setOrigin(0.5);

        // Käppchen
        this.playerX = 100;
        this.playerY = 300;
        if (this.textures.exists('kaeppchen')) {
            this.player = this.add.sprite(this.playerX, this.playerY, 'kaeppchen', 0).setScale(1.5);
        } else {
            this.player = this.add.circle(this.playerX, this.playerY, 20, 0xE63946);
        }

        // Wolf Boss rechts
        this.bossX = 650;
        this.bossY = 300;
        this.boss = this.add.container(this.bossX, this.bossY);
        const wolfBody = this.add.graphics();
        wolfBody.fillStyle(0x444444, 1);
        wolfBody.fillEllipse(0, 0, 100, 60);
        wolfBody.fillTriangle(-50, -10, -80, -30, -50, 10);  // Schnauze
        wolfBody.fillTriangle(-10, -30, 0, -50, 10, -30);  // Ohr links
        wolfBody.fillTriangle(20, -30, 30, -50, 40, -30);  // Ohr rechts
        wolfBody.fillStyle(0xff0000, 1);
        wolfBody.fillCircle(-40, -5, 5);  // Auge
        this.boss.add(wolfBody);

        this.bossMaxHealth = 5;
        this.bossHealth = this.bossMaxHealth;
        this.bossVY = 2;

        // Health Bar
        this.healthBar = this.add.graphics();
        this.updateHealthBar();

        // Äpfel zum Aufsammeln und Werfen
        this.apples = [];
        this.playerApples = 0;
        this.appleText = this.add.text(100, 560, 'Äpfel: 0', { font: '14px Orbitron', fill: '#ff0000' });

        // Äpfel spawnen
        this.time.addEvent({
            delay: 2000,
            callback: () => {
                if (this.hasEnded) return;
                const apple = this.add.circle(
                    Phaser.Math.Between(50, 350),
                    Phaser.Math.Between(100, 500),
                    10, 0xff0000
                );
                this.apples.push(apple);
            },
            loop: true
        });

        // Wolf greift an
        this.attacks = [];
        this.time.addEvent({
            delay: 1200,
            callback: () => {
                if (this.hasEnded) return;
                const attack = this.add.circle(this.bossX - 60, this.bossY, 12, 0x222222);
                attack.vx = -8;
                this.attacks.push(attack);
            },
            loop: true
        });

        this.cursors = this.input.keyboard.createCursorKeys();
        this.input.keyboard.on('keydown-SPACE', () => {
            if (this.hasEnded || this.playerApples <= 0) return;
            this.playerApples--;
            this.appleText.setText('Äpfel: ' + this.playerApples);
            const bullet = this.add.circle(this.playerX + 30, this.playerY, 8, 0xff0000);
            bullet.vx = 10;
            bullet.isPlayerBullet = true;
            this.attacks.push(bullet);
        });

    }

    updateHealthBar() {
        this.drawBossHealth(this.healthBar, this.bossHealth, this.bossMaxHealth, 550, 70, 200, 18);
    }

    // Ohne diese Überschreibungen wurde der Wolf-Sieg als normales Minispiel
    // gewertet: kein Extra-Leben, kein Bonus und vor allem kein Charakterwechsel.
    win() {
        if (this.hasEnded) return;
        this.hasEnded = true;
        this.cameras.main.flash(400, 230, 57, 70);
        Effects.burst(this, this.bossX, this.bossY, 0xE63946, 24, 240);
        musicEngine.playSFX('win');
        if (this.parentScene) { this.parentScene.bossWon(); this.scene.stop(); }
    }

    lose() {
        if (this.hasEnded) return;
        this.hasEnded = true;
        this.cameras.main.shake(200, 0.02);
        this.cameras.main.flash(150, 255, 0, 0);
        musicEngine.playSFX('lose');
        if (this.parentScene) { this.parentScene.microgameLost('KaeppchenBoss'); this.scene.stop(); }
    }

    update() {
        super.update();
        if (this.hasEnded) return;

        const speed = 5;
        if (this.isLeft()) {
            this.playerX -= speed;
            if (this.player.play) this.player.play('kaeppchen_left', true);
        } else if (this.isRight()) {
            this.playerX += speed;
            if (this.player.play) this.player.play('kaeppchen_right', true);
        } else if (this.isUp()) {
            this.playerY -= speed;
            if (this.player.play) this.player.play('kaeppchen_up', true);
        } else if (this.isDown()) {
            this.playerY += speed;
            if (this.player.play) this.player.play('kaeppchen_down', true);
        }

        this.playerX = Phaser.Math.Clamp(this.playerX, 30, 400);
        this.playerY = Phaser.Math.Clamp(this.playerY, 80, 530);
        this.player.x = this.playerX;
        this.player.y = this.playerY;

        // Wolf bewegt sich
        this.bossY += this.bossVY;
        if (this.bossY < 100 || this.bossY > 500) this.bossVY *= -1;
        this.boss.y = this.bossY;

        // Äpfel aufsammeln (rückwärts iterieren, sonst überspringt splice Einträge)
        for (let i = this.apples.length - 1; i >= 0; i--) {
            const apple = this.apples[i];
            if (Phaser.Math.Distance.Between(this.playerX, this.playerY, apple.x, apple.y) < 25) {
                apple.destroy();
                this.apples.splice(i, 1);
                this.playerApples++;
                this.appleText.setText('Äpfel: ' + this.playerApples);
                musicEngine.playSFX('click');
            }
        }

        // Angriffe bewegen
        for (let i = this.attacks.length - 1; i >= 0; i--) {
            const atk = this.attacks[i];
            atk.x += atk.vx || -8;

            if (atk.x < -20 || atk.x > 820) {
                atk.destroy();
                this.attacks.splice(i, 1);
                continue;
            }

            // Spieler getroffen
            if (!atk.isPlayerBullet && Phaser.Math.Distance.Between(this.playerX, this.playerY, atk.x, atk.y) < 25) {
                this.lose();
            }

            // Boss getroffen
            if (atk.isPlayerBullet && Phaser.Math.Distance.Between(this.bossX, this.bossY, atk.x, atk.y) < 60) {
                atk.destroy();
                this.attacks.splice(i, 1);
                this.bossHealth--;
                this.updateHealthBar();
                this.cameras.main.shake(100, 0.01);
                if (this.bossHealth <= 0) this.win();
            }
        }
    }

    exitToMenu() {
        this.hasEnded = true;
        musicEngine.stopMusic();
        this.scene.stop();
        if (this.parentScene) this.parentScene.scene.stop();
        this.scene.start('StartScreen');
    }
}

// Edgar Boss - Flipper/Pinball Boss
class EdgarBoss extends BaseMicrogame {
    constructor() { super({ key: 'EdgarBoss' }); }
    create() {
        super.create();
        this.markAsBoss();
        this.cameras.main.setBackgroundColor('#1a1a2e');

        this.add.text(400, 30, 'EDGAR BOSS!', { font: 'bold 34px Orbitron', fill: '#9B59B6' }).setOrigin(0.5);
        this.add.text(400, 560, '← → Paddle bewegen | Triff den Boss!', { font: '14px Orbitron', fill: '#888' }).setOrigin(0.5);

        // Boss oben
        this.bossX = 400;
        this.bossY = 100;
        this.boss = this.add.rectangle(this.bossX, this.bossY, 120, 60, 0xe74c3c);
        this.bossVX = 3;

        this.bossMaxHealth = 5;
        this.bossHealth = this.bossMaxHealth;

        // Health Bar
        this.healthBar = this.add.graphics();
        this.updateHealthBar();

        // Paddle unten
        this.paddleX = 400;
        this.paddle = this.add.rectangle(this.paddleX, 520, 100, 15, 0x3498db);

        // Edgar (der Ball)
        this.edgarX = 400;
        this.edgarY = 450;
        this.edgarVX = 4;
        this.edgarVY = -5;

        if (this.textures.exists('edgar')) {
            this.edgar = this.add.image(this.edgarX, this.edgarY, 'edgar').setScale(2.0);
        } else {
            this.edgar = this.add.circle(this.edgarX, this.edgarY, 20, 0x9B59B6);
        }

        this.cursors = this.input.keyboard.createCursorKeys();
    }

    updateHealthBar() {
        this.drawBossHealth(this.healthBar, this.bossHealth, this.bossMaxHealth, 300, 70, 200, 18, 0xe74c3c);
    }

    update() {
        super.update();
        if (this.hasEnded) return;

        // Paddle bewegen
        if (this.isLeft()) {
            this.paddleX -= 8;
        } else if (this.isRight()) {
            this.paddleX += 8;
        }
        this.paddleX = Phaser.Math.Clamp(this.paddleX, 60, 740);
        this.paddle.x = this.paddleX;

        // Boss bewegen
        this.bossX += this.bossVX;
        if (this.bossX < 80 || this.bossX > 720) this.bossVX *= -1;
        this.boss.x = this.bossX;

        // Edgar (Ball) bewegen
        this.edgarX += this.edgarVX;
        this.edgarY += this.edgarVY;
        this.edgar.x = this.edgarX;
        this.edgar.y = this.edgarY;
        this.edgar.angle += this.edgarVX * 2;

        // Wand-Kollision
        if (this.edgarX < 30 || this.edgarX > 770) {
            this.edgarVX *= -1;
        }
        if (this.edgarY < 50) {
            this.edgarVY *= -1;
        }

        // Paddle-Kollision
        if (this.edgarY > 500 && this.edgarY < 530 &&
            this.edgarX > this.paddleX - 60 && this.edgarX < this.paddleX + 60) {
            this.edgarVY = -Math.abs(this.edgarVY);
            // Winkel basierend auf Aufprallpunkt
            const diff = (this.edgarX - this.paddleX) / 50;
            this.edgarVX = diff * 6;
            musicEngine.playSFX('click');
        }

        // Ball verloren
        if (this.edgarY > 580) {
            this.lose();
        }

        // Boss-Kollision
        if (this.edgarY < 140 && this.edgarY > 60 &&
            this.edgarX > this.bossX - 70 && this.edgarX < this.bossX + 70) {
            this.edgarVY = Math.abs(this.edgarVY);
            this.bossHealth--;
            this.updateHealthBar();
            this.cameras.main.shake(100, 0.01);
            if (this.bossHealth <= 0) this.win();
        }
    }

    win() {
        if (this.hasEnded) return;
        this.hasEnded = true;
        this.cameras.main.flash(200, 0, 255, 136);
        musicEngine.playSFX('win');
        if (this.parentScene) { this.parentScene.bossWon(); this.scene.stop(); }
    }

    exitToMenu() {
        this.hasEnded = true;
        musicEngine.stopMusic();
        this.scene.stop();
        if (this.parentScene) this.parentScene.scene.stop();
        this.scene.start('StartScreen');
    }
}

class BootScene extends Phaser.Scene {

    preload() {

        // Lade-Anzeige
        const logo = this.add.text(400, 232, 'ZOBELWARE', { font: 'bold 46px Orbitron', fill: '#00ff88' }).setOrigin(0.5);
        logo.setShadow(0, 0, '#00ff88', 18, false, true);
        this.tweens.add({ targets: logo, alpha: 0.6, duration: 800, yoyo: true, repeat: -1 });
        this.add.text(400, 278, 'LADEN...', { font: '15px Orbitron', fill: '#7c8398' }).setOrigin(0.5);

        const barFrame = this.add.graphics();
        barFrame.lineStyle(2, 0x00ff88, 0.5);
        barFrame.strokeRoundedRect(250, 320, 300, 18, 9);
        const progressBar = this.add.graphics();
        const percentText = this.add.text(400, 356, '0%', { font: '13px Orbitron', fill: '#00ff88' }).setOrigin(0.5);
        const statusText = this.add.text(400, 400, '', { font: '11px Orbitron', fill: '#4d5468' }).setOrigin(0.5);

        this.load.on('progress', (value) => {
            progressBar.clear();
            progressBar.fillStyle(0x00ff88, 1);
            progressBar.fillRoundedRect(252, 322, Math.max(2, 296 * value), 14, 7);
            percentText.setText(Math.round(value * 100) + '%');
        });

        // Fehlerbehandlung
        this.load.on('loaderror', (file) => {
            console.error('Fehler beim Laden:', file.key, file.src);
            statusText.setText('Fehler: ' + file.key).setColor('#ff6b6b');
        });

        this.load.on('filecomplete', (key) => {
            statusText.setText('Geladen: ' + key);
        });

        // Charakter-Bilder laden
        this.load.image('zobel', 'Zobel.png');
        this.load.image('swaggy', 'swaggy.png');
        // Trashi ist ein Spritesheet: 9 Frames (288x48 = 32x48 pro Frame)
        this.load.spritesheet('dude', 'dude.png', { frameWidth: 32, frameHeight: 48 });

    create() {

// Pausenmenü - läuft als eigene Szene über dem pausierten Spiel
class PauseScene extends Phaser.Scene {
    constructor() { super({ key: 'PauseScene' }); }
    init(data) { this.resumeKeys = (data && data.resumeKeys) || []; }
    create() {
        this.add.rectangle(400, 300, 800, 600, 0x05060f, 0.88);
        UI.panel(this, 400, 300, 420, 340, UI.GREEN, 0.08);

        const title = this.add.text(400, 178, 'PAUSE', { font: 'bold 46px Orbitron', fill: '#00ff88' }).setOrigin(0.5);
        title.setShadow(0, 0, '#00ff88', 16, false, true);

        UI.button(this, 400, 262, 260, 52, 'WEITER', { onClick: () => this.resumeGame() });
        UI.button(this, 400, 326, 260, 52, musicEngine.musicEnabled ? 'MUSIK: AN' : 'MUSIK: AUS', {
            color: UI.CYAN, filled: false,
            onClick: () => { musicEngine.toggleMusic(); this.scene.restart({ resumeKeys: this.resumeKeys }); }
        });
        UI.button(this, 400, 390, 260, 52, musicEngine.sfxEnabled ? 'SOUND: AN' : 'SOUND: AUS', {
            color: UI.CYAN, filled: false,
            onClick: () => { musicEngine.toggleSFX(); this.scene.restart({ resumeKeys: this.resumeKeys }); }
        });
        UI.button(this, 400, 454, 260, 52, 'ZUM MENÜ', { color: UI.RED, onClick: () => this.quitToMenu() });

        this.add.text(400, 512, 'ESC = weiterspielen', { font: '12px Orbitron', fill: '#6c7590' }).setOrigin(0.5);
        this.input.keyboard.on('keydown-ESC', () => this.resumeGame());
        this.input.keyboard.on('keydown-P', () => this.resumeGame());
    }
    resumeGame() {
        this.resumeKeys.forEach(key => {
            const sc = this.scene.get(key);
            if (sc) { sc.isPaused = false; this.scene.resume(key); }
        });
        musicEngine.resumeMusic();
        this.scene.stop();
    }
    quitToMenu() {
        musicEngine.stopMusic();
        musicEngine.wasPlaying = false;
        this.resumeKeys.forEach(key => {
            const sc = this.scene.get(key);
            if (sc) { sc.isPaused = false; sc.hasEnded = true; }
            this.scene.stop(key);
        });
        this.scene.stop();
        this.scene.start('StartScreen');
    }
}

                targets: explosion, scale: 0.4, alpha: 1, duration: 500, ease: 'Back.easeOut',

                    this.tweens.add({
                        targets: explosion, scale: 0.42, angle: { from: -2, to: 2 },

                    });
                }
            });

            const characters = [

                this.time.delayedCall(300 + idx * 100, () => {

                        targets: sprite, x: char.x, y: char.y, scale: char.scale,
                        duration: 600, ease: 'Back.easeOut',

// Modusauswahl: Spielmodus und optional ein fester Charakter
class ModeSelectScene extends Phaser.Scene {
    constructor() { super({ key: 'ModeSelectScene' }); }
    init(data) {
        this.selectedMode = (data && data.mode) || 'classic';
        this.soloCharacter = (data && data.soloCharacter) || null;
    }
    create() {
        this.cameras.main.setBackgroundColor('#08081a');
        UI.starfield(this, 40);
        UI.header(this, 'MODUS WÄHLEN', 'Wie willst du spielen?');

        // ---- Modus-Karten ----
        const modes = ['classic', 'hardcore', 'marathon', 'bossrush'];
        modes.forEach((id, i) => {
            const m = GameModes.get(id);
            const x = 220 + (i % 2) * 360;
            const y = 168 + Math.floor(i / 2) * 104;
            const active = this.selectedMode === id;

            const card = this.add.container(x, y);
            const g = this.add.graphics();
            g.fillStyle(active ? UI.GREEN : 0x1b2038, active ? 0.22 : 0.85);
            g.fillRoundedRect(-165, -44, 330, 88, 12);
            g.lineStyle(active ? 3 : 2, active ? UI.GREEN : 0x39405c, 1);
            g.strokeRoundedRect(-165, -44, 330, 88, 12);
            card.add(g);
            card.add(this.add.text(-130, -6, m.icon, { font: '32px Arial' }).setOrigin(0.5));
            card.add(this.add.text(-100, -18, m.name, { font: 'bold 19px Orbitron', fill: active ? '#00ff88' : '#ffffff' }).setOrigin(0, 0.5));
            card.add(this.add.text(-100, 8, m.desc, { font: '11px Orbitron', fill: '#8b93aa' }).setOrigin(0, 0.5));

            const best = playerData.modeHighScores[id] || 0;
            card.add(this.add.text(150, 26, 'Best: ' + best, { font: '10px Orbitron', fill: '#6c7590' }).setOrigin(1, 0.5));

            card.setInteractive(new Phaser.Geom.Rectangle(-165, -44, 330, 88), Phaser.Geom.Rectangle.Contains, { useHandCursor: true });
            card.on('pointerover', () => card.setScale(1.03));
            card.on('pointerout', () => card.setScale(1));
            card.on('pointerdown', () => {
                musicEngine.playSFX('click');
                this.scene.restart({ mode: id, soloCharacter: this.soloCharacter });
            });
        });

        // ---- Charakterauswahl ----
        this.add.text(400, 338, 'CHARAKTER', { font: 'bold 15px Orbitron', fill: '#8b93aa' }).setOrigin(0.5);
        const options = [{ id: null, label: 'ALLE', color: UI.GREEN }].concat(
            CharacterManager.characters.map(c => ({
                id: c, label: CharacterManager.data[c].name, color: CharacterManager.data[c].color
            }))
        );
        options.forEach((opt, i) => {
            const x = 90 + i * 104;
            const active = this.soloCharacter === opt.id;
            const btn = this.add.container(x, 384);

            g.fillRoundedRect(-46, -24, 92, 48, 10);

                font: 'bold 12px Orbitron', fill: active ? '#0b1220' : '#ffffff'
            }).setOrigin(0.5));
            btn.setInteractive(new Phaser.Geom.Rectangle(-46, -24, 92, 48), Phaser.Geom.Rectangle.Contains, { useHandCursor: true });
            btn.on('pointerover', () => btn.setScale(1.06));
            btn.on('pointerout', () => btn.setScale(1));
            btn.on('pointerdown', () => {
                musicEngine.playSFX('click');
                this.scene.restart({ mode: this.selectedMode, soloCharacter: opt.id });
            });
        });

        const soloNote = this.soloCharacter
            ? 'Nur Spiele von ' + CharacterManager.data[this.soloCharacter].name
            : 'Alle Charaktere wechseln sich ab';
        this.add.text(400, 424, soloNote, { font: '11px Orbitron', fill: '#6c7590' }).setOrigin(0.5);

        if (Upgrades.hasExtraLife()) perks.push('❤ +1 Leben');
        if (Upgrades.hasCoinBoost()) perks.push('💰 x1.5 Münzen');
        if (Upgrades.hasExtraTime()) perks.push('⏱ +15% Zeit');
        if (Upgrades.hasSecondChance()) perks.push('✨ Zweite Chance');

            this.add.text(400, 450, 'Aktive Boni:  ' + perks.join('   '), { font: '11px Orbitron', fill: '#ffd93d' }).setOrigin(0.5);
        }

        UI.button(this, 400, 506, 280, 54, '▶  LOS GEHT\'S', {
            fontSize: 22,
            onClick: () => {
                musicEngine.initialize();
                this.scene.start('GameScene', { mode: this.selectedMode, soloCharacter: this.soloCharacter });
            }
        });
        UI.button(this, 400, 562, 180, 38, '← ZURÜCK', {
            color: UI.RED, filled: false, fontSize: 15, onClick: () => this.scene.start('StartScreen')
        });
        this.input.keyboard.on('keydown-ESC', () => this.scene.start('StartScreen'));
        this.input.keyboard.on('keydown-ENTER', () => {
            musicEngine.initialize();
            this.scene.start('GameScene', { mode: this.selectedMode, soloCharacter: this.soloCharacter });
        });
    }
}

// Erfolgs-Übersicht
class AchievementsScene extends Phaser.Scene {
    constructor() { super({ key: 'AchievementsScene' }); }
    init(data) { this.page = (data && data.page) || 0; }
    create() {
        this.cameras.main.setBackgroundColor('#0a0a1a');
        UI.starfield(this, 30, 0xffd93d);

        // Beim Öffnen nachrechnen - so bleibt nichts hängen, wenn ein Lauf
        // etwa über das Pausenmenü verlassen wurde.
        const freshlyUnlocked = Achievements.checkAll();

        UI.header(this, '🏅 ERFOLGE', playerData.achievements.length + ' von ' + Achievements.list.length + ' freigeschaltet', UI.YELLOW);

        // Fortschrittsbalken
        const pct = Achievements.progress() / 100;
        const bar = this.add.graphics();
        bar.fillStyle(0x000000, 0.6); bar.fillRoundedRect(200, 100, 400, 14, 7);
        if (pct > 0) { bar.fillStyle(UI.YELLOW, 1); bar.fillRoundedRect(200, 100, Math.max(14, 400 * pct), 14, 7); }
        bar.lineStyle(2, 0xffffff, 0.3); bar.strokeRoundedRect(200, 100, 400, 14, 7);

        if (freshlyUnlocked.length > 0) {
            const sum = freshlyUnlocked.reduce((s, a) => s + a.reward, 0);
            this.time.delayedCall(300, () => {
                musicEngine.playSFX('win');
                UI.floatText(this, 400, 132, '+' + sum + ' 💰 nachträglich gutgeschrieben', '#00ff88', 15);
            });
        }

        const perPage = 8;
        this.totalPages = Math.ceil(Achievements.list.length / perPage);
        const items = Achievements.list.slice(this.page * perPage, this.page * perPage + perPage);

        items.forEach((a, i) => {
            const x = 210 + (i % 2) * 380;
            const y = 158 + Math.floor(i / 2) * 86;
            const done = Achievements.isUnlocked(a.id);

            const g = this.add.graphics();
            g.fillStyle(done ? UI.YELLOW : 0x161a2e, done ? 0.16 : 0.9);
            g.fillRoundedRect(x - 175, y - 34, 350, 68, 10);
            g.lineStyle(2, done ? UI.YELLOW : 0x2c3350, 1);
            g.strokeRoundedRect(x - 175, y - 34, 350, 68, 10);

            this.add.text(x - 143, y, done ? a.icon : '🔒', { font: '26px Arial' }).setOrigin(0.5).setAlpha(done ? 1 : 0.5);
            this.add.text(x - 116, y - 13, a.name, {
                font: 'bold 14px Orbitron', fill: done ? '#ffd93d' : '#6c7590'
            }).setOrigin(0, 0.5);
            this.add.text(x - 116, y + 8, a.desc, { font: '10px Orbitron', fill: '#7f879c' }).setOrigin(0, 0.5);
            this.add.text(x + 162, y + 12, '+' + a.reward + ' 💰', {
                font: '10px Orbitron', fill: done ? '#00ff88' : '#4d5468'
            }).setOrigin(1, 0.5);
        });

        // Blättern
        if (this.page > 0) {
            UI.button(this, 110, 508, 110, 40, '◀', { color: UI.YELLOW, filled: false, onClick: () => this.scene.restart({ page: this.page - 1 }) });
        }
        if (this.page < this.totalPages - 1) {
            UI.button(this, 690, 508, 110, 40, '▶', { color: UI.YELLOW, filled: false, onClick: () => this.scene.restart({ page: this.page + 1 }) });
        }
        this.add.text(400, 508, 'Seite ' + (this.page + 1) + ' / ' + this.totalPages, { font: '12px Orbitron', fill: '#6c7590' }).setOrigin(0.5);

        UI.button(this, 400, 558, 200, 44, '← MENÜ', { color: UI.RED, onClick: () => this.scene.start('StartScreen') });
        this.input.keyboard.on('keydown-ESC', () => this.scene.start('StartScreen'));
    }
}

        UI.header(this, '🎮 MINISPIEL-ALBUM', games.length + ' Spiele  •  ' + won + ' davon gewonnen  •  Klicke zum Üben', UI.CYAN);

        this.cardsContainer = this.add.container(0, 0);
        this.drawPage();
        this.drawNavigation();

        UI.button(this, 400, 560, 190, 42, '← MENÜ', { color: UI.RED, fontSize: 16, onClick: () => this.scene.start('StartScreen') });
        this.input.keyboard.on('keydown-ESC', () => this.scene.start('StartScreen'));
        this.input.keyboard.on('keydown-LEFT', () => { if (this.currentPage > 0) this.scene.restart({ page: this.currentPage - 1 }); });
        this.input.keyboard.on('keydown-RIGHT', () => { if (this.currentPage < this.totalPages - 1) this.scene.restart({ page: this.currentPage + 1 }); });
    }
    drawPage() {
        this.cardsContainer.removeAll(true);
        const startIdx = this.currentPage * this.itemsPerPage;
        const pageGames = this.allGames.slice(startIdx, startIdx + this.itemsPerPage);
        const cols = 4, cardW = 172, cardH = 96, startX = 42, startY = 116, gapX = 12, gapY = 12;

        pageGames.forEach((game, idx) => {
            const col = idx % cols, row = Math.floor(idx / cols);
            const cx = startX + col * (cardW + gapX) + cardW / 2;
            const cy = startY + row * (cardH + gapY) + cardH / 2;
            const stats = playerData.gameStats[game.key] || { played: 0, won: 0 };
            const winRate = stats.played > 0 ? Math.round((stats.won / stats.played) * 100) : 0;
            const mastered = stats.won > 0;

            const g = this.add.graphics();
            const draw = (hover) => {
                g.clear();
                g.fillStyle(game.color, hover ? 0.38 : 0.14);
                g.fillRoundedRect(cx - cardW / 2, cy - cardH / 2, cardW, cardH, 10);
                g.lineStyle(2, game.color, mastered ? 1 : 0.45);
                g.strokeRoundedRect(cx - cardW / 2, cy - cardH / 2, cardW, cardH, 10);
            };
            draw(false);
            this.cardsContainer.add(g);

            const nameText = this.add.text(cx, cy - 26, game.name, { font: 'bold 13px Orbitron', fill: '#ffffff' }).setOrigin(0.5);
            this.cardsContainer.add(nameText);
            if (mastered) this.cardsContainer.add(this.add.text(cx + cardW / 2 - 14, cy - cardH / 2 + 12, '★', { font: '13px Arial', fill: '#ffd93d' }).setOrigin(0.5));

            this.cardsContainer.add(this.add.text(cx, cy - 2, stats.played + 'x gespielt', { font: '10px Orbitron', fill: '#8b93aa' }).setOrigin(0.5));

            // Kleiner Erfolgsbalken statt reiner Prozentzahl
            const barG = this.add.graphics();
            barG.fillStyle(0x000000, 0.5); barG.fillRoundedRect(cx - 52, cy + 16, 104, 8, 4);
            const rateColor = winRate >= 60 ? 0x00ff88 : winRate >= 30 ? 0xffaa00 : 0xff6b6b;
            if (stats.played > 0) { barG.fillStyle(rateColor, 1); barG.fillRoundedRect(cx - 52, cy + 16, Math.max(4, 104 * winRate / 100), 8, 4); }
            this.cardsContainer.add(barG);
            this.cardsContainer.add(this.add.text(cx, cy + 34, stats.played > 0 ? winRate + '% Siege' : 'noch nie gespielt',
                { font: '9px Orbitron', fill: '#6c7590' }).setOrigin(0.5));

            const hit = this.add.rectangle(cx, cy, cardW, cardH, 0xffffff, 0.001).setInteractive({ useHandCursor: true });
            this.cardsContainer.add(hit);
            hit.on('pointerover', () => { draw(true); nameText.setScale(1.08); });
            hit.on('pointerout', () => { draw(false); nameText.setScale(1); });
            hit.on('pointerdown', () => {
                musicEngine.initialize(); musicEngine.playSFX('click');
                this.scene.start(game.key, {
                    parentScene: null, gameSpeed: 1.0, duration: 5000,
                    practiceMode: true, command: game.name.toUpperCase()
                });
            });
        });

        if (this.pageText) this.pageText.destroy();
        this.pageText = this.add.text(400, 508, 'Seite ' + (this.currentPage + 1) + ' / ' + this.totalPages, { font: '13px Orbitron', fill: '#00d4ff' }).setOrigin(0.5);
    }
    drawNavigation() {
        if (this.currentPage > 0) {
            UI.button(this, 100, 508, 90, 40, '◀', { color: UI.CYAN, filled: false, onClick: () => this.scene.restart({ page: this.currentPage - 1 }) });
        }
        if (this.currentPage < this.totalPages - 1) {
            UI.button(this, 700, 508, 90, 40, '▶', { color: UI.CYAN, filled: false, onClick: () => this.scene.restart({ page: this.currentPage + 1 }) });
        }
    }
}

            { id: 'transition_green',  name: 'Grün',    price: 100, type: 'transition', value: 0x1a4e1a, preview: '🟢', desc: 'Waldgrün' },

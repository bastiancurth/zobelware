    // Sternenhimmel (für Menüs ohne eigenes Theme)
    starfield(scene, count = 60, color = 0x00ff88) {
        const stars = [];
        for (let i = 0; i < count; i++) {
            const s = scene.add.image(
                Phaser.Math.Between(0, 800), Phaser.Math.Between(0, 600), 'fx-glow'
            ).setTint(color).setBlendMode(Phaser.BlendModes.ADD)
             .setScale(Phaser.Math.FloatBetween(0.03, 0.12)).setAlpha(0.5).setDepth(-800);
            scene.tweens.add({
                targets: s, alpha: { from: 0.12, to: 0.85 },
                duration: Phaser.Math.Between(700, 2600), yoyo: true, repeat: -1,
                delay: Phaser.Math.Between(0, 1500)
            });
            stars.push(s);
        }
        return stars;
    }
};

// Alte Aufrufe weiterhin bedienen, damit die Minispiele unverändert laufen
const Effects = {
    burst(scene, x, y, color, count, spread) { FX.burst(scene, x, y, color, count || 18, spread || 220); },
    confetti(scene, count) { FX.confetti(scene, count || 80); },
    ring(scene, x, y, color, radius) { FX.shockwave(scene, x, y, color, radius || 140); },
    flash(scene, color, alpha, duration) { Juice.flash(scene, color, alpha, duration); }
};

// ======================================================================
// SCHWIERIGKEITSSTUFEN
// Jedes Minispiel läuft auf Stufe 1-3. Die Stufe steigt im Verlauf einer
// Stage und macht dieselben Spiele fordernder.
// ======================================================================
const FUSE_STYLES = {
    classic: { name: 'Klassisch', from: 0x00ff88, to: 0xff3355 },
    ice:     { name: 'Eis',       from: 0x9be7ff, to: 0x2255ff },
    fire:    { name: 'Feuer',     from: 0xffe066, to: 0xff2200 },
    candy:   { name: 'Candy',     from: 0xff9ff3, to: 0x8e44ad },
    toxic:   { name: 'Toxisch',   from: 0xd4ff00, to: 0x00ffcc }
};

class BaseMicrogame extends Phaser.Scene {
    init(data) {
        this.parentScene = data.parentScene;
        this.gameSpeed = data.gameSpeed || 1.0;
        this.level = Phaser.Math.Clamp(data.level || 1, 1, 3);
        this.baseDuration = data.duration || 4000;
        // Höhere Stufen geben weniger Zeit, das Extra-Zeit-Upgrade gleicht etwas aus
        const levelTime = [1, 1, 0.92, 0.84][this.level];
        this.duration = (this.baseDuration * levelTime * Upgrades.timeFactor()) / this.gameSpeed;
        this.practiceMode = data.practiceMode || false;
        this.command = data.command || null;
        this.keysHint = data.keysHint || null;
        this.themeKey = data.themeKey || null;
        this.isBossGame = false;
        this.isPaused = false;
        this.hasEnded = false;
    }

    create() {
        this.hasEnded = false;
        // Wiederverwendete Szenen-Instanz: Zeittempo sicherheitshalber normalisieren
        Juice.resetTimeScale(this);
        Art.build(this);
        PostFX.apply(this, { bloomStrength: 0.42, vignetteStrength: 0.34 });
        Handheld.overlay(this);

        this.createFuse();
        this.inputBufferActive = true;
        this.time.delayedCall(150, () => { this.inputBufferActive = false; });

        this.wasd = this.input.keyboard.addKeys({ w: 'W', a: 'A', s: 'S', d: 'D' });
        this.touchState = { left: false, right: false, up: false, down: false };
        this.touchTap = { left: false, right: false, up: false, down: false };

        this.input.keyboard.on('keydown-ESC', () => this.openPause());
        this.input.keyboard.on('keydown-P', () => this.openPause());

        this.createTouchControls();
        this.time.delayedCall(0, () => this.showCommand());
    }

    // Stufenabhängiger Wert: leicht / normal / schwer
    diff(easy, normal, hard) {
        return [easy, easy, normal, hard][this.level];
    }

    // ---------- Zündschnur mit Bombe ----------
    createFuse() {
        const style = FUSE_STYLES[playerData.fuseStyle] || FUSE_STYLES.classic;
        this.fuseColors = style;

        this.fuseTrack = this.add.graphics().setDepth(2000);
        this.fuseTrack.fillStyle(0x000000, 0.55);
        this.fuseTrack.fillRoundedRect(92, 564, 620, 22, 11);
        this.fuseTrack.lineStyle(2, 0xffffff, 0.12);
        this.fuseTrack.strokeRoundedRect(92, 564, 620, 22, 11);
        this.fuseTrack.lineStyle(5, 0x000000, 0.5);
        this.fuseTrack.lineBetween(100, 575, 700, 575);

        this.fuse = this.add.rectangle(700, 575, 600, 9, style.from).setOrigin(1, 0.5).setDepth(2001);
        this.fuseGlow = this.add.image(400, 575, 'fx-beam')
            .setDisplaySize(600, 26).setAngle(90).setTint(style.from)
            .setBlendMode(Phaser.BlendModes.ADD).setAlpha(0.35).setDepth(2000);
        this.fuseGlow.setDisplaySize(26, 600);
        this.fuseGlow.setAngle(90);

        // Bombe am Ende der Schnur
        this.bomb = this.add.container(742, 572).setDepth(2002);
        const bombG = this.add.graphics();
        bombG.fillStyle(0x0e0e16, 1); bombG.fillCircle(0, 0, 21);
        bombG.fillStyle(0x2c2c3c, 1); bombG.fillCircle(-6, -6, 8);
        bombG.fillStyle(0x53536b, 1); bombG.fillCircle(-8, -8, 3.5);
        bombG.fillStyle(0x000000, 1); bombG.fillRect(6, -26, 9, 11);
        this.bomb.add(bombG);

        this.spark = this.add.image(100, 575, 'fx-spark')
            .setScale(0.7).setTint(0xffe08a).setBlendMode(Phaser.BlendModes.ADD).setDepth(2003);
        this.sparkGlow = this.add.image(100, 575, 'fx-glow')
            .setScale(0.42).setTint(0xffaa33).setBlendMode(Phaser.BlendModes.ADD).setAlpha(0.6).setDepth(2002);
        this.tweens.add({ targets: this.sparkGlow, scale: 0.62, alpha: 0.25, duration: 300, yoyo: true, repeat: -1 });
        // Funkenflug an der Brennstelle (nur bei hoher Qualität)
        this.sparkTrail = !Quality.high() ? null : this.add.particles(0, 0, 'fx-spark', {
            follow: this.spark,
            speed: { min: 18, max: 70 },
            angle: { min: 200, max: 340 },
            scale: { start: 0.28, end: 0 },
            lifespan: 340, frequency: 34,
            tint: [0xffd93d, 0xff8833],
            blendMode: 'ADD'
        });
        if (this.sparkTrail) this.sparkTrail.setDepth(2002);

        this.warnedLowTime = false;
    }

    setFuseVisible(v) {
        [this.fuseTrack, this.fuse, this.fuseGlow, this.spark, this.sparkGlow, this.bomb].forEach(o => o && o.setVisible(v));
        if (this.sparkTrail) v ? this.sparkTrail.start() : this.sparkTrail.stop();
    }

    markAsBoss() { this.isBossGame = true; this.setFuseVisible(false); }

    // Lebensleiste für Bosse
    drawBossHealth(gfx, current, max, x = 200, y = 68, w = 400, h = 18, color = 0xff3355) {
        gfx.clear();
        gfx.fillStyle(0x000000, 0.75); gfx.fillRoundedRect(x - 4, y - 4, w + 8, h + 8, 8);
        gfx.fillStyle(0x23243a, 1);    gfx.fillRoundedRect(x, y, w, h, 5);
        const ratio = Phaser.Math.Clamp(current / max, 0, 1);
        if (ratio > 0) {
            gfx.fillStyle(ratio > 0.3 ? color : 0xff0000, 1);
            gfx.fillRoundedRect(x, y, w * ratio, h, 5);
            gfx.fillStyle(0xffffff, 0.3);
            gfx.fillRoundedRect(x, y, w * ratio, h / 2.4, 5);
        }
        gfx.lineStyle(2, 0xffffff, 0.45); gfx.strokeRoundedRect(x, y, w, h, 5);
    }

    // ---------- Befehls-Einblendung ----------
    showCommand() {
        if (!this.command) return;
        musicEngine.playSFX('command');
        const c = this.add.container(400, 252).setDepth(3600);

        const flare = this.add.image(0, 0, 'fx-glow')
            .setTint(0xffffff).setBlendMode(Phaser.BlendModes.ADD)
            .setDisplaySize(760, 260).setAlpha(0.3);
        const word = this.add.text(0, 0, this.command, {
            font: 'bold 76px Orbitron', fill: '#ffffff', stroke: '#000000', strokeThickness: 11
        }).setOrigin(0.5);
        word.setShadow(0, 5, '#000000', 0, true, true);
        c.add([flare, word]);

        if (this.keysHint) {
            c.add(this.add.text(0, 64, this.keysHint, {
                font: 'bold 24px Orbitron', fill: '#ffd93d',
                backgroundColor: '#000000cc', padding: { x: 14, y: 6 }
            }).setOrigin(0.5));
        }

        c.setScale(2.6).setAlpha(0);
        const inT = 130 / this.gameSpeed, hold = 500 / this.gameSpeed;
        this.tweens.add({
            targets: c, scale: 1, alpha: 1, duration: inT, ease: 'Back.easeOut',
            onComplete: () => {
                this.tweens.add({ targets: flare, alpha: 0, duration: 300 });
                this.time.delayedCall(hold, () => {
                    this.tweens.add({
                        targets: c, alpha: 0, scale: 1.3, y: 208,
                        duration: 220 / this.gameSpeed, onComplete: () => c.destroy()
                    });
                });
            }
        });
    }

    // ---------- Touch ----------
    createTouchControls() {
        if (!this.sys.game.device.input.touch) return;
        const mk = (x, y, r, label, onDown, onUp) => {
            const c = this.add.circle(x, y, r, 0xffffff, 0.13).setDepth(3000).setScrollFactor(0);
            c.setStrokeStyle(2, 0xffffff, 0.35);
            this.add.text(x, y, label, { font: 'bold 20px Orbitron', fill: '#ffffff' })
                .setOrigin(0.5).setAlpha(0.6).setDepth(3001);
            c.setInteractive({ useHandCursor: true });
            c.on('pointerdown', () => { c.setFillStyle(0xffffff, 0.3); onDown(); });
            c.on('pointerup', () => { c.setFillStyle(0xffffff, 0.13); if (onUp) onUp(); });
            c.on('pointerout', () => { c.setFillStyle(0xffffff, 0.13); if (onUp) onUp(); });
        };
        const press = (dir) => {
            this.touchState[dir] = true; this.touchTap[dir] = true;
            const map = { left: [37, 'ArrowLeft'], right: [39, 'ArrowRight'], up: [38, 'ArrowUp'], down: [40, 'ArrowDown'] };
            const [code, key] = map[dir];
            this.input.keyboard.emit('keydown', { keyCode: code, key, preventDefault: () => {} });
        };
        const release = (dir) => { this.touchState[dir] = false; };
        mk(70, 470, 32, '◀', () => press('left'), () => release('left'));
        mk(160, 470, 32, '▶', () => press('right'), () => release('right'));
        mk(115, 405, 32, '▲', () => press('up'), () => release('up'));
        mk(115, 520, 32, '▼', () => press('down'), () => release('down'));
        mk(710, 470, 42, '⏺', () => this.pressAction());
        const pauseBtn = this.add.circle(40, 40, 22, 0x000000, 0.5).setDepth(3000).setInteractive({ useHandCursor: true });
        pauseBtn.setStrokeStyle(2, 0xffffff, 0.4);
        this.add.text(40, 40, '❚❚', { font: 'bold 14px Orbitron', fill: '#ffffff' }).setOrigin(0.5).setDepth(3001);
        pauseBtn.on('pointerdown', () => this.openPause());
    }

    pressAction() {
        this.input.keyboard.emit('keydown-SPACE', { keyCode: 32, key: ' ', preventDefault: () => {} });
        this.input.keyboard.emit('keydown', { keyCode: 32, key: ' ', preventDefault: () => {} });
    }

    // ---------- Eingabe ----------
    isLeft()  { return (this.cursors && this.cursors.left.isDown)  || (this.wasd && this.wasd.a.isDown) || this.touchState.left; }
    isRight() { return (this.cursors && this.cursors.right.isDown) || (this.wasd && this.wasd.d.isDown) || this.touchState.right; }
    isUp()    { return (this.cursors && this.cursors.up.isDown)    || (this.wasd && this.wasd.w.isDown) || this.touchState.up; }
    isDown()  { return (this.cursors && this.cursors.down.isDown)  || (this.wasd && this.wasd.s.isDown) || this.touchState.down; }

    justPressed(dir) {
        const keyMap = { left: 'left', right: 'right', up: 'up', down: 'down' };
        const wasdMap = { left: 'a', right: 'd', up: 'w', down: 's' };
        const a = this.cursors && Phaser.Input.Keyboard.JustDown(this.cursors[keyMap[dir]]);
        const b = this.wasd && Phaser.Input.Keyboard.JustDown(this.wasd[wasdMap[dir]]);
        const t = this.touchTap[dir];
        if (t) this.touchTap[dir] = false;
        return a || b || t;
    }

    // ---------- Timer ----------
    startTimer() {
        this.gameTimer = this.time.delayedCall(this.duration, () => {
            if (!this.hasEnded) { this.detonate(); this.lose(); }
        });
    }
    startSurvivalTimer() {
        this.gameTimer = this.time.delayedCall(this.duration, () => { if (!this.hasEnded) this.win(); });
    }

    detonate() {
        if (!this.bomb || !this.bomb.visible) return;
        musicEngine.playSFX('explosion');
        FX.burst(this, this.bomb.x, this.bomb.y, 0xff7722, 26, 320);
        FX.shockwave(this, this.bomb.x, this.bomb.y, 0xffaa33, 260);
        this.bomb.setVisible(false);
        this.spark.setVisible(false);
        this.sparkGlow.setVisible(false);
        if (this.sparkTrail) this.sparkTrail.stop();
    }

    update() {
        if (this.hasEnded || !this.gameTimer) return;
        const p = this.gameTimer.getProgress();
        this.fuse.width = 600 * (1 - p);
        this.spark.x = 100 + 600 * p;
        this.sparkGlow.x = this.spark.x;

        const c = Phaser.Display.Color.Interpolate.ColorWithColor(
            Phaser.Display.Color.ValueToColor(this.fuseColors.from),
            Phaser.Display.Color.ValueToColor(this.fuseColors.to),
            100, Math.floor(p * 100)
        );
        const col = Phaser.Display.Color.GetColor(c.r, c.g, c.b);
        this.fuse.setFillStyle(col);
        if (this.fuseGlow) { this.fuseGlow.setTint(col); this.fuseGlow.x = (100 + this.spark.x) / 2; this.fuseGlow.setDisplaySize(26, Math.max(4, 600 * (1 - p))); }

        if (!this.warnedLowTime && p > 0.72) {
            this.warnedLowTime = true;
            this.tweens.add({ targets: [this.spark, this.sparkGlow], scale: '*=1.7', duration: 150, yoyo: true, repeat: -1 });
            if (this.bomb) {
                this.tweens.add({ targets: this.bomb, scale: 1.22, duration: 130, yoyo: true, repeat: -1 });
                this.tweens.add({ targets: this.bomb, x: { from: 738, to: 746 }, duration: 55, yoyo: true, repeat: -1 });
            }
        }
    }

    // ---------- Pause ----------
    openPause() {
        if (this.hasEnded || this.isPaused) return;
        this.isPaused = true;
        musicEngine.pauseMusic();
        const resumeKeys = [this.scene.key];
        if (this.parentScene) resumeKeys.push(this.parentScene.scene.key);
        const returnScene = this.parentScene && this.parentScene.mode && this.parentScene.mode.isStage ? 'CityScene' : 'StartScreen';
        this.scene.launch('PauseScene', { resumeKeys, returnScene });
        this.scene.pause();
        if (this.parentScene) this.parentScene.scene.pause();
    }

    // ---------- Ausgang ----------
    win() {
        if (this.hasEnded) return; this.hasEnded = true;
        if (this.gameTimer) this.gameTimer.remove();
        Juice.hitstop(this, 60, 0.08);
        Juice.flash(this, 0x00ff88, 0.45, 240);
        FX.burst(this, 400, 300, 0x00ff88, 26, 320);
        FX.shockwave(this, 400, 300, 0x00ff88, 300);
        musicEngine.playSFX('win');
        if (this.practiceMode) {
            UI.floatText(this, 400, 250, 'GESCHAFFT!', '#00ff88', 36);
            this.time.delayedCall(900, () => this.restartPractice());
        } else if (this.parentScene) {
            this.time.delayedCall(0, () => {
                this.parentScene.microgameWon(this.scene.key);
                this.scene.stop();
            });
        }
    }

    lose() {
        if (this.hasEnded) return; this.hasEnded = true;
        if (this.gameTimer) this.gameTimer.remove();
        Juice.hitstop(this, 90, 0.05);
        Juice.shake(this, 1, 260);
        Juice.flash(this, 0xff3355, 0.45, 220);
        musicEngine.playSFX('lose');
        if (this.practiceMode) {
            UI.floatText(this, 400, 250, 'DANEBEN!', '#ff5c7a', 36);
            this.time.delayedCall(900, () => this.restartPractice());
        } else if (this.parentScene) {
            this.time.delayedCall(0, () => {
                this.parentScene.microgameLost(this.scene.key);
                this.scene.stop();
            });
        }
    }

    restartPractice() {
        this.scene.restart({
            parentScene: null, gameSpeed: this.gameSpeed, level: this.level,
            duration: this.baseDuration, practiceMode: true,
            command: this.command, keysHint: this.keysHint, themeKey: this.themeKey
        });
    }

    exitToMenu() {
        this.hasEnded = true;
        if (this.gameTimer) this.gameTimer.remove();
        musicEngine.stopMusic();
        this.scene.stop();
        if (this.parentScene) this.parentScene.scene.stop();
        this.scene.start('StartScreen');
    }

    // ---------- Zeichen-Helfer (von allen Minispielen genutzt) ----------
    gameTitle(text, color = '#ffffff', y = 32) {
        const t = this.add.text(400, y, text, { font: 'bold 30px Orbitron', fill: color }).setOrigin(0.5).setDepth(1900);
        t.setShadow(0, 3, '#000000', 8);
        t.setStroke('#000000', 4);
        return t;
    }

    hint(text, y = 68) {
        const t = this.add.text(400, y, text, { font: '14px Orbitron', fill: '#ffffff' })
            .setOrigin(0.5).setAlpha(0.8).setDepth(1900);
        t.setShadow(0, 2, '#000000', 5);
        return t;
    }

    counter(text, color = '#00ff88', y = 100) {
        const t = this.add.text(400, y, text, { font: 'bold 26px Orbitron', fill: color }).setOrigin(0.5).setDepth(1900);
        t.setShadow(0, 2, '#000000', 6);
        // Bei jeder Änderung kurz aufpoppen
        const orig = t.setText.bind(t);
        t.setText = (v) => { orig(v); Juice.squash(this, t, 0.22, 200); return t; };
        return t;
    }

    // Hintergrund: nutzt das Theme der aktuellen Figur statt einer flachen Farbe
    gradientBackground(topColor, bottomColor) {
        const themeKey = this.themeKey || CharacterManager.currentCharacter;
        Sky.build(this, themeKey);
        // Die vom Minispiel gewünschte Farbe als Tönung darüberlegen,
        // damit jedes Spiel seine eigene Stimmung behält (als Textur, nicht als
        // Dutzende Rechtecke - das spart pro Bild spürbar Rechenzeit).
        // Die vom Minispiel gewuenschte Farbe wird kraeftig und hell gezogen -
        // dadurch wirken alle Spiele bunt statt duester. Liegt ueber der
        // Theme-Kulisse, damit keine Silhouetten durchschneiden.
        const top = Pop.vivid(topColor);
        const bottom = Pop.deeper(Pop.vivid(bottomColor), 0.78);
        return this.add.image(400, 300, Sky.gradientTexture(this, top, bottom))
            .setDisplaySize(800, 600).setAlpha(0.94).setDepth(-880);
    }

    spawnAwayFromCursor(minDist = 150) {
        const cursor = this.input.activePointer;
        let x, y, attempts = 0;
        do {
            x = Phaser.Math.Between(100, 700);
            y = Phaser.Math.Between(120, 500);
            attempts++;
        } while (Phaser.Math.Distance.Between(cursor.x, cursor.y, x, y) < minDist && attempts < 20);
        return { x, y };
    }
}


// MINISPIELE
class ClickTheButton extends BaseMicrogame {
    constructor() { super({ key: 'ClickTheButton' }); }
    create() { super.create(); this.gradientBackground(0x1a1a2e, 0x1a1a2e); this.add.text(400, 60, 'KLICK!', { font: 'bold 48px Orbitron', fill: '#00ff88' }).setOrigin(0.5); const pos = this.spawnAwayFromCursor(180); const btn = this.add.rectangle(pos.x, pos.y, 160, 90, 0x00ff88).setInteractive({ useHandCursor: true }); btn.setStrokeStyle(4, 0xffffff); this.add.text(pos.x, pos.y, 'KLICK!', { font: 'bold 26px Orbitron', fill: '#000' }).setOrigin(0.5); const doClick = () => { if (!this.inputBufferActive) this.win(); }; btn.on('pointerdown', doClick); this.input.keyboard.on('keydown-SPACE', doClick); btn.on('pointerover', () => btn.setScale(1.1)); btn.on('pointerout', () => btn.setScale(1)); this.startTimer(); }
}

class DodgeTheBall extends BaseMicrogame {
    constructor() { super({ key: 'DodgeTheBall' }); }
    create() {
        super.create();
        this.gradientBackground(0x1a1a2e, 0x08080f);
        this.gameTitle('WEICHE AUS!', '#ff6b6b');
        this.hint('← → bewegen und überleben');

        // Spieler
        this.player = this.add.rectangle(400, 500, 46, 46, 0x00ff88).setStrokeStyle(3, 0xffffff);
        this.physics.add.existing(this.player);
        this.player.body.setCollideWorldBounds(true);
        this.cursors = this.input.keyboard.createCursorKeys();

        // Bälle die fallen
        this.balls = [];
        for (let i = 0; i < 8; i++) {
            const ball = this.add.circle(Phaser.Math.Between(50, 750), -Phaser.Math.Between(50, 400), 15, 0xff6b6b);
            ball.setStrokeStyle(2, 0xffffff, 0.5);
            this.balls.push(ball);
            this.resetBallSpeed(ball);
        }

        // Timer - überleben = gewinnen
        this.gameTimer = this.time.delayedCall(this.duration, () => { if (!this.hasEnded) this.win(); });
    }
    resetBallSpeed(ball) {
        ball.vy = Phaser.Math.Between(200, 350) * this.gameSpeed;
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;

        // Spieler Bewegung
        this.player.body.setVelocityX(0);
        if (this.isLeft()) this.player.body.setVelocityX(-400);
        else if (this.isRight()) this.player.body.setVelocityX(400);

        for (const ball of this.balls) {
            ball.y += ball.vy * dt;
            // Bälle oben wieder einsetzen, damit bis zum Schluss Druck bleibt
            if (ball.y > 640) {
                ball.y = -Phaser.Math.Between(20, 160);
                ball.x = Phaser.Math.Between(50, 750);
                this.resetBallSpeed(ball);
            }
            if (Phaser.Math.Distance.Between(ball.x, ball.y, this.player.x, this.player.y) < 36) {
                this.lose();
                return;
            }
        }
    }
}

class MashTheKey extends BaseMicrogame {
    constructor() { super({ key: 'MashTheKey' }); }
    create() {
        super.create();
        this.gradientBackground(0x7e22ce, 0x3b0764);
        this.gameTitle('HÄMMERN!', '#ffffff');
        this.mashCount = 0;
        this.targetMashes = Math.floor(12 + this.gameSpeed * 3);
        this.countText = this.add.text(400, 300, '0', { font: 'bold 100px Orbitron', fill: '#00ff88' }).setOrigin(0.5);
        this.add.text(400, 420, 'Ziel: ' + this.targetMashes, { font: '28px Orbitron', fill: '#fff' }).setOrigin(0.5);
        this.hint('Hämmere auf eine beliebige Taste (oder klicke)');
        const mash = () => {
            if (this.hasEnded || this.inputBufferActive) return;
            this.mashCount++;
            this.countText.setText(this.mashCount.toString());
            this.countText.setScale(1 + this.mashCount / this.targetMashes * 0.3);
            if (this.mashCount % 3 === 0) Effects.burst(this, 400, 300, 0x00ff88, 6, 70);
            if (this.mashCount >= this.targetMashes) this.win();
        };
        // e.repeat ignorieren: gedrückt gehaltene Taste soll nicht automatisch gewinnen
        this.input.keyboard.on('keydown', (e) => { if (e && e.repeat) return; mash(); });
        this.input.on('pointerdown', mash);
        this.startTimer();
    }
}

    constructor() { super({ key: 'ColorMatch' }); }
    create() {
        super.create();
        this.gradientBackground(0x2c3e50, 0x11161d);
        this.gameTitle('FINDE DIE FARBE!', '#ffffff');
        const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff];
        this.targetIndex = Phaser.Math.Between(0, colors.length - 1);
        const sample = this.add.circle(400, 190, 52, colors[this.targetIndex]);
        sample.setStrokeStyle(4, 0xffffff);
        this.tweens.add({ targets: sample, scale: 1.08, duration: 600, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

        // Falsche Farben ziehen und die richtige zufällig einsortieren,
        // damit die Lösung nicht immer auf dem ersten Knopf liegt.
        const wrong = Phaser.Utils.Array.Shuffle(colors.map((_, i) => i).filter(i => i !== this.targetIndex)).slice(0, 3);
        const options = Phaser.Utils.Array.Shuffle([this.targetIndex, ...wrong]);

        options.forEach((colorIdx, i) => {
            const btn = this.add.rectangle(200 + i * 150, 390, 84, 84, colors[colorIdx]).setInteractive({ useHandCursor: true });
            btn.setStrokeStyle(3, 0xffffff, 0.6);
            btn.on('pointerover', () => btn.setScale(1.12));
            btn.on('pointerout', () => btn.setScale(1));
            btn.on('pointerdown', () => {
                if (this.inputBufferActive || this.hasEnded) return;
                if (colorIdx === this.targetIndex) this.win(); else this.lose();
            });
        });
        this.startTimer();
    }

class BalanceStick extends BaseMicrogame {
    constructor() { super({ key: 'BalanceStick' }); }
    create() {
        super.create();
        this.gradientBackground(0x1a1a2e, 0x090913);
        this.gameTitle('BALANCE!', '#00ff88');
        this.hint('Halte den Stab mit der Maus aufrecht');

        // Podest
        this.add.rectangle(400, 400, 160, 16, 0x555a7a).setStrokeStyle(2, 0x00ff88, 0.6);
        this.stick = this.add.rectangle(400, 310, 18, 180, 0x00ff88).setOrigin(0.5, 1);
        this.stick.y = 392;
        this.ball = this.add.circle(400, 212, 16, 0xffd93d).setStrokeStyle(3, 0xffffff);

        this.maxTilt = 0.5;
        // Kippen driftet von selbst - der Spieler muss aktiv gegensteuern
        this.tilt = 0;
        this.tiltVelocity = Phaser.Math.FloatBetween(-0.06, 0.06) || 0.05;
        // Referenzpunkt ist die aktuelle Mausposition, damit das Spiel nicht
        // sofort verloren ist, wenn der Zeiger am Rand steht.
        this.originX = this.input.activePointer.x || 400;

        this.warnBar = this.add.graphics().setDepth(80);
        this.gameTimer = this.time.delayedCall(this.duration, () => { if (!this.hasEnded) this.win(); });
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;

        // Eingabe: Mausbewegung relativ zum Startpunkt, alternativ Pfeiltasten
        const pointerOffset = (this.input.activePointer.x - this.originX) / 260;
        let steer = Phaser.Math.Clamp(pointerOffset, -1, 1);
        if (this.isLeft()) steer = -1;
        if (this.isRight()) steer = 1;

        // Der Stab fällt zunehmend schneller zur Seite, Gegensteuern bremst
        this.tiltVelocity += this.tilt * 1.6 * dt;
        this.tiltVelocity -= steer * 1.9 * dt;
        this.tiltVelocity *= 0.985;
        this.tilt += this.tiltVelocity * dt;

        this.stick.rotation = this.tilt;
        this.ball.x = 400 + Math.sin(this.tilt) * 180;
        this.ball.y = 392 - Math.cos(this.tilt) * 180;

        // Warnbalken zeigt, wie nah man am Umkippen ist
        const danger = Math.abs(this.tilt) / this.maxTilt;
        this.warnBar.clear();
        this.warnBar.fillStyle(danger > 0.7 ? 0xff3355 : 0x00ff88, 0.8);
        this.warnBar.fillRect(400 - 120 * danger, 500, 240 * danger, 8);

        if (Math.abs(this.tilt) >= this.maxTilt) this.lose();
    }
}

class ZobelFrogger extends BaseMicrogame {

        // Straßen-Bahnen
        this.add.rectangle(400, 150, 800, 80, 0x333333); // Straße 1
        this.add.rectangle(400, 250, 800, 80, 0x333333); // Straße 2
        this.add.rectangle(400, 350, 800, 80, 0x333333); // Straße 3

        // Zielbereich
        this.goalZone = this.add.rectangle(400, 70, 800, 60, 0x00ff88, 0.3);
        this.add.text(400, 70, '🏁 ZIEL 🏁', { font: 'bold 24px Orbitron', fill: '#00ff88' }).setOrigin(0.5);

        // Zobel Spieler
        if (this.textures.exists('zobel')) {
            this.zobel = this.add.image(400, 480, 'zobel').setScale(0.15);
        } else {
            this.zobel = Zobel.draw(this, 400, 480, 0.5, 0x00ff88);
        }
        this.physics.add.existing(this.zobel);
        this.zobel.body.setSize(40, 60);

        // Autos
        this.cars = [];
        const carColors = [0xff0000, 0x0000ff, 0xffff00, 0xff00ff];
        // Reihe 1 - nach rechts
        for (let i = 0; i < 3; i++) {
            const car = this.add.rectangle(-100 + i * 300, 150, 80, 40, carColors[i % 4]);
            this.physics.add.existing(car);
            car.body.setVelocityX(150 * this.gameSpeed);
            car.direction = 1;
            this.cars.push(car);
        }
        // Reihe 2 - nach links
        for (let i = 0; i < 3; i++) {
            const car = this.add.rectangle(900 - i * 300, 250, 80, 40, carColors[(i + 1) % 4]);
            this.physics.add.existing(car);
            car.body.setVelocityX(-180 * this.gameSpeed);
            car.direction = -1;
            this.cars.push(car);
        }
        // Reihe 3 - nach rechts (schneller)
        for (let i = 0; i < 4; i++) {
            const car = this.add.rectangle(-50 + i * 250, 350, 70, 35, carColors[(i + 2) % 4]);
            this.physics.add.existing(car);
            car.body.setVelocityX(200 * this.gameSpeed);
            car.direction = 1;
            this.cars.push(car);
        }

        // Steuerung
        this.cursors = this.input.keyboard.createCursorKeys();
        this.canMove = true;
        this.startTimer();
    }
    update() {
        super.update();
        if (this.hasEnded) return;

        // Autos wrappen
        this.cars.forEach(car => {
            if (car.direction === 1 && car.x > 850) car.x = -50;
            if (car.direction === -1 && car.x < -50) car.x = 850;
        });

        // Zobel Bewegung (Schritt-basiert) - Pfeiltasten + WASD + Touch
        if (this.canMove) {
            if (this.justPressed('up')) {
                this.zobel.y -= 100;
                this.canMove = false;
                this.time.delayedCall(150, () => this.canMove = true);
            } else if (this.justPressed('down') && this.zobel.y < 480) {
                this.zobel.y += 100;
                this.canMove = false;
                this.time.delayedCall(150, () => this.canMove = true);
            } else if (this.justPressed('left') && this.zobel.x > 50) {
                this.zobel.x -= 80;
            } else if (this.justPressed('right') && this.zobel.x < 750) {
                this.zobel.x += 80;
            }
        }

        // Kollision mit Autos
        for (const car of this.cars) {
            if (Phaser.Geom.Intersects.RectangleToRectangle(
                new Phaser.Geom.Rectangle(this.zobel.x - 20, this.zobel.y - 30, 40, 60),
                car.getBounds()
            )) {
                this.lose();
                return;
            }
        }

        // Ziel erreicht?
        if (this.zobel.y <= 100) {
            this.win();
        }
    }
}

class ZobelJump extends BaseMicrogame {
    constructor() { super({ key: 'ZobelJump' }); }
    create() {
        super.create();
        this.gradientBackground(0x87ceeb, 0x87ceeb);
        this.add.text(400, 30, 'SPRING!', { font: 'bold 42px Orbitron', fill: '#333' }).setOrigin(0.5);
        this.add.text(400, 80, 'SPACE oder Klick zum Springen', { font: '16px Orbitron', fill: '#666' }).setOrigin(0.5);

        // Boden
        this.add.rectangle(400, 530, 800, 60, 0x8b4513);
        this.add.rectangle(400, 505, 800, 10, 0x228b22); // Gras

        // Spieler - auf dem Boden stehend (Gras bei y=500)
        this.groundY = 480;
        this.playerY = this.groundY;
        this.velocityY = 0;
        this.isOnGround = true;
        this.gravity = 1500;

        // Zobel zeichnen - auf Bodenhöhe
        if (this.textures.exists('zobel')) {
            this.zobel = this.add.image(150, this.playerY, 'zobel').setScale(0.18);
        } else {
            this.zobel = Zobel.draw(this, 150, this.playerY, 0.6, playerData.activeZobelColor === 'rainbow' ? 0x00ff88 : playerData.activeZobelColor);
        }

        // Hindernisse
        this.obstacles = [];
        this.spawnObstacle(); // Erstes Hindernis sofort

        this.obstacleTimer = this.time.addEvent({
            delay: 1500 / this.gameSpeed,
            callback: this.spawnObstacle,
            callbackScope: this,
            loop: true
        });

        // Nur 1 Hindernis überspringen
        this.jumped = 0;
        this.targetJumps = 1;

        // Steuerung
        this.input.keyboard.on('keydown-SPACE', () => this.jump());
        this.input.on('pointerdown', () => this.jump());

        this.startTimer();
    }
    spawnObstacle() {
        if (this.hasEnded) return;
        const height = Phaser.Math.Between(50, 80);
        const obstacle = this.add.rectangle(850, 500 - height / 2, 50, height, 0xff6b6b);
        obstacle.setStrokeStyle(3, 0xaa0000);
        obstacle.velocityX = -350 * this.gameSpeed;
        obstacle.passed = false;
        this.obstacles.push(obstacle);
    }
    jump() {
        if (this.hasEnded) return;
        if (this.isOnGround) {
            this.velocityY = -600;
            this.isOnGround = false;
        }
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;

        const dt = delta / 1000;

        // Physik für Spieler
        this.velocityY += this.gravity * dt;
        this.playerY += this.velocityY * dt;

        // Boden-Check
        if (this.playerY >= this.groundY) {
            this.playerY = this.groundY;
            this.velocityY = 0;
            this.isOnGround = true;
        }

        // Zobel Position updaten
        this.zobel.y = this.playerY;

        // Hindernisse bewegen und prüfen
        for (let i = this.obstacles.length - 1; i >= 0; i--) {
            const obs = this.obstacles[i];
            obs.x += obs.velocityX * dt;

            if (obs.x < -60) {
                obs.destroy();
                this.obstacles.splice(i, 1);
                continue;
            }

            // Übersprungen? -> Sofort gewinnen
            if (!obs.passed && obs.x < 130) {
                obs.passed = true;
                this.win();
                return;
            }

            // Kollision?
            const playerBox = new Phaser.Geom.Rectangle(130, this.playerY - 40, 40, 70);
            if (Phaser.Geom.Intersects.RectangleToRectangle(playerBox, obs.getBounds())) {
                this.lose();
                return;
            }
        }
    }
}

        }

        // Fallende Objekte
        this.items = [];
        this.caught = 0;
        this.targetCatch = 1;
        this.add.text(400, 80, 'Fang einen Stern! Vermeide Bomben!', { font: '18px Orbitron', fill: '#fff' }).setOrigin(0.5);

        // Items spawnen
        this.spawnTimer = this.time.addEvent({
            delay: 600 / this.gameSpeed,
            callback: this.spawnItem,
            callbackScope: this,
            loop: true
        });

        this.startTimer();
    }
    spawnItem() {
        if (this.hasEnded) return;
        const isStar = Phaser.Math.Between(0, 3) > 0; // 75% Sterne, 25% Bomben
        const x = Phaser.Math.Between(80, 720);
        const item = this.add.text(x, -30, isStar ? '⭐' : '💣', { font: '40px Arial' }).setOrigin(0.5);
        this.physics.add.existing(item);
        item.body.setVelocityY(200 * this.gameSpeed);
        item.isStar = isStar;
        this.items.push(item);
    }
    update() {
        super.update();
        if (this.hasEnded) return;

        // Zobel folgt Maus
        this.zobel.x = Phaser.Math.Clamp(this.input.x, 60, 740);

        // Items prüfen
        for (let i = this.items.length - 1; i >= 0; i--) {
            const item = this.items[i];
            if (item.y > 620) {
                item.destroy();
                this.items.splice(i, 1);
                continue;
            }
            // Gefangen?
            const dist = Phaser.Math.Distance.Between(item.x, item.y, this.zobel.x, this.zobel.y - 20);
            if (dist < 50) {
                const wasStar = item.isStar;
                item.destroy();
                this.items.splice(i, 1);
                if (wasStar) { Effects.burst(this, this.zobel.x, this.zobel.y - 20, 0xffd93d, 12, 90); this.win(); }
                else this.lose();
                return;
            }
        }
    }
}

class ZobelHide extends BaseMicrogame {

        ];

        // Zobel versteckt sich in einem zufälligen Busch

        positions.forEach((pos, idx) => {
            const bush = this.add.container(pos.x, pos.y);

            bushGraphics.fillCircle(15, -20, 25);
            bush.add(bushGraphics);

            // Zobel-Augen die kurz blinken (nur im richtigen Busch)
            if (idx === zobelBushIndex) {
                const eyes = this.add.graphics();
                eyes.fillStyle(0x000000, 1);
                eyes.fillCircle(-8, -5, 5);
                eyes.fillCircle(8, -5, 5);
                bush.add(eyes);
                eyes.setAlpha(0);

                // Kurz blinken
                this.time.addEvent({
                    delay: Phaser.Math.Between(500, 1500),
                    callback: () => {
                        if (!this.hasEnded) {
                            this.tweens.add({
                                targets: eyes,
                                alpha: 1,
                                duration: 150,
                                yoyo: true,
                                repeat: 0
                            });
                        }
                    },
                    loop: true
                });
            }

            bush.setInteractive(new Phaser.Geom.Circle(0, 0, 60), Phaser.Geom.Circle.Contains);
            bush.on('pointerdown', () => {
                if (this.hasEnded) return;
                if (idx === zobelBushIndex) {
                    // Zobel springt raus
                    bush.removeAll(true);
                    if (this.textures.exists('zobel')) {
                        const zobelImg = this.add.image(pos.x, pos.y - 50, 'zobel').setScale(0.15);
                        this.tweens.add({ targets: zobelImg, y: pos.y - 100, duration: 300 });
                    } else {
                        const zobelSprite = Zobel.draw(this, pos.x, pos.y - 50, 0.5);
                        this.tweens.add({ targets: zobelSprite, y: pos.y - 100, duration: 300 });
                    }
                    this.win();
                } else {
                    // Falscher Busch - schüttelt
                    this.tweens.add({
                        targets: bush,
                        x: { from: pos.x - 10, to: pos.x + 10 },
                        duration: 50,
                        yoyo: true,
                        repeat: 3
                    });
                }
            });

            this.bushes.push(bush);
        });

        this.startTimer();
    }
}

            nutGraphics.fillStyle(0x8B4513, 1);
            nutGraphics.fillEllipse(0, 0, 25, 20);
            nutGraphics.fillStyle(0x654321, 1);
            nutGraphics.fillEllipse(0, -12, 10, 8);
            nut.add(nutGraphics);
            this.nuts.push(nut);

        this.cursors = this.input.keyboard.createCursorKeys();

    }

            this.zobelX -= speed;
            if (this.zobel.setFlipX) this.zobel.setFlipX(true);
        }
        if (this.isRight()) {
            this.zobelX += speed;
            if (this.zobel.setFlipX) this.zobel.setFlipX(false);
        }
        this.zobelX = Phaser.Math.Clamp(this.zobelX, 50, 750);
        this.zobel.x = this.zobelX;

        // Nüsse sammeln
        this.nuts.forEach((nut, idx) => {
            if (nut.active && Math.abs(nut.x - this.zobelX) < 40) {
                nut.setActive(false).setVisible(false);
                this.collected++;
                this.collectText.setText(this.collected + ' / ' + this.target);
                musicEngine.playSFX('click');

                if (this.collected >= this.target) {
                    this.win();
                }
            }
        });

            fish.fillEllipse(0, 0, 50, 25);
            fish.fillStyle(0x000000, 1);
            fish.fillCircle(12, -3, 4);
            this.swaggy.add(fish);
        }

        // Ziel-Linie zur Maus
        this.aimLine = this.add.graphics();

        // Blasen
        this.bubbles = [];
        for (let i = 0; i < 8; i++) {
            this.spawnBubble();
        }

        // Klick zum Schießen Richtung Maus
        this.input.on('pointerdown', (pointer) => {
            if (this.hasEnded) return;
            this.shootBubble(pointer.x, pointer.y);
        });

        this.startTimer();
    }

    spawnBubble() {
        const bubble = this.add.circle(
            Phaser.Math.Between(80, 720),
            Phaser.Math.Between(80, 520),
            Phaser.Math.Between(20, 40),
            0x87CEEB, 0.7
        );
        // Nicht zu nah an Swaggy spawnen
        if (Phaser.Math.Distance.Between(bubble.x, bubble.y, this.swaggyX, this.swaggyY) < 100) {
            bubble.x = Phaser.Math.Between(50, 150);
        }
        bubble.active = true;
        this.bubbles.push(bubble);
    }

    update() {
        super.update();
        if (this.hasEnded) return;

        // Ziel-Linie zur Maus zeichnen
        const pointer = this.input.activePointer;
        this.aimLine.clear();
        this.aimLine.lineStyle(2, 0xFFD700, 0.5);
        this.aimLine.lineBetween(this.swaggyX, this.swaggyY, pointer.x, pointer.y);
    }

    shootBubble(targetX, targetY) {
        // Richtung berechnen
        const angle = Phaser.Math.Angle.Between(this.swaggyX, this.swaggyY, targetX, targetY);
        const speed = 600;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;

        // Projektil erstellen
        const projectile = this.add.circle(this.swaggyX, this.swaggyY, 10, 0xFFD700);
        projectile.vx = vx;
        projectile.vy = vy;

        // Projektil bewegen per Tween
        this.tweens.add({
            targets: projectile,
            x: this.swaggyX + vx,
            y: this.swaggyY + vy,
            duration: 800,
            onUpdate: () => {
                this.bubbles.forEach(bubble => {
                    if (bubble.active && Phaser.Math.Distance.Between(projectile.x, projectile.y, bubble.x, bubble.y) < bubble.radius + 10) {
                        bubble.active = false;
                        bubble.destroy();
                        this.popped++;
                        this.collectText.setText(this.popped + ' / ' + this.target);
                        musicEngine.playSFX('click');
                        if (this.popped >= this.target) this.win();
                    }
                });
            },
            onComplete: () => projectile.destroy()
        });
    }
}

        this.arrowSymbols = { 'LEFT': '←', 'RIGHT': '→', 'UP': '↑', 'DOWN': '↓' };

        for (let i = 0; i < this.target; i++) {
            this.sequence.push(Phaser.Utils.Array.GetRandom(this.arrows));
        }
        this.currentIndex = 0;

        // Sequenz anzeigen mit Pfeilsymbolen
        this.arrowDisplay = this.add.text(400, 200, this.sequence.map(s => this.arrowSymbols[s]).join(' '), {
            font: 'bold 48px Orbitron', fill: '#ffff00'
        }).setOrigin(0.5);

        this.input.keyboard.on('keydown', (event) => {
            if (this.hasEnded) return;
            const key = event.key.toUpperCase().replace('ARROW', '');

                    this.score++;
                    this.currentIndex++;

                        scaleX: baseScale * 1.1,

                    });

            fish.active = true;
            fish.vx = Phaser.Math.Between(-3, 3) || 1;
            fish.vy = Phaser.Math.Between(-2, 2);
            this.smallFish.push(fish);
        }

        this.cursors = this.input.keyboard.createCursorKeys();
        this.startTimer();
    }

        super.update();  // Zündschnur-Anzeige aktualisieren

        if (this.isRight()) this.swaggyX += speed;

            fish.y += fish.vy;

            if (fish.y < 100 || fish.y > 560) fish.vy *= -1;

                fish.setVisible(false);
                this.caught++;
                this.collectText.setText(this.caught + ' / ' + this.target);
                musicEngine.playSFX('click');
                if (this.caught >= this.target) this.win();
            }
        });
    }
}

// DudeDodge - Weiche fallenden Objekten aus
class DudeDodge extends BaseMicrogame {
    constructor() { super({ key: 'DudeDodge' }); }
    create() {
        super.create();
        this.gradientBackground(0x1a1a2e, 0x1a1a2e);
        this.surviveTime = 0;

        this.add.rectangle(400, 550, 800, 100, 0x333333);
        this.add.text(400, 30, 'Weiche den Bomben aus! ← →', { font: '16px Orbitron', fill: '#fff' }).setOrigin(0.5);

        // Trashi - höher positioniert
        this.dudeX = 400;
        this.dudeY = 430;
        if (this.textures.exists('dude')) {
            this.dude = this.add.sprite(this.dudeX, this.dudeY, 'dude', 4).setScale(3.0);
        } else {
            this.dude = this.add.rectangle(this.dudeX, this.dudeY, 30, 50, 0x4169E1);
        }

        // Bomben
        this.bombs = [];
        this.spawnTimer = this.time.addEvent({
            delay: 500,
            callback: () => {
                if (!this.hasEnded) {
                    const bomb = this.add.circle(Phaser.Math.Between(50, 750), -20, 15, 0xff0000);
                    bomb.vy = Phaser.Math.Between(4, 8);
                    this.bombs.push(bomb);
                }
            },
            loop: true
        });

        this.cursors = this.input.keyboard.createCursorKeys();
        this.startSurvivalTimer();  // Überleben = Gewinnen!
    }

    update() {
        super.update();  // Timer-Update
        if (this.hasEnded) return;

        const speed = 7;
        if (this.isLeft()) {
            this.dudeX -= speed;
            if (this.dude.play) this.dude.play('dude_left', true);
        } else if (this.isRight()) {
            this.dudeX += speed;
            if (this.dude.play) this.dude.play('dude_right', true);
        } else if (this.dude.play) {
            this.dude.play('dude_idle', true);
        }

        this.dudeX = Phaser.Math.Clamp(this.dudeX, 30, 770);
        this.dude.x = this.dudeX;

        // Bomben bewegen und aufräumen
        for (let i = this.bombs.length - 1; i >= 0; i--) {
            const bomb = this.bombs[i];
            bomb.y += bomb.vy;

            // Bombe aus dem Bildschirm? Entfernen
            if (bomb.y > 600) {
                bomb.destroy();
                this.bombs.splice(i, 1);
                continue;
            }

            // Kollision - kleinere Hitbox (nur wenn Bombe wirklich den Spieler trifft)
            const dudeWidth = 20;
            const dudeHeight = 60;
            if (bomb.x > this.dudeX - dudeWidth && bomb.x < this.dudeX + dudeWidth &&
                bomb.y > this.dudeY - dudeHeight/2 && bomb.y < this.dudeY + dudeHeight/2) {
                this.lose();
            }
        }
    }
}

// DudeJump - Spring über Hindernisse
class DudeJump extends BaseMicrogame {
    constructor() { super({ key: 'DudeJump' }); }
    create() {
        super.create();
        this.gradientBackground(0x4a69bd, 0x4a69bd);
        this.jumped = 0;
        this.target = 1;

        this.add.rectangle(400, 550, 800, 100, 0x2d3436);
        this.add.rectangle(400, 510, 800, 20, 0x228B22); // Gras
        this.add.text(400, 30, 'Spring über das Hindernis! SPACE', { font: '16px Orbitron', fill: '#fff' }).setOrigin(0.5);

        // Trashi - steht auf dem Boden
        this.groundY = 430;
        this.dudeY = this.groundY;
        if (this.textures.exists('dude')) {
            this.dude = this.add.sprite(200, this.dudeY, 'dude', 4).setScale(3.0);
        } else {
            this.dude = this.add.rectangle(200, this.dudeY, 30, 50, 0x4169E1);
        }

        // Hindernis auf dem Boden (Höhe 50, Boden bei y=500)
        this.obstacle = this.add.rectangle(850, 475, 40, 50, 0xff6b6b);
        this.obstacleSpeed = 6;

        this.isJumping = false;
        this.dudeVY = 0;

        this.input.keyboard.on('keydown-SPACE', () => {
            if (!this.isJumping && !this.hasEnded) {
                this.isJumping = true;
                this.dudeVY = -18;
            }
        });

        this.startTimer();
    }

    update() {
        super.update();  // Timer-Update
        if (this.hasEnded) return;

        // Rennanimation wenn nicht springend
        if (!this.isJumping && this.dude.play) {
            this.dude.play('dude_right', true);
        }

        // Springen
        if (this.isJumping) {
            this.dudeVY += 1;
            this.dudeY += this.dudeVY;
            this.dude.y = this.dudeY;

            if (this.dudeY >= this.groundY) {
                this.dudeY = this.groundY;
                this.dude.y = this.groundY;
                this.isJumping = false;
                this.dudeVY = 0;
            }
        }

        // Hindernis bewegen
        this.obstacle.x -= this.obstacleSpeed;

        // Erfolgreich übersprungen
        if (this.obstacle.x < 150 && this.jumped === 0) {
            if (this.dudeY < this.groundY - 40) {
                // In der Luft = übersprungen
                this.jumped++;
                this.win();
            }
        }

        // Kollision - angepasste Werte
        if (this.obstacle.x > 160 && this.obstacle.x < 240 && this.dudeY > this.groundY - 30) {
            this.lose();
        }

        // Hindernis durch
        if (this.obstacle.x < -50) {
            this.obstacle.x = 850;
        }
    }
}

        this.startTimer();
    }
    update() {
        super.update();
        if (this.hasEnded) return;

        const speed = 4;
        let newX = this.playerX;
        let newY = this.playerY;

        if (this.isLeft()) {
            newX -= speed;
            if (this.player.play) this.player.play('kaeppchen_left', true);

            newX += speed;

        this.gradientBackground(0x1a3d1a, 0x1a3d1a);

        this.add.text(400, 30, 'Überlebe die Wölfe!', { font: '16px Orbitron', fill: '#fff' }).setOrigin(0.5);

        // Käppchen
        this.playerX = 400;
        this.playerY = 300;
        if (this.textures.exists('kaeppchen')) {
            this.player = this.add.sprite(this.playerX, this.playerY, 'kaeppchen', 0).setScale(1.5);
        } else {
            this.player = this.add.circle(this.playerX, this.playerY, 20, 0xE63946);
        }

        // Wölfe spawnen - langsamer für bessere Spielbarkeit
        this.wolves = [];
        this.spawnTimer = this.time.addEvent({
            delay: 800,
            callback: () => {
                if (this.hasEnded) return;
                const side = Phaser.Math.Between(0, 3);
                let x, y, vx = 0, vy = 0;
                if (side === 0) { x = -20; y = Phaser.Math.Between(100, 500); vx = 3; }
                else if (side === 1) { x = 820; y = Phaser.Math.Between(100, 500); vx = -3; }
                else if (side === 2) { x = Phaser.Math.Between(100, 700); y = -20; vy = 3; }
                else { x = Phaser.Math.Between(100, 700); y = 620; vy = -3; }
                const wolf = this.add.circle(x, y, 15, 0x444444);
                wolf.vx = vx; wolf.vy = vy;
                this.wolves.push(wolf);
            },
            loop: true
        });

        this.cursors = this.input.keyboard.createCursorKeys();
        this.startSurvivalTimer();  // Überleben = Gewinnen!
    }
    update() {
        super.update();
        if (this.hasEnded) return;

        const speed = 5;
        if (this.isLeft()) {
            this.playerX -= speed;
            if (this.player.play) this.player.play('kaeppchen_left', true);
        } else if (this.isRight()) {
            this.playerX += speed;
            if (this.player.play) this.player.play('kaeppchen_right', true);
        } else if (this.isUp()) {
            this.playerY -= speed;
            if (this.player.play) this.player.play('kaeppchen_up', true);
        } else if (this.isDown()) {
            this.playerY += speed;
            if (this.player.play) this.player.play('kaeppchen_down', true);
        }

        this.playerX = Phaser.Math.Clamp(this.playerX, 30, 770);
        this.playerY = Phaser.Math.Clamp(this.playerY, 60, 540);
        this.player.x = this.playerX;
        this.player.y = this.playerY;

        // Wölfe bewegen und außerhalb des Bildes aufräumen
        for (let i = this.wolves.length - 1; i >= 0; i--) {
            const wolf = this.wolves[i];
            wolf.x += wolf.vx;
            wolf.y += wolf.vy;
            if (wolf.x < -60 || wolf.x > 860 || wolf.y < -60 || wolf.y > 660) {
                wolf.destroy();
                this.wolves.splice(i, 1);
                continue;
            }
            if (Phaser.Math.Distance.Between(this.playerX, this.playerY, wolf.x, wolf.y) < 30) {
                this.lose();
                return;
            }
        }
    }
}

        this.platforms = [
            this.add.rectangle(150, 450, 180, 25, 0x7f8c8d),
            this.add.rectangle(400, 350, 180, 25, 0x7f8c8d),
            this.add.rectangle(650, 250, 180, 25, 0x7f8c8d)
        ];

        // Boden
        this.add.rectangle(400, 550, 800, 40, 0x2d3436);

        // Edgar
        this.edgarX = 150;
        this.edgarY = 400;
        this.velocityY = 0;
        this.onGround = true;

        if (this.textures.exists('edgar')) {
            this.edgar = this.add.image(this.edgarX, this.edgarY, 'edgar').setScale(2.0);
        } else {
            this.edgar = this.add.circle(this.edgarX, this.edgarY, 20, 0x9B59B6);
        }

        this.input.keyboard.on('keydown-SPACE', () => {
            if (this.onGround && !this.hasEnded) {
                this.velocityY = -15;
                this.onGround = false;
            }
        });

        this.cursors = this.input.keyboard.createCursorKeys();
        this.startTimer();
    }
    update() {
        super.update();
        if (this.hasEnded) return;

        // Horizontale Bewegung
        if (this.isLeft()) {
            this.edgarX -= 4;
            this.edgar.angle -= 5;
        } else if (this.isRight()) {
            this.edgarX += 4;
            this.edgar.angle += 5;
        }
        this.edgarX = Phaser.Math.Clamp(this.edgarX, 30, 770);

        // Schwerkraft
        this.velocityY += 0.8;
        this.edgarY += this.velocityY;

        // Boden-Check
        if (this.edgarY >= 510) {
            this.edgarY = 510;
            this.velocityY = 0;
            this.onGround = true;
        }

        // Plattform-Check - größerer Bereich für größere Plattformen
        this.platforms.forEach((plat, idx) => {
            if (this.velocityY > 0 &&
                this.edgarX > plat.x - 100 && this.edgarX < plat.x + 100 &&
                this.edgarY > plat.y - 30 && this.edgarY < plat.y + 15) {
                this.edgarY = plat.y - 20;
                this.velocityY = 0;
                this.onGround = true;
                // Zähle als Bounce wenn neue Plattform
                if (!plat.bounced) {
                    plat.bounced = true;
                    this.bounces++;
                    this.bounceText.setText(this.bounces + ' / ' + this.target);
                    musicEngine.playSFX('click');
                    if (this.bounces >= this.target) this.win();
                }
            }
        });

        this.edgar.x = this.edgarX;
        this.edgar.y = this.edgarY;
    }
}

class EdgarGoal extends BaseMicrogame {

        // Tor an zufälliger Position (links, mitte, rechts)
        const goalPositions = [200, 400, 600];
        this.goalX = Phaser.Utils.Array.GetRandom(goalPositions);
        this.add.rectangle(this.goalX, 80, 150, 60, 0xffffff, 0.3);
        this.add.rectangle(this.goalX, 80, 150, 60).setStrokeStyle(4, 0xffffff);

        // Edgar startet mittig
        this.edgarX = 400;
        this.edgarY = 450;
        this.velocityX = 0;
        this.velocityY = 0;
        this.kicked = false;

        if (this.textures.exists('edgar')) {
            this.edgar = this.add.image(this.edgarX, this.edgarY, 'edgar').setScale(2.5);
        } else {
            this.edgar = this.add.circle(this.edgarX, this.edgarY, 25, 0x9B59B6);
        }

        // Ziel-Pfeil
        this.arrow = this.add.triangle(this.edgarX, this.edgarY - 50, 0, 20, 10, 0, 20, 20, 0x00ff00);
        this.arrowAngle = -90;

        this.cursors = this.input.keyboard.createCursorKeys();

        this.input.keyboard.on('keydown-SPACE', () => {
            if (!this.kicked && !this.hasEnded) {
                this.kicked = true;
                const rad = this.arrowAngle * Math.PI / 180;
                this.velocityX = Math.cos(rad) * 12;
                this.velocityY = Math.sin(rad) * 12;
                this.arrow.visible = false;
            }
        });

        this.startTimer();
    }
    update() {
        super.update();
        if (this.hasEnded) return;

        if (!this.kicked) {
            // Pfeil bewegen
            if (this.isLeft()) this.arrowAngle -= 3;
            if (this.isRight()) this.arrowAngle += 3;
            this.arrowAngle = Phaser.Math.Clamp(this.arrowAngle, -150, -30);

            const rad = this.arrowAngle * Math.PI / 180;
            this.arrow.x = this.edgarX + Math.cos(rad) * 50;
            this.arrow.y = this.edgarY + Math.sin(rad) * 50;
            this.arrow.angle = this.arrowAngle + 90;
        } else {
            // Ball bewegt sich
            this.edgarX += this.velocityX;
            this.edgarY += this.velocityY;
            this.edgar.x = this.edgarX;
            this.edgar.y = this.edgarY;
            this.edgar.angle += this.velocityX * 2;

            // Tor getroffen?
            if (this.edgarY < 110 && this.edgarX > this.goalX - 75 && this.edgarX < this.goalX + 75) {
                this.win();
            }

            // Daneben?
            if (this.edgarY < 50 || this.edgarX < 0 || this.edgarX > 800) {
                this.lose();
            }
        }
    }
}

        // Swaggy - startet weiter links auf der langen Plattform
        this.swaggyX = 50; this.swaggyY = 470;
        this.velY = 0; this.onGround = true; this.currentPlatform = 0;
        if (this.textures.exists('swaggy')) {
            this.swaggy = this.add.image(this.swaggyX, this.swaggyY, 'swaggy').setScale(0.06);
        } else {
            this.swaggy = this.add.circle(this.swaggyX, this.swaggyY, 20, 0xFFA500);
        }

            if (this.hasEnded || !this.onGround) return;
            this.velY = -12;
            this.onGround = false;
        });
        this.input.on('pointerdown', () => {
            if (this.hasEnded || !this.onGround) return;
            this.velY = -12;
            this.onGround = false;
        });

        // Vorwärtstempo so wählen, dass die Zielplattform in der verfügbaren
        // Zeit erreichbar ist (vorher war das Spiel ab Tempo 1.0 unschaffbar).
        this.autoSpeed = (700 - this.swaggyX) / ((this.duration / 1000) * 0.72) / 60;
        this.startTimer();
    }
    update() {
        super.update();
        if (this.hasEnded) return;

        this.velY += 0.5; // Gravity
        this.swaggyY += this.velY;
        this.swaggyX += this.autoSpeed; // Auto move right

        // Platform collision
        this.platforms.forEach((p, i) => {
            if (this.swaggyX > p.x - 60 && this.swaggyX < p.x + 60 &&
                this.swaggyY > p.y - 30 && this.swaggyY < p.y && this.velY > 0) {
                this.swaggyY = p.y - 20;
                this.velY = 0;
                this.onGround = true;
                if (i === 4) this.win(); // Reached goal
            }
        });

        if (this.swaggyY > 600) this.lose();
        this.swaggy.x = this.swaggyX;
        this.swaggy.y = this.swaggyY;
    }
}

class DudeSlide extends BaseMicrogame {
    constructor() { super({ key: 'DudeSlide' }); }
    create() {
        super.create();
        this.gradientBackground(0x1a1a2e, 0x1a1a2e);
        this.add.text(400, 30, 'Rutsche runter! ← →', { font: '18px Orbitron', fill: '#fff' }).setOrigin(0.5);

        // Trashi - startet höher für mehr Reaktionszeit
        this.dudeX = 400; this.dudeY = 80;
        if (this.textures.exists('dude')) {
            this.dude = this.add.sprite(this.dudeX, this.dudeY, 'dude', 4).setScale(2.5);
        } else {
            this.dude = this.add.rectangle(this.dudeX, this.dudeY, 30, 45, 0x4169E1);
        }

        // Hindernisse - erste Reihe leer, danach weniger dichte Hindernisse
        this.obstacles = [];
        // Keine Hindernisse in den ersten 150 Pixeln (Startzone)
        for (let row = 0; row < 3; row++) {
            const y = 280 + row * 90;
            // Hindernisse mit Lücken, garantiert durchquerbar
            const numObs = 2;
            const positions = Phaser.Utils.Array.Shuffle([120, 280, 400, 520, 680]).slice(0, numObs);
            positions.forEach(x => {
                const obs = this.add.rectangle(x, y, 50, 15, 0xff6b6b);
                this.obstacles.push(obs);
            });
        }

        // Ziel
        this.goal = this.add.rectangle(400, 550, 250, 30, 0x00ff88);
        this.add.text(400, 550, 'ZIEL', { font: 'bold 14px Orbitron', fill: '#000' }).setOrigin(0.5);

        // Rutschtempo an die verfügbare Zeit koppeln, damit das Ziel bei
        // jedem Spieltempo rechtzeitig erreichbar bleibt.
        this.slideSpeed = 470 / ((this.duration / 1000) * 0.78);

        this.cursors = this.input.keyboard.createCursorKeys();
        this.startTimer();
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;

        if (this.isLeft()) this.dudeX -= 360 * dt;
        if (this.isRight()) this.dudeX += 360 * dt;
        this.dudeX = Phaser.Math.Clamp(this.dudeX, 30, 770);
        this.dudeY += this.slideSpeed * dt; // Auto slide down

        this.dude.x = this.dudeX;
        this.dude.y = this.dudeY;
        if (this.dude.play && (this.isLeft() || this.isRight())) {
            this.dude.play(this.isLeft() ? 'dude_left' : 'dude_right', true);
        }

        // Check obstacle collision
        this.obstacles.forEach(obs => {
            if (Math.abs(this.dudeX - obs.x) < 45 && Math.abs(this.dudeY - obs.y) < 25) {
                this.lose();
            }
        });

        // Check goal
        if (this.dudeY > 530) this.win();
    }
}

        this.counterText = this.add.text(400, 70, '0/' + this.target, { font: 'bold 28px Orbitron', fill: '#E63946' }).setOrigin(0.5);

        // Blumen spawnen - weniger insgesamt
        this.flowers = [];
        for (let i = 0; i < 8; i++) {
            const isRed = i < 2;
            const flower = this.add.text(
                Phaser.Math.Between(60, 740),
                Phaser.Math.Between(120, 520),
                isRed ? '🌹' : '🌼',
                { font: '36px Arial' }
            ).setOrigin(0.5).setInteractive({ useHandCursor: true });
            flower.isRed = isRed;
            flower.on('pointerdown', () => {
                if (this.hasEnded) return;
                if (flower.isRed) {
                    this.picked++;
                    this.counterText.setText(this.picked + '/' + this.target);
                    flower.destroy();
                    if (this.picked >= this.target) this.win();
                } else {
                    this.lose();
                }
            });
            this.flowers.push(flower);
        }
        // Shuffle visual positions
        Phaser.Utils.Array.Shuffle(this.flowers);

        this.startTimer();
    }
}

class EdgarPinball extends BaseMicrogame {
    constructor() { super({ key: 'EdgarPinball' }); }
    create() {
        super.create();
        this.gradientBackground(0x1a0a2e, 0x1a0a2e);
        this.add.text(400, 30, 'Triff einen Bumper! ← →', { font: '18px Orbitron', fill: '#fff' }).setOrigin(0.5);

        // Flipper
        this.flipperX = 400;
        this.flipper = this.add.rectangle(this.flipperX, 530, 120, 15, 0x9B59B6);

        // Edgar als Ball - startet oben und fällt Richtung Paddle
        this.edgarX = 400; this.edgarY = 120;
        this.velX = 0; this.velY = 2;
        if (this.textures.exists('edgar')) {
            this.edgar = this.add.image(this.edgarX, this.edgarY, 'edgar').setScale(2);
        } else {
            this.edgar = this.add.circle(this.edgarX, this.edgarY, 20, 0x9B59B6);
        }

        // 3 Leben
        this.lives = 3;
        this.livesText = this.add.text(700, 30, '❤️'.repeat(this.lives), { font: '24px Arial' }).setOrigin(0.5);

        // Bumper - 3 Stück, nur 1 treffen reicht
        this.bumpers = [];
        const positions = [[200, 280], [400, 200], [600, 280]];
        positions.forEach(p => {
            const b = this.add.circle(p[0], p[1], 30, 0xFFD700);
            b.setStrokeStyle(3, 0xffffff);
            b.hit = false;
            this.bumpers.push(b);
        });

        this.cursors = this.input.keyboard.createCursorKeys();
        this.startSurvivalTimer();
    }
    update() {
        super.update();
        if (this.hasEnded) return;

        // Flipper bewegen
        if (this.isLeft()) this.flipperX -= 8;
        if (this.isRight()) this.flipperX += 8;
        this.flipperX = Phaser.Math.Clamp(this.flipperX, 80, 720);
        this.flipper.x = this.flipperX;

        // Edgar Ball Physik
        this.edgarX += this.velX;
        this.edgarY += this.velY;
        this.velY += 0.12; // Gravity

        // Wand-Kollision
        if (this.edgarX < 30 || this.edgarX > 770) this.velX *= -1;
        if (this.edgarY < 50) this.velY *= -1;

        // Flipper Kollision
        if (this.edgarY > 510 && this.edgarY < 540 && Math.abs(this.edgarX - this.flipperX) < 70) {
            this.velY = -9;
            this.velX = (this.edgarX - this.flipperX) / 10;
            musicEngine.playSFX('click');
        }

        // Bumper Kollision - 1 Treffer = Gewonnen!
        this.bumpers.forEach(b => {
            if (!b.hit && Phaser.Math.Distance.Between(this.edgarX, this.edgarY, b.x, b.y) < 50) {
                b.hit = true;
                b.setFillStyle(0x00ff88);
                this.velY *= -1.2;
                this.velX += Phaser.Math.Between(-2, 2);
                this.win();
            }
        });

        // Ball verloren - Leben abziehen
        if (this.edgarY > 580) {
            this.lives--;
            this.livesText.setText('❤️'.repeat(this.lives));
            if (this.lives <= 0) {
                this.lose();
            } else {
                // Ball respawnen
                this.edgarX = 400;
                this.edgarY = 120;
                this.velX = 0;
                this.velY = 2;
            }
        }

        this.edgar.x = this.edgarX;
        this.edgar.y = this.edgarY;
        this.edgar.angle += this.velX * 2;
    }
}

// ReactionTest - Warten bis es grün wird, dann sofort reagieren

// WhackAMole - auftauchende Ziele schnell treffen
class WhackAMole extends BaseMicrogame {
    constructor() { super({ key: 'WhackAMole' }); }
    create() {
        super.create();
        this.gradientBackground(0x3d2b1a, 0x1a1108);
        this.gameTitle('HAU DRAUF!', '#ffd93d');
        this.hits = 0;
        this.target = 4;
        this.counterText = this.counter('0 / ' + this.target, '#ffd93d');
        this.hint('Klicke die Zobel, sobald sie auftauchen');

        // Löcher im Raster
        this.holes = [];
        const cols = 4, rows = 2;
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const x = 170 + c * 155, y = 250 + r * 150;
                this.add.ellipse(x, y + 26, 108, 34, 0x1a1108).setStrokeStyle(3, 0x4a3728);
                const mole = this.add.container(x, y).setAlpha(0);
                if (this.textures.exists('zobel')) {
                    mole.add(this.add.image(0, 0, 'zobel').setScale(0.11));
                } else {
                    const g = this.add.graphics();
                    g.fillStyle(0x8B7355, 1); g.fillCircle(0, 0, 30);
                    g.fillStyle(0x000000, 1); g.fillCircle(-10, -6, 4); g.fillCircle(10, -6, 4);
                    mole.add(g);
                }
                mole.setSize(100, 90);
                mole.setInteractive(new Phaser.Geom.Rectangle(-50, -45, 100, 90), Phaser.Geom.Rectangle.Contains, { useHandCursor: true });
                mole.isUp = false;
                mole.on('pointerdown', () => this.whack(mole));
                this.holes.push(mole);
            }
        }

        this.popTimer = this.time.addEvent({
            delay: Math.max(320, 620 / this.gameSpeed),
            callback: this.popRandom, callbackScope: this, loop: true
        });
        this.popRandom();
        this.startTimer();
    }
    popRandom() {
        if (this.hasEnded) return;
        const down = this.holes.filter(m => !m.isUp);
        if (down.length === 0) return;
        const mole = Phaser.Utils.Array.GetRandom(down);
        mole.isUp = true;
        this.tweens.add({ targets: mole, alpha: 1, y: mole.y - 18, duration: 140, ease: 'Back.easeOut' });
        this.time.delayedCall(Math.max(500, 900 / this.gameSpeed), () => {
            if (this.hasEnded || !mole.isUp) return;
            mole.isUp = false;
            this.tweens.add({ targets: mole, alpha: 0, y: mole.y + 18, duration: 140 });
        });
    }
    whack(mole) {
        if (this.hasEnded || !mole.isUp || this.inputBufferActive) return;
        mole.isUp = false;
        Effects.burst(this, mole.x, mole.y, 0xffd93d, 10, 70);
        musicEngine.playSFX('click');
        this.tweens.add({ targets: mole, alpha: 0, y: mole.y + 18, duration: 120 });
        this.hits++;
        this.counterText.setText(this.hits + ' / ' + this.target);
        if (this.hits >= this.target) this.win();
    }
}

// CountThem - Objekte zählen und die richtige Zahl wählen
class CountThem extends BaseMicrogame {
    constructor() { super({ key: 'CountThem' }); }
    create() {
        super.create();
        this.gradientBackground(0x14304a, 0x081420);
        this.gameTitle('ZÄHLEN!', '#00d4ff');
        this.hint('Wie viele Nüsse liegen herum?');

        const count = Phaser.Math.Between(4, 11);
        this.correct = count;
        for (let i = 0; i < count; i++) {
            const nut = this.add.text(
                Phaser.Math.Between(80, 720), Phaser.Math.Between(130, 400),
                '🌰', { font: '34px Arial' }
            ).setOrigin(0.5);
            this.tweens.add({
                targets: nut, angle: Phaser.Math.Between(-15, 15),
                duration: Phaser.Math.Between(700, 1400), yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
            });
        }

        // Antwortmöglichkeiten: richtige Zahl plus zwei nahe Alternativen
        const options = new Set([count]);
        while (options.size < 3) {
            const alt = count + Phaser.Math.Between(-3, 3);
            if (alt > 0 && alt !== count) options.add(alt);
        }
        const shuffled = Phaser.Utils.Array.Shuffle([...options]);
        shuffled.forEach((val, i) => {
            UI.button(this, 250 + i * 150, 490, 110, 60, String(val), {
                color: UI.CYAN,
                fontSize: 26,
                onClick: () => {
                    if (this.hasEnded || this.inputBufferActive) return;
                    if (val === this.correct) this.win(); else this.lose();
                }
            });
        });
        this.startTimer();
    }
}

// AvoidLaser - angekündigten Laserstrahlen ausweichen
class AvoidLaser extends BaseMicrogame {
    constructor() { super({ key: 'AvoidLaser' }); }
    create() {
        super.create();
        this.gradientBackground(0x1b0b2b, 0x070310);
        this.gameTitle('LASER!', '#ff3355');
        this.hint('← → ausweichen und überleben');

        this.playerX = 400;
        this.player = CharacterManager.draw(this, this.playerX, 470, 0.55);
        this.lasers = [];

        this.laserTimer = this.time.addEvent({
            delay: Math.max(420, 800 / this.gameSpeed),
            callback: this.spawnLaser, callbackScope: this, loop: true
        });
        this.spawnLaser();

        this.cursors = this.input.keyboard.createCursorKeys();
        this.startSurvivalTimer();
    }
    spawnLaser() {
        if (this.hasEnded) return;
        const x = Phaser.Math.Between(80, 720);
        // Warnlinie zuerst, damit ausweichen fair möglich ist
        const warn = this.add.rectangle(x, 300, 8, 600, 0xff3355, 0.35);
        this.tweens.add({ targets: warn, alpha: 0.8, duration: 120, yoyo: true, repeat: 3 });
        this.time.delayedCall(Math.max(380, 620 / this.gameSpeed), () => {
            if (this.hasEnded) { warn.destroy(); return; }
            warn.destroy();
            const beam = this.add.rectangle(x, 300, 44, 600, 0xff3355, 0.85);
            beam.setStrokeStyle(3, 0xffffff, 0.7);
            beam.deadly = true;
            this.lasers.push(beam);
            musicEngine.playSFX('click');
            this.time.delayedCall(360, () => {
                beam.deadly = false;
                this.tweens.add({
                    targets: beam, alpha: 0, duration: 180,
                    onComplete: () => {
                        const i = this.lasers.indexOf(beam);
                        if (i >= 0) this.lasers.splice(i, 1);
                        beam.destroy();
                    }
                });
            });
        });
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;

        if (this.isLeft()) this.playerX -= 380 * dt;
        if (this.isRight()) this.playerX += 380 * dt;
        this.playerX = Phaser.Math.Clamp(this.playerX, 40, 760);
        this.player.x = this.playerX;

        for (const beam of this.lasers) {
            if (beam.deadly && Math.abs(beam.x - this.playerX) < 34) { this.lose(); return; }
        }
    }
}

        this.hint('Hämmere auf SPACE, um das Seil zu ziehen');

        this.rope = 400;            // 400 = Mitte, <200 gewonnen, >600 verloren
        this.cpuPower = 42 * this.gameSpeed;

        this.add.rectangle(400, 300, 700, 8, 0x4a4a5a);
        this.add.rectangle(200, 300, 6, 60, 0x00ff88);
        this.add.rectangle(600, 300, 6, 60, 0xff3355);
        this.knot = this.add.circle(400, 300, 20, 0xffd93d).setStrokeStyle(3, 0xffffff);

        this.you = CharacterManager.draw(this, 120, 300, 0.5);
        this.foe = this.add.text(680, 300, '👹', { font: '58px Arial' }).setOrigin(0.5);

        const pull = () => {
            if (this.hasEnded || this.inputBufferActive) return;
            this.rope -= 26;
            this.tweens.add({ targets: this.knot, scale: 1.3, duration: 70, yoyo: true });
        };
        this.input.keyboard.on('keydown-SPACE', pull);
        this.input.keyboard.on('keydown', (e) => { if (e && e.repeat) return; if (e && e.keyCode === 32) return; pull(); });
        this.input.on('pointerdown', pull);
        this.startTimer();
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;

        this.rope += this.cpuPower * dt;
        this.rope = Phaser.Math.Clamp(this.rope, 150, 650);
        this.knot.x = this.rope;
        this.you.x = this.rope - 280;
        this.foe.x = this.rope + 280;

        if (this.rope <= 200) this.win();
        else if (this.rope >= 600) this.lose();
    }
}

// SwaggyFlappy - durch Lücken zwischen Korallen tauchen
class SwaggyFlappy extends BaseMicrogame {
    constructor() { super({ key: 'SwaggyFlappy' }); }
    create() {
        super.create();
        this.gradientBackground(0x0a4d6e, 0x02121d);
        this.gameTitle('TAUCHEN!', '#87CEEB');
        this.hint('SPACE / Klick zum Auftauchen');

        this.fishY = 300;
        this.velY = 0;
        this.passed = 0;
        this.target = 2;
        this.counterText = this.counter('0 / ' + this.target, '#87CEEB');

        if (this.textures.exists('swaggy')) {
            this.fish = this.add.image(200, this.fishY, 'swaggy').setScale(0.09);
        } else {
            this.fish = this.add.circle(200, this.fishY, 20, 0xFFA500);
        }

        // Hindernispaare
        this.gates = [];
        this.gateSpeed = 210 * this.gameSpeed;
        this.spawnGate(560);
        this.spawnGate(880);

        const flap = () => { if (!this.hasEnded) this.velY = -260; };
        this.input.keyboard.on('keydown-SPACE', flap);
        this.input.on('pointerdown', flap);
        this.startTimer();
    }
    spawnGate(x) {
        const gapY = Phaser.Math.Between(200, 420);
        const gapH = 170;
        const top = this.add.rectangle(x, (gapY - gapH / 2) / 2, 56, gapY - gapH / 2, 0x1f7a5a).setStrokeStyle(3, 0x2ecc71);
        const bottom = this.add.rectangle(x, (gapY + gapH / 2 + 600) / 2, 56, 600 - (gapY + gapH / 2), 0x1f7a5a).setStrokeStyle(3, 0x2ecc71);
        this.gates.push({ top, bottom, x, gapY, gapH, scored: false });
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;

        this.velY += 900 * dt;
        this.fishY += this.velY * dt;
        this.fish.y = this.fishY;
        this.fish.angle = Phaser.Math.Clamp(this.velY / 14, -35, 35);

        if (this.fishY < 100 || this.fishY > 545) { this.lose(); return; }

        for (const gate of this.gates) {
            gate.x -= this.gateSpeed * dt;
            gate.top.x = gate.x;
            gate.bottom.x = gate.x;

            // Kollision
            if (Math.abs(gate.x - 200) < 46) {
                if (this.fishY < gate.gapY - gate.gapH / 2 + 14 || this.fishY > gate.gapY + gate.gapH / 2 - 14) {
                    this.lose();
                    return;
                }
            }
            // Durchgekommen
            if (!gate.scored && gate.x < 200 - 46) {
                gate.scored = true;
                this.passed++;
                this.counterText.setText(this.passed + ' / ' + this.target);
                musicEngine.playSFX('click');
                if (this.passed >= this.target) { this.win(); return; }
            }
            // Wiederverwenden
            if (gate.x < -60) {
                gate.x = 860;
                gate.gapY = Phaser.Math.Between(200, 420);
                gate.scored = false;
                gate.top.setSize(56, gate.gapY - gate.gapH / 2);
                gate.top.y = (gate.gapY - gate.gapH / 2) / 2;
                gate.bottom.setSize(56, 600 - (gate.gapY + gate.gapH / 2));
                gate.bottom.y = (gate.gapY + gate.gapH / 2 + 600) / 2;
            }
        }
    }
}

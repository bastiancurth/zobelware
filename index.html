<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a1a">
    <title>ZobelWare 2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            display: flex; justify-content: center; align-items: center;
            background: #05050f;
            font-family: 'Orbitron', sans-serif;
            touch-action: none; -webkit-tap-highlight-color: transparent;
        }
        /* Animierter Hintergrund-Verlauf */
        body::after {
            content: ''; position: fixed; inset: -20%;
            background:
                radial-gradient(circle at 20% 20%, rgba(0,255,136,0.10), transparent 45%),
                radial-gradient(circle at 80% 30%, rgba(0,212,255,0.10), transparent 45%),
                radial-gradient(circle at 50% 90%, rgba(155,89,182,0.12), transparent 50%),
                linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
            animation: driftBG 24s ease-in-out infinite alternate;
            z-index: -1;
        }
        @keyframes driftBG {
            0%   { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(2%, -2%, 0) scale(1.06); }
        }
        /* CRT Scanlines + Vignette */
        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 1000;
            background:
                repeating-linear-gradient(0deg, rgba(0,0,0,0.16), rgba(0,0,0,0.16) 1px, transparent 1px, transparent 3px),
                radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
        }
        #game-shell {
            position: relative;
            width: min(100vw, calc(100vh * 4 / 3));
            max-width: 1100px;
            aspect-ratio: 4 / 3;
            display: flex; align-items: center; justify-content: center;
        }
        canvas {
            display: block;
            border: 4px solid #00ff88;
            border-radius: 10px;
            box-shadow:
                0 0 24px rgba(0,255,136,0.45),
                0 0 70px rgba(0,255,136,0.18),
                inset 0 0 40px rgba(0,0,0,0.5);
            background: #0a0a1a;
            image-rendering: auto;
        }
        /* Ladebildschirm bevor Phaser bereit ist */
        #boot-overlay {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 18px;
            background: #05050f; color: #00ff88; z-index: 900;
            transition: opacity .4s ease; letter-spacing: .2em;
        }
        #boot-overlay.hidden { opacity: 0; pointer-events: none; }
        #boot-overlay .ring {
            width: 54px; height: 54px; border-radius: 50%;
            border: 4px solid rgba(0,255,136,0.2); border-top-color: #00ff88;
            animation: spin 900ms linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            body::after, #boot-overlay .ring { animation: none; }
        }
    </style>
</head>
<body>
<div id="boot-overlay"><div class="ring"></div><div>ZOBELWARE</div></div>
<div id="game-shell"></div>
<script>
// MUSIK-SYSTEM
class MusicEngine {
    constructor() {
        this.audioContext = null; this.masterGain = null; this.musicGain = null;
        this.isPlaying = false; this.currentBPM = 140; this.musicEnabled = true;
        this.sfxEnabled = true; this.timerID = null; this.initialized = false;
        this.nextNoteTime = 0; this.currentBeat = 0;
        this.currentMusicStyle = 'main';
        this.noteFreq = {'C2':65.41,'D2':73.42,'E2':82.41,'F2':87.31,'G2':98,'A2':110,'B2':123.47,'C3':130.81,'D3':146.83,'E3':164.81,'F3':174.61,'G3':196,'A3':220,'B3':246.94,'C4':261.63,'D4':293.66,'E4':329.63,'F4':349.23,'G4':392,'A4':440,'B4':493.88,'C5':523.25,'D5':587.33,'E5':659.25,'F5':698.46,'G5':783.99,'A5':880,'B5':987.77,'C6':1046.5,'D6':1174.66,'E6':1318.51};
        // Verschiedene Musik-Styles für Microgames
        this.musicStyles = {
            main: { melody: ['C5','E5','G5','C6','B5','G5','E5','C5'], bass: ['C3','G3','C3','G3'], tempo: 1.0, type: 'square' },
            action: { melody: ['E5','E5','E5','C5','E5','G5','G4'], bass: ['C3','C3','G2','G2'], tempo: 1.2, type: 'square' },
            puzzle: { melody: ['G4','A4','B4','C5','D5','E5','D5','C5'], bass: ['C3','E3','G3','E3'], tempo: 0.8, type: 'sine' },
            tense: { melody: ['E4','E4','F4','G4','G4','F4','E4','D4'], bass: ['A2','A2','A2','E2'], tempo: 1.0, type: 'sawtooth' },
            happy: { melody: ['C5','D5','E5','G5','E5','D5','C5','G4'], bass: ['C3','G3','E3','G3'], tempo: 1.1, type: 'square' },
            rush: { melody: ['C5','C5','G5','G5','A5','A5','G5'], bass: ['C3','C3','F3','G3'], tempo: 1.4, type: 'square' },
            calm: { melody: ['E4','G4','B4','E5','D5','B4','G4','E4'], bass: ['E3','B2','E3','B2'], tempo: 0.7, type: 'sine' },
            boss: { melody: ['C4','D#4','G4','C5','D#5','G5','D#5','C5'], bass: ['C2','C2','G2','C2'], tempo: 1.3, type: 'sawtooth' }
        };
    }
    initialize() {
        if (this.initialized) return;
        try {
            this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            this.masterGain = this.audioContext.createGain(); this.masterGain.gain.value = 0.5;
            this.masterGain.connect(this.audioContext.destination);
            this.musicGain = this.audioContext.createGain(); this.musicGain.gain.value = 0.35;
            this.musicGain.connect(this.masterGain);
            this.initialized = true;
        } catch (e) { console.error('Audio init failed:', e); }
    }
    playNote(freq, duration, type='square', gain=0.3, startTime=null) {
        if (!this.initialized || !this.musicEnabled) return;
        const ctx = this.audioContext, time = startTime || ctx.currentTime;
        const osc = ctx.createOscillator(), noteGain = ctx.createGain();
        osc.type = type; osc.frequency.value = freq;
        noteGain.gain.setValueAtTime(0, time);
        noteGain.gain.linearRampToValueAtTime(gain, time + 0.01);
        noteGain.gain.linearRampToValueAtTime(gain * 0.7, time + 0.05);
        noteGain.gain.setValueAtTime(gain * 0.7, time + duration - 0.05);
        noteGain.gain.linearRampToValueAtTime(0.001, time + duration);
        osc.connect(noteGain); noteGain.connect(this.musicGain);
        osc.start(time); osc.stop(time + duration);
    }
    playSFX(type) {
        if (!this.initialized || !this.sfxEnabled) return;
        const ctx = this.audioContext, time = ctx.currentTime;
        const sfxGain = ctx.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(this.masterGain);
        if (type === 'win') {
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                const osc = ctx.createOscillator(), g = ctx.createGain();
                osc.type = 'square'; osc.frequency.value = freq;
                g.gain.setValueAtTime(0.4, time + i * 0.08);
                g.gain.exponentialRampToValueAtTime(0.01, time + i * 0.08 + 0.15);
                osc.connect(g); g.connect(sfxGain);
                osc.start(time + i * 0.08); osc.stop(time + i * 0.08 + 0.15);
            });
        } else if (type === 'lose') {
            const osc = ctx.createOscillator(), g = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, time);
            osc.frequency.exponentialRampToValueAtTime(100, time + 0.3);
            g.gain.setValueAtTime(0.5, time);
            g.gain.exponentialRampToValueAtTime(0.01, time + 0.3);
            osc.connect(g); g.connect(sfxGain);
            osc.start(time); osc.stop(time + 0.3);
        } else if (type === 'speedup') {
            for (let i = 0; i < 8; i++) {
                const osc = ctx.createOscillator(), g = ctx.createGain();
                osc.type = 'square'; osc.frequency.value = 400 + i * 100;
                g.gain.setValueAtTime(0.3, time + i * 0.04);
                g.gain.exponentialRampToValueAtTime(0.01, time + i * 0.04 + 0.06);
                osc.connect(g); g.connect(sfxGain);
                osc.start(time + i * 0.04); osc.stop(time + i * 0.04 + 0.06);
            }
        } else if (type === 'click') {
            const osc = ctx.createOscillator(), g = ctx.createGain();
            osc.type = 'square'; osc.frequency.value = 800;
            g.gain.setValueAtTime(0.2, time);
            g.gain.exponentialRampToValueAtTime(0.01, time + 0.05);
            osc.connect(g); g.connect(sfxGain);
            osc.start(time); osc.stop(time + 0.05);
        } else if (type === 'command') {
            // Kurzer, harter Stich beim Einblenden des Befehls
            const osc = ctx.createOscillator(), g = ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(880, time);
            osc.frequency.exponentialRampToValueAtTime(220, time + 0.14);
            g.gain.setValueAtTime(0.35, time);
            g.gain.exponentialRampToValueAtTime(0.01, time + 0.16);
            osc.connect(g); g.connect(sfxGain);
            osc.start(time); osc.stop(time + 0.16);
            const osc2 = ctx.createOscillator(), g2 = ctx.createGain();
            osc2.type = 'sawtooth'; osc2.frequency.value = 110;
            g2.gain.setValueAtTime(0.3, time);
            g2.gain.exponentialRampToValueAtTime(0.01, time + 0.22);
            osc2.connect(g2); g2.connect(sfxGain);
            osc2.start(time); osc2.stop(time + 0.22);
        } else if (type === 'heartbreak') {
            // Absteigender Ton beim Verlust eines Lebens
            const osc = ctx.createOscillator(), g = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(520, time);
            osc.frequency.exponentialRampToValueAtTime(90, time + 0.45);
            g.gain.setValueAtTime(0.4, time);
            g.gain.exponentialRampToValueAtTime(0.01, time + 0.45);
            osc.connect(g); g.connect(sfxGain);
            osc.start(time); osc.stop(time + 0.45);
        } else if (type === 'explosion') {
            // Explosionsgeräusch: Rauschen + tiefer Knall
            const bufferSize = ctx.sampleRate * 0.4;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
            }
            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            const noiseGain = ctx.createGain();
            noiseGain.gain.setValueAtTime(0.6, time);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.4);
            noise.connect(noiseGain);
            noiseGain.connect(sfxGain);
            noise.start(time);
            // Tiefer Knall
            const boom = ctx.createOscillator(), boomGain = ctx.createGain();
            boom.type = 'sine';
            boom.frequency.setValueAtTime(150, time);
            boom.frequency.exponentialRampToValueAtTime(30, time + 0.3);
            boomGain.gain.setValueAtTime(0.7, time);
            boomGain.gain.exponentialRampToValueAtTime(0.01, time + 0.3);
            boom.connect(boomGain);
            boomGain.connect(sfxGain);
            boom.start(time);
            boom.stop(time + 0.3);
        }
    }
    // Transition Jingle - wird schneller mit gameSpeed
    playTransitionJingle(gameSpeed = 1.0) {
        if (!this.initialized || !this.sfxEnabled) return;
        const ctx = this.audioContext, time = ctx.currentTime;
        const sfxGain = ctx.createGain(); sfxGain.gain.value = 0.4; sfxGain.connect(this.masterGain);
        const speed = Math.min(gameSpeed, 2.0);
        const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25];
        notes.forEach((freq, i) => {
            const osc = ctx.createOscillator(), g = ctx.createGain();
            osc.type = 'square'; osc.frequency.value = freq;
            const noteTime = time + i * (0.08 / speed);
            g.gain.setValueAtTime(0.35, noteTime);
            g.gain.exponentialRampToValueAtTime(0.01, noteTime + (0.12 / speed));
            osc.connect(g); g.connect(sfxGain);
            osc.start(noteTime); osc.stop(noteTime + (0.12 / speed));
        });
    }
    // Boss Jingle
    playBossJingle() {
        if (!this.initialized || !this.sfxEnabled) return;
        const ctx = this.audioContext, time = ctx.currentTime;
        const sfxGain = ctx.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(this.masterGain);
        const notes = [130.81, 155.56, 164.81, 196, 164.81, 155.56, 130.81];
        notes.forEach((freq, i) => {
            const osc = ctx.createOscillator(), g = ctx.createGain();
            osc.type = 'sawtooth'; osc.frequency.value = freq;
            g.gain.setValueAtTime(0.5, time + i * 0.15);
            g.gain.exponentialRampToValueAtTime(0.01, time + i * 0.15 + 0.2);
            osc.connect(g); g.connect(sfxGain);
            osc.start(time + i * 0.15); osc.stop(time + i * 0.15 + 0.2);
        });
    }
    setMusicStyle(style) {
        if (this.musicStyles[style]) {
            this.currentMusicStyle = style;
        }
    }
    startMusic(style = null) {
        if (!this.initialized || this.isPlaying || !this.musicEnabled) return;
        if (style) this.currentMusicStyle = style;
        this.isPlaying = true;
        this.nextNoteTime = this.audioContext.currentTime;
        this.currentBeat = 0;
        this.scheduleMusic();
    }
    scheduleMusic() {
        if (!this.isPlaying) return;
        const style = this.musicStyles[this.currentMusicStyle] || this.musicStyles.main;
        const secPerBeat = 60.0 / (this.currentBPM * style.tempo);
        while (this.nextNoteTime < this.audioContext.currentTime + 0.1) {
            this.playStyleBeat(this.nextNoteTime, this.currentBeat, style);
            this.nextNoteTime += secPerBeat / 4;
            this.currentBeat = (this.currentBeat + 1) % 64;
        }
        this.timerID = setTimeout(() => this.scheduleMusic(), 25);
    }
    playStyleBeat(time, beat, style) {
        const ctx = this.audioContext, beatInBar = beat % 16;
        // Kick drum
        if (beatInBar === 0 || beatInBar === 8) {
            const osc = ctx.createOscillator(), g = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, time);
            osc.frequency.exponentialRampToValueAtTime(40, time + 0.1);
            g.gain.setValueAtTime(0.7, time);
            g.gain.exponentialRampToValueAtTime(0.01, time + 0.15);
            osc.connect(g); g.connect(this.musicGain);
            osc.start(time); osc.stop(time + 0.15);
        }
        // Snare
        if (beatInBar === 4 || beatInBar === 12) {
            const bufSize = ctx.sampleRate * 0.1;
            const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = ctx.createBufferSource(); noise.buffer = buf;
            const g = ctx.createGain(), filter = ctx.createBiquadFilter();
            filter.type = 'highpass'; filter.frequency.value = 1000;
            g.gain.setValueAtTime(0.35, time);
            g.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
            noise.connect(filter); filter.connect(g); g.connect(this.musicGain);
            noise.start(time); noise.stop(time + 0.1);
        }
        // Hi-hat
        if (beatInBar % 2 === 0) {
            const bufSize = ctx.sampleRate * 0.03;
            const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = ctx.createBufferSource(); noise.buffer = buf;
            const g = ctx.createGain(), filter = ctx.createBiquadFilter();
            filter.type = 'highpass'; filter.frequency.value = 7000;
            g.gain.setValueAtTime(0.12, time);
            g.gain.exponentialRampToValueAtTime(0.01, time + 0.03);
            noise.connect(filter); filter.connect(g); g.connect(this.musicGain);
            noise.start(time); noise.stop(time + 0.03);
        }
        // Bass
        if (beatInBar % 4 === 0) {
            const bassIdx = Math.floor(beat / 4) % style.bass.length;
            const bassNote = style.bass[bassIdx];
            const freq = this.noteFreq[bassNote];
            if (freq) this.playNote(freq, (60.0 / this.currentBPM) * 0.8, 'sawtooth', 0.22, time);
        }
        // Melody
        if (beatInBar % 2 === 0) {
            const melIdx = Math.floor(beat / 2) % style.melody.length;
            const melNote = style.melody[melIdx];
            const freq = this.noteFreq[melNote];
            if (freq) this.playNote(freq, (60.0 / this.currentBPM) * 0.5, style.type, 0.18, time);
        }
    }
    stopMusic() { this.isPlaying = false; if (this.timerID) { clearTimeout(this.timerID); this.timerID = null; } }
    setBPM(bpm) { this.currentBPM = Math.min(220, Math.max(100, bpm)); }
    toggleMusic() {
        this.musicEnabled = !this.musicEnabled;
        if (!this.musicEnabled) this.stopMusic();
        if (typeof playerData !== 'undefined') { playerData.musicEnabled = this.musicEnabled; playerData.saveData(); }
        return this.musicEnabled;
    }
    toggleSFX() {
        this.sfxEnabled = !this.sfxEnabled;
        if (typeof playerData !== 'undefined') { playerData.sfxEnabled = this.sfxEnabled; playerData.saveData(); }
        return this.sfxEnabled;
    }
    // Musik pausieren/fortsetzen (Pausenmenü) ohne den Stil zu verlieren
    pauseMusic() { if (this.isPlaying) { this.wasPlaying = true; this.stopMusic(); } }
    resumeMusic() { if (this.wasPlaying) { this.wasPlaying = false; this.startMusic(); } }
}
const musicEngine = new MusicEngine();

// PlayerData
const DEFAULT_OWNED = ['default', 'startscreen_default', 'transition_brown', 'fuse_classic'];

class PlayerDataManager {
    constructor() { this.loadData(); }
    loadData() {
        try {
            const stored = localStorage.getItem('zobelware_v2');
            if (stored) {
                const d = JSON.parse(stored);
                this.coins = d.coins || 0;
                this.highScore = d.highScore || 0;
                this.gameStats = d.gameStats || {};
                this.ownedItems = Array.isArray(d.ownedItems) ? d.ownedItems : [...DEFAULT_OWNED];
                this.activeZobelColor = d.activeZobelColor || 0x00ff88;
                this.activeBackground = d.activeBackground || 'default';
                this.activeParticles = d.activeParticles || 'none';
                this.startScreenStyle = d.startScreenStyle || 'default';
                this.transitionColor = d.transitionColor || 0x8B7355;
                this.fuseStyle = d.fuseStyle || 'classic';
                // Erweiterte Statistiken
                this.achievements = Array.isArray(d.achievements) ? d.achievements : [];
                this.totalWins = d.totalWins || 0;
                this.totalPlayed = d.totalPlayed || 0;
                this.bossWins = d.bossWins || 0;
                this.bestCombo = d.bestCombo || 0;
                this.totalCoinsEarned = d.totalCoinsEarned || 0;
                this.runsPlayed = d.runsPlayed || 0;
                this.bestSpeed = d.bestSpeed || 1.0;
                this.modeHighScores = d.modeHighScores || {};
                this.musicEnabled = d.musicEnabled !== false;
                this.sfxEnabled = d.sfxEnabled !== false;
                // Sicherstellen, dass Basis-Items nie fehlen (z.B. nach altem Spielstand)
                DEFAULT_OWNED.forEach(id => { if (!this.ownedItems.includes(id)) this.ownedItems.push(id); });
            } else { this.reset(); }
        } catch (e) { this.reset(); }
    }
    reset() {
        this.coins = 0; this.highScore = 0; this.gameStats = {};
        this.ownedItems = [...DEFAULT_OWNED];
        this.activeZobelColor = 0x00ff88;
        this.activeBackground = 'default';
        this.activeParticles = 'none';
        this.startScreenStyle = 'default';
        this.transitionColor = 0x8B7355;
        this.fuseStyle = 'classic';
        this.achievements = [];
        this.totalWins = 0; this.totalPlayed = 0; this.bossWins = 0;
        this.bestCombo = 0; this.totalCoinsEarned = 0; this.runsPlayed = 0;
        this.bestSpeed = 1.0; this.modeHighScores = {};
        this.musicEnabled = true; this.sfxEnabled = true;
    }
    saveData() {
        try {
            localStorage.setItem('zobelware_v2', JSON.stringify({
                coins: this.coins, highScore: this.highScore, gameStats: this.gameStats,
                ownedItems: this.ownedItems, activeZobelColor: this.activeZobelColor,
                activeBackground: this.activeBackground, activeParticles: this.activeParticles,
                startScreenStyle: this.startScreenStyle, transitionColor: this.transitionColor,
                fuseStyle: this.fuseStyle, achievements: this.achievements,
                totalWins: this.totalWins, totalPlayed: this.totalPlayed, bossWins: this.bossWins,
                bestCombo: this.bestCombo, totalCoinsEarned: this.totalCoinsEarned,
                runsPlayed: this.runsPlayed, bestSpeed: this.bestSpeed,
                modeHighScores: this.modeHighScores,
                musicEnabled: this.musicEnabled, sfxEnabled: this.sfxEnabled
            }));
        } catch (e) {}
    }
    addCoins(n) { this.coins += n; this.totalCoinsEarned += n; this.saveData(); }
    spendCoins(n) { if (this.coins >= n) { this.coins -= n; this.saveData(); return true; } return false; }
    updateHighScore(s) { if (s > this.highScore) { this.highScore = s; this.saveData(); return true; } return false; }
    updateModeHighScore(mode, s) {
        const prev = this.modeHighScores[mode] || 0;
        if (s > prev) { this.modeHighScores[mode] = s; this.saveData(); return true; }
        return false;
    }
    trackGame(key, won) {
        if (!this.gameStats[key]) this.gameStats[key] = { played: 0, won: 0 };
        this.gameStats[key].played++; this.totalPlayed++;
        if (won) { this.gameStats[key].won++; this.totalWins++; }
        this.saveData();
    }
    getWinRate(key) { const s = this.gameStats[key]; if (!s || s.played === 0) return 0; return Math.round((s.won / s.played) * 100); }
    buyItem(itemId) { if (!this.ownedItems.includes(itemId)) { this.ownedItems.push(itemId); this.saveData(); } }
    ownsItem(itemId) { return this.ownedItems.includes(itemId); }
    setZobelColor(color) { this.activeZobelColor = color; this.saveData(); }
    setBackground(bg) { this.activeBackground = bg; this.saveData(); }
    setParticles(p) { this.activeParticles = p; this.saveData(); }

// ============ UI-KIT: einheitliche Optik für alle Menüs ============
const UI = {
    GREEN: 0x00ff88, CYAN: 0x00d4ff, YELLOW: 0xffd93d, RED: 0xff6b6b,
    PURPLE: 0x9b59b6, DARK: 0x0f1020, PANEL: 0x161a35,

    hex(color) { return '#' + color.toString(16).padStart(6, '0'); },

    // Abgerundetes Panel mit Rahmen und leichtem Glow
    panel(scene, x, y, w, h, color = 0x00ff88, alpha = 0.10) {
        const g = scene.add.graphics();
        g.fillStyle(0x000000, 0.55); g.fillRoundedRect(x - w / 2 + 3, y - h / 2 + 4, w, h, 16);
        g.fillStyle(color, alpha);   g.fillRoundedRect(x - w / 2, y - h / 2, w, h, 16);
        g.lineStyle(2, color, 0.85); g.strokeRoundedRect(x - w / 2, y - h / 2, w, h, 16);
        return g;
    },

    // Vollwertiger Button: Container mit Hover-, Press- und Klang-Feedback
    button(scene, x, y, w, h, label, opts = {}) {
        const color = opts.color !== undefined ? opts.color : UI.GREEN;
        const fontSize = opts.fontSize || 20;
        const filled = opts.filled !== false;
        const c = scene.add.container(x, y);
        const g = scene.add.graphics();

        const redraw = (state) => {
            g.clear();
            const lift = state === 'down' ? 1 : 4;
            g.fillStyle(0x000000, 0.5); g.fillRoundedRect(-w / 2, -h / 2 + lift, w, h, 12);
            if (filled) {
                g.fillStyle(color, state === 'over' ? 1 : 0.9);
                g.fillRoundedRect(-w / 2, -h / 2, w, h, 12);
                g.fillStyle(0xffffff, state === 'over' ? 0.28 : 0.16);
                g.fillRoundedRect(-w / 2, -h / 2, w, h / 2.4, 12);
            } else {
                g.fillStyle(color, state === 'over' ? 0.32 : 0.14);
                g.fillRoundedRect(-w / 2, -h / 2, w, h, 12);
            }
            g.lineStyle(2, filled ? 0xffffff : color, filled ? 0.9 : 1);
            g.strokeRoundedRect(-w / 2, -h / 2, w, h, 12);
        };
        redraw('idle');

        const txt = scene.add.text(0, 0, label, {
            font: `bold ${fontSize}px Orbitron`,
            fill: filled ? '#08121a' : UI.hex(color)
        }).setOrigin(0.5);

        c.add([g, txt]);
        c.setSize(w, h);
        c.setInteractive(new Phaser.Geom.Rectangle(-w / 2, -h / 2, w, h), Phaser.Geom.Rectangle.Contains, { useHandCursor: true });

        c.on('pointerover', () => { redraw('over'); scene.tweens.add({ targets: c, scale: 1.05, duration: 110, ease: 'Quad.easeOut' }); });
        c.on('pointerout',  () => { redraw('idle'); scene.tweens.add({ targets: c, scale: 1.0,  duration: 110, ease: 'Quad.easeOut' }); });
        c.on('pointerdown', () => { redraw('down'); musicEngine.playSFX('click'); });
        c.on('pointerup',   () => { redraw('over'); if (opts.onClick) opts.onClick(); });
        return c;
    },

    // Dezenter Sternenhimmel als Menü-Hintergrund
    starfield(scene, count = 60, color = 0x00ff88) {
        const stars = [];
        for (let i = 0; i < count; i++) {
            const s = scene.add.circle(
                Phaser.Math.Between(0, 800), Phaser.Math.Between(0, 600),
                Phaser.Math.FloatBetween(0.6, 2.4), color, 0.5
            ).setDepth(-10);
            scene.tweens.add({
                targets: s, alpha: { from: 0.12, to: 0.8 },
                duration: Phaser.Math.Between(700, 2600), yoyo: true, repeat: -1,
                delay: Phaser.Math.Between(0, 1500)
            });
            scene.tweens.add({
                targets: s, y: s.y - Phaser.Math.Between(20, 70),
                duration: Phaser.Math.Between(6000, 14000), yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
            });
            stars.push(s);
        }
        return stars;
    },

    // Menü-Kopfzeile mit Titel und Untertitel
    header(scene, title, subtitle, color = UI.GREEN) {
        const t = scene.add.text(400, 44, title, {
            font: 'bold 34px Orbitron', fill: UI.hex(color)
        }).setOrigin(0.5);
        t.setShadow(0, 0, UI.hex(color), 14, false, true);
        if (subtitle) scene.add.text(400, 78, subtitle, { font: '13px Orbitron', fill: '#7c8398' }).setOrigin(0.5);
        return t;
    },

    // Kurzer Hinweistext, der nach oben wegschwebt
    floatText(scene, x, y, text, color = '#00ff88', size = 22) {
        const t = scene.add.text(x, y, text, { font: `bold ${size}px Orbitron`, fill: color }).setOrigin(0.5).setDepth(200);
        t.setShadow(0, 2, '#000000', 4);
        scene.tweens.add({
            targets: t, y: y - 60, alpha: 0, duration: 900, ease: 'Quad.easeOut',
            onComplete: () => t.destroy()
        });
        return t;
    },

    // Erfolgs-Benachrichtigung oben rechts
    achievementToast(scene, achievement, index = 0) {
        const y = 90 + index * 74;
        const c = scene.add.container(1000, y).setDepth(500);
        const g = scene.add.graphics();
        g.fillStyle(0x000000, 0.85); g.fillRoundedRect(-170, -30, 340, 60, 12);
        g.lineStyle(2, UI.YELLOW, 1); g.strokeRoundedRect(-170, -30, 340, 60, 12);
        const icon = scene.add.text(-140, 0, achievement.icon, { font: '28px Arial' }).setOrigin(0.5);
        const name = scene.add.text(-112, -10, achievement.name, { font: 'bold 15px Orbitron', fill: '#ffd93d' }).setOrigin(0, 0.5);
        const rew  = scene.add.text(-112, 11, 'Erfolg freigeschaltet  +' + achievement.reward + ' 💰', { font: '11px Orbitron', fill: '#9aa3b8' }).setOrigin(0, 0.5);
        c.add([g, icon, name, rew]);
        scene.tweens.add({
            targets: c, x: 610, duration: 420, ease: 'Back.easeOut',
            onComplete: () => {
                scene.time.delayedCall(2600, () => {
                    scene.tweens.add({ targets: c, x: 1050, alpha: 0, duration: 350, onComplete: () => c.destroy() });
                });
            }
        });
        return c;
    }
};

const Effects = {
    // Explosionsartiger Partikelkranz
    burst(scene, x, y, color = 0x00ff88, count = 14, spread = 120) {
        for (let i = 0; i < count; i++) {
            const angle = (Math.PI * 2 * i) / count + Phaser.Math.FloatBetween(-0.2, 0.2);
            const dist = Phaser.Math.Between(spread * 0.5, spread);
            const p = scene.add.circle(x, y, Phaser.Math.Between(3, 7), color).setDepth(300);
            scene.tweens.add({
                targets: p,
                x: x + Math.cos(angle) * dist,
                y: y + Math.sin(angle) * dist,
                alpha: 0, scale: 0.2,
                duration: Phaser.Math.Between(350, 650),
                ease: 'Quad.easeOut',
                onComplete: () => p.destroy()
            });
        }
    },

    // Konfetti-Regen für große Siege
    confetti(scene, count = 50) {
        const colors = [0x00ff88, 0x00d4ff, 0xffd93d, 0xff6b6b, 0x9b59b6, 0xffffff];
        for (let i = 0; i < count; i++) {
            const p = scene.add.rectangle(
                Phaser.Math.Between(0, 800), Phaser.Math.Between(-200, -20),
                Phaser.Math.Between(6, 12), Phaser.Math.Between(8, 16),
                Phaser.Utils.Array.GetRandom(colors)
            ).setDepth(300).setAngle(Phaser.Math.Between(0, 360));
            scene.tweens.add({
                targets: p, y: 650,
                x: p.x + Phaser.Math.Between(-90, 90),
                angle: p.angle + Phaser.Math.Between(-540, 540),
                duration: Phaser.Math.Between(1400, 2800),
                delay: Phaser.Math.Between(0, 700),
                ease: 'Quad.easeIn',
                onComplete: () => p.destroy()
            });
        }
    },

    // Aufsteigender Ring (z.B. bei Treffern)
    ring(scene, x, y, color = 0x00ff88, radius = 60) {
        const c = scene.add.circle(x, y, 8).setStrokeStyle(4, color).setDepth(290);
        scene.tweens.add({
            targets: c, radius: radius, alpha: 0, duration: 420, ease: 'Quad.easeOut',
            onUpdate: () => c.setRadius(c.radius), onComplete: () => c.destroy()
        });
    },

    // Kurzer Bildschirm-Blitz in Wunschfarbe
    flash(scene, color = 0x00ff88, alpha = 0.4, duration = 220) {
        const r = scene.add.rectangle(400, 300, 800, 600, color, alpha).setDepth(400);
        scene.tweens.add({ targets: r, alpha: 0, duration, onComplete: () => r.destroy() });
    }
};

    getCurrentCharacter() {
        return this.data[this.currentCharacter];
    },

    getCharacterByName(name) {
        return this.data[name];
    },

    nextCharacter() {
        // Aktuellen Charakter als gespielt markieren
        if (!this.playedThisRound.includes(this.currentCharacter)) {
            this.playedThisRound.push(this.currentCharacter);
        }

        // Alle anderen Charaktere (nicht Zobel)
        const otherChars = this.characters.filter(c => c !== 'zobel');

        // Welche anderen Charaktere wurden noch nicht gespielt?
        const remainingOthers = otherChars.filter(c => !this.playedThisRound.includes(c));

        if (remainingOthers.length === 0) {
            // Alle haben gespielt, neue Runde mit Zobel starten
            this.playedThisRound = [];
            this.currentCharacter = 'zobel';
        } else {
            // Zufällig einen der verbleibenden wählen (nicht den aktuellen)
            const available = remainingOthers.filter(c => c !== this.currentCharacter);
            if (available.length > 0) {
                this.currentCharacter = Phaser.Utils.Array.GetRandom(available);
            } else {
                // Nur noch einer übrig, den nehmen
                this.currentCharacter = remainingOthers[0];
            }
        }

        this.characterIndex = this.characters.indexOf(this.currentCharacter);
        return this.getCurrentCharacter();
    },

    setCharacter(name) {
        if (this.data[name]) {
            this.currentCharacter = name;
            this.characterIndex = this.characters.indexOf(name);
        }
    },

    resetRound() {
        this.playedThisRound = [];
        this.currentCharacter = 'zobel';
        this.characterIndex = 0;
    },

    getRandomGame() {
        const char = this.getCurrentCharacter();
        return Phaser.Utils.Array.GetRandom(char.games);
    },

    getBoss() {
        return this.getCurrentCharacter().boss;
    },

    // Zeichnet den aktuellen Charakter (für Szenen die kein Bild haben)
    draw(scene, x, y, scale = 1) {
        const char = this.getCurrentCharacter();
        if (scene.textures.exists(char.image)) {
            const img = scene.add.image(x, y, char.image).setScale(char.scale * scale);
            return img;
        }
        // Fallback auf gezeichnetes Zobel
        return Zobel.draw(scene, x, y, scale, char.color);
    },

    // Spielt den Charakter-Jingle
    playJingle(gameSpeed = 1.0) {
        if (!musicEngine.initialized || !musicEngine.sfxEnabled) return;
        const char = this.getCurrentCharacter();
        const ctx = musicEngine.audioContext, time = ctx.currentTime;
        const sfxGain = ctx.createGain();
        sfxGain.gain.value = 0.4;
        sfxGain.connect(musicEngine.masterGain);
        const speed = Math.min(gameSpeed, 2.0);
        char.jingleNotes.forEach((freq, i) => {
            const osc = ctx.createOscillator(), g = ctx.createGain();
            osc.type = 'square';
            osc.frequency.value = freq;
            const noteTime = time + i * (0.08 / speed);
            g.gain.setValueAtTime(0.35, noteTime);
            g.gain.exponentialRampToValueAtTime(0.01, noteTime + (0.12 / speed));
            osc.connect(g);
            g.connect(sfxGain);
            osc.start(noteTime);
            osc.stop(noteTime + (0.12 / speed));
        });
    }
};

// BaseMicrogame
// Gemeinsame Basis aller Minispiele: Zündschnur-Timer, Steuerung (Tasten/WASD/Touch),
// Pausenmenü, Sieg-/Niederlage-Ablauf und ein paar Zeichen-Helfer.
const FUSE_STYLES = {
    classic: { name: 'Klassisch', from: 0x00ff88, to: 0xff3355 },
    ice:     { name: 'Eis',       from: 0x9be7ff, to: 0x2255ff },
    fire:    { name: 'Feuer',     from: 0xffe066, to: 0xff2200 },
    candy:   { name: 'Candy',     from: 0xff9ff3, to: 0x8e44ad },
    toxic:   { name: 'Toxisch',   from: 0xd4ff00, to: 0x00ffcc }
};

class BaseMicrogame extends Phaser.Scene {
    init(data) {
        this.parentScene = data.parentScene;
        this.gameSpeed = data.gameSpeed || 1.0;
        this.baseDuration = data.duration || 4000;
        // Extra-Zeit-Upgrade wirkt auf jedes Minispiel
        this.duration = (this.baseDuration * Upgrades.timeFactor()) / this.gameSpeed;
        this.practiceMode = data.practiceMode || false;
        this.command = data.command || null;
        this.keysHint = data.keysHint || null;
        this.isBossGame = false;
        this.isPaused = false;
    }

    create() {
        this.hasEnded = false;
        this.createFuse();
        // Der Befehl wird über das bereits laufende Spiel geblendet (WarioWare-Prinzip)
        this.time.delayedCall(0, () => this.showCommand());

        this.inputBufferActive = true;
        this.time.delayedCall(150, () => { this.inputBufferActive = false; });

        // WASD zusätzlich zu den Pfeiltasten
        this.wasd = this.input.keyboard.addKeys({ w: 'W', a: 'A', s: 'S', d: 'D' });
        this.touchState = { left: false, right: false, up: false, down: false };
        this.touchTap = { left: false, right: false, up: false, down: false };

        // ESC / P öffnen das Pausenmenü statt sofort abzubrechen
        this.input.keyboard.on('keydown-ESC', () => this.openPause());
        this.input.keyboard.on('keydown-P', () => this.openPause());

        this.createTouchControls();
    }

    // ---------- Zündschnur mit Bombe (WarioWare-Stil) ----------
    // Der Funke wandert nach rechts auf die Bombe zu; ist er da, ist die Zeit um.
    createFuse() {
        const style = FUSE_STYLES[playerData.fuseStyle] || FUSE_STYLES.classic;
        this.fuseColors = style;

        this.fuseTrack = this.add.graphics().setDepth(90);
        this.fuseTrack.lineStyle(6, 0x000000, 0.45);
        this.fuseTrack.lineBetween(100, 575, 700, 575);

        // Verbleibende Schnur (schrumpft von links)
        this.fuse = this.add.rectangle(700, 575, 600, 9, style.from).setOrigin(1, 0.5).setDepth(91);

        // Bombe am Ende der Schnur
        this.bomb = this.add.container(742, 572).setDepth(92);
        const bombG = this.add.graphics();
        bombG.fillStyle(0x1a1a22, 1); bombG.fillCircle(0, 0, 20);
        bombG.fillStyle(0x3a3a4a, 1); bombG.fillCircle(-6, -6, 6);
        bombG.fillStyle(0x000000, 1); bombG.fillRect(6, -24, 8, 10);
        this.bomb.add(bombG);
        this.bombGraphic = bombG;

        this.spark = this.add.circle(100, 575, 6, 0xffffaa).setDepth(93);
        this.sparkGlow = this.add.circle(100, 575, 13, 0xffaa33, 0.4).setDepth(92);
        this.tweens.add({ targets: this.sparkGlow, scale: 1.6, alpha: 0.12, duration: 380, yoyo: true, repeat: -1 });
        this.warnedLowTime = false;
    }

    setFuseVisible(visible) {
        [this.fuseTrack, this.fuse, this.spark, this.sparkGlow, this.bomb].forEach(o => o && o.setVisible(visible));
    }

    // ---------- Befehls-Einblendung ----------
    // Riesiges Kommandowort über dem laufenden Spiel - verschwindet schnell wieder.
    showCommand() {
        if (!this.command) return;
        musicEngine.playSFX('command');
        const c = this.add.container(400, 250).setDepth(600);

        const word = this.add.text(0, 0, this.command, {
            font: 'bold 74px Orbitron', fill: '#ffffff',
            stroke: '#000000', strokeThickness: 10
        }).setOrigin(0.5);
        word.setShadow(4, 4, '#000000', 0, true, true);
        c.add(word);

        if (this.keysHint) {
            const keys = this.add.text(0, 62, this.keysHint, {
                font: 'bold 24px Orbitron', fill: '#ffd93d',
                backgroundColor: '#000000cc', padding: { x: 14, y: 6 }
            }).setOrigin(0.5);
            c.add(keys);
        }

        c.setScale(2.4).setAlpha(0);
        const inTime = 130 / this.gameSpeed;
        const holdTime = 520 / this.gameSpeed;
        this.tweens.add({
            targets: c, scale: 1, alpha: 1, duration: inTime, ease: 'Back.easeOut',
            onComplete: () => {
                this.time.delayedCall(holdTime, () => {
                    this.tweens.add({
                        targets: c, alpha: 0, scale: 1.25, y: 210,
                        duration: 220 / this.gameSpeed,
                        onComplete: () => c.destroy()
                    });
                });
            }
        });
    }

    // Bosskämpfe laufen ohne Zeitlimit - die Zündschnur wäre dort nur irreführend
    markAsBoss() { this.isBossGame = true; this.setFuseVisible(false); }

    // Einheitliche Lebensleiste für Bosse
    drawBossHealth(gfx, current, max, x = 200, y = 68, w = 400, h = 18, color = 0xff3355) {
        gfx.clear();
        gfx.fillStyle(0x000000, 0.7); gfx.fillRoundedRect(x - 3, y - 3, w + 6, h + 6, 6);
        gfx.fillStyle(0x2a2a3a, 1);   gfx.fillRoundedRect(x, y, w, h, 4);
        const ratio = Phaser.Math.Clamp(current / max, 0, 1);
        if (ratio > 0) {
            gfx.fillStyle(ratio > 0.3 ? color : 0xff0000, 1);
            gfx.fillRoundedRect(x, y, w * ratio, h, 4);
            gfx.fillStyle(0xffffff, 0.25);
            gfx.fillRoundedRect(x, y, w * ratio, h / 2.5, 4);
        }
        gfx.lineStyle(2, 0xffffff, 0.5); gfx.strokeRoundedRect(x, y, w, h, 4);
    }

    // ---------- Touch-Steuerung ----------
    createTouchControls() {
        if (!this.sys.game.device.input.touch) return;
        this.touchButtons = [];
        const mk = (x, y, r, label, onDown, onUp) => {
            const c = this.add.circle(x, y, r, 0xffffff, 0.13).setDepth(400).setScrollFactor(0);
            c.setStrokeStyle(2, 0xffffff, 0.35);
            const t = this.add.text(x, y, label, { font: 'bold 20px Orbitron', fill: '#ffffff' })
                .setOrigin(0.5).setAlpha(0.6).setDepth(401);
            c.setInteractive({ useHandCursor: true });
            c.on('pointerdown', () => { c.setFillStyle(0xffffff, 0.3); onDown(); });
            c.on('pointerup', () => { c.setFillStyle(0xffffff, 0.13); if (onUp) onUp(); });
            c.on('pointerout', () => { c.setFillStyle(0xffffff, 0.13); if (onUp) onUp(); });
            this.touchButtons.push(c, t);
            return c;
        };
        const press = (dir) => {
            this.touchState[dir] = true; this.touchTap[dir] = true;
            const map = { left: [37, 'ArrowLeft'], right: [39, 'ArrowRight'], up: [38, 'ArrowUp'], down: [40, 'ArrowDown'] };
            const [code, key] = map[dir];
            this.input.keyboard.emit('keydown', { keyCode: code, key, preventDefault: () => {} });
        };
        const release = (dir) => { this.touchState[dir] = false; };

        mk(70, 470, 32, '◀', () => press('left'), () => release('left'));
        mk(160, 470, 32, '▶', () => press('right'), () => release('right'));
        mk(115, 405, 32, '▲', () => press('up'), () => release('up'));
        mk(115, 520, 32, '▼', () => press('down'), () => release('down'));
        mk(710, 470, 42, '⏺', () => this.pressAction());
        // Pause-Knopf für Touch-Geräte
        const pauseBtn = this.add.circle(40, 40, 22, 0x000000, 0.5).setDepth(400).setInteractive({ useHandCursor: true });
        pauseBtn.setStrokeStyle(2, 0xffffff, 0.4);
        this.add.text(40, 40, '❚❚', { font: 'bold 14px Orbitron', fill: '#ffffff' }).setOrigin(0.5).setDepth(401);
        pauseBtn.on('pointerdown', () => this.openPause());
    }

    // Löst die "Aktions"-Taste aus (entspricht SPACE)
    pressAction() {
        this.input.keyboard.emit('keydown-SPACE', { keyCode: 32, key: ' ', preventDefault: () => {} });
        this.input.keyboard.emit('keydown', { keyCode: 32, key: ' ', preventDefault: () => {} });
    }

    // ---------- Eingabe-Helfer (Pfeiltasten + WASD + Touch) ----------
    isLeft()  { return (this.cursors && this.cursors.left.isDown)  || (this.wasd && this.wasd.a.isDown) || this.touchState.left; }
    isRight() { return (this.cursors && this.cursors.right.isDown) || (this.wasd && this.wasd.d.isDown) || this.touchState.right; }
    isUp()    { return (this.cursors && this.cursors.up.isDown)    || (this.wasd && this.wasd.w.isDown) || this.touchState.up; }
    isDown()  { return (this.cursors && this.cursors.down.isDown)  || (this.wasd && this.wasd.s.isDown) || this.touchState.down; }

    // Einmaliges Drücken (für schrittweise Bewegung)
    justPressed(dir) {
        const keyMap = { left: 'left', right: 'right', up: 'up', down: 'down' };
        const wasdMap = { left: 'a', right: 'd', up: 'w', down: 's' };
        const cursorDown = this.cursors && Phaser.Input.Keyboard.JustDown(this.cursors[keyMap[dir]]);
        const wasdDown = this.wasd && Phaser.Input.Keyboard.JustDown(this.wasd[wasdMap[dir]]);
        const tapped = this.touchTap[dir];
        if (tapped) this.touchTap[dir] = false;
        return cursorDown || wasdDown || tapped;
    }

    // ---------- Timer ----------
    startTimer() { this.gameTimer = this.time.delayedCall(this.duration, () => { if (!this.hasEnded) { this.detonate(); this.lose(); } }); }

    // Bombe am Ende der Zündschnur explodieren lassen
    detonate() {
        if (!this.bomb || !this.bomb.visible) return;
        musicEngine.playSFX('explosion');
        Effects.burst(this, this.bomb.x, this.bomb.y, 0xff6b00, 20, 150);
        Effects.burst(this, this.bomb.x, this.bomb.y, 0xffff66, 12, 90);
        this.bomb.setVisible(false);
        this.spark.setVisible(false);
        this.sparkGlow.setVisible(false);
    }
    startSurvivalTimer() { this.gameTimer = this.time.delayedCall(this.duration, () => { if (!this.hasEnded) this.win(); }); }

    update() {
        if (this.hasEnded || !this.gameTimer) return;
        const p = this.gameTimer.getProgress();
        // Schnur brennt ab, der Funke wandert auf die Bombe zu
        this.fuse.width = 600 * (1 - p);
        this.spark.x = 100 + 600 * p;
        this.sparkGlow.x = this.spark.x;
        // Farbverlauf gemäß gewähltem Zündschnur-Stil
        const c = Phaser.Display.Color.Interpolate.ColorWithColor(
            Phaser.Display.Color.ValueToColor(this.fuseColors.from),
            Phaser.Display.Color.ValueToColor(this.fuseColors.to),
            100, Math.floor(p * 100)
        );
        this.fuse.setFillStyle(Phaser.Display.Color.GetColor(c.r, c.g, c.b));

        // Kurz vor Schluss zittert die Bombe und der Funke wird hektisch
        if (!this.warnedLowTime && p > 0.72) {
            this.warnedLowTime = true;
            this.tweens.add({ targets: [this.spark, this.sparkGlow], scale: 1.9, duration: 150, yoyo: true, repeat: -1 });
            if (this.bomb) {
                this.tweens.add({ targets: this.bomb, scale: 1.25, duration: 130, yoyo: true, repeat: -1 });
                this.tweens.add({ targets: this.bomb, x: { from: 738, to: 746 }, duration: 55, yoyo: true, repeat: -1 });
            }
        }
    }

    // ---------- Pausenmenü ----------
    openPause() {
        if (this.hasEnded || this.isPaused) return;
        this.isPaused = true;
        musicEngine.pauseMusic();
        const resumeKeys = [this.scene.key];
        if (this.parentScene) resumeKeys.push(this.parentScene.scene.key);
        this.scene.launch('PauseScene', { resumeKeys });
        this.scene.pause();
        if (this.parentScene) this.parentScene.scene.pause();
    }

    // ---------- Ausgang ----------
    win() {
        if (this.hasEnded) return; this.hasEnded = true;
        if (this.gameTimer) this.gameTimer.remove();
        this.cameras.main.flash(150, 0, 255, 136);
        Effects.burst(this, 400, 300, 0x00ff88, 18, 200);
        musicEngine.playSFX('win');
        if (this.practiceMode) {
            UI.floatText(this, 400, 250, 'GESCHAFFT!', '#00ff88', 34);
            this.time.delayedCall(900, () => this.restartPractice());
        } else if (this.parentScene) {
            this.parentScene.microgameWon(this.scene.key);
            this.scene.stop();
        }
    }

    lose() {
        if (this.hasEnded) return; this.hasEnded = true;
        if (this.gameTimer) this.gameTimer.remove();
        this.cameras.main.shake(200, 0.02); this.cameras.main.flash(150, 255, 0, 0);
        musicEngine.playSFX('lose');
        if (this.practiceMode) {
            UI.floatText(this, 400, 250, 'DANEBEN!', '#ff6b6b', 34);
            this.time.delayedCall(900, () => this.restartPractice());
        } else if (this.parentScene) {
            this.parentScene.microgameLost(this.scene.key);
            this.scene.stop();
        }
    }

    // Im Übungsmodus wird das Spiel mit unveränderten Werten neu gestartet
    restartPractice() {
        this.scene.restart({
            parentScene: null, gameSpeed: this.gameSpeed,
            duration: this.baseDuration, practiceMode: true,
            command: this.command, keysHint: this.keysHint
        });
    }

    exitToMenu() {
        this.hasEnded = true;
        if (this.gameTimer) this.gameTimer.remove();
        musicEngine.stopMusic();
        this.scene.stop();
        if (this.parentScene) this.parentScene.scene.stop();
        this.scene.start('StartScreen');
    }

    // ---------- Zeichen-Helfer ----------
    // Einheitliche Überschrift für Minispiele
    gameTitle(text, color = '#ffffff', y = 32) {
        const t = this.add.text(400, y, text, { font: 'bold 30px Orbitron', fill: color }).setOrigin(0.5).setDepth(80);
        t.setShadow(0, 3, '#000000', 6);
        return t;
    }

    // Kleiner Hinweis unterhalb der Überschrift
    hint(text, y = 68) {
        const t = this.add.text(400, y, text, { font: '14px Orbitron', fill: '#ffffff' })
            .setOrigin(0.5).setAlpha(0.75).setDepth(80);
        t.setShadow(0, 2, '#000000', 4);
        return t;
    }

    // Fortschrittsanzeige "x / y"
    counter(text, color = '#00ff88', y = 100) {
        const t = this.add.text(400, y, text, { font: 'bold 26px Orbitron', fill: color }).setOrigin(0.5).setDepth(80);
        t.setShadow(0, 2, '#000000', 4);
        return t;
    }

    // Sanfter Farbverlauf als Hintergrund
    gradientBackground(topColor, bottomColor) {
        const g = this.add.graphics().setDepth(-100);
        const steps = 40;
        const from = Phaser.Display.Color.ValueToColor(topColor);
        const to = Phaser.Display.Color.ValueToColor(bottomColor);

            g.fillStyle(Phaser.Display.Color.GetColor(c.r, c.g, c.b), 1);

        }

    }

    spawnAwayFromCursor(minDist = 150) {
        const cursor = this.input.activePointer;

class DodgeTheBall extends BaseMicrogame {
    constructor() { super({ key: 'DodgeTheBall' }); }
    create() {
        super.create();
        this.gradientBackground(0x1a1a2e, 0x08080f);
        this.gameTitle('WEICHE AUS!', '#ff6b6b');
        this.hint('← → bewegen und überleben');

        // Spieler
        this.player = this.add.rectangle(400, 500, 46, 46, 0x00ff88).setStrokeStyle(3, 0xffffff);
        this.physics.add.existing(this.player);
        this.player.body.setCollideWorldBounds(true);
        this.cursors = this.input.keyboard.createCursorKeys();

        // Bälle die fallen
        this.balls = [];
        for (let i = 0; i < 8; i++) {
            const ball = this.add.circle(Phaser.Math.Between(50, 750), -Phaser.Math.Between(50, 400), 15, 0xff6b6b);
            ball.setStrokeStyle(2, 0xffffff, 0.5);
            this.balls.push(ball);
            this.resetBallSpeed(ball);
        }

        // Timer - überleben = gewinnen
        this.gameTimer = this.time.delayedCall(this.duration, () => { if (!this.hasEnded) this.win(); });
    }
    resetBallSpeed(ball) {
        ball.vy = Phaser.Math.Between(200, 350) * this.gameSpeed;
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;

        // Spieler Bewegung
        this.player.body.setVelocityX(0);
        if (this.isLeft()) this.player.body.setVelocityX(-400);
        else if (this.isRight()) this.player.body.setVelocityX(400);

        for (const ball of this.balls) {
            ball.y += ball.vy * dt;
            // Bälle oben wieder einsetzen, damit bis zum Schluss Druck bleibt
            if (ball.y > 640) {
                ball.y = -Phaser.Math.Between(20, 160);
                ball.x = Phaser.Math.Between(50, 750);
                this.resetBallSpeed(ball);
            }
            if (Phaser.Math.Distance.Between(ball.x, ball.y, this.player.x, this.player.y) < 36) {
                this.lose();
                return;
            }
        }
    }
}

        this.stick = this.add.rectangle(400, 310, 18, 180, 0x00ff88).setOrigin(0.5, 1);
        this.stick.y = 392;
        this.ball = this.add.circle(400, 212, 16, 0xffd93d).setStrokeStyle(3, 0xffffff);

        this.maxTilt = 0.5;
        // Kippen driftet von selbst - der Spieler muss aktiv gegensteuern
        this.tilt = 0;
        this.tiltVelocity = Phaser.Math.FloatBetween(-0.06, 0.06) || 0.05;
        // Referenzpunkt ist die aktuelle Mausposition, damit das Spiel nicht
        // sofort verloren ist, wenn der Zeiger am Rand steht.
        this.originX = this.input.activePointer.x || 400;

        this.warnBar = this.add.graphics().setDepth(80);
        this.gameTimer = this.time.delayedCall(this.duration, () => { if (!this.hasEnded) this.win(); });
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;

        // Eingabe: Mausbewegung relativ zum Startpunkt, alternativ Pfeiltasten
        const pointerOffset = (this.input.activePointer.x - this.originX) / 260;
        let steer = Phaser.Math.Clamp(pointerOffset, -1, 1);
        if (this.isLeft()) steer = -1;
        if (this.isRight()) steer = 1;

        // Der Stab fällt zunehmend schneller zur Seite, Gegensteuern bremst
        this.tiltVelocity += this.tilt * 1.6 * dt;
        this.tiltVelocity -= steer * 1.9 * dt;
        this.tiltVelocity *= 0.985;
        this.tilt += this.tiltVelocity * dt;

        this.stick.rotation = this.tilt;
        this.ball.x = 400 + Math.sin(this.tilt) * 180;
        this.ball.y = 392 - Math.cos(this.tilt) * 180;

        // Warnbalken zeigt, wie nah man am Umkippen ist
        const danger = Math.abs(this.tilt) / this.maxTilt;
        this.warnBar.clear();
        this.warnBar.fillStyle(danger > 0.7 ? 0xff3355 : 0x00ff88, 0.8);
        this.warnBar.fillRect(400 - 120 * danger, 500, 240 * danger, 8);

        if (Math.abs(this.tilt) >= this.maxTilt) this.lose();
    }
}

class ZobelFrogger extends BaseMicrogame {
    constructor() { super({ key: 'ZobelFrogger' }); }
    create() {

        this.add.text(400, 30, 'ÜBERQUERE DIE STRASSE!', { font: 'bold 32px Orbitron', fill: '#fff' }).setOrigin(0.5);

        // Straßen-Bahnen
        this.add.rectangle(400, 150, 800, 80, 0x333333); // Straße 1
        this.add.rectangle(400, 250, 800, 80, 0x333333); // Straße 2
        this.add.rectangle(400, 350, 800, 80, 0x333333); // Straße 3

        // Zielbereich
        this.goalZone = this.add.rectangle(400, 70, 800, 60, 0x00ff88, 0.3);
        this.add.text(400, 70, '🏁 ZIEL 🏁', { font: 'bold 24px Orbitron', fill: '#00ff88' }).setOrigin(0.5);

        // Zobel Spieler
        if (this.textures.exists('zobel')) {
            this.zobel = this.add.image(400, 480, 'zobel').setScale(0.15);
        } else {
            this.zobel = Zobel.draw(this, 400, 480, 0.5, 0x00ff88);
        }
        this.physics.add.existing(this.zobel);
        this.zobel.body.setSize(40, 60);

        // Autos
        this.cars = [];
        const carColors = [0xff0000, 0x0000ff, 0xffff00, 0xff00ff];
        // Reihe 1 - nach rechts
        for (let i = 0; i < 3; i++) {
            const car = this.add.rectangle(-100 + i * 300, 150, 80, 40, carColors[i % 4]);
            this.physics.add.existing(car);
            car.body.setVelocityX(150 * this.gameSpeed);
            car.direction = 1;
            this.cars.push(car);
        }
        // Reihe 2 - nach links
        for (let i = 0; i < 3; i++) {
            const car = this.add.rectangle(900 - i * 300, 250, 80, 40, carColors[(i + 1) % 4]);
            this.physics.add.existing(car);
            car.body.setVelocityX(-180 * this.gameSpeed);
            car.direction = -1;
            this.cars.push(car);
        }
        // Reihe 3 - nach rechts (schneller)
        for (let i = 0; i < 4; i++) {
            const car = this.add.rectangle(-50 + i * 250, 350, 70, 35, carColors[(i + 2) % 4]);
            this.physics.add.existing(car);
            car.body.setVelocityX(200 * this.gameSpeed);
            car.direction = 1;
            this.cars.push(car);
        }

        // Steuerung
        this.cursors = this.input.keyboard.createCursorKeys();
        this.canMove = true;
        this.startTimer();
    }
    update() {
        super.update();
        if (this.hasEnded) return;

        // Autos wrappen
        this.cars.forEach(car => {
            if (car.direction === 1 && car.x > 850) car.x = -50;
            if (car.direction === -1 && car.x < -50) car.x = 850;
        });

        // Zobel Bewegung (Schritt-basiert) - Pfeiltasten + WASD + Touch
        if (this.canMove) {
            if (this.justPressed('up')) {
                this.zobel.y -= 100;
                this.canMove = false;
                this.time.delayedCall(150, () => this.canMove = true);
            } else if (this.justPressed('down') && this.zobel.y < 480) {
                this.zobel.y += 100;
                this.canMove = false;
                this.time.delayedCall(150, () => this.canMove = true);
            } else if (this.justPressed('left') && this.zobel.x > 50) {
                this.zobel.x -= 80;
            } else if (this.justPressed('right') && this.zobel.x < 750) {
                this.zobel.x += 80;
            }
        }

        // Kollision mit Autos
        for (const car of this.cars) {
            if (Phaser.Geom.Intersects.RectangleToRectangle(
                new Phaser.Geom.Rectangle(this.zobel.x - 20, this.zobel.y - 30, 40, 60),
                car.getBounds()
            )) {
                this.lose();
                return;
            }
        }

        // Ziel erreicht?
        if (this.zobel.y <= 100) {
            this.win();
        }
    }
}

class ZobelJump extends BaseMicrogame {
    constructor() { super({ key: 'ZobelJump' }); }
    create() {
        super.create();
        this.cameras.main.setBackgroundColor('#87ceeb');
        this.add.text(400, 30, 'SPRING!', { font: 'bold 42px Orbitron', fill: '#333' }).setOrigin(0.5);
        this.add.text(400, 80, 'SPACE oder Klick zum Springen', { font: '16px Orbitron', fill: '#666' }).setOrigin(0.5);

        // Boden
        this.add.rectangle(400, 530, 800, 60, 0x8b4513);
        this.add.rectangle(400, 505, 800, 10, 0x228b22); // Gras

        // Spieler - auf dem Boden stehend (Gras bei y=500)
        this.groundY = 480;
        this.playerY = this.groundY;
        this.velocityY = 0;
        this.isOnGround = true;
        this.gravity = 1500;

        // Zobel zeichnen - auf Bodenhöhe
        if (this.textures.exists('zobel')) {
            this.zobel = this.add.image(150, this.playerY, 'zobel').setScale(0.18);
        } else {
            this.zobel = Zobel.draw(this, 150, this.playerY, 0.6, playerData.activeZobelColor === 'rainbow' ? 0x00ff88 : playerData.activeZobelColor);
        }

        // Hindernisse
        this.obstacles = [];
        this.spawnObstacle(); // Erstes Hindernis sofort

        this.obstacleTimer = this.time.addEvent({
            delay: 1500 / this.gameSpeed,
            callback: this.spawnObstacle,
            callbackScope: this,
            loop: true
        });

        // Nur 1 Hindernis überspringen
        this.jumped = 0;
        this.targetJumps = 1;

        // Steuerung
        this.input.keyboard.on('keydown-SPACE', () => this.jump());
        this.input.on('pointerdown', () => this.jump());

        this.startTimer();
    }
    spawnObstacle() {
        if (this.hasEnded) return;
        const height = Phaser.Math.Between(50, 80);
        const obstacle = this.add.rectangle(850, 500 - height / 2, 50, height, 0xff6b6b);
        obstacle.setStrokeStyle(3, 0xaa0000);
        obstacle.velocityX = -350 * this.gameSpeed;
        obstacle.passed = false;
        this.obstacles.push(obstacle);
    }
    jump() {
        if (this.hasEnded) return;
        if (this.isOnGround) {
            this.velocityY = -600;
            this.isOnGround = false;
        }
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;

        const dt = delta / 1000;

        // Physik für Spieler
        this.velocityY += this.gravity * dt;
        this.playerY += this.velocityY * dt;

        // Boden-Check
        if (this.playerY >= this.groundY) {
            this.playerY = this.groundY;
            this.velocityY = 0;
            this.isOnGround = true;
        }

        // Zobel Position updaten
        this.zobel.y = this.playerY;

        // Hindernisse bewegen und prüfen
        for (let i = this.obstacles.length - 1; i >= 0; i--) {
            const obs = this.obstacles[i];
            obs.x += obs.velocityX * dt;

            if (obs.x < -60) {
                obs.destroy();
                this.obstacles.splice(i, 1);
                continue;
            }

            // Übersprungen? -> Sofort gewinnen
            if (!obs.passed && obs.x < 130) {
                obs.passed = true;
                this.win();
                return;
            }

            // Kollision?
            const playerBox = new Phaser.Geom.Rectangle(130, this.playerY - 40, 40, 70);
            if (Phaser.Geom.Intersects.RectangleToRectangle(playerBox, obs.getBounds())) {
                this.lose();
                return;
            }
        }
    }
}

// ZobelHide - Zobel versteckt sich vor Feinden
class ZobelHide extends BaseMicrogame {
    constructor() { super({ key: 'ZobelHide' }); }
    create() {
        super.create();
        this.cameras.main.setBackgroundColor('#2d5a27');

        // Anleitung
        this.add.text(400, 560, 'Klicke auf das versteckte Zobel!', { font: '14px Orbitron', fill: '#fff' }).setOrigin(0.5);

        // Büsche erstellen
        this.bushes = [];
        const positions = [
            { x: 150, y: 250 }, { x: 350, y: 200 }, { x: 550, y: 280 },
            { x: 250, y: 400 }, { x: 450, y: 380 }, { x: 650, y: 320 }
        ];

        // Zobel versteckt sich in einem zufälligen Busch
        const zobelBushIndex = Phaser.Math.Between(0, positions.length - 1);

        positions.forEach((pos, idx) => {
            const bush = this.add.container(pos.x, pos.y);

            // Busch zeichnen
            const bushGraphics = this.add.graphics();
            bushGraphics.fillStyle(0x228B22, 1);
            bushGraphics.fillCircle(0, 0, 50);
            bushGraphics.fillCircle(-30, 10, 35);
            bushGraphics.fillCircle(30, 10, 35);
            bushGraphics.fillStyle(0x1a6b1a, 1);
            bushGraphics.fillCircle(-15, -20, 25);
            bushGraphics.fillCircle(15, -20, 25);
            bush.add(bushGraphics);

            // Zobel-Augen die kurz blinken (nur im richtigen Busch)
            if (idx === zobelBushIndex) {
                const eyes = this.add.graphics();
                eyes.fillStyle(0x000000, 1);
                eyes.fillCircle(-8, -5, 5);
                eyes.fillCircle(8, -5, 5);
                bush.add(eyes);
                eyes.setAlpha(0);

                // Kurz blinken
                this.time.addEvent({
                    delay: Phaser.Math.Between(500, 1500),
                    callback: () => {
                        if (!this.hasEnded) {
                            this.tweens.add({
                                targets: eyes,
                                alpha: 1,
                                duration: 150,
                                yoyo: true,
                                repeat: 0
                            });
                        }
                    },
                    loop: true
                });
            }

            bush.setInteractive(new Phaser.Geom.Circle(0, 0, 60), Phaser.Geom.Circle.Contains);
            bush.on('pointerdown', () => {
                if (this.hasEnded) return;
                if (idx === zobelBushIndex) {
                    // Zobel springt raus
                    bush.removeAll(true);
                    if (this.textures.exists('zobel')) {
                        const zobelImg = this.add.image(pos.x, pos.y - 50, 'zobel').setScale(0.15);
                        this.tweens.add({ targets: zobelImg, y: pos.y - 100, duration: 300 });
                    } else {
                        const zobelSprite = Zobel.draw(this, pos.x, pos.y - 50, 0.5);
                        this.tweens.add({ targets: zobelSprite, y: pos.y - 100, duration: 300 });
                    }
                    this.win();
                } else {
                    // Falscher Busch - schüttelt
                    this.tweens.add({
                        targets: bush,
                        x: { from: pos.x - 10, to: pos.x + 10 },
                        duration: 50,
                        yoyo: true,
                        repeat: 3
                    });
                }
            });

            this.bushes.push(bush);
        });

        this.startTimer();
    }
}

// ZobelRun - Zobel rennt und sammelt Nüsse
class ZobelRun extends BaseMicrogame {
    constructor() { super({ key: 'ZobelRun' }); }
    create() {
        super.create();
        this.cameras.main.setBackgroundColor('#87CEEB');
        this.collected = 0;
        this.target = 3;

        // Boden
        this.add.rectangle(400, 550, 800, 100, 0x8B4513);

        // Anleitung
        this.add.text(400, 30, 'Sammle 3 Nüsse! ← →', { font: '18px Orbitron', fill: '#000' }).setOrigin(0.5);
        this.collectText = this.add.text(400, 60, '0 / 3', { font: 'bold 24px Orbitron', fill: '#8B4513' }).setOrigin(0.5);

        // Zobel erstellen
        this.zobelX = 400;
        this.zobelY = 480;
        if (this.textures.exists('zobel')) {
            this.zobel = this.add.image(this.zobelX, this.zobelY, 'zobel').setScale(0.15);
        } else {
            this.zobel = Zobel.draw(this, this.zobelX, this.zobelY, 0.5);
        }

        // Nüsse erstellen
        this.nuts = [];
        for (let i = 0; i < 5; i++) {
            const nut = this.add.container(Phaser.Math.Between(80, 720), 480);
            const nutGraphics = this.add.graphics();
            nutGraphics.fillStyle(0x8B4513, 1);
            nutGraphics.fillEllipse(0, 0, 25, 20);
            nutGraphics.fillStyle(0x654321, 1);
            nutGraphics.fillEllipse(0, -12, 10, 8);
            nut.add(nutGraphics);
            this.nuts.push(nut);
        }

        // Steuerung
        this.cursors = this.input.keyboard.createCursorKeys();

        this.startTimer();
    }

    update() {
        super.update();  // Zündschnur-Anzeige aktualisieren
        if (this.hasEnded) return;

        // Zobel bewegen
        const speed = 8;
        if (this.isLeft()) {
            this.zobelX -= speed;
            if (this.zobel.setFlipX) this.zobel.setFlipX(true);
        }
        if (this.isRight()) {
            this.zobelX += speed;
            if (this.zobel.setFlipX) this.zobel.setFlipX(false);
        }
        this.zobelX = Phaser.Math.Clamp(this.zobelX, 50, 750);
        this.zobel.x = this.zobelX;

            const fish = this.add.graphics();
            fish.fillStyle(0xFFA500, 1);
            fish.fillEllipse(0, 0, 50, 25);
            fish.fillStyle(0x000000, 1);
            fish.fillCircle(12, -3, 4);
            this.swaggy.add(fish);
        }

        // Ziel-Linie zur Maus
        this.aimLine = this.add.graphics();

        // Blasen
        this.bubbles = [];
        for (let i = 0; i < 8; i++) {
            this.spawnBubble();
        }

        // Klick zum Schießen Richtung Maus
        this.input.on('pointerdown', (pointer) => {
            if (this.hasEnded) return;
            this.shootBubble(pointer.x, pointer.y);
        });

        this.startTimer();
    }

    spawnBubble() {
        const bubble = this.add.circle(
            Phaser.Math.Between(80, 720),
            Phaser.Math.Between(80, 520),
            Phaser.Math.Between(20, 40),
            0x87CEEB, 0.7
        );
        // Nicht zu nah an Swaggy spawnen
        if (Phaser.Math.Distance.Between(bubble.x, bubble.y, this.swaggyX, this.swaggyY) < 100) {
            bubble.x = Phaser.Math.Between(50, 150);
        }
        bubble.active = true;
        this.bubbles.push(bubble);
    }

    update() {
        super.update();
        if (this.hasEnded) return;

        // Ziel-Linie zur Maus zeichnen
        const pointer = this.input.activePointer;
        this.aimLine.clear();
        this.aimLine.lineStyle(2, 0xFFD700, 0.5);
        this.aimLine.lineBetween(this.swaggyX, this.swaggyY, pointer.x, pointer.y);
    }

    shootBubble(targetX, targetY) {
        // Richtung berechnen
        const angle = Phaser.Math.Angle.Between(this.swaggyX, this.swaggyY, targetX, targetY);
        const speed = 600;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;

        // Projektil erstellen
        const projectile = this.add.circle(this.swaggyX, this.swaggyY, 10, 0xFFD700);
        projectile.vx = vx;
        projectile.vy = vy;

        // Projektil bewegen per Tween
        this.tweens.add({
            targets: projectile,
            x: this.swaggyX + vx,
            y: this.swaggyY + vy,
            duration: 800,
            onUpdate: () => {
                this.bubbles.forEach(bubble => {
                    if (bubble.active && Phaser.Math.Distance.Between(projectile.x, projectile.y, bubble.x, bubble.y) < bubble.radius + 10) {
                        bubble.active = false;
                        bubble.destroy();
                        this.popped++;
                        this.collectText.setText(this.popped + ' / ' + this.target);
                        musicEngine.playSFX('click');
                        if (this.popped >= this.target) this.win();
                    }
                });
            },
            onComplete: () => projectile.destroy()
        });
    }
}

class DudeDodge extends BaseMicrogame {
    constructor() { super({ key: 'DudeDodge' }); }
    create() {
        super.create();
        this.cameras.main.setBackgroundColor('#1a1a2e');
        this.surviveTime = 0;

        this.add.rectangle(400, 550, 800, 100, 0x333333);
        this.add.text(400, 30, 'Weiche den Bomben aus! ← →', { font: '16px Orbitron', fill: '#fff' }).setOrigin(0.5);

        // Trashi - höher positioniert
        this.dudeX = 400;
        this.dudeY = 430;
        if (this.textures.exists('dude')) {
            this.dude = this.add.sprite(this.dudeX, this.dudeY, 'dude', 4).setScale(3.0);
        } else {
            this.dude = this.add.rectangle(this.dudeX, this.dudeY, 30, 50, 0x4169E1);
        }

        // Bomben
        this.bombs = [];
        this.spawnTimer = this.time.addEvent({
            delay: 500,
            callback: () => {
                if (!this.hasEnded) {
                    const bomb = this.add.circle(Phaser.Math.Between(50, 750), -20, 15, 0xff0000);
                    bomb.vy = Phaser.Math.Between(4, 8);
                    this.bombs.push(bomb);
                }
            },
            loop: true
        });

        this.cursors = this.input.keyboard.createCursorKeys();
        this.startSurvivalTimer();  // Überleben = Gewinnen!
    }

    update() {
        super.update();  // Timer-Update
        if (this.hasEnded) return;

        const speed = 7;
        if (this.isLeft()) {
            this.dudeX -= speed;
            if (this.dude.play) this.dude.play('dude_left', true);
        } else if (this.isRight()) {
            this.dudeX += speed;
            if (this.dude.play) this.dude.play('dude_right', true);
        } else if (this.dude.play) {
            this.dude.play('dude_idle', true);
        }

        this.dudeX = Phaser.Math.Clamp(this.dudeX, 30, 770);
        this.dude.x = this.dudeX;

        // Bomben bewegen und aufräumen
        for (let i = this.bombs.length - 1; i >= 0; i--) {
            const bomb = this.bombs[i];
            bomb.y += bomb.vy;

            // Bombe aus dem Bildschirm? Entfernen
            if (bomb.y > 600) {
                bomb.destroy();
                this.bombs.splice(i, 1);
                continue;
            }

            // Kollision - kleinere Hitbox (nur wenn Bombe wirklich den Spieler trifft)
            const dudeWidth = 20;
            const dudeHeight = 60;
            if (bomb.x > this.dudeX - dudeWidth && bomb.x < this.dudeX + dudeWidth &&
                bomb.y > this.dudeY - dudeHeight/2 && bomb.y < this.dudeY + dudeHeight/2) {
                this.lose();
            }
        }
    }
}

// DudeJump - Spring über Hindernisse
class DudeJump extends BaseMicrogame {
    constructor() { super({ key: 'DudeJump' }); }
    create() {
        super.create();
        this.cameras.main.setBackgroundColor('#4a69bd');
        this.jumped = 0;
        this.target = 1;

        this.add.rectangle(400, 550, 800, 100, 0x2d3436);
        this.add.rectangle(400, 510, 800, 20, 0x228B22); // Gras
        this.add.text(400, 30, 'Spring über das Hindernis! SPACE', { font: '16px Orbitron', fill: '#fff' }).setOrigin(0.5);

        // Trashi - steht auf dem Boden
        this.groundY = 430;
        this.dudeY = this.groundY;
        if (this.textures.exists('dude')) {
            this.dude = this.add.sprite(200, this.dudeY, 'dude', 4).setScale(3.0);
        } else {
            this.dude = this.add.rectangle(200, this.dudeY, 30, 50, 0x4169E1);
        }

        // Hindernis auf dem Boden (Höhe 50, Boden bei y=500)
        this.obstacle = this.add.rectangle(850, 475, 40, 50, 0xff6b6b);
        this.obstacleSpeed = 6;

        this.isJumping = false;
        this.dudeVY = 0;

        this.input.keyboard.on('keydown-SPACE', () => {
            if (!this.isJumping && !this.hasEnded) {
                this.isJumping = true;
                this.dudeVY = -18;
            }
        });

        this.startTimer();
    }

    update() {
        super.update();  // Timer-Update
        if (this.hasEnded) return;

        // Rennanimation wenn nicht springend
        if (!this.isJumping && this.dude.play) {
            this.dude.play('dude_right', true);
        }

        // Springen
        if (this.isJumping) {
            this.dudeVY += 1;
            this.dudeY += this.dudeVY;
            this.dude.y = this.dudeY;

            if (this.dudeY >= this.groundY) {
                this.dudeY = this.groundY;
                this.dude.y = this.groundY;
                this.isJumping = false;
                this.dudeVY = 0;
            }
        }

        // Hindernis bewegen
        this.obstacle.x -= this.obstacleSpeed;

        // Erfolgreich übersprungen
        if (this.obstacle.x < 150 && this.jumped === 0) {
            if (this.dudeY < this.groundY - 40) {
                // In der Luft = übersprungen
                this.jumped++;
                this.win();
            }
        }

        // Kollision - angepasste Werte
        if (this.obstacle.x > 160 && this.obstacle.x < 240 && this.dudeY > this.groundY - 30) {
            this.lose();
        }

        // Hindernis durch
        if (this.obstacle.x < -50) {
            this.obstacle.x = 850;
        }
    }
}

        } else if (this.isDown()) {
            this.playerY += speed;
            if (this.player.play) this.player.play('kaeppchen_down', true);
            moving = true;
        }

            // Labyrinth innere Wände

            [150, 250, 15, 215],  // Links vertikal (blockiert Aufstieg)
            [300, 350, 300, 15],  // Mitte horizontal
            [450, 200, 15, 315],  // Mitte vertikal (Hauptblockade)
            [600, 450, 200, 15],  // Unten rechts horizontal
            [550, 150, 15, 200],  // Rechts vertikal oben
            [650, 250, 100, 15],  // Rechts horizontal
            [250, 480, 150, 15],  // Unten links horizontal
        ];
        wallPositions.forEach(w => {
            const wall = this.add.rectangle(w[0], w[1], w[2], w[3], 0x4a3728);
            wall.setStrokeStyle(2, 0x2a1a08);
            this.walls.push(wall);
        });

        this.playerY = 500;
        if (this.textures.exists('kaeppchen')) {

        } else {

        }

        this.goal = this.add.rectangle(720, 80, 50, 50, 0xFFD700);
        this.add.text(720, 80, '🏠', { font: '24px Arial' }).setOrigin(0.5);

        this.cursors = this.input.keyboard.createCursorKeys();
        this.startTimer();
    }
    update() {
        super.update();
        if (this.hasEnded) return;

        const speed = 4;
        let newX = this.playerX;
        let newY = this.playerY;

        if (this.isLeft()) {
            newX -= speed;
            if (this.player.play) this.player.play('kaeppchen_left', true);
        } else if (this.isRight()) {
            newX += speed;
            if (this.player.play) this.player.play('kaeppchen_right', true);
        } else if (this.isUp()) {
            newY -= speed;
            if (this.player.play) this.player.play('kaeppchen_up', true);
        } else if (this.isDown()) {
            newY += speed;
            if (this.player.play) this.player.play('kaeppchen_down', true);
        }

        // Kollision mit Wänden prüfen
        let canMove = true;
        this.walls.forEach(wall => {
            if (newX > wall.x - wall.width/2 - 15 && newX < wall.x + wall.width/2 + 15 &&
                newY > wall.y - wall.height/2 - 15 && newY < wall.y + wall.height/2 + 15) {
                canMove = false;
            }
        });

        if (canMove) {
            this.playerX = Phaser.Math.Clamp(newX, 30, 770);
            this.playerY = Phaser.Math.Clamp(newY, 50, 540);
        }

        this.player.x = this.playerX;
        this.player.y = this.playerY;

        // Ziel erreicht?
        if (Phaser.Math.Distance.Between(this.playerX, this.playerY, 720, 80) < 40) {
            this.win();
        }
    }
}

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#211710">
    <title>ZobelWare NEO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { width: 100%; height: 100%; overflow: hidden; background: #0a0705; }
        /* body ohne eigenen Hintergrund, sonst verdeckt er das Zimmer dahinter */
        body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
        body {
            display: flex; justify-content: center; align-items: center;
            font-family: 'Orbitron', sans-serif;
            touch-action: none; -webkit-tap-highlight-color: transparent;
            /* Bildschirmbreite steuert die Groesse des ganzen Fernsehers */
            --screen-w: min(84vw, 88vh, 1080px);
            --bez: calc(var(--screen-w) * 0.045);
            --wood: #6b3f22;
        }

        /* ==================================================================
           DAS ZIMMER
           Tapete, Fussleiste, Dielenboden, Teppich und warmes Lampenlicht.
           ================================================================== */
        #room { position: fixed; inset: 0; z-index: -3; overflow: hidden; }
        #room .wall {
            position: absolute; inset: 0 0 26% 0;
            background:
                repeating-linear-gradient(90deg,
                    rgba(255,255,255,0.030) 0px, rgba(255,255,255,0.030) 26px,
                    transparent 26px, transparent 62px),
                linear-gradient(180deg, #3a2a1c 0%, #2b1e14 55%, #211710 100%);
        }
        /* Warmes Licht einer Stehlampe von links oben */
        #room .lamp {
            position: absolute; inset: 0;
            background:
                radial-gradient(circle at 12% 8%, rgba(255,196,110,0.28), transparent 46%),
                radial-gradient(circle at 92% 14%, rgba(255,150,90,0.10), transparent 40%);
        }
        #room .skirting {
            position: absolute; left: 0; right: 0; top: 74%; height: 2.4%;
            background: linear-gradient(180deg, #4a3220, #2c1c11);
            box-shadow: 0 3px 10px rgba(0,0,0,0.5);
        }
        #room .floor {
            position: absolute; left: -20%; right: -20%; top: 76.4%; bottom: 0;
            background:
                repeating-linear-gradient(90deg,
                    rgba(0,0,0,0.22) 0px, rgba(0,0,0,0.22) 2px,
                    transparent 2px, transparent 84px),
                repeating-linear-gradient(0deg,
                    rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px,
                    transparent 1px, transparent 34px),
                linear-gradient(180deg, #5a3620 0%, #34200f 100%);
            transform: perspective(520px) rotateX(46deg);
            transform-origin: top center;
        }
        #room .rug {
            position: absolute; left: 50%; top: 84%; width: 78vw; height: 30vh;
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(ellipse at center, #7a2f3c 0%, #5c2230 60%, transparent 72%);
            opacity: 0.72;
        }
        /* Deko an der Wand - auf schmalen Bildschirmen ausgeblendet */
        #room .poster {
            position: absolute; left: 3.4vw; top: 13vh; width: 12vw; height: 16vh;
            transform: rotate(-3deg);
            background: linear-gradient(160deg, #d9b23f, #b3521f);
            border: 0.7vh solid #f2e2bd;
            box-shadow: 0 1.4vh 3vh rgba(0,0,0,0.55);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.6vh; color: #2a140a; text-align: center; padding: 0.6vh;
        }
        #room .poster b { font-size: clamp(9px, 1.5vh, 17px); letter-spacing: .16em; }
        #room .poster span { font-size: clamp(7px, 1vh, 11px); letter-spacing: .1em; opacity: .8; }
        #room .shelf {
            position: absolute; right: 3vw; top: 20vh; width: 13vw; height: 1.4vh;
            background: linear-gradient(180deg, #7d4c2a, #40230f);
            box-shadow: 0 1vh 2vh rgba(0,0,0,0.5);
        }
        #room .shelf .stuff {
            position: absolute; left: 0; right: 0; bottom: 100%;
            display: flex; justify-content: space-around; align-items: flex-end;
            font-size: clamp(12px, 2.4vh, 28px); filter: saturate(.85) brightness(.85);
        }
        #room .plant {
            position: absolute; right: 2vw; bottom: 4vh;
            font-size: clamp(28px, 9vh, 96px);
            filter: brightness(.55) saturate(.7);
            text-shadow: 0 0 3vh rgba(0,0,0,0.6);
        }
        /* Zimmer-Vignette */
        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 40;
            background: radial-gradient(ellipse at 50% 48%, transparent 56%, rgba(0,0,0,0.55) 100%);
        }

        /* ==================================================================
           DER FERNSEHER
           ================================================================== */
        #tv {
            position: relative; z-index: 5;
            display: flex; flex-direction: column; align-items: center;
            filter: drop-shadow(0 calc(var(--screen-w) * 0.03) calc(var(--screen-w) * 0.05) rgba(0,0,0,0.75));
        }
        /* Hasenohren-Antenne */
        #tv .antenna {
            position: relative; width: calc(var(--screen-w) * 0.42);
            height: calc(var(--screen-w) * 0.11);
        }
        #tv .antenna i {
            position: absolute; bottom: 0; left: 50%; width: 3px; height: 100%;
            background: linear-gradient(180deg, #cfd6de, #6d7681);
            border-radius: 3px; transform-origin: bottom center;
        }
        #tv .antenna i:first-child { transform: rotate(-34deg); }
        #tv .antenna i:last-child  { transform: rotate(30deg); }
        #tv .antenna b {
            position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
            width: calc(var(--screen-w) * 0.09); height: calc(var(--screen-w) * 0.02);
            background: linear-gradient(180deg, #4d4237, #2a231b);
            border-radius: 3px 3px 0 0;
        }
        #tv .cabinet {
            position: relative;
            padding: var(--bez);
            padding-bottom: calc(var(--bez) * 0.6);
            border-radius: calc(var(--bez) * 1.5);
            background:
                linear-gradient(160deg, #c8b190 0%, #a68d68 22%, #8a7150 55%, #6d5739 100%);
            box-shadow:
                inset 0 2px 0 rgba(255,255,255,0.35),
                inset 0 -3px 8px rgba(0,0,0,0.45),
                0 0 0 2px rgba(40,28,16,0.9);
        }
        /* Feine Kunststoff-Maserung */
        #tv .cabinet::before {
            content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
            background: repeating-linear-gradient(115deg,
                rgba(255,255,255,0.035) 0 2px, transparent 2px 5px);
            mix-blend-mode: overlay;
        }
        #tv .screen-wrap {
            position: relative;
            width: var(--screen-w); aspect-ratio: 4 / 3;
            border-radius: 5% / 6.5%;
            overflow: hidden;
            background: #05060f;
            box-shadow:
                0 0 0 calc(var(--bez) * 0.22) #2a2117,
                inset 0 0 calc(var(--bez) * 1.6) rgba(0,0,0,0.85);
        }
        #game-shell { position: absolute; inset: 0; }
        canvas { display: block; width: 100% !important; height: 100% !important; background: #05060f; }

        /* Die Glasscheibe: Scanlines, Wölbung, Spiegelung, Bildlauf */
        #tv .glass {
            position: absolute; inset: 0; pointer-events: none; z-index: 20;
            border-radius: inherit;
            background:
                repeating-linear-gradient(0deg, rgba(0,0,0,0.13) 0 1px, transparent 1px 3px),
                repeating-linear-gradient(90deg, rgba(255,0,80,0.028) 0 1px, rgba(0,255,120,0.028) 1px 2px, rgba(60,120,255,0.028) 2px 3px),
                radial-gradient(ellipse at 50% 46%, transparent 56%, rgba(0,0,0,0.55) 100%);
        }
        /* Lichtreflex oben links auf der Röhre */
        #tv .glass::before {
            content: ''; position: absolute; left: 4%; top: 3%; width: 46%; height: 34%;
            background: linear-gradient(150deg, rgba(255,255,255,0.07), rgba(255,255,255,0));
            border-radius: 50% 50% 60% 40%;
            transform: rotate(-8deg);
        }
        /* Langsam durchlaufender Helligkeitsstreifen */
        #tv .glass::after {
            content: ''; position: absolute; left: 0; right: 0; height: 26%;
            background: linear-gradient(180deg, transparent, rgba(255,255,255,0.032), transparent);
            animation: roll 7.5s linear infinite;
            will-change: transform;
        }
        @keyframes roll { from { transform: translateY(-30%); } to { transform: translateY(420%); } }
        body[data-crt="off"] #tv .glass { display: none; }

        /* Kanalanzeige oben rechts wie beim Umschalten */
        #tv .channel {
            position: absolute; right: 4%; top: 5%; z-index: 25; pointer-events: none;
            font-size: calc(var(--screen-w) * 0.032); font-weight: 900; letter-spacing: .18em;
            color: #9dffcb; text-shadow: 0 0 10px rgba(0,255,140,0.8);
            opacity: 0; transition: opacity .5s ease;
        }
        #tv .channel.show { opacity: 0.9; }

        /* Bedienfeld unter dem Bildschirm */
        #tv .panel {
            display: flex; align-items: center; gap: calc(var(--bez) * 0.55);
            width: var(--screen-w); height: calc(var(--screen-w) * 0.085);
            margin-top: calc(var(--bez) * 0.55);
            padding: 0 calc(var(--bez) * 0.2);
        }
        #tv .brand {
            font-size: calc(var(--screen-w) * 0.024); font-weight: 900; letter-spacing: .26em;
            color: #3e2d18; text-shadow: 0 1px 0 rgba(255,255,255,0.35);
            white-space: nowrap;
        }
        #tv .grille {
            flex: 1; height: 62%; border-radius: calc(var(--bez) * 0.3);
            background:
                repeating-linear-gradient(90deg,
                    rgba(0,0,0,0.42) 0 3px, rgba(255,255,255,0.10) 3px 7px);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.55);
        }
        #tv .knob {
            width: calc(var(--screen-w) * 0.062); height: calc(var(--screen-w) * 0.062);
            border-radius: 50%; flex: none; cursor: pointer; position: relative;
            background: radial-gradient(circle at 34% 30%, #6f6152, #2e261d 70%);
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.3), 0 2px 5px rgba(0,0,0,0.6);
            transition: transform .2s ease;
        }
        #tv .knob::after {
            content: ''; position: absolute; left: 50%; top: 12%;
            width: 2px; height: 34%; margin-left: -1px; border-radius: 2px;
            background: #e8dcc4;
        }
        #tv .knob:hover { transform: scale(1.08); }
        #tv .knob.turned { transform: rotate(128deg); }
        #tv .knob.turned:hover { transform: rotate(128deg) scale(1.08); }
        #tv .led {
            width: calc(var(--screen-w) * 0.016); height: calc(var(--screen-w) * 0.016);
            border-radius: 50%; flex: none;
            background: #ff5b47; box-shadow: 0 0 calc(var(--screen-w) * 0.02) #ff5b47;
            animation: pulse 2.6s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
        /* Standfuss */
        #tv .stand {
            width: calc(var(--screen-w) * 0.34); height: calc(var(--screen-w) * 0.035);
            background: linear-gradient(180deg, #4a3b28, #241a10);
            border-radius: 0 0 calc(var(--bez) * 0.6) calc(var(--bez) * 0.6);
            box-shadow: 0 calc(var(--screen-w) * 0.012) calc(var(--screen-w) * 0.02) rgba(0,0,0,0.6);
        }

        /* Erzähltext im Zimmer */
        #room-text {
            position: fixed; left: 50%; bottom: 1.6vh; transform: translateX(-50%);
            z-index: 45; pointer-events: none; text-align: center; width: 92vw;
            font-size: clamp(9px, 1.45vh, 15px); letter-spacing: .14em;
            color: rgba(255,224,180,0.62);
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            transition: opacity .8s ease; opacity: 1;
        }
        #room-text.fade { opacity: 0; }

        /* Bildschirm-Modus: Zimmer ausblenden, nur noch spielen */
        body[data-room="off"] #room .poster,
        body[data-room="off"] #room .shelf,
        body[data-room="off"] #room .plant,
        body[data-room="off"] #room .rug,
        body[data-room="off"] #room-text { display: none; }
        body[data-room="off"] #room .wall { inset: 0; background: #0b0a12; }
        body[data-room="off"] #room .floor,
        body[data-room="off"] #room .skirting,
        body[data-room="off"] #room .lamp { display: none; }
        body[data-room="off"] #tv .antenna,
        body[data-room="off"] #tv .stand { display: none; }
        body[data-room="off"] { --screen-w: min(96vw, 98vh, 1400px); --bez: calc(var(--screen-w) * 0.016); }
        body[data-room="off"] #tv .cabinet { background: #14121a; box-shadow: 0 0 0 2px #23202e; }
        /* Die Knoepfe bleiben erreichbar, damit man zurueckschalten kann */
        body[data-room="off"] #tv .brand,
        body[data-room="off"] #tv .grille { visibility: hidden; }
        body[data-room="off"] #tv .panel { height: calc(var(--screen-w) * 0.05); }

        #boot-overlay {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 20px;
            background: #04040a; color: #00ff88; z-index: 90;
            transition: opacity .45s ease; letter-spacing: .28em;
        }
        #boot-overlay.hidden { opacity: 0; pointer-events: none; }
        #boot-overlay .ring {
            width: 56px; height: 56px; border-radius: 50%;
            border: 3px solid rgba(0,255,136,0.18); border-top-color: #00ff88;
            animation: spin 900ms linear infinite;
        }
        #boot-overlay .sub { font-size: 11px; color: #00d4ff; letter-spacing: .5em; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Schmale Fenster: Deko weg, Rahmen duenner */
        @media (max-width: 820px), (max-height: 560px) {
            #room .poster, #room .shelf, #room .plant { display: none; }
            body { --screen-w: min(96vw, 92vh); --bez: calc(var(--screen-w) * 0.028); }
            #tv .antenna, #tv .stand { display: none; }
            #room-text { display: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            #tv .glass::after, #tv .led, #boot-overlay .ring { animation: none; }
        }
    </style>
</head>
<body data-crt="on" data-room="on">
<div id="boot-overlay"><div class="ring"></div><div>ZOBELWARE</div><div class="sub">NEO</div></div>

<div id="room">
    <div class="wall"></div>
    <div class="lamp"></div>
    <div class="poster"><b>ZOBEL</b><b>WARE</b><span>JETZT NEU</span></div>
    <div class="shelf"><div class="stuff">🏆 📼 🥤</div></div>
    <div class="skirting"></div>
    <div class="floor"></div>
    <div class="rug"></div>
    <div class="plant">🪴</div>
</div>

<div id="tv">
    <div class="antenna"><i></i><b></b><i></i></div>
    <div class="cabinet">
        <div class="screen-wrap">
            <div id="game-shell"></div>
            <div class="channel" id="tv-channel">CH 03</div>
            <div class="glass"></div>
        </div>
        <div class="panel">
            <div class="brand">ZOBELTRON</div>
            <div class="grille"></div>
            <div class="knob" id="knob-crt" title="Röhren-Optik an/aus"></div>
            <div class="knob" id="knob-room" title="Zimmer an/aus"></div>
            <div class="led"></div>
        </div>
    </div>
    <div class="stand"></div>
</div>

<div id="room-text">Samstagmorgen. Der Fernseher läuft schon seit Stunden.</div>

<script>
// ======================================================================
// WOHNZIMMER-RAHMEN
// Zwei Drehknoepfe am Fernseher, eine Kanalanzeige und wechselnder
// Erzaehltext im Zimmer. Alles rein kosmetisch, das Spiel merkt nichts.
// ======================================================================
(function () {
    const body = document.body;
    const knobCrt = document.getElementById('knob-crt');
    const knobRoom = document.getElementById('knob-room');
    const channel = document.getElementById('tv-channel');
    const roomText = document.getElementById('room-text');

    const load = (k, d) => { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };
    const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

    function apply(attr, value, knob) {
        body.setAttribute(attr, value);
        knob.classList.toggle('turned', value === 'off');
    }
    apply('data-crt', load('zw_crt', 'on'), knobCrt);
    apply('data-room', load('zw_room', 'on'), knobRoom);

    function flashChannel(text) {
        channel.textContent = text;
        channel.classList.add('show');
        clearTimeout(flashChannel.t);
        flashChannel.t = setTimeout(() => channel.classList.remove('show'), 1800);
    }

    knobCrt.addEventListener('click', () => {
        const next = body.getAttribute('data-crt') === 'on' ? 'off' : 'on';
        apply('data-crt', next, knobCrt);
        save('zw_crt', next);
        flashChannel(next === 'on' ? 'RÖHRE AN' : 'RÖHRE AUS');
    });
    knobRoom.addEventListener('click', () => {
        const next = body.getAttribute('data-room') === 'on' ? 'off' : 'on';
        apply('data-room', next, knobRoom);
        save('zw_room', next);
        flashChannel(next === 'on' ? 'ZIMMER AN' : 'VOLLBILD');
    });

    setTimeout(() => flashChannel('CH 03'), 900);

    const LINES = [
        'Samstagmorgen. Der Fernseher läuft schon seit Stunden.',
        'Draußen regnet es. Drinnen läuft ZobelWare.',
        'Die Antenne wackelt – aber das Bild bleibt.',
        'Kanal 3. Ein anderer war nie nötig.',
        'Irgendwo im Haus ruft jemand nach dem Abendessen.',
        'Der Teppich ist warm, die Röhre brummt leise.',
        'Auf dem Regal steht noch der Pokal von damals.',
        'Nur noch ein Spiel. Wirklich nur noch eins.',
        'Die Limo ist warm geworden. Egal.',
        'Draußen wird es dunkel. Der Bildschirm bleibt hell.',
        'Der Zobel im Fernseher sieht müde aus. Du auch.',
        'Später räumst du auf. Später.'
    ];
    let li = 0;
    setInterval(() => {
        if (body.getAttribute('data-room') === 'off') return;
        roomText.classList.add('fade');
        setTimeout(() => {
            li = (li + 1) % LINES.length;
            roomText.textContent = LINES[li];
            roomText.classList.remove('fade');
        }, 800);
    }, 11000);
})();
</script>
<script>

class MusicEngine {
    constructor() {
        this.audioContext = null; this.masterGain = null; this.musicGain = null;
        this.isPlaying = false; this.currentBPM = 140; this.musicEnabled = true;
        this.sfxEnabled = true; this.timerID = null; this.initialized = false;
        this.nextNoteTime = 0; this.currentBeat = 0;
        this.currentMusicStyle = 'main';
        this.noteFreq = {'C2':65.41,'D2':73.42,'E2':82.41,'F2':87.31,'G2':98,'A2':110,'B2':123.47,'C3':130.81,'D3':146.83,'E3':164.81,'F3':174.61,'G3':196,'A3':220,'B3':246.94,'C4':261.63,'D4':293.66,'E4':329.63,'F4':349.23,'G4':392,'A4':440,'B4':493.88,'C5':523.25,'D5':587.33,'E5':659.25,'F5':698.46,'G5':783.99,'A5':880,'B5':987.77,'C6':1046.5,'D6':1174.66,'E6':1318.51};
        // Verschiedene Musik-Styles für Microgames
        this.musicStyles = {
            main:   { melody:['C5','E5','G5','C6','B5','G5','E5','C5'], bass:['C3','C3','G2','G2'], arp:['C4','E4','G4','E4'], tempo:1.0, type:'square', duty:0.5 },
            action: { melody:['E5','E5','E5','C5','E5','G5','G4','G4'], bass:['C3','C3','G2','A2'], arp:['C4','G4','C5','G4'], tempo:1.2, type:'square', duty:0.25 },
            puzzle: { melody:['G4','A4','B4','C5','D5','E5','D5','C5'], bass:['C3','E3','G3','E3'], arp:['C4','E4','G4','B4'], tempo:0.85, type:'triangle', duty:0.5 },
            tense:  { melody:['E4','E4','F4','G4','G4','F4','E4','D4'], bass:['A2','A2','A2','G2'], arp:['A3','C4','E4','C4'], tempo:1.05, type:'sawtooth', duty:0.5 },
            happy:  { melody:['C5','D5','E5','G5','E5','D5','C5','G4'], bass:['C3','G3','E3','G3'], arp:['C4','E4','G4','C5'], tempo:1.1, type:'square', duty:0.5 },
            rush:   { melody:['C5','C5','G5','G5','A5','A5','G5','E5'], bass:['C3','C3','F3','G3'], arp:['C4','F4','A4','F4'], tempo:1.45, type:'square', duty:0.25 },
            calm:   { melody:['E4','G4','B4','E5','D5','B4','G4','E4'], bass:['E3','B2','E3','B2'], arp:['E4','G4','B4','G4'], tempo:0.75, type:'triangle', duty:0.5 },
            boss:   { melody:['C4','D#4','G4','C5','D#5','G5','D#5','C5'], bass:['C2','C2','G2','C2'], arp:['C4','D#4','G4','A#4'], tempo:1.3, type:'sawtooth', duty:0.5 }
        };
        // Kanaele mit eigener Lautstaerke, wie bei einem Soundchip
        this.mix = { kick: 0.75, snare: 0.32, hat: 0.10, bass: 0.24, lead: 0.20, arp: 0.11 };
    }

    initialize() {
        if (this.initialized) return;
        try {
            this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            this.masterGain = this.audioContext.createGain(); this.masterGain.gain.value = 0.5;
            this.masterGain.connect(this.audioContext.destination);
            this.musicGain = this.audioContext.createGain(); this.musicGain.gain.value = 0.35;
            this.musicGain.connect(this.masterGain);
            this.initialized = true;
        } catch (e) { console.error('Audio init failed:', e); }
    }
    playNote(freq, duration, type='square', gain=0.3, startTime=null) {
        if (!this.initialized || !this.musicEnabled) return;
        const ctx = this.audioContext, time = startTime || ctx.currentTime;
        const osc = ctx.createOscillator(), noteGain = ctx.createGain();
        osc.type = type; osc.frequency.value = freq;
        noteGain.gain.setValueAtTime(0, time);

    // Boss Jingle

        const sfxGain = ctx.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(this.masterGain);

            const osc = ctx.createOscillator(), g = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(165, time);
            osc.frequency.exponentialRampToValueAtTime(38, time + 0.09);
            g.gain.setValueAtTime(m.kick, time);
            g.gain.exponentialRampToValueAtTime(0.01, time + 0.13);
            osc.connect(g); g.connect(this.musicGain);
            osc.start(time); osc.stop(time + 0.13);
        }

        // Snare: gefiltertes Rauschen auf den Zaehlzeiten 2 und 4
        if (beatInBar === 4 || beatInBar === 12) {
            const bufSize = ctx.sampleRate * 0.09;
            const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
            const data = buf.getChannelData(0);

            noise.connect(filter); filter.connect(g); g.connect(this.musicGain);
            noise.start(time); noise.stop(time + 0.09);
        }

        // Hi-Hat auf jeder Achtel, jede zweite offener
        if (beatInBar % 2 === 0) {
            const open = beatInBar % 8 === 6;
            const len = open ? 0.09 : 0.025;
            const bufSize = ctx.sampleRate * len;
            const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

            const arpIdx = beat % style.arp.length;
            const freq = this.noteFreq[style.arp[arpIdx]];
            if (freq) this.playNote(freq, beatLen * 0.12, 'square', m.arp, time);
        }

        // Melodie
        if (beatInBar % 2 === 0) {
            const melIdx = Math.floor(beat / 2) % style.melody.length;
            const freq = this.noteFreq[style.melody[melIdx]];
            if (freq) {
                this.playNote(freq, beatLen * 0.42, style.type, m.lead, time);
                // Zweite Stimme eine Oktave hoeher, ganz leise - macht es voller
                this.playNote(freq * 2, beatLen * 0.30, 'square', m.lead * 0.28, time);
            }
        }
    }

    }

    setBPM(bpm) { this.currentBPM = Math.min(220, Math.max(100, bpm)); }

// PlayerData
const DEFAULT_OWNED = ['default', 'startscreen_default', 'transition_brown', 'fuse_classic'];

class PlayerDataManager {
    constructor() { this.loadData(); }
    loadData() {
        try {
            const stored = localStorage.getItem('zobelware_v2');
            if (stored) {
                const d = JSON.parse(stored);
                this.coins = d.coins || 0;
                this.highScore = d.highScore || 0;
                this.gameStats = d.gameStats || {};
                this.ownedItems = Array.isArray(d.ownedItems) ? d.ownedItems : [...DEFAULT_OWNED];
                this.activeZobelColor = d.activeZobelColor || 0x00ff88;
                this.activeBackground = d.activeBackground || 'default';
                this.activeParticles = d.activeParticles || 'none';
                this.startScreenStyle = d.startScreenStyle || 'default';
                this.transitionColor = d.transitionColor || 0x8B7355;
                this.fuseStyle = d.fuseStyle || 'classic';
                // Erweiterte Statistiken
                this.achievements = Array.isArray(d.achievements) ? d.achievements : [];
                this.totalWins = d.totalWins || 0;
                this.totalPlayed = d.totalPlayed || 0;
                this.bossWins = d.bossWins || 0;
                this.bestCombo = d.bestCombo || 0;
                this.totalCoinsEarned = d.totalCoinsEarned || 0;
                this.runsPlayed = d.runsPlayed || 0;
                this.bestSpeed = d.bestSpeed || 1.0;
                this.modeHighScores = d.modeHighScores || {};
                this.clearedStages = Array.isArray(d.clearedStages) ? d.clearedStages : [];
                this.stageHighScores = d.stageHighScores || {};
                this.seenStories = Array.isArray(d.seenStories) ? d.seenStories : [];
                this.handheldMode = d.handheldMode !== false;
                this.musicEnabled = d.musicEnabled !== false;
                this.sfxEnabled = d.sfxEnabled !== false;
                // Sicherstellen, dass Basis-Items nie fehlen (z.B. nach altem Spielstand)
                DEFAULT_OWNED.forEach(id => { if (!this.ownedItems.includes(id)) this.ownedItems.push(id); });
            } else { this.reset(); }
        } catch (e) { this.reset(); }
    }
    reset() {
        this.coins = 0; this.highScore = 0; this.gameStats = {};
        this.ownedItems = [...DEFAULT_OWNED];
        this.activeZobelColor = 0x00ff88;
        this.activeBackground = 'default';
        this.activeParticles = 'none';
        this.startScreenStyle = 'default';
        this.transitionColor = 0x8B7355;
        this.fuseStyle = 'classic';
        this.achievements = [];
        this.totalWins = 0; this.totalPlayed = 0; this.bossWins = 0;
        this.bestCombo = 0; this.totalCoinsEarned = 0; this.runsPlayed = 0;
        this.bestSpeed = 1.0; this.modeHighScores = {};
        this.clearedStages = []; this.stageHighScores = {}; this.seenStories = [];
        this.handheldMode = true;
        this.musicEnabled = true; this.sfxEnabled = true;
    }
    saveData() {
        try {

                ownedItems: this.ownedItems, activeZobelColor: this.activeZobelColor,
                activeBackground: this.activeBackground, activeParticles: this.activeParticles,
                startScreenStyle: this.startScreenStyle, transitionColor: this.transitionColor,
                fuseStyle: this.fuseStyle, achievements: this.achievements,
                totalWins: this.totalWins, totalPlayed: this.totalPlayed, bossWins: this.bossWins,
                bestCombo: this.bestCombo, totalCoinsEarned: this.totalCoinsEarned,
                runsPlayed: this.runsPlayed, bestSpeed: this.bestSpeed,
                modeHighScores: this.modeHighScores,
                clearedStages: this.clearedStages, stageHighScores: this.stageHighScores,
                seenStories: this.seenStories,
                handheldMode: this.handheldMode,
                musicEnabled: this.musicEnabled, sfxEnabled: this.sfxEnabled

        } catch (e) {}
    }
    addCoins(n) { this.coins += n; this.totalCoinsEarned += n; this.saveData(); }
    spendCoins(n) { if (this.coins >= n) { this.coins -= n; this.saveData(); return true; } return false; }
    updateHighScore(s) { if (s > this.highScore) { this.highScore = s; this.saveData(); return true; } return false; }
    updateModeHighScore(mode, s) {
        const prev = this.modeHighScores[mode] || 0;
        if (s > prev) { this.modeHighScores[mode] = s; this.saveData(); return true; }
        return false;
    }
    trackGame(key, won) {
        if (!this.gameStats[key]) this.gameStats[key] = { played: 0, won: 0 };
        this.gameStats[key].played++; this.totalPlayed++;
        if (won) { this.gameStats[key].won++; this.totalWins++; }
        this.saveData();

        const prev = this.stageHighScores[charKey] || 0;
        if (score > prev) { this.stageHighScores[charKey] = score; this.saveData(); return true; }
        return false;
    }
    hasSeenStory(id) { return this.seenStories.includes(id); }
    markStorySeen(id) { if (!this.seenStories.includes(id)) { this.seenStories.push(id); this.saveData(); } }

    checkAll() {
        const unlocked = [];
        this.list.forEach(a => {
            if (!playerData.achievements.includes(a.id) && a.check(playerData)) {
                playerData.achievements.push(a.id);
                playerData.coins += a.reward;
                playerData.totalCoinsEarned += a.reward;
                unlocked.push(a);
            }
        });
        if (unlocked.length > 0) playerData.saveData();
        return unlocked;
    },
    isUnlocked(id) { return playerData.achievements.includes(id); },
    progress() { return Math.round((playerData.achievements.length / this.list.length) * 100); }
};

// ======================================================================
// ZOBELWARE NEO - Grafik- und Effektkern
// Alle Effekt-Texturen werden beim Start selbst gezeichnet, damit das
// Spiel ohne zusätzliche Bilddateien auskommt.
// ======================================================================


// ======================================================================
// QUALITÄT
// Teure Effekte (Bloom, Korn, viele Partikel) laufen nur, wenn die
// Grafikkarte sie auch trägt. Auf Software-Rendering oder bei
// einbrechender Bildrate wird automatisch heruntergeschaltet.
// ======================================================================
const Quality = {
    level: 'high',
    _lowFrames: 0,

    detect(game) {
        try {
            if (!game.renderer || game.renderer.type !== Phaser.WEBGL) { this.level = 'low'; return; }
            const gl = game.renderer.gl;
            const dbg = gl.getExtension('WEBGL_debug_renderer_info');
            const name = dbg ? String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)) : '';
            // Software-Renderer erkennen - dort ist Bloom unbezahlbar
            if (/swiftshader|software|llvmpipe|basic render/i.test(name)) this.level = 'low';
        } catch (e) { this.level = 'low'; }
    },

    // Läuft die Bildrate dauerhaft zu niedrig, dauerhaft herunterschalten
    watch(game) {
        if (this.level === 'low') return;
        const fps = game.loop.actualFps;
        if (fps > 0 && fps < 40) { this._lowFrames++; } else { this._lowFrames = Math.max(0, this._lowFrames - 1); }
        if (this._lowFrames > 60) { this.level = 'low'; }
    },

    high() { return this.level === 'high'; },
    // Partikelmengen an die Leistung anpassen
    count(n) { return this.level === 'high' ? n : Math.max(4, Math.round(n * 0.45)); }
};

const Art = {
    built: false,

    // Erzeugt einmalig alle Hilfstexturen für Partikel, Schatten und Glanz
    build(scene) {
        if (this.built) return;
        this.built = true;

        // Weicher runder Lichtpunkt - Basis für fast alle Partikel
        this.canvas(scene, 'fx-glow', 128, 128, (ctx, w, h) => {
            const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
            g.addColorStop(0, 'rgba(255,255,255,1)');
            g.addColorStop(0.35, 'rgba(255,255,255,0.55)');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
        });

        // Harter kleiner Funke mit weichem Rand
        this.canvas(scene, 'fx-spark', 32, 32, (ctx, w, h) => {
            const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
            g.addColorStop(0, 'rgba(255,255,255,1)');
            g.addColorStop(0.5, 'rgba(255,255,255,0.8)');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
        });

        // Vierzackiger Stern für Glitzer und Treffer
        this.canvas(scene, 'fx-star', 64, 64, (ctx, w, h) => {
            const cx = w / 2, cy = h / 2;
            const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, cx);
            g.addColorStop(0, 'rgba(255,255,255,1)');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            for (let i = 0; i < 4; i++) {
                const a = (Math.PI / 2) * i;
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(a - 0.16) * cx, cy + Math.sin(a - 0.16) * cy);
                ctx.lineTo(cx + Math.cos(a) * cx, cy + Math.sin(a) * cy);
                ctx.lineTo(cx + Math.cos(a + 0.16) * cx, cy + Math.sin(a + 0.16) * cy);
            }
            ctx.fill();
            ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fill();
        });

        // Ring für Schockwellen
        this.canvas(scene, 'fx-ring', 128, 128, (ctx, w, h) => {
            ctx.strokeStyle = 'rgba(255,255,255,1)';
            ctx.lineWidth = 8;
            ctx.beginPath(); ctx.arc(w / 2, h / 2, w / 2 - 8, 0, Math.PI * 2); ctx.stroke();
        });

        // Rauchwolke
        this.canvas(scene, 'fx-smoke', 96, 96, (ctx, w, h) => {
            for (let i = 0; i < 8; i++) {
                const x = w / 2 + (Math.random() - 0.5) * 34;
                const y = h / 2 + (Math.random() - 0.5) * 34;
                const r = 14 + Math.random() * 20;
                const g = ctx.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0, 'rgba(255,255,255,0.34)');
                g.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
            }
        });

        // Weicher Bodenschatten unter Figuren
        this.canvas(scene, 'fx-shadow', 128, 48, (ctx, w, h) => {
            const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
            g.addColorStop(0, 'rgba(0,0,0,0.55)');
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.save(); ctx.translate(w / 2, h / 2); ctx.scale(1, h / w); ctx.translate(-w / 2, -h / 2);
            ctx.fillStyle = g; ctx.fillRect(0, 0, w, w);
            ctx.restore();
        });

        // Feines Rauschen für Filmkorn (gleich in Bildschirmgröße,
        // damit kein TileSprite nötig ist - das kollidierte mit Canvas-Texturen)
        this.canvas(scene, 'fx-grain', 800, 600, (ctx, w, h) => {
            const img = ctx.createImageData(w, h);
            for (let i = 0; i < img.data.length; i += 4) {
                const v = 120 + Math.random() * 135;
                img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
                img.data[i + 3] = 26;
            }
            ctx.putImageData(img, 0, 0);
        });

        // Weiches Rechteck für Konfetti und Balken
        this.canvas(scene, 'fx-chip', 16, 16, (ctx, w, h) => {
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            const r = 4;
            ctx.moveTo(r, 0); ctx.arcTo(w, 0, w, h, r); ctx.arcTo(w, h, 0, h, r);
            ctx.arcTo(0, h, 0, 0, r); ctx.arcTo(0, 0, w, 0, r); ctx.fill();
        });

        // Vertikaler Lichtstrahl
        this.canvas(scene, 'fx-beam', 64, 256, (ctx, w, h) => {
            const g = ctx.createLinearGradient(0, 0, w, 0);
            g.addColorStop(0, 'rgba(255,255,255,0)');
            g.addColorStop(0.5, 'rgba(255,255,255,0.85)');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
        });
    },

    canvas(scene, key, w, h, draw) {
        if (scene.textures.exists(key)) return;
        const tex = scene.textures.createCanvas(key, w, h);
        draw(tex.getContext(), w, h);
        tex.refresh();
    }
};

// ======================================================================
// FARBEN
// Das Vorbild war knallbunt, nicht dunkel. Jede Farbe, die ein Minispiel
// anfordert, wird hier auf kraeftig und hell gezogen - so werden alle
// Spiele auf einen Schlag bunter, ohne sie einzeln anzufassen.
// ======================================================================
const Pop = {
    vivid(color, satBoost = 1.9, minLight = 0.72) {
        const c = Phaser.Display.Color.ValueToColor(color);
        const hsv = Phaser.Display.Color.RGBToHSV(c.red, c.green, c.blue);
        const s = Math.min(1, Math.max(hsv.s * satBoost, 0.62));
        const v = Math.min(1, Math.max(hsv.v * 1.5, minLight));
        const out = Phaser.Display.Color.HSVToRGB(hsv.h, s, v);
        const r = out.r !== undefined ? out.r : out.red;
        const g = out.g !== undefined ? out.g : out.green;
        const b = out.b !== undefined ? out.b : out.blue;
        return Phaser.Display.Color.GetColor(r, g, b);
    },
    // Etwas dunklere Variante fuer den unteren Rand des Verlaufs
    deeper(color, amount = 0.72) {
        const c = Phaser.Display.Color.ValueToColor(color);
        const hsv = Phaser.Display.Color.RGBToHSV(c.red, c.green, c.blue);
        const out = Phaser.Display.Color.HSVToRGB(hsv.h, Math.min(1, hsv.s * 1.12), hsv.v * amount);
        const r = out.r !== undefined ? out.r : out.red;
        const g = out.g !== undefined ? out.g : out.green;
        const b = out.b !== undefined ? out.b : out.blue;
        return Phaser.Display.Color.GetColor(r, g, b);
    }
};

// ======================================================================
// JUICE - alles, was Treffer und Erfolge spürbar macht
// ======================================================================
const Juice = {
    // Bildschirmzittern über einen Erschütterungswert, der von selbst abklingt.
    // Fühlt sich organischer an als eine feste Dauer.
    shake(scene, amount = 0.5, duration = 260) {
        scene.cameras.main.shake(duration, 0.004 + 0.012 * amount, true);
    },

    // Kurzer Zeitstopp beim Aufprall - der Klassiker für Wucht.
    // Wichtig: Das Tempo wird IMMER zurückgesetzt, auch wenn die Szene
    // inzwischen beendet wurde. Phaser verwendet Szenen-Instanzen wieder -
    // ein hängengebliebener Zeitfaktor lässt das Spiel beim nächsten Mal
    // in Zeitlupe laufen und wirkt wie ein Absturz.
    hitstop(scene, ms = 70, scale = 0.06) {
        if (scene.__hitstop) return;
        scene.__hitstop = true;
        Juice._setTimeScale(scene, scale);
        setTimeout(() => Juice.resetTimeScale(scene), ms);
    },

    _setTimeScale(scene, scale) {
        if (!scene) return;
        if (scene.time) scene.time.timeScale = scale;
        if (scene.tweens) scene.tweens.timeScale = scale;
    },

    // Setzt das Zeittempo einer Szene bedingungslos zurück
    resetTimeScale(scene) {
        if (!scene) return;
        if (scene.time) scene.time.timeScale = 1;
        if (scene.tweens) scene.tweens.timeScale = 1;
        if (scene.physics && scene.physics.world) scene.physics.world.timeScale = 1;
        scene.__hitstop = false;
    },

    // Stauchen und Strecken - lässt starre Sprites lebendig wirken
    squash(scene, target, strength = 0.25, duration = 180) {
        if (!target || !target.scaleX) return;
        const sx = target.__baseScaleX !== undefined ? target.__baseScaleX : (target.__baseScaleX = target.scaleX);
        const sy = target.__baseScaleY !== undefined ? target.__baseScaleY : (target.__baseScaleY = target.scaleY);
        scene.tweens.killTweensOf(target);
        target.setScale(sx * (1 + strength), sy * (1 - strength));
        scene.tweens.add({
            targets: target, scaleX: sx, scaleY: sy,
            duration, ease: 'Elastic.easeOut'
        });
    },

    // Kurzes Aufblitzen des Sprites (Trefferfeedback)
    flashSprite(scene, target, color = 0xffffff, duration = 90) {
        if (!target || !target.setTintFill) return;
        const had = target.isTinted;
        const prev = target.tintTopLeft;
        target.setTintFill(color);
        scene.time.delayedCall(duration, () => {
            if (!target.scene) return;
            if (had) target.setTint(prev); else target.clearTint();
        });
    },

    // Vollbild-Blitz in Wunschfarbe
    flash(scene, color = 0xffffff, alpha = 0.55, duration = 200) {
        const r = scene.add.rectangle(400, 300, 800, 600, color, alpha)
            .setDepth(9000).setScrollFactor(0).setBlendMode(Phaser.BlendModes.ADD);
        scene.tweens.add({ targets: r, alpha: 0, duration, onComplete: () => r.destroy() });
    },

    // Zeitlupe für dramatische Momente
    slowmo(scene, ms = 500, scale = 0.35) {
        Juice._setTimeScale(scene, scale);
        setTimeout(() => Juice.resetTimeScale(scene), ms);
    }
};

// ======================================================================
// FX - Partikeleffekte auf Basis der erzeugten Texturen
// ======================================================================
const FX = {
    // Explosionsartiger Ausbruch
    burst(scene, x, y, color = 0x00ff88, count = 24, power = 260) {
        count = Quality.count(count);
        const e = scene.add.particles(x, y, 'fx-spark', {
            speed: { min: power * 0.35, max: power },
            angle: { min: 0, max: 360 },
            scale: { start: 0.9, end: 0 },
            alpha: { start: 1, end: 0 },
            lifespan: { min: 260, max: 620 },
            quantity: count,
            tint: color,
            blendMode: 'ADD',
            emitting: false
        }).setDepth(3000);
        e.explode(count);
        scene.time.delayedCall(900, () => e.destroy());
        return e;
    },

    // Schockwelle als aufziehender Ring
    shockwave(scene, x, y, color = 0xffffff, size = 220, duration = 420) {
        const ring = scene.add.image(x, y, 'fx-ring')
            .setTint(color).setBlendMode(Phaser.BlendModes.ADD)
            .setScale(0.15).setDepth(2900);
        scene.tweens.add({
            targets: ring, scale: size / 128, alpha: 0,
            duration, ease: 'Cubic.easeOut', onComplete: () => ring.destroy()
        });
        return ring;
    },

    // Weicher Lichtblitz an einer Stelle
    pop(scene, x, y, color = 0xffffff, size = 200) {
        const g = scene.add.image(x, y, 'fx-glow')
            .setTint(color).setBlendMode(Phaser.BlendModes.ADD)
            .setScale(0.2).setDepth(2900);
        scene.tweens.add({
            targets: g, scale: size / 128, alpha: 0,
            duration: 320, ease: 'Quad.easeOut', onComplete: () => g.destroy()
        });
    },

    // Konfettiregen für große Momente
    confetti(scene, count = 90) {
        count = Quality.count(count);
        const colors = [0x00ff88, 0x00d4ff, 0xffd93d, 0xff6b6b, 0x9b59b6, 0xffffff];
        const e = scene.add.particles(0, -30, 'fx-chip', {
            x: { min: 0, max: 800 },
            speedY: { min: 130, max: 340 },
            speedX: { min: -70, max: 70 },
            scale: { min: 0.5, max: 1.2 },
            rotate: { min: -220, max: 220 },
            lifespan: 3200,
            quantity: 3,
            frequency: 24,
            tint: colors
        }).setDepth(3000);
        scene.time.delayedCall(Math.min(1600, count * 18), () => e.stop());
        scene.time.delayedCall(5200, () => e.destroy());
        return e;
    },

    // Dauerhafter Funkenschweif, der einem Objekt folgt
    trail(scene, target, color = 0x00ff88, scale = 0.5) {
        if (!Quality.high()) return null;
        const e = scene.add.particles(0, 0, 'fx-glow', {
            follow: target,
            speed: { min: 4, max: 30 },
            scale: { start: scale, end: 0 },
            alpha: { start: 0.7, end: 0 },
            lifespan: 340,
            frequency: 26,
            tint: color,
            blendMode: 'ADD'
        }).setDepth(-1);
        return e;
    },

    // Ruhiger Staub in der Luft - füllt leere Hintergründe
    ambient(scene, color = 0xffffff, count = 26) {
        if (!Quality.high()) return null;
        const e = scene.add.particles(0, 0, 'fx-glow', {
            x: { min: 0, max: 800 },
            y: { min: 0, max: 600 },
            speedY: { min: -14, max: -4 },
            speedX: { min: -8, max: 8 },
            scale: { min: 0.05, max: 0.22 },
            alpha: { start: 0, end: 0 },
            lifespan: 6000,
            frequency: 6000 / count,
            tint: color,
            blendMode: 'ADD'
        }).setDepth(-50);
        // Sanft ein- und ausblenden statt hart erscheinen
        e.addEmitZone({ type: 'random', source: new Phaser.Geom.Rectangle(0, 0, 800, 620), quantity: 1 });
        e.setAlpha({ start: 0.55, end: 0 });
        return e;
    },

    // Aufsteigende Blasen (Unterwasser-Themen)
    bubbles(scene, count = 22) {
        if (!Quality.high()) return null;
        return scene.add.particles(0, 620, 'fx-glow', {
            x: { min: 0, max: 800 },
            speedY: { min: -70, max: -22 },
            speedX: { min: -14, max: 14 },
            scale: { min: 0.06, max: 0.26 },
            alpha: { start: 0.4, end: 0 },
            lifespan: 7000,
            frequency: 7000 / count,
            tint: 0x9be7ff,
            blendMode: 'ADD'
        }).setDepth(-50);
    },

    // Fallende Blätter/Flocken (Wald-Themen)
    leaves(scene, color = 0x8fbf6a, count = 16) {
        if (!Quality.high()) return null;
        return scene.add.particles(0, -20, 'fx-chip', {
            x: { min: 0, max: 800 },
            speedY: { min: 22, max: 60 },
            speedX: { min: -26, max: 26 },
            scale: { min: 0.25, max: 0.5 },
            rotate: { min: -180, max: 180 },
            alpha: { start: 0.55, end: 0.1 },
            lifespan: 9000,
            frequency: 9000 / count,
            tint: color
        }).setDepth(-50);
    }
};

// ======================================================================
// SKY - prozedurale Hintergründe je Theme
// ======================================================================
const Sky = {
    // Baut einen kompletten Hintergrund inkl. Verlauf, Kulisse und Partikeln
    build(scene, themeKey, opts = {}) {
        const t = Themes.get(themeKey);
        const layers = [];
        layers.push(this.gradient(scene, t.sky[0], t.sky[1]));

        if (opts.plain !== true) {
            switch (t.kind) {
                case 'ocean':  this.ocean(scene, t); break;
                case 'forest': this.forest(scene, t); break;
                case 'scrap':  this.scrap(scene, t); break;
                case 'arena':  this.arena(scene, t); break;
                default:       this.grid(scene, t); break;
            }
        }
        // Filmkorn ganz oben drüber
        if (opts.grain !== false) this.grain(scene);
        return layers;
    },

    // Farbverlauf einmal in eine Textur backen und danach als einzelnes Bild
    // zeichnen. Vorher waren das knapp 50 Rechtecke pro Bild und Ebene.
    gradientTexture(scene, top, bottom) {
        const key = 'grad-' + top.toString(16) + '-' + bottom.toString(16);
        if (!scene.textures.exists(key)) {
            const tex = scene.textures.createCanvas(key, 8, 600);
            const ctx = tex.getContext();
            const g = ctx.createLinearGradient(0, 0, 0, 600);
            const hex = v => '#' + v.toString(16).padStart(6, '0');
            g.addColorStop(0, hex(top));
            g.addColorStop(1, hex(bottom));
            ctx.fillStyle = g; ctx.fillRect(0, 0, 8, 600);
            tex.refresh();
        }
        return key;
    },

    gradient(scene, top, bottom) {
        return scene.add.image(400, 300, this.gradientTexture(scene, top, bottom))
            .setDisplaySize(800, 600).setDepth(-1000);
    },

    // Leichtes Rauschen über dem Bild - nimmt Verläufen das Digitale
    grain(scene) {
        if (!Quality.high()) return null;
        const g = scene.add.image(400, 300, 'fx-grain')
            .setDepth(2500).setAlpha(0.16).setScrollFactor(0);
        // Leichtes Verrutschen alle paar Bilder lässt das Korn lebendig wirken
        let n = 0;
        scene.events.on('update', () => {
            if (++n % 4) return;
            g.setPosition(400 + Phaser.Math.Between(-3, 3), 300 + Phaser.Math.Between(-3, 3));
        });
        return g;
    },

    ocean(scene, t) {
        FX.bubbles(scene, 24);
        if (!Quality.high()) return;
        // Lichtstrahlen von der Oberfläche
        for (let i = 0; i < 5; i++) {
            const beam = scene.add.image(90 + i * 165, 240, 'fx-beam')
                .setTint(t.accent).setAlpha(0.09).setBlendMode(Phaser.BlendModes.ADD)
                .setDisplaySize(150, 620).setAngle(8).setDepth(-900);
            scene.tweens.add({
                targets: beam, alpha: 0.2, x: beam.x + 24,
                duration: 3200 + i * 500, yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
            });
        }
        // Wellenlinien am oberen Rand (nur bei hoher Qualität)
        if (!Quality.high()) return;
        const wave = scene.add.graphics().setDepth(-890);
        let phase = 0;
        scene.events.on('update', () => {
            phase += 0.02;
            wave.clear();
            wave.lineStyle(2, t.accent, 0.25);
            for (let k = 0; k < 3; k++) {
                wave.beginPath();
                for (let x = 0; x <= 800; x += 16) {
                    const y = 40 + k * 14 + Math.sin(x * 0.02 + phase + k) * 6;
                    x === 0 ? wave.moveTo(x, y) : wave.lineTo(x, y);
                }
                wave.strokePath();
            }
        });
    },

    forest(scene, t) {
        // Baumsilhouetten in zwei Ebenen für Tiefe
        for (let layer = 0; layer < 2; layer++) {
            const g = scene.add.graphics().setDepth(-950 + layer * 10);
            const dark = layer === 0 ? 0.55 : 0.8;
            const base = 620 - layer * 30;
            g.fillStyle(0x000000, dark * 0.55);
            let x = -40;
            while (x < 840) {
                const w = 40 + Math.random() * 60;
                const h = 150 + Math.random() * 190 - layer * 40;
                g.fillTriangle(x, base, x + w / 2, base - h, x + w, base);
                g.fillRect(x + w / 2 - 5, base - 40, 10, 40);
                x += w * 0.72;
            }
        }
        FX.leaves(scene, t.accent, 14);
        if (!Quality.high()) return;
        // Sonnenstrahlen
        for (let i = 0; i < 3; i++) {
            const beam = scene.add.image(160 + i * 240, 200, 'fx-beam')
                .setTint(t.accent).setAlpha(0.07).setBlendMode(Phaser.BlendModes.ADD)
                .setDisplaySize(220, 700).setAngle(-14).setDepth(-900);
            scene.tweens.add({ targets: beam, alpha: 0.16, duration: 2600 + i * 400, yoyo: true, repeat: -1 });
        }
    },

    scrap(scene, t) {
        // Zerklüftete Schrottberge
        const g = scene.add.graphics().setDepth(-940);
        g.fillStyle(0x000000, 0.45);
        let x = -20;
        while (x < 830) {
            const w = 60 + Math.random() * 90;
            const h = 60 + Math.random() * 150;
            g.fillRect(x, 600 - h, w, h);
            g.fillTriangle(x, 600 - h, x + w, 600 - h, x + w / 2, 600 - h - 30 - Math.random() * 40);
            x += w * 0.8;
        }
        FX.ambient(scene, t.accent, 18);
        if (!Quality.high()) return;
        // Blinkende Warnlichter
        for (let i = 0; i < 4; i++) {
            const l = scene.add.image(110 + i * 200, 430 + Math.random() * 60, 'fx-glow')
                .setTint(i % 2 ? 0xff5544 : t.accent).setBlendMode(Phaser.BlendModes.ADD)
                .setScale(0.5).setAlpha(0.5).setDepth(-930);
            scene.tweens.add({ targets: l, alpha: 0.05, duration: 700 + i * 230, yoyo: true, repeat: -1 });
        }
    },

    arena(scene, t) {
        this.grid(scene, t);
        if (!Quality.high()) return;
        // Scheinwerferkegel von oben
        for (let i = 0; i < 4; i++) {
            const beam = scene.add.image(120 + i * 190, 120, 'fx-beam')
                .setTint(t.accent).setAlpha(0.12).setBlendMode(Phaser.BlendModes.ADD)
                .setDisplaySize(200, 480).setDepth(-900).setOrigin(0.5, 0);
            beam.y = 0;
            scene.tweens.add({
                targets: beam, angle: { from: -9, to: 9 },
                duration: 2600 + i * 340, yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
            });
        }
    },

    // Perspektivisches Neongitter. Die Fluchtlinien werden einmal gezeichnet,
    // nur die waagerechten Linien wandern - das spart jede Menge Rechenzeit.
    grid(scene, t) {
        const horizon = 330;
        const stat = scene.add.graphics().setDepth(-950);
        stat.lineStyle(1.5, t.accent, 0.18);
        for (let i = -12; i <= 12; i++) stat.lineBetween(400, horizon, 400 + i * 150, 600);
        stat.fillStyle(t.accent, 0.06);
        stat.fillRect(0, horizon - 26, 800, 26);

        const lines = [];
        for (let i = 0; i < 12; i++) {
            lines.push(scene.add.rectangle(400, horizon, 800, 2, t.accent, 0.2).setDepth(-949));
        }
        let offset = 0;
        scene.events.on('update', (time, delta) => {
            offset = (offset + delta * 0.05) % 46;
            for (let i = 0; i < lines.length; i++) {
                const p = ((i * 46 + offset) / (lines.length * 46));
                lines[i].y = horizon + Math.pow(p, 2.1) * (600 - horizon);
                lines[i].setAlpha(0.05 + p * 0.26);
            }
        });

        const sun = scene.add.image(400, horizon - 10, 'fx-glow')
            .setTint(t.accent).setBlendMode(Phaser.BlendModes.ADD)
            .setScale(3.4, 1.6).setAlpha(0.22).setDepth(-960);
        scene.tweens.add({ targets: sun, alpha: 0.34, duration: 2400, yoyo: true, repeat: -1 });
    }
};

// ======================================================================
// Kamera-Nachbearbeitung: Bloom und Vignette, sofern WebGL verfügbar
// ======================================================================
const PostFX = {
    apply(scene, opts = {}) {
        const cam = scene.cameras.main;
        if (!scene.renderer || scene.renderer.type !== Phaser.WEBGL || !cam.postFX) return;
        try {
            if (Handheld.enabled()) {
                // Handheld-Modus: grobes Pixelraster und blassere Farben wie auf
                // einem alten Taschenspiel-Bildschirm. Bloom passt da nicht dazu.
                cam.postFX.addPixelate(Handheld.PIXEL);
                const cm = cam.postFX.addColorMatrix();
                cm.saturate(-0.10);
                cm.contrast(0.12);
                cm.brightness(1.06);
                if (opts.vignette !== false) cam.postFX.addVignette(0.5, 0.5, 1.0, 0.16);
                return;
            }
            if (opts.bloom !== false && Quality.high()) {
                cam.postFX.addBloom(0xffffff, 1, 1, opts.bloomStrength !== undefined ? opts.bloomStrength * 0.7 : 0.38, opts.bloomBlur || 0.65);
            }
            if (opts.vignette !== false) {
                cam.postFX.addVignette(0.5, 0.5, opts.vignetteRadius || 1.0, (opts.vignetteStrength || 0.42) * 0.5);
            }
        } catch (e) {
            // Ältere Renderer ohne FX-Unterstützung einfach überspringen
        }
    }
};

// ======================================================================
// HANDHELD-MODUS
// Holt die Optik des kleinen Klapp-Spielgeraets zurueck: grobe Pixel,
// sichtbares LCD-Raster und ein Rahmen, der das Bild wie ein Display
// wirken laesst.
// ======================================================================
const Handheld = {
    PIXEL: 1.6,                 // Staerke des Pixelrasters (mehr macht kleinen Text unlesbar)
    enabled() { return playerData.handheldMode !== false; },
    toggle() {
        playerData.handheldMode = !this.enabled();
        playerData.saveData();
        return this.enabled();
    },

    // Feines Gitter, das die einzelnen Bildpunkte andeutet
    buildTexture(scene) {
        if (scene.textures.exists('lcd-grid')) return;
        const cell = 4;
        const tex = scene.textures.createCanvas('lcd-grid', 800, 600);
        const ctx = tex.getContext();
        ctx.clearRect(0, 0, 800, 600);
        // Senkrechte Linien kraeftiger als waagerechte - so sehen echte
        // Fluessigkristall-Anzeigen aus der Naehe aus
        ctx.fillStyle = 'rgba(0,0,0,0.30)';
        for (let x = 0; x < 800; x += cell) ctx.fillRect(x, 0, 1, 600);
        ctx.fillStyle = 'rgba(0,0,0,0.16)';
        for (let y = 0; y < 600; y += cell) ctx.fillRect(0, y, 800, 1);
        tex.refresh();
    },

    // Legt Raster und Displayrand ueber die Szene
    overlay(scene) {
        if (!this.enabled()) return null;
        this.buildTexture(scene);
        const grid = scene.add.image(400, 300, 'lcd-grid')
            .setDepth(2800).setAlpha(0.75).setScrollFactor(0);
        // Leichter Grünstich und Aufhellung an den Raendern - typisch fuer
        // durchleuchtete Fluessigkristall-Anzeigen
        const sheen = scene.add.image(400, 300, 'fx-glow')
            .setTint(0xbfffe0).setBlendMode(Phaser.BlendModes.ADD)
            .setDisplaySize(1100, 900).setAlpha(0.05).setDepth(2801).setScrollFactor(0);
        return { grid, sheen };
    }
};

    getCurrentCharacter() {
        return this.data[this.currentCharacter];
    },

    getCharacterByName(name) {
        return this.data[name];
    },

    nextCharacter() {
        // Aktuellen Charakter als gespielt markieren
        if (!this.playedThisRound.includes(this.currentCharacter)) {
            this.playedThisRound.push(this.currentCharacter);
        }

        // Alle anderen Charaktere (nicht Zobel)
        const otherChars = this.characters.filter(c => c !== 'zobel');

        // Welche anderen Charaktere wurden noch nicht gespielt?
        const remainingOthers = otherChars.filter(c => !this.playedThisRound.includes(c));

        if (remainingOthers.length === 0) {
            // Alle haben gespielt, neue Runde mit Zobel starten
            this.playedThisRound = [];
            this.currentCharacter = 'zobel';
        } else {
            // Zufällig einen der verbleibenden wählen (nicht den aktuellen)
            const available = remainingOthers.filter(c => c !== this.currentCharacter);
            if (available.length > 0) {
                this.currentCharacter = Phaser.Utils.Array.GetRandom(available);
            } else {
                // Nur noch einer übrig, den nehmen
                this.currentCharacter = remainingOthers[0];
            }
        }

        this.characterIndex = this.characters.indexOf(this.currentCharacter);
        return this.getCurrentCharacter();
    },

    setCharacter(name) {
        if (this.data[name]) {
            this.currentCharacter = name;
            this.characterIndex = this.characters.indexOf(name);
        }
    },

    resetRound() {
        this.playedThisRound = [];
        this.currentCharacter = 'zobel';
        this.characterIndex = 0;
    },

    getRandomGame() {
        const char = this.getCurrentCharacter();
        return Phaser.Utils.Array.GetRandom(char.games);
    },

    getBoss() {
        return this.getCurrentCharacter().boss;
    },

    // Zeichnet den aktuellen Charakter (für Szenen die kein Bild haben)
    draw(scene, x, y, scale = 1) {
        const char = this.getCurrentCharacter();
        if (scene.textures.exists(char.image)) {
            const img = scene.add.image(x, y, char.image).setScale(char.scale * scale);
            return img;
        }
        // Fallback auf gezeichnetes Zobel
        return Zobel.draw(scene, x, y, scale, char.color);
    },

    // Spielt den Charakter-Jingle
    playJingle(gameSpeed = 1.0) {
        if (!musicEngine.initialized || !musicEngine.sfxEnabled) return;
        const char = this.getCurrentCharacter();
        const ctx = musicEngine.audioContext, time = ctx.currentTime;
        const sfxGain = ctx.createGain();
        sfxGain.gain.value = 0.4;
        sfxGain.connect(musicEngine.masterGain);
        const speed = Math.min(gameSpeed, 2.0);
        char.jingleNotes.forEach((freq, i) => {
            const osc = ctx.createOscillator(), g = ctx.createGain();
            osc.type = 'square';
            osc.frequency.value = freq;
            const noteTime = time + i * (0.08 / speed);
            g.gain.setValueAtTime(0.35, noteTime);
            g.gain.exponentialRampToValueAtTime(0.01, noteTime + (0.12 / speed));
            osc.connect(g);
            g.connect(sfxGain);
            osc.start(noteTime);
            osc.stop(noteTime + (0.12 / speed));
        });
    }
};

const UI = {
    GREEN: 0x00ff88, CYAN: 0x00d4ff, YELLOW: 0xffd93d, RED: 0xff5c7a,
    PURPLE: 0xb06bff, DARK: 0x0b0d1c, PANEL: 0x151a33,

    hex(color) { return '#' + color.toString(16).padStart(6, '0'); },

    // Glasiges Panel mit Leuchtkante
    panel(scene, x, y, w, h, color = 0x00ff88, alpha = 0.10) {
        const c = scene.add.container(x, y);
        const glow = scene.add.image(0, 0, 'fx-glow')
            .setTint(color).setBlendMode(Phaser.BlendModes.ADD)
            .setDisplaySize(w * 1.25, h * 1.6).setAlpha(0.11);
        const g = scene.add.graphics();
        g.fillStyle(0x000000, 0.62); g.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
        g.fillStyle(color, alpha);   g.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
        g.lineStyle(2, color, 0.75); g.strokeRoundedRect(-w / 2, -h / 2, w, h, 18);
        // Glanzkante oben
        g.fillStyle(0xffffff, 0.07); g.fillRoundedRect(-w / 2 + 2, -h / 2 + 2, w - 4, h * 0.34, 16);
        c.add([glow, g]);
        return c;
    },

    // Knopf mit Leuchten, Druckgefühl und Klang
    button(scene, x, y, w, h, label, opts = {}) {
        const color = opts.color !== undefined ? opts.color : UI.GREEN;
        const fontSize = opts.fontSize || 20;
        const filled = opts.filled !== false;
        const c = scene.add.container(x, y);

        const glow = scene.add.image(0, 2, 'fx-glow')
            .setTint(color).setBlendMode(Phaser.BlendModes.ADD)
            .setDisplaySize(w * 1.3, h * 2.1).setAlpha(filled ? 0.25 : 0.12);
        const g = scene.add.graphics();

        const redraw = (state) => {
            g.clear();
            const lift = state === 'down' ? 1 : 5;
            g.fillStyle(0x000000, 0.55); g.fillRoundedRect(-w / 2, -h / 2 + lift, w, h, 13);
            if (filled) {
                g.fillStyle(color, state === 'over' ? 1 : 0.92);
                g.fillRoundedRect(-w / 2, -h / 2, w, h, 13);
                g.fillStyle(0xffffff, state === 'over' ? 0.3 : 0.18);
                g.fillRoundedRect(-w / 2, -h / 2, w, h / 2.3, 13);
            } else {
                g.fillStyle(color, state === 'over' ? 0.3 : 0.1);
                g.fillRoundedRect(-w / 2, -h / 2, w, h, 13);
            }
            g.lineStyle(2, filled ? 0xffffff : color, filled ? 0.85 : 1);
            g.strokeRoundedRect(-w / 2, -h / 2, w, h, 13);
            glow.setAlpha(state === 'over' ? (filled ? 0.42 : 0.26) : (filled ? 0.25 : 0.12));
        };
        redraw('idle');

        const txt = scene.add.text(0, 0, label, {
            font: `bold ${fontSize}px Orbitron`,
            fill: filled ? '#07101a' : UI.hex(color)
        }).setOrigin(0.5);
        if (!filled) txt.setShadow(0, 0, UI.hex(color), 8, false, true);

        c.add([glow, g, txt]);
        c.setSize(w, h);
        c.setInteractive(new Phaser.Geom.Rectangle(-w / 2, -h / 2, w, h), Phaser.Geom.Rectangle.Contains, { useHandCursor: true });

        c.on('pointerover', () => { redraw('over'); scene.tweens.add({ targets: c, scale: 1.06, duration: 130, ease: 'Back.easeOut' }); });
        c.on('pointerout',  () => { redraw('idle'); scene.tweens.add({ targets: c, scale: 1.0,  duration: 130, ease: 'Quad.easeOut' }); });
        c.on('pointerdown', () => { redraw('down'); musicEngine.initialize(); musicEngine.playSFX('click'); });
        c.on('pointerup',   () => {
            redraw('over');
            FX.pop(scene, c.x, c.y, color, 130);
            // Szenenwechsel erst im nächsten Tick, sonst bleibt der Zeigerstatus hängen
            if (opts.onClick) scene.time.delayedCall(0, () => opts.onClick());
        });
        return c;
    },

    // Leuchtende Überschrift
    header(scene, title, subtitle, color = UI.GREEN) {
        const t = scene.add.text(400, 48, title, { font: 'bold 36px Orbitron', fill: '#ffffff' }).setOrigin(0.5);
        t.setShadow(0, 0, UI.hex(color), 18, false, true);
        t.setStroke(UI.hex(color), 3);
        if (subtitle) scene.add.text(400, 84, subtitle, { font: '13px Orbitron', fill: '#8b93b8' }).setOrigin(0.5);
        return t;

        t.setShadow(0, 2, '#000000', 6);
        t.setScale(0.5);
        scene.tweens.add({ targets: t, scale: 1, duration: 180, ease: 'Back.easeOut' });
        scene.tweens.add({
            targets: t, y: y - 70, alpha: 0, duration: 950, delay: 160, ease: 'Quad.easeOut',
            onComplete: () => t.destroy()

        return t;

        c.add([glow, g, icon, name, rew]);
        scene.tweens.add({
            targets: c, x: 606, duration: 460, ease: 'Back.easeOut',
            onComplete: () => scene.time.delayedCall(2600, () =>
                scene.tweens.add({ targets: c, x: 1060, alpha: 0, duration: 340, onComplete: () => c.destroy() }))
        });
        return c;

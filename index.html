            { id: 'startscreen', name: '🏠 Startbild', x: 320 },
            { id: 'transition', name: '🎬 Übergang', x: 500 },
            { id: 'fuse', name: '🧨 Zündschnur', x: 675 }
        ];
        categories.forEach(cat => {
            const isActive = this.currentCategory === cat.id;
            UI.button(this, cat.x, 148, 168, 40, cat.name, {
                color: isActive ? UI.GREEN : UI.CYAN,
                filled: isActive, fontSize: 13,
                onClick: () => { if (!isActive) this.scene.restart({ category: cat.id }); }
            });
        });
    }
    drawItems() {
        this.itemsContainer.removeAll(true);
        const filtered = this.shopItems.filter(item => item.type === this.currentCategory);
        const cols = 3, cardW = 220, cardH = 118, startX = 60, startY = 196, gapX = 20, gapY = 16;

        filtered.forEach((item, idx) => {
            const col = idx % cols, row = Math.floor(idx / cols);
            const cx = startX + col * (cardW + gapX) + cardW / 2;
            const cy = startY + row * (cardH + gapY) + cardH / 2;
            const owned = playerData.ownsItem(item.id);
            const isActive = this.isItemActive(item);
            const affordable = playerData.coins >= item.price;

            const accent = owned ? (isActive ? UI.GREEN : UI.CYAN) : (affordable ? UI.YELLOW : 0x555b70);
            const g = this.add.graphics();
            const draw = (hover) => {
                g.clear();
                g.fillStyle(accent, hover ? 0.3 : (isActive ? 0.2 : 0.1));
                g.fillRoundedRect(cx - cardW / 2, cy - cardH / 2, cardW, cardH, 12);
                g.lineStyle(isActive ? 3 : 2, accent, owned ? 1 : 0.6);
                g.strokeRoundedRect(cx - cardW / 2, cy - cardH / 2, cardW, cardH, 12);
            };
            draw(false);
            this.itemsContainer.add(g);

            this.itemsContainer.add(this.add.text(cx - cardW / 2 + 34, cy - 12, item.preview, { font: '32px Arial' }).setOrigin(0.5));
            this.itemsContainer.add(this.add.text(cx - cardW / 2 + 62, cy - 30, item.name, { font: 'bold 14px Orbitron', fill: '#ffffff' }).setOrigin(0, 0.5));
            this.itemsContainer.add(this.add.text(cx - cardW / 2 + 62, cy - 8, item.desc, { font: '10px Orbitron', fill: '#8b93aa' }).setOrigin(0, 0.5));

            let statusText, statusColor;
            if (owned) {
                // Boni sind nach dem Kauf immer aktiv und brauchen keine Umschaltung
                statusText = item.type === 'perk' ? '✓ AKTIV' : (isActive ? '✓ AUSGEWÄHLT' : 'AUSWÄHLEN');
                statusColor = (item.type === 'perk' || isActive) ? '#00ff88' : '#00d4ff';
            } else {
                statusText = '💰 ' + item.price;
                statusColor = affordable ? '#ffd93d' : '#ff6b6b';
            }
            this.itemsContainer.add(this.add.text(cx, cy + 36, statusText, { font: 'bold 14px Orbitron', fill: statusColor }).setOrigin(0.5));

            const hit = this.add.rectangle(cx, cy, cardW, cardH, 0xffffff, 0.001).setInteractive({ useHandCursor: true });
            this.itemsContainer.add(hit);
            hit.on('pointerover', () => draw(true));
            hit.on('pointerout', () => draw(false));
            hit.on('pointerdown', () => this.handleItemClick(item));
        });

        if (filtered.length === 0) {
            this.itemsContainer.add(this.add.text(400, 300, 'Keine Artikel', { font: '16px Orbitron', fill: '#6c7590' }).setOrigin(0.5));
        }
    }
    isItemActive(item) {
        if (item.type === 'startscreen') return playerData.startScreenStyle === item.value;
        if (item.type === 'transition') return playerData.transitionColor === item.value;
        if (item.type === 'fuse') return playerData.fuseStyle === item.value;
        if (item.type === 'perk') return playerData.ownsItem(item.id);
        return false;
    }
    handleItemClick(item) {
        if (playerData.ownsItem(item.id)) {
            if (item.type === 'perk') {
                UI.floatText(this, 400, 300, 'Bonus ist dauerhaft aktiv', '#00ff88', 18);
                return;
            }
            if (item.type === 'startscreen') playerData.startScreenStyle = item.value;
            else if (item.type === 'transition') playerData.transitionColor = item.value;
            else if (item.type === 'fuse') playerData.fuseStyle = item.value;
            playerData.saveData();
            musicEngine.playSFX('click');
            this.scene.restart({ category: this.currentCategory });
        } else if (playerData.spendCoins(item.price)) {
            playerData.buyItem(item.id);
            // Gekaufte Optik direkt aktivieren, das erspart einen zweiten Klick
            if (item.type === 'startscreen') playerData.startScreenStyle = item.value;
            else if (item.type === 'transition') playerData.transitionColor = item.value;
            else if (item.type === 'fuse') playerData.fuseStyle = item.value;
            playerData.saveData();
            musicEngine.playSFX('win');
            Effects.confetti(this, 24);
            this.scene.restart({ category: this.currentCategory });
        } else {
            musicEngine.playSFX('lose');
            this.cameras.main.shake(120, 0.008);
            UI.floatText(this, 400, 300, 'Nicht genug Münzen!', '#ff6b6b', 22);
        }
    }
}

class GameScene extends Phaser.Scene {
    constructor() { super({ key: 'GameScene' }); }
    init(data) {
        this.mode = GameModes.get(data && data.mode);
        this.soloCharacter = (data && data.soloCharacter) || null;
    }
    create() {
        this.cameras.main.setBackgroundColor('#0a0a1a');
        this.score = 0;
        this.gameSpeed = this.mode.startSpeed;
        this.gamesPlayed = 0;
        this.winStreak = 0;
        this.lossStreak = 0;
        this.combo = 0;
        this.bestCombo = 0;
        this.coinsThisRun = 0;
        this.bossesBeaten = 0;
        this.secondChanceUsed = false;
        this.isPaused = false;
        this.lives = this.mode.lives + (Upgrades.hasExtraLife() ? 1 : 0);
        this.maxLives = this.lives + 2;

        playerData.runsPlayed++;
        playerData.saveData();

        // Charakter festlegen: Solo-Modus oder normale Rotation
        CharacterManager.resetRound();
        if (this.soloCharacter) CharacterManager.setCharacter(this.soloCharacter);

        this.buildHUD();

        this.input.keyboard.on('keydown-ESC', () => this.openPause());
        this.input.keyboard.on('keydown-P', () => this.openPause());
        musicEngine.initialize();
        this.showTransition();
    }

    // ---------- HUD ----------
    buildHUD() {
        const hud = this.add.graphics().setDepth(40);
        hud.fillStyle(0x000000, 0.45);
        hud.fillRoundedRect(8, 8, 784, 62, 12);
        hud.lineStyle(2, 0x00ff88, 0.25);
        hud.strokeRoundedRect(8, 8, 784, 62, 12);

        this.scoreText = this.add.text(24, 18, 'SCORE 0', { font: 'bold 24px Orbitron', fill: '#00ff88' }).setDepth(41);
        this.coinsText = this.add.text(24, 46, '💰 ' + playerData.coins, { font: '14px Orbitron', fill: '#ffd93d' }).setDepth(41);

        this.speedText = this.add.text(400, 20, 'x' + this.gameSpeed.toFixed(1), { font: 'bold 20px Orbitron', fill: '#00d4ff' }).setOrigin(0.5, 0).setDepth(41);
        this.comboText = this.add.text(400, 46, '', { font: 'bold 14px Orbitron', fill: '#ffd93d' }).setOrigin(0.5, 0).setDepth(41);

        this.livesText = this.add.text(776, 18, '', { font: '22px Arial' }).setOrigin(1, 0).setDepth(41);
        const char = CharacterManager.getCurrentCharacter();
        this.charText = this.add.text(776, 48, char.name, {
            font: 'bold 14px Orbitron', fill: UI.hex(char.color)
        }).setOrigin(1, 0).setDepth(41);

        this.modeText = this.add.text(400, 78, this.mode.icon + ' ' + this.mode.name.toUpperCase(),
            { font: '10px Orbitron', fill: '#4d5468' }).setOrigin(0.5, 0).setDepth(41);

        // Punktereihe zeigt, wie viele Spiele noch bis zum Boss fehlen
        this.bossDots = this.add.graphics().setDepth(41);

        this.refreshLives();
        this.refreshBossDots();
    }

    refreshBossDots() {
        this.bossDots.clear();
        const total = this.mode.bossEvery;
        if (total <= 1 || total > 14) return;
        const done = this.gamesPlayed % total;
        const gap = 13;
        const startX = 400 - ((total - 1) * gap) / 2;
        for (let i = 0; i < total; i++) {
            const filled = i < done;
            this.bossDots.fillStyle(filled ? 0xffd93d : 0x39405c, filled ? 1 : 0.8);
            this.bossDots.fillCircle(startX + i * gap, 66, filled ? 4.5 : 3);
        }
    }

    refreshLives() {
        this.livesText.setText('❤️'.repeat(Math.max(0, this.lives)) || '💀');
    }

    // Kurzer Reaktions-Moment nach jedem Minispiel: der Charakter jubelt oder ärgert sich.
    // Das ist der Takt, der zwischen zwei Minispielen für das typische Gefühl sorgt.
    showReaction(won) {
        const char = CharacterManager.getCurrentCharacter();
        const bg = this.add.rectangle(400, 300, 800, 600, won ? 0x0d2a1a : 0x2a0d0d, 0.7).setDepth(70);

        let sprite;
        if (char.image === 'dude' && this.textures.exists('dude')) {
            sprite = this.add.sprite(400, 330, 'dude', 4).setScale(char.scale * 1.7).setDepth(71);
        } else if (this.textures.exists(char.image)) {
            sprite = this.add.image(400, 330, char.image).setScale(char.scale * 1.4).setDepth(71);
        } else {
            sprite = Zobel.draw(this, 400, 330, 0.8, char.color).setDepth(71);
        }

        const word = this.add.text(400, 195, won ? Zobel.getWin() : Zobel.getLose(), {
            font: 'bold 56px Orbitron', fill: won ? '#00ff88' : '#ff3355',
            stroke: '#000000', strokeThickness: 8
        }).setOrigin(0.5).setDepth(72).setScale(0.4);
        this.tweens.add({ targets: word, scale: 1, duration: 180, ease: 'Back.easeOut' });

        if (won) {
            // Freudensprung
            this.tweens.add({ targets: sprite, y: 285, duration: 150, yoyo: true, repeat: 1, ease: 'Quad.easeOut' });
            this.tweens.add({ targets: sprite, angle: { from: -8, to: 8 }, duration: 110, yoyo: true, repeat: 3 });
            Effects.burst(this, 400, 320, char.color, 14, 150);
        } else {
            // Zittern und in sich zusammensacken
            this.tweens.add({ targets: sprite, x: { from: 392, to: 408 }, duration: 45, yoyo: true, repeat: 6 });
            this.tweens.add({ targets: sprite, alpha: 0.55, duration: 400 });
        }

        const objs = [bg, sprite, word];
        this.time.delayedCall(430, () => {
            this.tweens.add({
                targets: objs, alpha: 0, duration: 140,
                onComplete: () => objs.forEach(o => o.destroy())
            });
        });
    }

    // Ein Herz zerspringt sichtbar, wenn ein Leben verloren geht
    showHeartBreak() {
        musicEngine.playSFX('heartbreak');
        const x = 762 - this.lives * 24;
        const heart = this.add.text(x, 22, '💔', { font: '22px Arial' }).setDepth(120);
        this.tweens.add({
            targets: heart, y: 120, alpha: 0, angle: 140, scale: 1.6,
            duration: 650, ease: 'Quad.easeIn', onComplete: () => heart.destroy()
        });
    }

    updateHUD() {
        this.scoreText.setText('SCORE ' + this.score);
        this.coinsText.setText('💰 ' + playerData.coins);
        this.speedText.setText('x' + this.gameSpeed.toFixed(1));
        this.comboText.setText(this.combo >= 2 ? 'COMBO x' + this.combo : '');
        this.refreshLives();
        this.refreshBossDots();
    }

    openPause() {
        if (this.isPaused) return;
        // Während ein Minispiel läuft, kümmert sich dieses um die Pause
        const running = this.scene.manager.getScenes(true).some(s => s !== this && s.parentScene === this);
        if (running) return;
        this.isPaused = true;
        musicEngine.pauseMusic();
        this.scene.launch('PauseScene', { resumeKeys: ['GameScene'] });
        this.scene.pause();
    }

    // ---------- Ablauf ----------
    isBossRound() {
        if (this.mode.id === 'bossrush') return true;
        return this.gamesPlayed > 0 && this.gamesPlayed % this.mode.bossEvery === 0;
    }

    showTransition() {
        if (this.lives <= 0) { this.gameOver(); return; }
        if (this.isBossRound()) { this.showBossTransition(); return; }

        musicEngine.stopMusic();
        const transitionDuration = Math.max(560, 1100 / this.gameSpeed);
        const char = CharacterManager.getCurrentCharacter();
        const bg = this.add.rectangle(400, 300, 800, 600, playerData.transitionColor, 0.95).setDepth(100);

        // Bewegte Streifen im Hintergrund für mehr Dynamik
        const stripes = [];
        for (let i = 0; i < 6; i++) {
            const s = this.add.rectangle(-200, 90 + i * 90, 260, 12, char.color, 0.25).setDepth(100);
            this.tweens.add({ targets: s, x: 1000, duration: transitionDuration * 0.9, delay: i * 60, ease: 'Quad.easeIn' });
            stripes.push(s);
        }

        const roundNum = this.gamesPlayed + 1;
        const roundText = this.add.text(400, 100, roundNum.toString(), {
            font: 'bold 110px Orbitron', fill: UI.hex(char.color), stroke: '#ffffff', strokeThickness: 4
        }).setOrigin(0.5).setDepth(101);

        const charName = this.add.text(400, 176, char.name.toUpperCase(), {
            font: 'bold 26px Orbitron', fill: '#ffffff'
        }).setOrigin(0.5).setDepth(101);

        let charSprite;
        if (char.image === 'dude' && this.textures.exists('dude')) {
            charSprite = this.add.sprite(400, 380, 'dude', 4).setScale(char.scale * 2).setDepth(101);
        } else if (this.textures.exists(char.image)) {
            charSprite = this.add.image(400, 380, char.image).setScale(char.scale * 1.5).setDepth(101);
        } else {
            charSprite = Zobel.draw(this, 400, 380, 0.8, char.color);
            charSprite.setDepth(101);
        }

        this.playTransitionAnimation(charSprite, char, transitionDuration);
        CharacterManager.playJingle(this.gameSpeed);

        this.tweens.add({
            targets: roundText, scaleX: 1.3, scaleY: 1.3,
            duration: transitionDuration / 2, yoyo: true, ease: 'Bounce.easeOut'
        });

        for (let i = 0; i < 8; i++) {
            const star = this.add.text(
                Phaser.Math.Between(50, 750), Phaser.Math.Between(50, 550),
                '★', { font: 'bold 24px Arial', fill: UI.hex(char.color) }
            ).setOrigin(0.5).setDepth(100).setAlpha(0);
            this.tweens.add({
                targets: star, alpha: 1, scale: { from: 0.5, to: 1.5 },
                duration: 300, delay: i * 100, yoyo: true, onComplete: () => star.destroy()
            });
        }

        this.time.delayedCall(transitionDuration, () => {
            bg.destroy(); roundText.destroy(); charName.destroy(); charSprite.destroy();
            stripes.forEach(s => s.destroy());
            this.startNextGame();
        });
    }

    playTransitionAnimation(charSprite, char, transitionDuration) {
        const animationType = Phaser.Math.Between(0, 5);
        const animSpeed = Math.max(150, 300 / this.gameSpeed);
        switch (animationType) {
            case 0:
                this.tweens.add({
                    targets: charSprite, x: { from: 150, to: 650 }, y: { from: 380, to: 320 },
                    duration: animSpeed, ease: 'Quad.easeOut', yoyo: true,
                    repeat: Math.floor(transitionDuration / (animSpeed * 2))
                });
                if (char.image === 'dude' && charSprite.play) {
                    charSprite.play('dude_right');
                    this.time.addEvent({ delay: animSpeed, callback: () => charSprite.play && charSprite.play('dude_left'), loop: true });
                }
                break;
            case 1:
                this.tweens.add({
                    targets: charSprite, y: { from: 380, to: 280 },
                    duration: animSpeed, ease: 'Bounce.easeOut', yoyo: true,
                    repeat: Math.floor(transitionDuration / (animSpeed * 2))
                });
                if (char.image !== 'dude') this.tweens.add({ targets: charSprite, angle: 360, duration: animSpeed * 2, repeat: -1 });
                break;
            case 2:
                this.tweens.add({
                    targets: charSprite,
                    scaleX: { from: char.scale * 1.2, to: char.scale * 1.8 },
                    scaleY: { from: char.scale * 1.8, to: char.scale * 1.2 },
                    duration: animSpeed / 2, yoyo: true, repeat: -1
                });
                this.tweens.add({ targets: charSprite, x: { from: 380, to: 420 }, duration: animSpeed / 3, yoyo: true, repeat: -1 });
                break;
            case 3:
                charSprite.x = -50;
                this.tweens.add({ targets: charSprite, x: { from: -50, to: 850 }, duration: transitionDuration * 0.8, ease: 'Linear' });
                if (char.image === 'dude' && charSprite.play) charSprite.play('dude_right');
                this.tweens.add({ targets: charSprite, y: { from: 380, to: 350 }, duration: 100, yoyo: true, repeat: -1 });
                break;
            case 4:
                this.tweens.add({
                    targets: charSprite, x: { from: 300, to: 500 },
                    duration: animSpeed, ease: 'Sine.easeInOut', yoyo: true, repeat: -1
                });
                this.tweens.add({ targets: charSprite, scaleY: { from: char.scale * 1.2, to: char.scale * 1.8 }, duration: animSpeed / 2, yoyo: true, repeat: -1 });
                break;
            case 5:
                this.tweens.add({
                    targets: charSprite,
                    scaleX: { from: char.scale, to: char.scale * 2 }, scaleY: { from: char.scale, to: char.scale * 2 },
                    duration: animSpeed, ease: 'Bounce.easeOut', yoyo: true, repeat: -1
                });
                break;
        }
    }

    showBossTransition() {
        musicEngine.stopMusic();
        const char = CharacterManager.getCurrentCharacter();
        const boss = CharacterManager.getBoss();
        const bg = this.add.rectangle(400, 300, 800, 600, 0x1a0000, 0.95).setDepth(100);

        const warningText = this.add.text(400, 60, '⚠ WARNING ⚠', { font: 'bold 36px Orbitron', fill: '#ffff00' }).setOrigin(0.5).setDepth(101);
        this.tweens.add({ targets: warningText, alpha: 0, duration: 200, yoyo: true, repeat: -1 });

        const bossText = this.add.text(400, 180, boss.name, {
            font: 'bold 66px Orbitron', fill: '#ff0000', stroke: '#ffff00', strokeThickness: 6
        }).setOrigin(0.5).setDepth(101);

        const charNameText = this.add.text(400, 120, char.name + ' vs', { font: 'bold 24px Orbitron', fill: '#ffffff' }).setOrigin(0.5).setDepth(101);

        let charSprite;
        if (char.image === 'dude' && this.textures.exists('dude')) {
            charSprite = this.add.sprite(400, 400, 'dude', 4).setScale(char.scale * 2).setDepth(101);
        } else if (this.textures.exists(char.image)) {
            charSprite = this.add.image(400, 400, char.image).setScale(char.scale * 1.5).setDepth(101);
        } else {
            charSprite = Zobel.draw(this, 400, 400, 0.9, 0xff6666);
            charSprite.setDepth(101);
        }

        musicEngine.playBossJingle();

        let zoomCount = 0;
        const zoomIn = () => {
            this.tweens.add({
                targets: this.cameras.main, zoom: 1.3, duration: 200, ease: 'Quad.easeIn',
                onComplete: () => {
                    this.tweens.add({
                        targets: this.cameras.main, zoom: 1.0, duration: 200, ease: 'Quad.easeOut',
                        onComplete: () => { zoomCount++; if (zoomCount < 3) this.time.delayedCall(100, zoomIn); }
                    });
                }
            });
        };
        zoomIn();

        this.tweens.add({ targets: charSprite, x: { from: 390, to: 410 }, duration: 50, yoyo: true, repeat: -1 });
        this.tweens.add({ targets: bossText, scaleX: 1.4, scaleY: 1.4, duration: 300, yoyo: true, repeat: 3, ease: 'Bounce.easeInOut' });

        this.time.delayedCall(1800, () => {
            bg.destroy(); bossText.destroy(); warningText.destroy(); charNameText.destroy(); charSprite.destroy();
            this.cameras.main.setZoom(1);
            this.startBoss();
        });
    }

    startNextGame() {
        const char = CharacterManager.getCurrentCharacter();
        let game;
        if (this.lossStreak >= 3) {
            // Nach mehreren Niederlagen bewusst ein einfacheres Spiel wählen
            const easyKeys = ['ClickTheButton', 'MashTheKey', 'TargetClick', 'FastClicker', 'ReactionTest', 'WhackAMole', 'DudeSort'];
            const easyGames = char.games.filter(g => easyKeys.includes(g.key));
            game = easyGames.length ? Phaser.Utils.Array.GetRandom(easyGames) : CharacterManager.getRandomGame();
            this.lossStreak = 0;
        } else {
            game = CharacterManager.getRandomGame();
            // Direkte Wiederholung des letzten Spiels vermeiden
            if (this.lastGameKey && char.games.length > 2) {
                let guard = 0;
                while (game.key === this.lastGameKey && guard++ < 6) game = CharacterManager.getRandomGame();
            }
        }
        this.lastGameKey = game.key;
        this.currentGame = game;

        // Kein eigener Ansage-Bildschirm mehr: Das Minispiel startet sofort und der
        // Befehl wird darüber eingeblendet - genau wie im großen Vorbild.
        musicEngine.setBPM(140 + (this.gameSpeed - 1) * 50);
        musicEngine.startMusic(game.music);
        this.scene.launch(game.key, {
            parentScene: this,
            gameSpeed: this.gameSpeed,
            duration: game.duration,
            command: game.name,
            keysHint: game.keys
        });
    }

    startBoss() {
        const boss = CharacterManager.getBoss();
        this.currentGame = boss;
        musicEngine.setBPM(160 + (this.gameSpeed - 1) * 40);
        musicEngine.startMusic('boss');
        this.scene.launch(boss.key, {
            parentScene: this, gameSpeed: this.gameSpeed, command: boss.name
        });
    }

    // ---------- Ergebnisse ----------
    microgameWon(gameKey) {
        musicEngine.stopMusic();
        this.score++; this.gamesPlayed++; this.winStreak++; this.lossStreak = 0;
        this.combo++;
        if (this.combo > this.bestCombo) this.bestCombo = this.combo;

        // Münzen steigen mit der Combo - Belohnung für Serien
        const reward = Math.round((8 + Math.min(this.combo, 10) * 2) * Upgrades.coinFactor() * (this.mode.id === 'hardcore' ? 2 : 1));
        this.coinsThisRun += reward;
        playerData.trackGame(gameKey, true);
        playerData.addCoins(reward);
        this.updateHUD();

        this.showReaction(true);
        UI.floatText(this, 640, 170, '+' + reward + ' 💰', '#ffd93d', 18);
        if (this.combo >= 3) UI.floatText(this, 400, 430, 'COMBO x' + this.combo + '!', '#ffd93d', 26);

        let speedUpDelay = 0;
        if (this.winStreak % 5 === 0) {
            this.gameSpeed += this.mode.speedStep;
            if (this.gameSpeed > playerData.bestSpeed) { playerData.bestSpeed = this.gameSpeed; playerData.saveData(); }
            this.updateHUD();
            this.showSpeedUp();
            speedUpDelay = 1000;
        }
        this.time.delayedCall(560 + speedUpDelay, () => this.showTransition());
    }

    // Tempo-Erhöhung als kleine Show: Blitz, Speedlines und der Charakter rast durchs Bild
    showSpeedUp() {
        musicEngine.playSFX('speedup');
        const char = CharacterManager.getCurrentCharacter();
        const overlay = this.add.rectangle(400, 300, 800, 600, char.color, 0.35).setDepth(58);
        this.tweens.add({ targets: overlay, alpha: 0, duration: 700, onComplete: () => overlay.destroy() });

        // Waagerechte Speedlines
        for (let i = 0; i < 14; i++) {
            const y = Phaser.Math.Between(90, 540);
            const line = this.add.rectangle(-200, y, Phaser.Math.Between(120, 320), Phaser.Math.Between(2, 6), 0xffffff, 0.7).setDepth(59);
            this.tweens.add({
                targets: line, x: 1100, duration: Phaser.Math.Between(280, 520),
                delay: i * 22, ease: 'Quad.easeIn', onComplete: () => line.destroy()
            });
        }

        const speedText = this.add.text(400, 292, 'SPEED UP!', {
            font: 'bold 62px Orbitron', fill: '#ffffff', stroke: '#ff3355', strokeThickness: 8
        }).setOrigin(0.5).setDepth(61).setScale(0.2);
        const comment = this.add.text(400, 356, Zobel.getSpeedUp(), {
            font: 'bold 26px Orbitron', fill: '#ffd93d', stroke: '#000000', strokeThickness: 4
        }).setOrigin(0.5).setDepth(61).setAlpha(0);

        this.tweens.add({ targets: speedText, scale: 1, duration: 260, ease: 'Back.easeOut' });
        this.tweens.add({ targets: comment, alpha: 1, duration: 200, delay: 180 });
        this.tweens.add({ targets: speedText, angle: { from: -3, to: 3 }, duration: 90, yoyo: true, repeat: 4 });
        this.cameras.main.shake(220, 0.008);
        Effects.burst(this, 400, 292, 0xffd93d, 20, 220);

        // Charakter flitzt durchs Bild
        let dash;
        if (char.image === 'dude' && this.textures.exists('dude')) {
            dash = this.add.sprite(-80, 460, 'dude', 4).setScale(char.scale * 1.6).setDepth(60);
            if (dash.play) dash.play('dude_right');
        } else if (this.textures.exists(char.image)) {
            dash = this.add.image(-80, 460, char.image).setScale(char.scale * 1.2).setDepth(60);
        } else {
            dash = Zobel.draw(this, -80, 460, 0.6, char.color).setDepth(60);
        }
        this.tweens.add({ targets: dash, x: 900, duration: 700, ease: 'Quad.easeIn', onComplete: () => dash.destroy() });
        this.tweens.add({ targets: dash, y: 440, duration: 90, yoyo: true, repeat: 7 });

        this.time.delayedCall(900, () => {
            this.tweens.add({
                targets: [speedText, comment], alpha: 0, y: '-=60', duration: 200,
                onComplete: () => { speedText.destroy(); comment.destroy(); }
            });
        });
    }

    microgameLost(gameKey) {
        musicEngine.stopMusic();
        this.lives--; this.gamesPlayed++; this.winStreak = 0; this.lossStreak++;
        this.combo = 0;
        playerData.trackGame(gameKey, false);
        this.showHeartBreak();
        this.updateHUD();
        this.showReaction(false);
        this.cameras.main.shake(160, 0.006);

        if (this.lives > 0) {
            this.time.delayedCall(620, () => this.showTransition());
        } else if (Upgrades.hasSecondChance() && !this.secondChanceUsed) {
            // Einmal pro Runde geht es mit einem Leben weiter
            this.secondChanceUsed = true;
            this.lives = 1;
            this.updateHUD();
            const t = this.add.text(400, 300, '✨ ZWEITE CHANCE! ✨', {
                font: 'bold 40px Orbitron', fill: '#ffd93d'
            }).setOrigin(0.5).setDepth(120);
            Effects.confetti(this, 30);
            musicEngine.playSFX('win');
            this.tweens.add({ targets: t, scale: 1.2, duration: 400, yoyo: true, repeat: 1, onComplete: () => t.destroy() });
            this.time.delayedCall(1600, () => this.showTransition());
        } else {
            this.time.delayedCall(500, () => this.gameOver());
        }
    }

    bossWon() {
        musicEngine.stopMusic();
        this.score += 3; this.gamesPlayed++; this.bossesBeaten++;
        this.combo++;
        if (this.combo > this.bestCombo) this.bestCombo = this.combo;
        this.lives = Math.min(this.lives + 1, this.maxLives);
        this.gameSpeed += 0.1;

        const bossReward = Math.round(60 * Upgrades.coinFactor());
        this.coinsThisRun += bossReward;
        playerData.addCoins(bossReward);
        playerData.bossWins++;
        playerData.saveData();
        this.updateHUD();

        const oldChar = CharacterManager.getCurrentCharacter();
        const bossWinText = this.add.text(400, 240, 'BOSS BESIEGT!', {
            font: 'bold 56px Orbitron', fill: '#ffd700', stroke: '#ff6600', strokeThickness: 4
        }).setOrigin(0.5).setDepth(120);
        const bonusText = this.add.text(400, 320, '+1 LEBEN   +' + bossReward + ' 💰', {
            font: 'bold 28px Orbitron', fill: '#00ff88'
        }).setOrigin(0.5).setDepth(120);

        musicEngine.playSFX('win');
        Effects.confetti(this, 60);
        this.tweens.add({ targets: [bossWinText, bonusText], scaleX: 1.2, scaleY: 1.2, duration: 300, yoyo: true, repeat: 2 });

        this.time.delayedCall(1800, () => {
            bossWinText.destroy(); bonusText.destroy();
            if (this.soloCharacter) {
                // Im Solo-Modus bleibt der gewählte Charakter erhalten
                this.showTransition();
                return;
            }
            const newChar = CharacterManager.nextCharacter();
            this.charText.setText(newChar.name);
            this.charText.setColor(UI.hex(newChar.color));
            this.showCharacterSwitch(oldChar, newChar);
        });
    }

    showCharacterSwitch(oldChar, newChar) {
        const bg = this.add.rectangle(400, 300, 800, 600, 0x000033, 0.95).setDepth(100);
        const titleText = this.add.text(400, 80, 'CHARAKTER WECHSEL!', { font: 'bold 34px Orbitron', fill: '#00ff88' }).setOrigin(0.5).setDepth(101);

        const makeSprite = (char, x, extraScale) => {
            if (char.image === 'dude' && this.textures.exists('dude')) return this.add.sprite(x, 300, 'dude', 4).setScale(char.scale * 1.5).setDepth(101);
            if (this.textures.exists(char.image)) return this.add.image(x, 300, char.image).setScale(char.scale * extraScale).setDepth(101);
            const s = Zobel.draw(this, x, 300, 0.6, char.color); s.setDepth(101); return s;
        };

        const oldSprite = makeSprite(oldChar, 200, 1);
        oldSprite.setAlpha(0.55);
        const oldNameText = this.add.text(200, 400, oldChar.name, { font: 'bold 20px Orbitron', fill: '#888888' }).setOrigin(0.5).setDepth(101);

        const arrow = this.add.text(400, 300, '→', { font: 'bold 80px Orbitron', fill: '#ffff00' }).setOrigin(0.5).setDepth(101);
        this.tweens.add({ targets: arrow, x: { from: 380, to: 420 }, duration: 300, yoyo: true, repeat: -1 });

        const newSprite = makeSprite(newChar, 600, 1);
        if (newSprite.play) newSprite.play('dude_idle');
        const newNameText = this.add.text(600, 400, newChar.name + '!', {
            font: 'bold 24px Orbitron', fill: UI.hex(newChar.color)
        }).setOrigin(0.5).setDepth(101);

        this.tweens.add({
            targets: newSprite,
            scaleX: newSprite.scaleX * 1.35, scaleY: newSprite.scaleY * 1.35,
            duration: 400, yoyo: true, repeat: 2, ease: 'Bounce.easeOut'
        });
        Effects.burst(this, 600, 300, newChar.color, 20, 160);
        CharacterManager.playJingle(1.0);

        this.time.delayedCall(2500, () => {
            bg.destroy(); titleText.destroy(); oldSprite.destroy(); oldNameText.destroy();
            arrow.destroy(); newSprite.destroy(); newNameText.destroy();
            this.showTransition();
        });
    }

    gameOver() {
        musicEngine.stopMusic();
        if (this.bestCombo > playerData.bestCombo) playerData.bestCombo = this.bestCombo;
        playerData.updateHighScore(this.score);
        playerData.updateModeHighScore(this.mode.id, this.score);
        playerData.saveData();
        this.scene.start('GameOverScene', {
            score: this.score,
            mode: this.mode.id,
            soloCharacter: this.soloCharacter,
            coins: this.coinsThisRun,
            bestCombo: this.bestCombo,
            bosses: this.bossesBeaten,
            rounds: this.gamesPlayed,
            speed: this.gameSpeed
        });
    }

    exitToMenu() { musicEngine.stopMusic(); this.scene.stop(); this.scene.start('StartScreen'); }
}

class GameOverScene extends Phaser.Scene {
    constructor() { super({ key: 'GameOverScene' }); }
    init(data) {
        this.finalScore = data.score || 0;
        this.mode = data.mode || 'classic';
        this.soloCharacter = data.soloCharacter || null;
        this.coinsEarned = data.coins || 0;
        this.bestCombo = data.bestCombo || 0;
        this.bosses = data.bosses || 0;
        this.rounds = data.rounds || 0;
        this.finalSpeed = data.speed || 1;
    }
    create() {
        this.cameras.main.setBackgroundColor('#08080f');
        UI.starfield(this, 40, UI.RED);

        const isRecord = this.finalScore > 0 && this.finalScore >= (playerData.modeHighScores[this.mode] || 0);

        const title = this.add.text(400, 92, 'GAME OVER', { font: 'bold 58px Orbitron', fill: '#ff3355' }).setOrigin(0.5);
        title.setShadow(0, 0, '#ff3355', 18, false, true);
        this.tweens.add({ targets: title, scaleX: 1.03, scaleY: 1.03, duration: 900, yoyo: true, repeat: -1 });

        if (isRecord) {
            const rec = this.add.text(400, 140, '🏆 NEUER REKORD! 🏆', { font: 'bold 22px Orbitron', fill: '#ffd93d' }).setOrigin(0.5);
            this.tweens.add({ targets: rec, alpha: 0.4, duration: 500, yoyo: true, repeat: -1 });
            Effects.confetti(this, 60);
            musicEngine.playSFX('win');
        }

        // Ergebnis-Übersicht
        UI.panel(this, 400, 268, 520, 190, isRecord ? UI.YELLOW : UI.RED, 0.08);
        this.add.text(400, 196, 'SCORE ' + this.finalScore, { font: 'bold 42px Orbitron', fill: '#00ff88' }).setOrigin(0.5);

        const rows = [
            ['Runden gespielt', this.rounds],
            ['Beste Combo', 'x' + this.bestCombo],
            ['Bosse besiegt', this.bosses],
            ['Münzen verdient', this.coinsEarned + ' 💰'],
            ['Endtempo', 'x' + this.finalSpeed.toFixed(1)]
        ];
        rows.forEach((r, i) => {
            const y = 240 + i * 24;
            this.add.text(190, y, r[0], { font: '13px Orbitron', fill: '#8b93aa' }).setOrigin(0, 0.5);
            this.add.text(610, y, String(r[1]), { font: 'bold 13px Orbitron', fill: '#ffffff' }).setOrigin(1, 0.5);
        });

        this.add.text(400, 378, 'Rekord in diesem Modus: ' + (playerData.modeHighScores[this.mode] || 0) +
            '   •   Gesamt-Highscore: ' + playerData.highScore,
            { font: '12px Orbitron', fill: '#6c7590' }).setOrigin(0.5);

        // Neu freigeschaltete Erfolge als kompakte Zeile (statt überlappender Einblendungen)
        const unlocked = Achievements.checkAll();
        if (unlocked.length > 0) this.showUnlockedStrip(unlocked);

        UI.button(this, 220, 448, 210, 52, '↻ NOCHMAL', {
            fontSize: 18,
            onClick: () => this.scene.start('GameScene', { mode: this.mode, soloCharacter: this.soloCharacter })
        });
        UI.button(this, 580, 448, 210, 52, '⚙ MODUS', {
            color: UI.CYAN, fontSize: 18,
            onClick: () => this.scene.start('ModeSelectScene', { mode: this.mode, soloCharacter: this.soloCharacter })
        });
        UI.button(this, 220, 512, 210, 46, 'ALBUM', {
            color: UI.PURPLE, filled: false, fontSize: 16, onClick: () => this.scene.start('AlbumScene')
        });
        UI.button(this, 580, 512, 210, 46, 'SHOP', {
            color: UI.YELLOW, filled: false, fontSize: 16, onClick: () => this.scene.start('ShopScene')
        });
        UI.button(this, 400, 566, 180, 38, '← MENÜ', {
            color: UI.RED, filled: false, fontSize: 14, onClick: () => this.scene.start('StartScreen')
        });

        this.input.keyboard.on('keydown-ESC', () => this.scene.start('StartScreen'));
        this.input.keyboard.on('keydown-ENTER', () => this.scene.start('GameScene', { mode: this.mode, soloCharacter: this.soloCharacter }));
    }

    // Zeigt die in diesem Lauf freigeschalteten Erfolge in einer Zeile
    showUnlockedStrip(unlocked) {
        const shown = unlocked.slice(0, 3);
        const rewardSum = unlocked.reduce((sum, a) => sum + a.reward, 0);
        let label = shown.map(a => a.icon + ' ' + a.name).join('   •   ');
        if (unlocked.length > shown.length) label += '   +' + (unlocked.length - shown.length) + ' weitere';

        const strip = this.add.container(400, 406).setAlpha(0);
        const g = this.add.graphics();
        g.fillStyle(0xffd93d, 0.14); g.fillRoundedRect(-330, -17, 660, 34, 9);
        g.lineStyle(2, 0xffd93d, 0.8); g.strokeRoundedRect(-330, -17, 660, 34, 9);
        strip.add(g);
        strip.add(this.add.text(-314, 0, 'NEU', { font: 'bold 11px Orbitron', fill: '#ffd93d' }).setOrigin(0, 0.5));
        strip.add(this.add.text(-276, 0, label, { font: '11px Orbitron', fill: '#ffffff' }).setOrigin(0, 0.5));
        strip.add(this.add.text(314, 0, '+' + rewardSum + ' 💰', { font: 'bold 11px Orbitron', fill: '#00ff88' }).setOrigin(1, 0.5));

        this.tweens.add({ targets: strip, alpha: 1, y: 400, duration: 400, delay: 500, ease: 'Back.easeOut' });
        this.time.delayedCall(600, () => musicEngine.playSFX('win'));
    }
}

// CONFIG
const config = {
    type: Phaser.AUTO,
    parent: 'game-shell',
    width: 800, height: 600,
    backgroundColor: '#0a0a1a',
    // Canvas passt sich der Fenstergröße an, bleibt aber im 4:3-Format
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: 800, height: 600 },
    // Feste Simulationsrate: sonst laufen alle Spiele auf 120-Hz-Displays doppelt so schnell
    fps: { target: 60, forceSetTimeOut: true },
    render: { antialias: true, roundPixels: false },
    physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
    scene: [BootScene, StartScreen, ModeSelectScene, GameScene, GameOverScene, AlbumScene, ShopScene, AchievementsScene, PauseScene, ClickTheButton, DodgeTheBall, MashTheKey, StopTheBar, CatchTheGem, DragToTarget, TypeTheWord, ConnectTheLovers, PumpTheBalloon, Safecracker, MatchTheShape, HitTheTarget, TargetClick, MathQuiz, MemoryClick, ColorMatch, DontPress, StopWatch, SpotTheOdd, BalanceStick, FastClicker, ZobelFrogger, ZobelJump, ZobelCatch, FeedZobel, ZobelDance, ZobelHide, ZobelRun, ZobelSneeze, SwaggySwim, SwaggyBubble, SwaggyDance, SwaggyFish, SwaggyJump, DudeRun, DudeDodge, DudeJump, DudeSlide, KaeppchenCollect, KaeppchenMaze, KaeppchenDodge, KaeppchenDeliver, KaeppchenPick, EdgarRoll, EdgarBounce, EdgarGoal, EdgarDodge, EdgarPinball, ReactionTest, WhackAMole, CountThem, RhythmTap, AvoidLaser, KeyDuel, ZobelClimb, ZobelDig, SwaggyFlappy, SwaggyHook, DudeSort, DudePush, KaeppchenRedLight, KaeppchenBake, EdgarGolf, EdgarBrick, PickTheNose, SwatTheFly, BlowCandles, StompIt, BossGame, BoxingBoss, SwaggyBoss, KaeppchenBoss, EdgarBoss]
};
const game = new Phaser.Game(config);
</script>

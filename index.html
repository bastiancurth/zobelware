// ======================================================================
// HAUPTSPIEL - steuert Wellen, Schwierigkeit und Bosse
// ======================================================================
class GameScene extends Phaser.Scene {
    constructor() { super({ key: 'GameScene' }); }
    init(data) {
        this.mode = GameModes.get(data && data.mode);
        this.soloCharacter = (data && data.soloCharacter) || null;
    }

    create() {
        Art.build(this);
        this.cameras.main.setBackgroundColor('#07080f');
        PostFX.apply(this, { bloomStrength: 0.5, vignetteStrength: 0.36 });
        Handheld.overlay(this);

        this.score = 0;
        this.gamesPlayed = 0;
        this.winStreak = 0; this.lossStreak = 0;
        this.combo = 0; this.bestCombo = 0;
        this.coinsThisRun = 0; this.bossesBeaten = 0;
        this.secondChanceUsed = false;
        this.isPaused = false;
        this.lastGameKey = null;
        this.playLog = [];        // Was wurde gespielt und wie ging es aus?
        this.lives = this.mode.lives + (Upgrades.hasExtraLife() ? 1 : 0);
        this.maxLives = this.lives + 2;

        // Wellenzähler
        this.waveIndex = 0;
        this.gameInWave = 0;
        this.gameSpeed = this.mode.startSpeed;
        this.level = 1;

        playerData.runsPlayed++; playerData.saveData();
        CharacterManager.resetRound();
        if (this.soloCharacter) CharacterManager.setCharacter(this.soloCharacter);

        this.buildHUD();
        this.input.keyboard.on('keydown-ESC', () => this.openPause());
        this.input.keyboard.on('keydown-P', () => this.openPause());
        musicEngine.initialize();

        this.startWave(true);
    }

    // ---------- Wellen ----------
    currentWave() {
        if (this.mode.isStage) {
            return Director.stagePlan[Math.min(this.waveIndex, Director.stagePlan.length - 1)];
        }
        return Director.mixWave(this.waveIndex);
    }

    startWave(first) {
        const w = this.currentWave();
        this.level = w.level;
        this.gameSpeed = this.mode.id === 'hardcore' ? w.speed * 1.15 : w.speed;
        this.gameInWave = 0;
        this.updateHUD();
        this.showWaveBanner(w, first);
    }

    showWaveBanner(wave, first) {
        const total = this.mode.isStage ? Director.stagePlan.length : 0;
        const label = 'WELLE ' + (this.waveIndex + 1) + (total ? ' / ' + total : '');
        const c = this.add.container(400, 300).setDepth(3200);
        const glow = this.add.image(0, 0, 'fx-glow').setTint(UI.GREEN)
            .setBlendMode(Phaser.BlendModes.ADD).setDisplaySize(760, 220).setAlpha(0.25);
        const t1 = this.add.text(0, -22, label, { font: 'bold 52px Orbitron', fill: '#ffffff' }).setOrigin(0.5);
        t1.setShadow(0, 0, '#00ff88', 20, false, true).setStroke('#00ff88', 4);
        const t2 = this.add.text(0, 30, wave.name, { font: 'bold 20px Orbitron', fill: '#ffd93d' }).setOrigin(0.5);
        const t3 = this.add.text(0, 62, 'Stufe ' + wave.level + '   •   Tempo x' + wave.speed.toFixed(2),
            { font: '12px Orbitron', fill: '#9aa3c8' }).setOrigin(0.5);
        c.add([glow, t1, t2, t3]);
        c.setScale(0.4).setAlpha(0);

        // Sichtbare Stufen-Punkte
        for (let i = 0; i < 3; i++) {
            const dot = this.add.circle(-24 + i * 24, 92, i < wave.level ? 6 : 4,
                i < wave.level ? 0xffd93d : 0x39405c);
            c.add(dot);
        }

        musicEngine.playSFX(first ? 'command' : 'speedup');
        this.tweens.add({ targets: c, scale: 1, alpha: 1, duration: 320, ease: 'Back.easeOut' });
        FX.shockwave(this, 400, 300, UI.GREEN, 460, 620);
        this.time.delayedCall(first ? 900 : 1150, () => {
            this.tweens.add({
                targets: c, alpha: 0, scale: 1.25, duration: 240,
                onComplete: () => { c.destroy(); this.nextStep(); }
            });
        });
    }

    // Entscheidet, was als Nächstes kommt: Minispiel, Boss oder neue Welle
    nextStep() {
        if (!this.isLive()) return;
        if (this.lives <= 0) { this.gameOver(); return; }
        const wave = this.currentWave();

        if (this.gameInWave >= wave.games) {
            // Welle vorbei
            if (this.mode.id === 'bossrush') { this.startBoss(); return; }
            if (this.mode.isStage) {
                if (this.waveIndex >= Director.stagePlan.length - 1) { this.startBoss(); return; }
                this.waveIndex++;
                this.startWave(false);
                return;
            }
            // Wilder Mix
            this.waveIndex++;
            const next = Director.mixWave(this.waveIndex);
            if (next.boss) { this.pendingWave = true; this.startBoss(); return; }
            this.startWave(false);
            return;
        }
        this.showTransition();
    }

    // ---------- HUD ----------
    buildHUD() {
        const hud = this.add.graphics().setDepth(2400);
        hud.fillStyle(0x000000, 0.5); hud.fillRoundedRect(8, 8, 784, 62, 13);
        hud.lineStyle(2, 0x00ff88, 0.22); hud.strokeRoundedRect(8, 8, 784, 62, 13);

        this.scoreText = this.add.text(24, 18, 'SCORE 0', { font: 'bold 24px Orbitron', fill: '#00ff88' }).setDepth(2401);
        this.scoreText.setShadow(0, 0, '#00ff88', 10, false, true);
        this.coinsText = this.add.text(24, 46, '💰 ' + playerData.coins, { font: '14px Orbitron', fill: '#ffd93d' }).setDepth(2401);

        this.speedText = this.add.text(400, 18, 'x1.0', { font: 'bold 20px Orbitron', fill: '#00d4ff' }).setOrigin(0.5, 0).setDepth(2401);
        this.comboText = this.add.text(400, 44, '', { font: 'bold 14px Orbitron', fill: '#ffd93d' }).setOrigin(0.5, 0).setDepth(2401);

        this.livesText = this.add.text(776, 18, '', { font: '22px Arial' }).setOrigin(1, 0).setDepth(2401);
        const ch = CharacterManager.getCurrentCharacter();
        this.charText = this.add.text(776, 48, ch.name, { font: 'bold 14px Orbitron', fill: UI.hex(ch.color) }).setOrigin(1, 0).setDepth(2401);

        this.waveText = this.add.text(400, 78, '', { font: '10px Orbitron', fill: '#5b6488' }).setOrigin(0.5, 0).setDepth(2401);
        this.waveDots = this.add.graphics().setDepth(2401);
        this.refreshLives();
    }

    // Nach dem Beenden der Szene sind die Anzeigen zerstört - dann nichts mehr anfassen
    isLive() {
        return this.sys && this.sys.isActive() && this.scoreText && this.scoreText.scene;
    }

    refreshLives() {
        if (!this.livesText || !this.livesText.scene) return;
        this.livesText.setText('❤️'.repeat(Math.max(0, this.lives)) || '💀');
    }

    updateHUD() {
        if (!this.isLive()) return;
        this.scoreText.setText('SCORE ' + this.score);
        this.coinsText.setText('💰 ' + playerData.coins);
        this.speedText.setText('x' + this.gameSpeed.toFixed(1));
        this.comboText.setText(this.combo >= 2 ? 'COMBO x' + this.combo : '');
        this.refreshLives();

        const wave = this.currentWave();
        const stageName = this.mode.isStage && this.soloCharacter
            ? CharacterManager.data[this.soloCharacter].stageName.toUpperCase() : this.mode.name.toUpperCase();
        this.waveText.setText(stageName + '   •   WELLE ' + (this.waveIndex + 1) + '   •   STUFE ' + this.level);

        // Punkte zeigen den Fortschritt in der aktuellen Welle
        this.waveDots.clear();
        const n = wave.games, gap = 13, sx = 400 - ((n - 1) * gap) / 2;
        for (let i = 0; i < n; i++) {
            const done = i < this.gameInWave;
            this.waveDots.fillStyle(done ? 0xffd93d : 0x39405c, done ? 1 : 0.8);
            this.waveDots.fillCircle(sx + i * gap, 66, done ? 4.5 : 3);
        }
    }

    openPause() {
        if (this.isPaused) return;
        if (this.scene.manager.getScenes(true).some(s => s !== this && s.parentScene === this)) return;
        this.isPaused = true;
        musicEngine.pauseMusic();
        this.scene.launch('PauseScene', { resumeKeys: ['GameScene'], returnScene: this.mode.isStage ? 'CityScene' : 'StartScreen' });
        this.scene.pause();
    }

    // ---------- Übergang ----------
    showTransition() {
        musicEngine.stopMusic();
        const dur = Math.max(430, 820 / this.gameSpeed);
        const ch = CharacterManager.getCurrentCharacter();

        // Knallige, wechselnde Vollflaeche statt dunklem Verlauf - so kennt man
        // die Zwischenbilder aus dem Vorbild. Die Farbe wechselt jede Runde.
        const flat = GameScene.FLAT_COLORS[this.gamesPlayed % GameScene.FLAT_COLORS.length];
        const bg = this.add.rectangle(400, 300, 800, 600, flat, 1).setDepth(2900);
        // Zwei schraege Baender laufen durchs Bild
        const glow = this.add.rectangle(400, 300, 1200, 150, 0xffffff, 0.10).setAngle(-18).setDepth(2901);
        this.tweens.add({ targets: glow, y: 180, duration: dur, ease: 'Quad.easeOut' });

        const stripes = [];
        for (let i = 0; i < 9; i++) {
            const s = this.add.rectangle(-240, 40 + i * 70, 300, 14, 0xffffff, 0.16).setDepth(2901);
            this.tweens.add({ targets: s, x: 1040, duration: dur * 0.85, delay: i * 32, ease: 'Quad.easeIn' });
            stripes.push(s);
        }

        const num = this.add.text(400, 104, String(this.gamesPlayed + 1), {
            font: 'bold 108px Orbitron', fill: '#ffffff'
        }).setOrigin(0.5).setDepth(2902);
        num.setStroke('#000000', 8).setShadow(3, 4, '#00000066', 0, true, true);
        const nameT = this.add.text(400, 178, ch.name.toUpperCase(), { font: 'bold 26px Orbitron', fill: '#ffffff' }).setOrigin(0.5).setDepth(2902);

        this.add.image(400, 452, 'fx-shadow').setDisplaySize(160, 40).setAlpha(0.4).setDepth(2901);
        let sp;
        if (ch.image === 'dude' && this.textures.exists('dude')) sp = this.add.sprite(400, 380, 'dude', 4).setScale(ch.scale * 2).setDepth(2902);
        else if (this.textures.exists(ch.image)) sp = this.add.image(400, 380, ch.image).setScale(ch.scale * 1.5).setDepth(2902);
        else { sp = Zobel.draw(this, 400, 380, 0.8, ch.color); sp.setDepth(2902); }

        this.tweens.add({ targets: sp, y: 356, duration: dur / 3, yoyo: true, repeat: 2, ease: 'Sine.easeInOut' });
        this.tweens.add({ targets: sp, angle: { from: -6, to: 6 }, duration: dur / 4, yoyo: true, repeat: 3 });
        CharacterManager.playJingle(this.gameSpeed);
        this.tweens.add({ targets: num, scale: 1.28, duration: dur / 2, yoyo: true, ease: 'Bounce.easeOut' });

        this.time.delayedCall(dur, () => {
            [bg, glow, num, nameT, sp].forEach(o => o.destroy());
            stripes.forEach(s => s.destroy());
            this.startNextGame();
        });
    }

    startNextGame() {
        const ch = CharacterManager.getCurrentCharacter();
        let game;
        if (this.lossStreak >= 3) {
            const easy = ['ClickTheButton', 'MashTheKey', 'TargetClick', 'FastClicker', 'ReactionTest', 'WhackAMole', 'DudeSort'];
            const pool = ch.games.filter(g => easy.includes(g.key));
            game = pool.length ? Phaser.Utils.Array.GetRandom(pool) : CharacterManager.getRandomGame();
            this.lossStreak = 0;
        } else {
            game = CharacterManager.getRandomGame();
            let guard = 0;
            while (this.lastGameKey && game.key === this.lastGameKey && guard++ < 6) game = CharacterManager.getRandomGame();
        }
        this.lastGameKey = game.key;
        this.currentGame = game;

        musicEngine.setBPM(140 + (this.gameSpeed - 1) * 50);
        musicEngine.startMusic(game.music);
        this.scene.launch(game.key, {
            parentScene: this, gameSpeed: this.gameSpeed, level: this.level,
            duration: game.duration, command: game.name, keysHint: game.keys,
            themeKey: CharacterManager.currentCharacter
        });
    }

    startBoss() {
        musicEngine.stopMusic();
        const ch = CharacterManager.getCurrentCharacter();
        const boss = CharacterManager.getBoss();
        const bg = this.add.rectangle(400, 300, 800, 600, 0x1a0000, 0.95).setDepth(2900);
        const warn = this.add.text(400, 62, '⚠ WARNING ⚠', { font: 'bold 36px Orbitron', fill: '#ffff00' }).setOrigin(0.5).setDepth(2902);
        this.tweens.add({ targets: warn, alpha: 0, duration: 200, yoyo: true, repeat: -1 });
        const bossT = this.add.text(400, 184, boss.name, { font: 'bold 64px Orbitron', fill: '#ffffff' }).setOrigin(0.5).setDepth(2902);
        bossT.setStroke('#ff0000', 7).setShadow(0, 0, '#ff2200', 22, false, true);
        const vs = this.add.text(400, 122, ch.name + ' vs', { font: 'bold 24px Orbitron', fill: '#ffffff' }).setOrigin(0.5).setDepth(2902);

        let sp;
        if (ch.image === 'dude' && this.textures.exists('dude')) sp = this.add.sprite(400, 400, 'dude', 4).setScale(ch.scale * 2).setDepth(2902);
        else if (this.textures.exists(ch.image)) sp = this.add.image(400, 400, ch.image).setScale(ch.scale * 1.5).setDepth(2902);
        else { sp = Zobel.draw(this, 400, 400, 0.9, 0xff6666); sp.setDepth(2902); }

        musicEngine.playBossJingle();
        FX.burst(this, 400, 300, 0xff3322, 30, 380);
        let zooms = 0;
        const zoom = () => {
            this.tweens.add({
                targets: this.cameras.main, zoom: 1.28, duration: 190, ease: 'Quad.easeIn',
                onComplete: () => this.tweens.add({
                    targets: this.cameras.main, zoom: 1.0, duration: 190, ease: 'Quad.easeOut',
                    onComplete: () => { zooms++; if (zooms < 3) this.time.delayedCall(90, zoom); }
                })
            });
        };
        zoom();
        this.tweens.add({ targets: sp, x: { from: 390, to: 410 }, duration: 50, yoyo: true, repeat: -1 });
        this.tweens.add({ targets: bossT, scale: 1.35, duration: 300, yoyo: true, repeat: 3, ease: 'Bounce.easeInOut' });

        this.time.delayedCall(1800, () => {
            [bg, warn, bossT, vs, sp].forEach(o => o.destroy());
            this.cameras.main.setZoom(1);
            this.currentGame = boss;
            musicEngine.setBPM(160 + (this.gameSpeed - 1) * 40);
            musicEngine.startMusic('boss');
            this.scene.launch(boss.key, {
                parentScene: this, gameSpeed: this.gameSpeed, level: this.level,
                command: boss.name, themeKey: CharacterManager.currentCharacter
            });
        });
    }

    // ---------- Ergebnisse ----------
    showReaction(won) {
        const ch = CharacterManager.getCurrentCharacter();
        const bg = this.add.rectangle(400, 300, 800, 600, won ? 0x0d2a1a : 0x2a0d0d, 0.7).setDepth(2800);
        this.add.image(400, 396, 'fx-shadow').setDisplaySize(150, 36).setAlpha(0.4).setDepth(2801);
        let sp;
        if (ch.image === 'dude' && this.textures.exists('dude')) sp = this.add.sprite(400, 330, 'dude', 4).setScale(ch.scale * 1.7).setDepth(2801);
        else if (this.textures.exists(ch.image)) sp = this.add.image(400, 330, ch.image).setScale(ch.scale * 1.4).setDepth(2801);
        else { sp = Zobel.draw(this, 400, 330, 0.8, ch.color); sp.setDepth(2801); }

        const word = this.add.text(400, 196, won ? Zobel.getWin() : Zobel.getLose(), {
            font: 'bold 56px Orbitron', fill: '#ffffff', stroke: '#000000', strokeThickness: 8
        }).setOrigin(0.5).setDepth(2802).setScale(0.4);
        this.tweens.add({ targets: word, scale: 1, duration: 180, ease: 'Back.easeOut' });

        if (won) {
            this.tweens.add({ targets: sp, y: 286, duration: 150, yoyo: true, repeat: 1, ease: 'Quad.easeOut' });
            Juice.squash(this, sp, 0.2, 260);
            FX.burst(this, 400, 320, ch.color, 18, 200);
        } else {
            this.tweens.add({ targets: sp, x: { from: 392, to: 408 }, duration: 45, yoyo: true, repeat: 6 });
            this.tweens.add({ targets: sp, alpha: 0.55, duration: 400 });
        }
        const objs = [bg, sp, word];
        this.time.delayedCall(430, () => this.tweens.add({
            targets: objs, alpha: 0, duration: 140, onComplete: () => objs.forEach(o => o.destroy())
        }));
    }

    showHeartBreak() {
        musicEngine.playSFX('heartbreak');
        const x = 762 - this.lives * 24;
        const h = this.add.text(x, 22, '💔', { font: '22px Arial' }).setDepth(3000);
        FX.burst(this, x, 26, 0xff3355, 10, 90);
        this.tweens.add({ targets: h, y: 130, alpha: 0, angle: 140, scale: 1.6, duration: 660, ease: 'Quad.easeIn', onComplete: () => h.destroy() });
    }

    microgameWon(gameKey) {
        if (!this.isLive()) return;
        musicEngine.stopMusic();
        this.score++; this.gamesPlayed++; this.gameInWave++;
        this.winStreak++; this.lossStreak = 0; this.combo++;
        this.playLog.push({ key: gameKey, won: true, level: this.level });
        if (this.combo > this.bestCombo) this.bestCombo = this.combo;

        const reward = Math.round((8 + Math.min(this.combo, 10) * 2 + this.level * 3)
            * Upgrades.coinFactor() * (this.mode.id === 'hardcore' ? 2 : 1));
        this.coinsThisRun += reward;
        playerData.trackGame(gameKey, true);
        playerData.addCoins(reward);
        this.updateHUD();

        this.showReaction(true);
        UI.floatText(this, 640, 170, '+' + reward + ' 💰', '#ffd93d', 18);
        if (this.combo >= 3) UI.floatText(this, 400, 430, 'COMBO x' + this.combo + '!', '#ffd93d', 26);
        if (this.gameSpeed > playerData.bestSpeed) { playerData.bestSpeed = this.gameSpeed; playerData.saveData(); }

        this.time.delayedCall(560, () => this.nextStep());
    }

    microgameLost(gameKey) {
        if (!this.isLive()) return;
        musicEngine.stopMusic();
        this.lives--; this.gamesPlayed++; this.gameInWave++;
        this.winStreak = 0; this.lossStreak++; this.combo = 0;
        this.playLog.push({ key: gameKey, won: false, level: this.level });
        playerData.trackGame(gameKey, false);
        this.showHeartBreak();
        this.updateHUD();
        this.showReaction(false);
        Juice.shake(this, 0.5, 180);

        if (this.lives > 0) {
            this.time.delayedCall(620, () => this.nextStep());
        } else if (Upgrades.hasSecondChance() && !this.secondChanceUsed) {
            this.secondChanceUsed = true;
            this.lives = 1;
            this.updateHUD();
            const t = this.add.text(400, 300, '✨ ZWEITE CHANCE! ✨', { font: 'bold 40px Orbitron', fill: '#ffd93d' }).setOrigin(0.5).setDepth(3100);
            FX.confetti(this, 50);
            musicEngine.playSFX('win');
            this.tweens.add({ targets: t, scale: 1.2, duration: 400, yoyo: true, repeat: 1, onComplete: () => t.destroy() });
            this.time.delayedCall(1600, () => this.nextStep());
        } else {
            this.time.delayedCall(620, () => this.gameOver());
        }
    }

    bossWon() {
        if (!this.isLive()) return;
        musicEngine.stopMusic();
        this.score += 3; this.gamesPlayed++; this.bossesBeaten++;
        this.combo++;
        if (this.combo > this.bestCombo) this.bestCombo = this.combo;
        if (this.mode.isStage) { this.finishStage(); return; }

        this.lives = Math.min(this.lives + 1, this.maxLives);
        const bonus = Math.round(60 * Upgrades.coinFactor());
        this.coinsThisRun += bonus;
        playerData.addCoins(bonus);
        playerData.bossWins++; playerData.saveData();
        this.updateHUD();

        const oldChar = CharacterManager.getCurrentCharacter();
        const t1 = this.add.text(400, 240, 'BOSS BESIEGT!', { font: 'bold 56px Orbitron', fill: '#ffffff' }).setOrigin(0.5).setDepth(3100);
        t1.setStroke('#ff6600', 5).setShadow(0, 0, '#ffd700', 20, false, true);
        const t2 = this.add.text(400, 320, '+1 LEBEN   +' + bonus + ' 💰', { font: 'bold 28px Orbitron', fill: '#00ff88' }).setOrigin(0.5).setDepth(3100);
        musicEngine.playSFX('win');
        FX.confetti(this, 90);
        FX.shockwave(this, 400, 300, 0xffd700, 520, 700);
        this.tweens.add({ targets: [t1, t2], scale: 1.2, duration: 300, yoyo: true, repeat: 2 });

        this.time.delayedCall(1800, () => {
            t1.destroy(); t2.destroy();
            const newChar = CharacterManager.nextCharacter();
            this.charText.setText(newChar.name).setColor(UI.hex(newChar.color));
            this.showCharacterSwitch(oldChar, newChar);
        });
    }

    showCharacterSwitch(oldChar, newChar) {
        const bg = this.add.rectangle(400, 300, 800, 600, 0x000c26, 0.95).setDepth(2900);
        const title = this.add.text(400, 80, 'CHARAKTER WECHSEL!', { font: 'bold 34px Orbitron', fill: '#00ff88' }).setOrigin(0.5).setDepth(2902);
        const mk = (ch, x) => {
            if (ch.image === 'dude' && this.textures.exists('dude')) return this.add.sprite(x, 300, 'dude', 4).setScale(ch.scale * 1.5).setDepth(2902);
            if (this.textures.exists(ch.image)) return this.add.image(x, 300, ch.image).setScale(ch.scale).setDepth(2902);
            const s = Zobel.draw(this, x, 300, 0.6, ch.color); s.setDepth(2902); return s;
        };
        const oldS = mk(oldChar, 200); oldS.setAlpha(0.5);
        const oldN = this.add.text(200, 400, oldChar.name, { font: 'bold 20px Orbitron', fill: '#888888' }).setOrigin(0.5).setDepth(2902);
        const arrow = this.add.text(400, 300, '→', { font: 'bold 80px Orbitron', fill: '#ffff00' }).setOrigin(0.5).setDepth(2902);
        this.tweens.add({ targets: arrow, x: { from: 380, to: 420 }, duration: 300, yoyo: true, repeat: -1 });
        const newS = mk(newChar, 600);
        const newN = this.add.text(600, 400, newChar.name + '!', { font: 'bold 24px Orbitron', fill: UI.hex(newChar.color) }).setOrigin(0.5).setDepth(2902);
        this.tweens.add({ targets: newS, scaleX: newS.scaleX * 1.35, scaleY: newS.scaleY * 1.35, duration: 400, yoyo: true, repeat: 2, ease: 'Bounce.easeOut' });
        FX.burst(this, 600, 300, newChar.color, 26, 220);
        CharacterManager.playJingle(1.0);

        this.time.delayedCall(2300, () => {
            [bg, title, oldS, oldN, arrow, newS, newN].forEach(o => o.destroy());
            this.waveIndex++;
            this.startWave(false);
        });
    }

    finishStage() {
        const key = this.soloCharacter;
        playerData.bossWins++;
        const bonus = Math.round(120 * Upgrades.coinFactor());
        this.coinsThisRun += bonus;
        playerData.addCoins(bonus);
        if (this.bestCombo > playerData.bestCombo) playerData.bestCombo = this.bestCombo;
        playerData.updateHighScore(this.score);
        playerData.updateStageHighScore(key, this.score);
        const firstClear = playerData.clearStage(key);
        playerData.saveData();

        const t1 = this.add.text(400, 250, 'BOSS BESIEGT!', { font: 'bold 54px Orbitron', fill: '#ffffff' }).setOrigin(0.5).setDepth(3100);
        t1.setStroke('#ff6600', 5).setShadow(0, 0, '#ffd700', 20, false, true);
        const t2 = this.add.text(400, 320, '+' + bonus + ' 💰 Stage-Bonus', { font: 'bold 24px Orbitron', fill: '#00ff88' }).setOrigin(0.5).setDepth(3100);
        musicEngine.playSFX('win');
        FX.confetti(this, 100);
        FX.shockwave(this, 400, 300, 0xffd700, 560, 720);
        this.tweens.add({ targets: [t1, t2], scale: 1.15, duration: 300, yoyo: true, repeat: 2 });

        this.time.delayedCall(1900, () => {
            t1.destroy(); t2.destroy();
            if (firstClear || !playerData.hasSeenStory(key + '_outro')) {
                this.scene.start('StoryScene', { character: key, type: 'outro', score: this.score, log: this.playLog });
            } else {
                this.scene.start('StageClearScene', { character: key, score: this.score, log: this.playLog });
            }
        });
    }

    gameOver() {
        musicEngine.stopMusic();
        if (this.bestCombo > playerData.bestCombo) playerData.bestCombo = this.bestCombo;
        playerData.updateHighScore(this.score);
        if (this.mode.isStage) playerData.updateStageHighScore(this.soloCharacter, this.score);
        else playerData.updateModeHighScore(this.mode.id, this.score);
        playerData.saveData();
        this.scene.start('GameOverScene', {
            score: this.score, mode: this.mode.id, soloCharacter: this.soloCharacter,
            coins: this.coinsThisRun, bestCombo: this.bestCombo, bosses: this.bossesBeaten,
            rounds: this.gamesPlayed, speed: this.gameSpeed, waves: this.waveIndex + 1
        });
    }

    exitToMenu() { musicEngine.stopMusic(); this.scene.stop(); this.scene.start('StartScreen'); }
}

// ======================================================================
// GAME OVER
// ======================================================================
class GameOverScene extends Phaser.Scene {
    constructor() { super({ key: 'GameOverScene' }); }
    init(data) {
        this.finalScore = data.score || 0;
        this.mode = data.mode || 'classic';
        this.soloCharacter = data.soloCharacter || null;
        this.coinsEarned = data.coins || 0;
        this.bestCombo = data.bestCombo || 0;
        this.bosses = data.bosses || 0;
        this.rounds = data.rounds || 0;
        this.finalSpeed = data.speed || 1;
        this.waves = data.waves || 1;
    }
    create() {
        Art.build(this);
        this.cameras.main.setBackgroundColor('#07070d');
        Sky.gradient(this, 0x2a0d18, 0x05060b);
        UI.starfield(this, 40, UI.RED);
        PostFX.apply(this, { bloomStrength: 0.5 });

        this.isStage = this.mode === 'stage' && !!this.soloCharacter;
        const best = this.isStage ? (playerData.stageHighScores[this.soloCharacter] || 0)
                                  : (playerData.modeHighScores[this.mode] || 0);
        const isRecord = this.finalScore > 0 && this.finalScore >= best;

        const title = this.add.text(400, 92, this.isStage ? 'STAGE VERLOREN' : 'GAME OVER', {
            font: this.isStage ? 'bold 46px Orbitron' : 'bold 58px Orbitron', fill: '#ffffff'
        }).setOrigin(0.5);
        title.setStroke('#ff3355', 4).setShadow(0, 0, '#ff3355', 20, false, true);
        this.tweens.add({ targets: title, scaleX: 1.03, scaleY: 1.03, duration: 900, yoyo: true, repeat: -1 });

        if (isRecord) {
            const rec = this.add.text(400, 140, '🏆 NEUER REKORD! 🏆', { font: 'bold 22px Orbitron', fill: '#ffd93d' }).setOrigin(0.5);
            this.tweens.add({ targets: rec, alpha: 0.4, duration: 500, yoyo: true, repeat: -1 });
            FX.confetti(this, 80);
            musicEngine.playSFX('win');
        }

        UI.panel(this, 400, 272, 540, 200, isRecord ? UI.YELLOW : UI.RED, 0.08);
        const sc = this.add.text(400, 196, 'SCORE ' + this.finalScore, { font: 'bold 42px Orbitron', fill: '#00ff88' }).setOrigin(0.5);
        sc.setShadow(0, 0, '#00ff88', 14, false, true);

        [['Wellen überstanden', this.waves], ['Runden gespielt', this.rounds],
         ['Beste Combo', 'x' + this.bestCombo], ['Bosse besiegt', this.bosses],
         ['Münzen verdient', this.coinsEarned + ' 💰'], ['Endtempo', 'x' + this.finalSpeed.toFixed(1)]
        ].forEach((r, i) => {
            const y = 238 + i * 23;
            this.add.text(180, y, r[0], { font: '13px Orbitron', fill: '#8b93aa' }).setOrigin(0, 0.5);
            this.add.text(620, y, String(r[1]), { font: 'bold 13px Orbitron', fill: '#ffffff' }).setOrigin(1, 0.5);
        });

        this.add.text(400, 388, (this.isStage ? 'Stage-Rekord: ' : 'Rekord in diesem Modus: ') + best +
            '   •   Gesamt-Highscore: ' + playerData.highScore, { font: '12px Orbitron', fill: '#6c7590' }).setOrigin(0.5);

        const unlocked = Achievements.checkAll();
        if (unlocked.length) this.showUnlockedStrip(unlocked);

        UI.button(this, 220, 452, 210, 52, '↻ NOCHMAL', {
            fontSize: 18, onClick: () => this.scene.start('GameScene', { mode: this.mode, soloCharacter: this.soloCharacter })
        });
        UI.button(this, 580, 452, 210, 52, this.isStage ? '🏙 ZUR STADT' : '⚙ MODUS', {
            color: UI.CYAN, fontSize: 18,
            onClick: () => this.isStage ? this.scene.start('CityScene') : this.scene.start('ModeSelectScene', { mode: this.mode })
        });
        UI.button(this, 220, 514, 210, 44, 'ALBUM', { color: UI.PURPLE, filled: false, fontSize: 16, onClick: () => this.scene.start('AlbumScene') });
        UI.button(this, 580, 514, 210, 44, 'SHOP', { color: UI.YELLOW, filled: false, fontSize: 16, onClick: () => this.scene.start('ShopScene') });
        UI.button(this, 400, 568, 180, 36, '← MENÜ', { color: UI.RED, filled: false, fontSize: 14, onClick: () => this.scene.start('StartScreen') });

        this.input.keyboard.on('keydown-ESC', () => this.scene.start(this.isStage ? 'CityScene' : 'StartScreen'));
        this.input.keyboard.on('keydown-ENTER', () => this.scene.start('GameScene', { mode: this.mode, soloCharacter: this.soloCharacter }));
    }

    showUnlockedStrip(unlocked) {
        const shown = unlocked.slice(0, 3);
        const sum = unlocked.reduce((s, a) => s + a.reward, 0);
        let label = shown.map(a => a.icon + ' ' + a.name).join('   •   ');
        if (unlocked.length > shown.length) label += '   +' + (unlocked.length - shown.length) + ' weitere';
        const strip = this.add.container(400, 418).setAlpha(0);
        const g = this.add.graphics();
        g.fillStyle(0xffd93d, 0.14); g.fillRoundedRect(-330, -17, 660, 34, 9);
        g.lineStyle(2, 0xffd93d, 0.8); g.strokeRoundedRect(-330, -17, 660, 34, 9);
        strip.add(g);
        strip.add(this.add.text(-314, 0, 'NEU', { font: 'bold 11px Orbitron', fill: '#ffd93d' }).setOrigin(0, 0.5));
        strip.add(this.add.text(-276, 0, label, { font: '11px Orbitron', fill: '#ffffff' }).setOrigin(0, 0.5));
        strip.add(this.add.text(314, 0, '+' + sum + ' 💰', { font: 'bold 11px Orbitron', fill: '#00ff88' }).setOrigin(1, 0.5));
        this.tweens.add({ targets: strip, alpha: 1, y: 412, duration: 400, delay: 500, ease: 'Back.easeOut' });
        this.time.delayedCall(600, () => musicEngine.playSFX('win'));
    }
}

class AlbumScene extends Phaser.Scene {
    constructor() { super({ key: 'AlbumScene' }); }
    init(data) { this.currentPage = (data && data.page) || 0; }
    create() {
        Art.build(this);
        this.cameras.main.setBackgroundColor('#070810');
        Sky.gradient(this, 0x102040, 0x05060d);
        UI.starfield(this, 30, UI.CYAN);
        PostFX.apply(this, { bloomStrength: 0.5 });

        this.allGames = ALBUM_GAMES;
        this.itemsPerPage = 12;
        this.totalPages = Math.ceil(this.allGames.length / this.itemsPerPage);
        this.currentPage = Phaser.Math.Clamp(this.currentPage, 0, this.totalPages - 1);

        UI.header(this, '🎮 MINISPIEL-ALBUM',
            this.allGames.length + ' Spiele  •  ' + playerData.distinctGamesWon() + ' davon gewonnen  •  Klicke zum Üben', UI.CYAN);

        this.cardsContainer = this.add.container(0, 0);
        this.drawPage();
        if (this.currentPage > 0) UI.button(this, 100, 508, 90, 40, '◀', { color: UI.CYAN, filled: false, onClick: () => this.scene.restart({ page: this.currentPage - 1 }) });
        if (this.currentPage < this.totalPages - 1) UI.button(this, 700, 508, 90, 40, '▶', { color: UI.CYAN, filled: false, onClick: () => this.scene.restart({ page: this.currentPage + 1 }) });
        UI.button(this, 400, 560, 190, 42, '← MENÜ', { color: UI.RED, fontSize: 16, onClick: () => this.scene.start('StartScreen') });

        this.input.keyboard.on('keydown-ESC', () => this.scene.start('StartScreen'));
        this.input.keyboard.on('keydown-LEFT', () => { if (this.currentPage > 0) this.scene.restart({ page: this.currentPage - 1 }); });
        this.input.keyboard.on('keydown-RIGHT', () => { if (this.currentPage < this.totalPages - 1) this.scene.restart({ page: this.currentPage + 1 }); });
    }
    drawPage() {
        const start = this.currentPage * this.itemsPerPage;
        const page = this.allGames.slice(start, start + this.itemsPerPage);
        const cols = 4, cw = 172, chh = 96, sx = 42, sy = 116, gx = 12, gy = 12;
        page.forEach((game, idx) => {
            const cx = sx + (idx % cols) * (cw + gx) + cw / 2;
            const cy = sy + Math.floor(idx / cols) * (chh + gy) + chh / 2;
            const st = playerData.gameStats[game.key] || { played: 0, won: 0 };
            const rate = st.played ? Math.round((st.won / st.played) * 100) : 0;
            const mastered = st.won > 0;

            const g = this.add.graphics();
            const draw = (hover) => {
                g.clear();
                g.fillStyle(game.color, hover ? 0.36 : 0.13);
                g.fillRoundedRect(cx - cw / 2, cy - chh / 2, cw, chh, 11);
                g.lineStyle(2, game.color, mastered ? 1 : 0.42);
                g.strokeRoundedRect(cx - cw / 2, cy - chh / 2, cw, chh, 11);
            };
            draw(false);
            this.cardsContainer.add(g);
            const nameT = this.add.text(cx, cy - 26, game.name, { font: 'bold 13px Orbitron', fill: '#ffffff' }).setOrigin(0.5);
            this.cardsContainer.add(nameT);
            if (mastered) this.cardsContainer.add(this.add.text(cx + cw / 2 - 14, cy - chh / 2 + 12, '★', { font: '13px Arial', fill: '#ffd93d' }).setOrigin(0.5));
            this.cardsContainer.add(this.add.text(cx, cy - 2, st.played + 'x gespielt', { font: '10px Orbitron', fill: '#8b93aa' }).setOrigin(0.5));
            const bar = this.add.graphics();
            bar.fillStyle(0x000000, 0.5); bar.fillRoundedRect(cx - 52, cy + 16, 104, 8, 4);
            if (st.played) {
                bar.fillStyle(rate >= 60 ? 0x00ff88 : rate >= 30 ? 0xffaa00 : 0xff6b6b, 1);
                bar.fillRoundedRect(cx - 52, cy + 16, Math.max(4, 104 * rate / 100), 8, 4);
            }
            this.cardsContainer.add(bar);
            this.cardsContainer.add(this.add.text(cx, cy + 34, st.played ? rate + '% Siege' : 'noch nie gespielt', { font: '9px Orbitron', fill: '#6c7590' }).setOrigin(0.5));

            const hit = this.add.rectangle(cx, cy, cw, chh, 0xffffff, 0.001).setInteractive({ useHandCursor: true });
            this.cardsContainer.add(hit);
            hit.on('pointerover', () => { draw(true); nameT.setScale(1.08); });
            hit.on('pointerout', () => { draw(false); nameT.setScale(1); });
            hit.on('pointerdown', () => {
                musicEngine.initialize(); musicEngine.playSFX('click');
                this.time.delayedCall(0, () => this.scene.start(game.key, {
                    parentScene: null, gameSpeed: 1.0, level: 2, duration: 5000,
                    practiceMode: true, command: game.name.toUpperCase()
                }));
            });
        });
        this.add.text(400, 508, 'Seite ' + (this.currentPage + 1) + ' / ' + this.totalPages, { font: '13px Orbitron', fill: '#00d4ff' }).setOrigin(0.5);
    }
}

// SHOP
// ======================================================================
class ShopScene extends Phaser.Scene {
    constructor() { super({ key: 'ShopScene' }); }
    init(data) { this.currentCategory = (data && data.category) || 'perk'; }
    create() {
        Art.build(this);
        this.cameras.main.setBackgroundColor('#0d0720');
        Sky.gradient(this, 0x2b1148, 0x06040e);
        UI.starfield(this, 30, UI.YELLOW);
        PostFX.apply(this, { bloomStrength: 0.5 });
        UI.header(this, '🛒 ZOBEL-SHOP', 'Münzen verdienst du in jedem gewonnenen Minispiel', UI.YELLOW);
        this.add.text(400, 108, '💰 ' + playerData.coins + ' Münzen', { font: 'bold 20px Orbitron', fill: '#ffd93d' }).setOrigin(0.5);

        this.shopItems = SHOP_ITEMS;
        [
            { id: 'perk', name: '⚡ Boni', x: 140 },
            { id: 'startscreen', name: '🏠 Startbild', x: 320 },
            { id: 'transition', name: '🎬 Übergang', x: 500 },
            { id: 'fuse', name: '🧨 Zündschnur', x: 675 }
        ].forEach(cat => {
            const active = this.currentCategory === cat.id;
            UI.button(this, cat.x, 150, 168, 40, cat.name, {
                color: active ? UI.GREEN : UI.CYAN, filled: active, fontSize: 13,
                onClick: () => { if (!active) this.scene.restart({ category: cat.id }); }
            });
        });

        this.drawItems();
        UI.button(this, 400, 560, 190, 42, '← MENÜ', { color: UI.RED, fontSize: 16, onClick: () => this.scene.start('StartScreen') });
        this.input.keyboard.on('keydown-ESC', () => this.scene.start('StartScreen'));
    }
    drawItems() {
        const items = this.shopItems.filter(i => i.type === this.currentCategory);
        const cols = 3, cw = 220, chh = 118, sx = 60, sy = 198, gx = 20, gy = 16;
        items.forEach((item, idx) => {
            const cx = sx + (idx % cols) * (cw + gx) + cw / 2;
            const cy = sy + Math.floor(idx / cols) * (chh + gy) + chh / 2;
            const owned = playerData.ownsItem(item.id);
            const active = this.isItemActive(item);
            const afford = playerData.coins >= item.price;
            const accent = owned ? (active ? UI.GREEN : UI.CYAN) : (afford ? UI.YELLOW : 0x545a70);

            const g = this.add.graphics();
            const draw = (hover) => {
                g.clear();
                g.fillStyle(accent, hover ? 0.3 : (active ? 0.2 : 0.09));
                g.fillRoundedRect(cx - cw / 2, cy - chh / 2, cw, chh, 13);
                g.lineStyle(active ? 3 : 2, accent, owned ? 1 : 0.55);
                g.strokeRoundedRect(cx - cw / 2, cy - chh / 2, cw, chh, 13);
            };
            draw(false);
            this.add.text(cx - cw / 2 + 34, cy - 12, item.preview, { font: '32px Arial' }).setOrigin(0.5);
            this.add.text(cx - cw / 2 + 62, cy - 30, item.name, { font: 'bold 14px Orbitron', fill: '#ffffff' }).setOrigin(0, 0.5);
            this.add.text(cx - cw / 2 + 62, cy - 8, item.desc, { font: '10px Orbitron', fill: '#8b93aa' }).setOrigin(0, 0.5);
            let st, col;
            if (owned) { st = item.type === 'perk' ? '✓ AKTIV' : (active ? '✓ AUSGEWÄHLT' : 'AUSWÄHLEN'); col = (item.type === 'perk' || active) ? '#00ff88' : '#00d4ff'; }
            else { st = '💰 ' + item.price; col = afford ? '#ffd93d' : '#ff6b6b'; }
            this.add.text(cx, cy + 36, st, { font: 'bold 14px Orbitron', fill: col }).setOrigin(0.5);

            const hit = this.add.rectangle(cx, cy, cw, chh, 0xffffff, 0.001).setInteractive({ useHandCursor: true });
            hit.on('pointerover', () => draw(true));
            hit.on('pointerout', () => draw(false));
            hit.on('pointerdown', () => this.handleItemClick(item));
        });
    }
    isItemActive(item) {
        if (item.type === 'startscreen') return playerData.startScreenStyle === item.value;
        if (item.type === 'transition') return playerData.transitionColor === item.value;
        if (item.type === 'fuse') return playerData.fuseStyle === item.value;
        if (item.type === 'perk') return playerData.ownsItem(item.id);
        return false;
    }
    handleItemClick(item) {
        const apply = () => {
            if (item.type === 'startscreen') playerData.startScreenStyle = item.value;
            else if (item.type === 'transition') playerData.transitionColor = item.value;
            else if (item.type === 'fuse') playerData.fuseStyle = item.value;
            playerData.saveData();
        };
        if (playerData.ownsItem(item.id)) {
            if (item.type === 'perk') { UI.floatText(this, 400, 300, 'Bonus ist dauerhaft aktiv', '#00ff88', 18); return; }
            apply(); musicEngine.playSFX('click');
            this.time.delayedCall(0, () => this.scene.restart({ category: this.currentCategory }));
        } else if (playerData.spendCoins(item.price)) {
            playerData.buyItem(item.id); apply();
            musicEngine.playSFX('win'); FX.confetti(this, 30);
            this.time.delayedCall(0, () => this.scene.restart({ category: this.currentCategory }));
        } else {
            musicEngine.playSFX('lose'); Juice.shake(this, 0.3, 120);
            UI.floatText(this, 400, 300, 'Nicht genug Münzen!', '#ff6b6b', 22);
        }
    }
}

class AchievementsScene extends Phaser.Scene {
    constructor() { super({ key: 'AchievementsScene' }); }
    init(data) { this.page = (data && data.page) || 0; }
    create() {
        Art.build(this);
        this.cameras.main.setBackgroundColor('#08080f');
        Sky.gradient(this, 0x2b2410, 0x05060b);
        UI.starfield(this, 30, 0xffd93d);
        PostFX.apply(this, { bloomStrength: 0.5 });

        const fresh = Achievements.checkAll();
        UI.header(this, '🏅 ERFOLGE', playerData.achievements.length + ' von ' + Achievements.list.length + ' freigeschaltet', UI.YELLOW);

        const pct = Achievements.progress() / 100;
        const bar = this.add.graphics();
        bar.fillStyle(0x000000, 0.6); bar.fillRoundedRect(200, 104, 400, 14, 7);
        if (pct > 0) { bar.fillStyle(UI.YELLOW, 1); bar.fillRoundedRect(200, 104, Math.max(14, 400 * pct), 14, 7); }
        bar.lineStyle(2, 0xffffff, 0.3); bar.strokeRoundedRect(200, 104, 400, 14, 7);
        if (fresh.length) {
            const sum = fresh.reduce((s, a) => s + a.reward, 0);
            this.time.delayedCall(300, () => { musicEngine.playSFX('win'); UI.floatText(this, 400, 136, '+' + sum + ' 💰 nachträglich gutgeschrieben', '#00ff88', 15); });
        }

        const per = 8;
        this.totalPages = Math.ceil(Achievements.list.length / per);
        Achievements.list.slice(this.page * per, this.page * per + per).forEach((a, i) => {
            const x = 210 + (i % 2) * 380, y = 162 + Math.floor(i / 2) * 86;
            const done = Achievements.isUnlocked(a.id);
            const g = this.add.graphics();
            g.fillStyle(done ? UI.YELLOW : 0x141830, done ? 0.15 : 0.9);
            g.fillRoundedRect(x - 175, y - 34, 350, 68, 11);
            g.lineStyle(2, done ? UI.YELLOW : 0x2a3050, 1);
            g.strokeRoundedRect(x - 175, y - 34, 350, 68, 11);
            this.add.text(x - 143, y, done ? a.icon : '🔒', { font: '26px Arial' }).setOrigin(0.5).setAlpha(done ? 1 : 0.5);
            this.add.text(x - 116, y - 13, a.name, { font: 'bold 14px Orbitron', fill: done ? '#ffd93d' : '#6c7590' }).setOrigin(0, 0.5);
            this.add.text(x - 116, y + 8, a.desc, { font: '10px Orbitron', fill: '#7f879c' }).setOrigin(0, 0.5);
            this.add.text(x + 162, y + 12, '+' + a.reward + ' 💰', { font: '10px Orbitron', fill: done ? '#00ff88' : '#4d5468' }).setOrigin(1, 0.5);
        });

        if (this.page > 0) UI.button(this, 110, 508, 110, 40, '◀', { color: UI.YELLOW, filled: false, onClick: () => this.scene.restart({ page: this.page - 1 }) });
        if (this.page < this.totalPages - 1) UI.button(this, 690, 508, 110, 40, '▶', { color: UI.YELLOW, filled: false, onClick: () => this.scene.restart({ page: this.page + 1 }) });
        this.add.text(400, 508, 'Seite ' + (this.page + 1) + ' / ' + this.totalPages, { font: '12px Orbitron', fill: '#6c7590' }).setOrigin(0.5);
        UI.button(this, 400, 558, 200, 44, '← MENÜ', { color: UI.RED, onClick: () => this.scene.start('StartScreen') });
        this.input.keyboard.on('keydown-ESC', () => this.scene.start('StartScreen'));
    }
}

        } else {
            this.fish = this.add.circle(this.fishX, 470, 22, 0xFFA500);
        }

        this.hooks = [];
        this.hookTimer = this.time.addEvent({
            delay: Math.max(400, 750 / this.gameSpeed),
            callback: this.dropHook, callbackScope: this, loop: true
        });
        this.dropHook();

        this.cursors = this.input.keyboard.createCursorKeys();
        this.startSurvivalTimer();
    }
    dropHook() {
        if (this.hasEnded) return;
        const x = Phaser.Math.Between(60, 740);
        const line = this.add.rectangle(x, 100, 2, 0, 0xffffff, 0.7).setOrigin(0.5, 0);
        const hook = this.add.text(x, 110, '🪝', { font: '30px Arial' }).setOrigin(0.5);
        hook.vy = Phaser.Math.Between(190, 280) * this.gameSpeed;
        hook.line = line;
        this.hooks.push(hook);
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;

        if (this.isLeft()) this.fishX -= 340 * dt;
        if (this.isRight()) this.fishX += 340 * dt;
        this.fishX = Phaser.Math.Clamp(this.fishX, 40, 760);
        this.fish.x = this.fishX;

        for (let i = this.hooks.length - 1; i >= 0; i--) {
            const hook = this.hooks[i];
            hook.y += hook.vy * dt;
            hook.line.height = hook.y - 100;
            if (hook.y > 620) {
                hook.line.destroy(); hook.destroy();
                this.hooks.splice(i, 1);
                continue;
            }
            if (Math.abs(hook.x - this.fishX) < 30 && Math.abs(hook.y - 470) < 34) { this.lose(); return; }
        }
    }
}

        } else {

        }

        this.wolf = this.add.text(400, 160, '🐺', { font: '64px Arial' }).setOrigin(0.5);
        this.statusText = this.add.text(400, 230, 'WOLF SCHLÄFT', { font: 'bold 26px Orbitron', fill: '#00ff88' }).setOrigin(0.5);
        this.watching = false;
        this.scheduleWolf();

        this.cursors = this.input.keyboard.createCursorKeys();
        this.startTimer();
    }
    scheduleWolf() {
        if (this.hasEnded) return;
        const delay = this.watching
            ? Phaser.Math.Between(600, 1100)
            : Phaser.Math.Between(700, 1300) / this.gameSpeed;
        this.time.delayedCall(delay, () => {
            if (this.hasEnded) return;
            this.watching = !this.watching;
            if (this.watching) {
                this.statusText.setText('WOLF SCHAUT!').setColor('#ff3355');
                this.wolf.setText('👀');
                this.tweens.add({ targets: this.wolf, scale: 1.25, duration: 120, yoyo: true });
            } else {
                this.statusText.setText('WOLF SCHLÄFT').setColor('#00ff88');
                this.wolf.setText('🐺');
            }
            this.scheduleWolf();
        });
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;

        const moving = this.isRight() || this.isLeft();
        if (this.isRight()) this.playerX += 250 * dt;
        if (this.isLeft()) this.playerX -= 250 * dt;
        this.playerX = Phaser.Math.Clamp(this.playerX, 30, 780);
        this.player.x = this.playerX;

        if (moving && this.player.play) this.player.play('kaeppchen_right', true);
        else if (this.player.play) this.player.play('kaeppchen_idle', true);

        // Beim Blick des Wolfs ist jede Bewegung tödlich
        if (this.watching && moving && !this.inputBufferActive) {
            this.cameras.main.shake(150, 0.015);
            this.lose();
            return;
        }
        if (this.playerX >= 720) this.win();
    }
}

// EdgarGolf - Kraft dosieren und einlochen
class EdgarGolf extends BaseMicrogame {
    constructor() { super({ key: 'EdgarGolf' }); }
    create() {
        super.create();

        this.gameTitle('MINIGOLF!', '#ffffff');
        this.hint('SPACE: Kraft stoppen und schlagen');

        // Loch an wechselnder Position
        this.holeX = Phaser.Math.Between(480, 700);
        this.add.ellipse(this.holeX, 420, 60, 26, 0x000000);
        this.add.rectangle(this.holeX, 375, 4, 60, 0xffffff);
        this.add.triangle(this.holeX + 16, 355, 0, 0, 0, 24, 30, 12, 0xff3355);

        this.edgarX = 130;
        this.edgar = this.textures.exists('edgar')
            ? this.add.image(this.edgarX, 420, 'edgar').setScale(2.2)
            : this.add.circle(this.edgarX, 420, 18, 0x9B59B6);

        // Kraftbalken
        this.add.rectangle(400, 520, 404, 30, 0x000000, 0.5);
        this.add.rectangle(400, 520, 404, 30).setStrokeStyle(2, 0xffffff, 0.6);
        this.powerBar = this.add.rectangle(200, 520, 0, 22, 0x00ff88).setOrigin(0, 0.5);
        // Reichweite bei voller Kraft (ergibt sich aus Anstoß + Ausrollen);
        // daraus wird die Idealmarkierung berechnet, damit sie wirklich stimmt.
        this.travelFactor = 690;
        const ideal = Phaser.Math.Clamp((this.holeX - this.edgarX) / this.travelFactor, 0, 1);
        this.add.rectangle(200 + 400 * ideal, 520, 6, 34, 0xffd93d);
        this.add.rectangle(200 + 400 * ideal, 520, 34, 30, 0xffd93d, 0.2);

        this.power = 0;
        this.powerDir = 1;
        this.shot = false;
        this.velX = 0;

        this.input.keyboard.on('keydown-SPACE', () => this.shoot());
        this.input.on('pointerdown', () => this.shoot());
        this.startTimer();
    }
    shoot() {
        if (this.hasEnded || this.shot || this.inputBufferActive) return;
        this.shot = true;
        this.velX = this.power * 620;   // Kraft in Reichweite umrechnen
        musicEngine.playSFX('click');
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;

        if (!this.shot) {
            this.power += this.powerDir * 1.1 * dt * this.gameSpeed;
            if (this.power >= 1) { this.power = 1; this.powerDir = -1; }
            if (this.power <= 0) { this.power = 0; this.powerDir = 1; }
            this.powerBar.width = 400 * this.power;
            return;
        }

        // Ausrollen
        this.velX *= 0.985;
        this.edgarX += this.velX * dt;
        this.edgar.x = this.edgarX;
        this.edgar.angle += this.velX * dt * 2;

        // Großzügige Lochweite: der Ball fällt rein, solange er nicht rast
        if (Math.abs(this.edgarX - this.holeX) < 30 && Math.abs(this.velX) < 420) {
            Effects.burst(this, this.holeX, 420, 0xffd93d, 16, 110);
            this.win();
            return;
        }
        if (this.edgarX > 790 || Math.abs(this.velX) < 8) this.lose();
    }
}

// EdgarBrick - Steine mit dem Paddel abräumen
class EdgarBrick extends BaseMicrogame {
    constructor() { super({ key: 'EdgarBrick' }); }
    create() {
        super.create();
        this.gradientBackground(0x1a1a3e, 0x07070f);
        this.gameTitle('STEINE!', '#9B59B6');
        this.hint('← → Paddel bewegen');

        this.broken = 0;
        this.target = 3;
        this.counterText = this.counter('0 / ' + this.target, '#9B59B6');

        // Steine
        this.bricks = [];
        const colors = [0xff6b6b, 0xffd93d, 0x00d4ff, 0x00ff88];
        for (let r = 0; r < 2; r++) {
            for (let c = 0; c < 6; c++) {
                const b = this.add.rectangle(120 + c * 112, 160 + r * 44, 96, 30, colors[(r + c) % colors.length]);
                b.setStrokeStyle(2, 0xffffff, 0.5);
                b.alive = true;
                this.bricks.push(b);
            }
        }

        this.paddleX = 400;
        this.paddle = this.add.rectangle(this.paddleX, 520, 130, 16, 0x9B59B6).setStrokeStyle(2, 0xffffff);

        this.ballX = 400; this.ballY = 460;
        this.ballVX = Phaser.Math.Between(0, 1) ? 220 : -220;
        this.ballVY = -300;
        this.ball = this.textures.exists('edgar')
            ? this.add.image(this.ballX, this.ballY, 'edgar').setScale(1.6)
            : this.add.circle(this.ballX, this.ballY, 13, 0xffffff);

        this.cursors = this.input.keyboard.createCursorKeys();
        this.startTimer();
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;

        if (this.isLeft()) this.paddleX -= 480 * dt;
        if (this.isRight()) this.paddleX += 480 * dt;
        this.paddleX = Phaser.Math.Clamp(this.paddleX, 70, 730);
        this.paddle.x = this.paddleX;

        this.ballX += this.ballVX * dt;
        this.ballY += this.ballVY * dt;

        if (this.ballX < 20 || this.ballX > 780) this.ballVX *= -1;
        if (this.ballY < 110) this.ballVY = Math.abs(this.ballVY);

        // Paddel
        if (this.ballY > 500 && this.ballY < 528 && Math.abs(this.ballX - this.paddleX) < 72 && this.ballVY > 0) {
            this.ballVY = -Math.abs(this.ballVY);
            this.ballVX = ((this.ballX - this.paddleX) / 65) * 300;
            musicEngine.playSFX('click');
        }

        // Steine treffen
        for (const b of this.bricks) {
            if (!b.alive) continue;
            if (Math.abs(this.ballX - b.x) < 56 && Math.abs(this.ballY - b.y) < 24) {
                b.alive = false;
                Effects.burst(this, b.x, b.y, b.fillColor, 8, 60);
                b.destroy();
                this.ballVY *= -1;
                this.broken++;
                this.counterText.setText(this.broken + ' / ' + this.target);
                if (this.broken >= this.target) { this.win(); return; }
                break;
            }
        }

        this.ball.x = this.ballX;
        this.ball.y = this.ballY;
        this.ball.angle += this.ballVX * dt;

        if (this.ballY > 580) this.lose();
    }
}

            delay: Math.max(280, 550 / this.gameSpeed),
            callback: this.pickTarget, callbackScope: this, loop: true
        });
        this.startTimer();
    }
    pickTarget() {
        if (this.hasEnded) return;
        this.targetX = Phaser.Math.Between(90, 710);
        this.targetY = Phaser.Math.Between(150, 470);
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;
        // Ruckartige Annäherung ans Ziel wirkt wie echtes Fliegenflattern
        this.flyX += (this.targetX - this.flyX) * 2.2 * dt + Phaser.Math.Between(-3, 3);
        this.flyY += (this.targetY - this.flyY) * 2.2 * dt + Phaser.Math.Between(-3, 3);
        this.fly.setPosition(this.flyX, this.flyY);
        const p = this.input.activePointer;
        this.swatter.setPosition(p.x + 18, p.y + 18);
    }
}

// BlowCandles - alle Kerzen auspusten
class BlowCandles extends BaseMicrogame {
    constructor() { super({ key: 'BlowCandles' }); }
    create() {
        super.create();
        this.gradientBackground(0x2b1b3d, 0x0d0616);
        this.hint('Hämmere SPACE zum Pusten!', 560);

        // Torte
        this.add.rectangle(400, 430, 300, 110, 0xf4a7b9).setStrokeStyle(4, 0xd6849a);
        this.add.rectangle(400, 388, 300, 22, 0xfff0f3);

        this.candles = [];
        const count = 5;
        for (let i = 0; i < count; i++) {
            const x = 290 + i * 55;
            this.add.rectangle(x, 350, 12, 60, 0xfffacd).setStrokeStyle(2, 0xd8d0a0);
            const flame = this.add.ellipse(x, 310, 16, 26, 0xffa726);
            const glow = this.add.ellipse(x, 310, 30, 44, 0xffcc33, 0.25);
            this.tweens.add({ targets: [flame, glow], scaleY: 1.25, duration: 240, yoyo: true, repeat: -1, delay: i * 60 });
            this.candles.push({ flame, glow, lit: true });
        }

        this.blow = 0;
        this.needed = 12;
        this.counterText = this.counter('Puste!', '#ffd93d');

        const doBlow = () => {
            if (this.hasEnded || this.inputBufferActive) return;
            this.blow++;
            const perCandle = this.needed / count;
            const shouldOut = Math.floor(this.blow / perCandle);
            this.candles.forEach((c, i) => {
                if (c.lit && i < shouldOut) {
                    c.lit = false;
                    this.tweens.add({
                        targets: [c.flame, c.glow], alpha: 0, scaleY: 0.2, y: '-=18', duration: 180,
                        onComplete: () => { c.flame.destroy(); c.glow.destroy(); }
                    });
                    musicEngine.playSFX('click');
                }
            });
            const left = this.candles.filter(c => c.lit).length;
            this.counterText.setText(left > 0 ? left + ' Kerzen übrig' : 'Alle aus!');
            if (left === 0) this.win();
        };
        this.input.keyboard.on('keydown-SPACE', doBlow);
        this.input.keyboard.on('keydown', (e) => { if (e && (e.repeat || e.keyCode === 32)) return; doBlow(); });
        this.input.on('pointerdown', doBlow);
        this.startTimer();
    }
}

                targets: this.foot, y: 430, duration: 90, ease: 'Quad.easeIn',

// BalloonPop - platze nur die Ballons in der gezeigten Farbe

        const colors = [
            { c: 0xff4757, n: 'ROT' }, { c: 0x2ed573, n: 'GRÜN' },
            { c: 0xffa502, n: 'ORANGE' }, { c: 0x5352ed, n: 'BLAU' }
        ];

        this.popped = 0;
        this.counterText = this.counter('0 / ' + need, '#ffffff');

        // Farbige Ballons verteilen, davon genug in der Zielfarbe
        const total = this.diff(8, 10, 12);
        const list = [];
        for (let i = 0; i < total; i++) {
            list.push(i < need + 1 ? target : Phaser.Utils.Array.GetRandom(colors.filter(c => c.c !== target.c)));
        }
        Phaser.Utils.Array.Shuffle(list).forEach((col, i) => {

                    musicEngine.playSFX('click');

// TrafficLight - bei Grün losfahren, bei Rot sofort stehen bleiben
class TrafficLight extends BaseMicrogame {
    constructor() { super({ key: 'TrafficLight' }); }
    create() {
        super.create();
        this.gradientBackground(0x9be36d, 0x54b34a);
        this.gameTitle('AMPEL!', '#ffffff');
        this.hint('→ halten bei Grün, loslassen bei Rot');

        this.add.rectangle(400, 520, 800, 120, 0x555f6e);
        for (let x = 20; x < 800; x += 70) this.add.rectangle(x, 520, 36, 6, 0xffffff, 0.8);

        // Ampel
        this.add.rectangle(660, 190, 74, 190, 0x2f3542).setStrokeStyle(4, 0x1e2129);
        this.lampRed = this.add.circle(660, 140, 24, 0x4a1520);
        this.lampGreen = this.add.circle(660, 240, 24, 0x14401f);

        this.carX = 80;
        this.car = CharacterManager.draw(this, this.carX, 462, 0.9);
        this.goal = 620;
        this.add.rectangle(this.goal, 470, 6, 120, 0xffffff, 0.7);
        this.add.text(this.goal, 390, 'ZIEL', { font: 'bold 14px Orbitron', fill: '#ffffff' }).setOrigin(0.5);

        this.green = true;
        this.setLight(true);
        this.scheduleSwitch();
        this.cursors = this.input.keyboard.createCursorKeys();
        this.startTimer();
    }
    setLight(green) {
        this.green = green;
        if (!green) this.redAt = this.time.now;
        this.lampRed.setFillStyle(green ? 0x4a1520 : 0xff3b4e);
        this.lampGreen.setFillStyle(green ? 0x2ed573 : 0x14401f);
        if (!green) Juice.flash(this, 0xff3b4e, 0.18, 180);
    }
    scheduleSwitch() {
        if (this.hasEnded) return;
        const wait = this.green ? Phaser.Math.Between(800, 1350) / this.gameSpeed : Phaser.Math.Between(360, 600);
        this.time.delayedCall(wait, () => {
            if (this.hasEnded) return;
            this.setLight(!this.green);
            this.scheduleSwitch();
        });
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;
        const moving = this.isRight();
        if (moving) {
            this.carX += 520 * dt;
            this.car.x = this.carX;
            // Kleine Schrecksekunde, sonst waere Rot nicht fair zu erwischen
            if (!this.green && !this.inputBufferActive && this.time.now - this.redAt > 350) {
                Juice.shake(this, 1, 220); this.lose(); return;
            }
        }
        if (this.carX >= this.goal) this.win();
    }
}

// SockMatch - finde das passende Sockenpaar
class SockMatch extends BaseMicrogame {
    constructor() { super({ key: 'SockMatch' }); }
    create() {
        super.create();
        this.gradientBackground(0xffd45e, 0xf0a93b);
        this.gameTitle('SOCKEN!', '#5a3b00');
        this.hint('Klicke die zwei gleichen Socken');

        const palette = [0xff4757, 0x2ed573, 0x3742fa, 0xffd32a, 0x00d2d3, 0xff7f11, 0xa55eea];
        const pairColor = Phaser.Utils.Array.GetRandom(palette);
        const others = Phaser.Utils.Array.Shuffle(palette.filter(c => c !== pairColor));

        const slots = this.diff(6, 8, 8);
        const list = [pairColor, pairColor];
        for (let i = 0; i < slots - 2; i++) list.push(others[i % others.length]);
        Phaser.Utils.Array.Shuffle(list);

        this.found = 0;
        const cols = 4;
        list.forEach((col, i) => {
            const x = 180 + (i % cols) * 150, y = 240 + Math.floor(i / cols) * 150;
            const sock = this.add.container(x, y);
            const g = this.add.graphics();
            g.fillStyle(col, 1);
            g.fillRoundedRect(-22, -50, 44, 74, 10);       // Schaft
            g.fillRoundedRect(-22, 10, 68, 40, 14);        // Fuß
            g.fillStyle(0xffffff, 0.85);
            g.fillRect(-22, -50, 44, 12);                   // Bündchen
            g.lineStyle(3, 0x00000033);
            g.strokeRoundedRect(-22, -50, 44, 74, 10);
            sock.add(g);
            sock.setInteractive(new Phaser.Geom.Rectangle(-30, -55, 90, 110), Phaser.Geom.Rectangle.Contains, { useHandCursor: true });
            this.tweens.add({ targets: sock, angle: Phaser.Math.Between(-6, 6), duration: 1100 + i * 70, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
            sock.on('pointerdown', () => {
                if (this.hasEnded || this.inputBufferActive || sock.taken) return;
                if (col === pairColor) {
                    sock.taken = true;
                    this.found++;
                    FX.burst(this, x, y, col, 10, 80);
                    musicEngine.playSFX('click');
                    this.tweens.add({ targets: sock, scaleX: 1.25, scaleY: 1.25, alpha: 0.35, duration: 180 });
                    if (this.found >= 2) this.win();
                } else this.lose();
            });
        });
        this.startTimer();
    }
}

        this.hint('SPACE hämmern, bis die Blume aufblüht');

        this.add.rectangle(400, 486, 800, 16, 0x5fa832);
        this.add.ellipse(400, 500, 190, 46, 0x7a4a22);

        this.need = this.diff(10, 12, 15);

        this.stem = this.add.rectangle(400, 470, 12, 10, 0x3f9c34).setOrigin(0.5, 1);
        this.petals = [];
        for (let i = 0; i < 6; i++) {
            const a = (Math.PI * 2 * i) / 6;
            const p = this.add.ellipse(400 + Math.cos(a) * 34, 470 + Math.sin(a) * 34, 40, 26, 0xff5c8a)
                .setRotation(a).setScale(0);
            this.petals.push({ node: p, a });
        }
        this.core = this.add.circle(400, 470, 20, 0xffd93d).setScale(0);
        this.counterText = this.counter('0%', '#0a3d52');

        const water = () => {
            if (this.hasEnded || this.inputBufferActive) return;
            this.growth++;
            const k = Math.min(1, this.growth / this.need);
            this.stem.height = 10 + k * 150;
            const headY = 470 - k * 150;
            this.core.setPosition(400, headY).setScale(k);
            this.petals.forEach(p => {
                p.node.setPosition(400 + Math.cos(p.a) * 34 * k, headY + Math.sin(p.a) * 34 * k).setScale(k);
            });
            this.counterText.setText(Math.round(k * 100) + '%');
            // Wassertropfen
            const d = this.add.circle(Phaser.Math.Between(360, 440), 220, 5, 0x6bd6ff);
            this.tweens.add({ targets: d, y: headY, alpha: 0, duration: 260, onComplete: () => d.destroy() });
            if (this.growth >= this.need) { FX.burst(this, 400, headY, 0xff5c8a, 20, 160); this.win(); }
        };
        this.input.keyboard.on('keydown', (e) => { if (e && e.repeat) return; water(); });
        this.input.on('pointerdown', water);
        this.startTimer();
    }
}

// GoalkeeperDive - in die richtige Ecke hechten
class GoalkeeperDive extends BaseMicrogame {
    constructor() { super({ key: 'GoalkeeperDive' }); }
    create() {
        super.create();
        this.gradientBackground(0x6fd86f, 0x2f9440);
        this.gameTitle('HALTEN!', '#ffffff');
        this.hint('Achte auf den Anlauf – dann ← oder →');

        // Tor
        this.add.rectangle(400, 210, 560, 14, 0xffffff);
        this.add.rectangle(126, 300, 14, 194, 0xffffff);
        this.add.rectangle(674, 300, 14, 194, 0xffffff);
        for (let x = 146; x < 668; x += 34) this.add.rectangle(x, 300, 2, 180, 0xffffff, 0.28);
        this.add.rectangle(400, 470, 800, 90, 0x3c8a3c, 0.35);

        this.keeper = CharacterManager.draw(this, 400, 360, 0.85);
        this.side = Phaser.Math.Between(0, 1) ? -1 : 1;
        this.dir = 0;

        // Schuetze unten mit sichtbarem Anlauf - das ist die Vorwarnung
        this.shooter = this.add.text(400, 540, '🦶', { font: '46px Arial' }).setOrigin(0.5);
        this.ball = this.add.circle(400, 520, 17, 0xffffff).setStrokeStyle(3, 0x222222).setDepth(6);
        this.ballT = 0;
        this.flight = 620;
        this.shootDelay = this.diff(1500, 1200, 950) / this.gameSpeed;
        this.tellDone = false;
        this.resolved = false;

        const dive = (dir) => {
            if (this.hasEnded || this.dir !== 0 || this.inputBufferActive) return;
            this.dir = dir;
            this.tweens.add({ targets: this.keeper, x: 400 + dir * 200, y: 330, angle: dir * 62, duration: 200, ease: 'Quad.easeOut' });
        };
        this.input.keyboard.on('keydown', (e) => {
            if (!e) return;
            if (e.keyCode === 37 || e.keyCode === 65) dive(-1);
            else if (e.keyCode === 39 || e.keyCode === 68) dive(1);
        });
        this.input.on('pointerdown', (p) => dive(p.x < 400 ? -1 : 1));
        this.startTimer();
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;
        this.ballT += dt * 1000;

        // Kurz vor dem Schuss stellt sich der Schuetze sichtbar auf eine Seite
        if (!this.tellDone && this.ballT > this.shootDelay - 320) {
            this.tellDone = true;
            this.tweens.add({ targets: this.shooter, x: 400 - this.side * 46, angle: -this.side * 22, duration: 200 });
        }
        if (this.ballT > this.shootDelay) {
            const k = Math.min(1, (this.ballT - this.shootDelay) / this.flight);
            this.ball.x = 400 + this.side * 200 * k;
            this.ball.y = 520 - 230 * k;
            this.ball.setScale(1 - k * 0.3);
            if (k >= 1 && !this.resolved) {
                this.resolved = true;
                if (this.dir === this.side) { FX.burst(this, this.ball.x, this.ball.y, 0xffffff, 18, 140); this.win(); }
                else this.lose();
            }
        }
    }
}

// StarConnect - die Sterne in der richtigen Reihenfolge verbinden
class StarConnect extends BaseMicrogame {
    constructor() { super({ key: 'StarConnect' }); }
    create() {
        super.create();
        this.gradientBackground(0x7b5cd6, 0x3b2580);
        this.gameTitle('STERNBILD!', '#ffffff');
        this.hint('Klicke die Sterne der Reihe nach: 1, 2, 3 …');

        const n = this.diff(4, 5, 6);
        this.next = 1;
        this.lines = this.add.graphics().setDepth(5);
        this.points = [];

        const spots = [];
        for (let i = 0; i < n; i++) {
            let x, y, tries = 0;
            do {
                x = Phaser.Math.Between(140, 660); y = Phaser.Math.Between(180, 470); tries++;
            } while (spots.some(s => Phaser.Math.Distance.Between(s.x, s.y, x, y) < 130) && tries < 40);
            spots.push({ x, y });
        }

        spots.forEach((s, i) => {
            const num = i + 1;
            const star = this.add.text(s.x, s.y, '⭐', { font: '46px Arial' }).setOrigin(0.5).setDepth(10)
                .setInteractive({ useHandCursor: true });
            const label = this.add.text(s.x, s.y + 34, String(num), {
                font: 'bold 20px Orbitron', fill: '#ffffff', stroke: '#000000', strokeThickness: 4
            }).setOrigin(0.5).setDepth(11);
            this.tweens.add({ targets: star, scale: 1.12, duration: 700 + i * 90, yoyo: true, repeat: -1 });
            this.points.push({ x: s.x, y: s.y });
            star.on('pointerdown', () => {
                if (this.hasEnded || this.inputBufferActive) return;
                if (num !== this.next) { this.lose(); return; }
                star.setTint(0xffe066);
                label.setColor('#ffd93d');
                FX.burst(this, s.x, s.y, 0xffe066, 10, 80);
                musicEngine.playSFX('click');
                if (this.next > 1) {
                    const p = this.points[this.next - 2];
                    this.lines.lineStyle(4, 0xffe066, 0.9);
                    this.lines.lineBetween(p.x, p.y, s.x, s.y);
                }
                this.next++;
                if (this.next > n) { Juice.flash(this, 0xffe066, 0.4, 260); this.win(); }
            });
        });
        this.startTimer();
    }
}

                if (this.hasEnded) return;
                const good = Phaser.Math.Between(0, 7) > 0;
                const n = this.add.text(Phaser.Math.Between(70, 730), -30, good ? '🍰' : '🥦', { font: '40px Arial' }).setOrigin(0.5);
                n.vy = Phaser.Math.Between(260, 360) * this.gameSpeed;
                n.good = good;
                this.items.push(n);
            }
        });
        this.startTimer();
    }
    update(time, delta) {
        super.update();
        if (this.hasEnded) return;
        const dt = Math.min(delta, 50) / 1000;
        this.plateX = Phaser.Math.Clamp(this.input.activePointer.x || 400, 80, 720);
        this.plate.x = this.plateX;

        for (let i = this.items.length - 1; i >= 0; i--) {
            const it = this.items[i];
            it.y += it.vy * dt;
            it.rotation += dt * 1.2;
            if (it.y > 640) { it.destroy(); this.items.splice(i, 1); continue; }
            if (Math.abs(it.x - this.plateX) < 80 && it.y > 468 && it.y < 522) {
                const good = it.good;
                it.destroy(); this.items.splice(i, 1);
                if (good) {
                    this.caught++;
                    FX.burst(this, this.plateX, 490, 0xffd93d, 10, 80);
                    musicEngine.playSFX('click');
                } else {
                    // Gemuese kostet einen Punkt - aerglich, aber nicht sofort verloren
                    this.caught = Math.max(0, this.caught - 1);
                    FX.burst(this, this.plateX, 490, 0x4caf50, 10, 80);
                    Juice.shake(this, 0.6, 180);
                    musicEngine.playSFX('heartbreak');
                }
                this.counterText.setText(this.caught + ' / ' + this.need);
                if (this.caught >= this.need) this.win();
                return;
            }
        }
    }
}

        this.lastX = null;
        this.scrub = 0;
        this.need = this.diff(1600, 2100, 2700);
        this.counterText = this.counter('0%', '#08405a');
        this.startTimer();
    }

        super.update();
        if (this.hasEnded) return;
        const p = this.input.activePointer;
        this.brush.setPosition(p.x, p.y);
        if (this.lastX !== null) {
            const moved = Math.abs(p.x - this.lastX);
            // Nur zaehlen, wenn die Buerste ueber den Zaehnen ist
            if (p.y > 200 && p.y < 330) {
                this.scrub += moved;
                const k = Math.min(1, this.scrub / this.need);
                this.counterText.setText(Math.round(k * 100) + '%');
                this.teeth.forEach((t, i) => {
                    const local = Phaser.Math.Clamp(k * this.teeth.length - i, 0, 1);
                    const c = Phaser.Display.Color.Interpolate.ColorWithColor(
                        Phaser.Display.Color.ValueToColor(0xd8cf9a),
                        Phaser.Display.Color.ValueToColor(0xffffff), 100, Math.floor(local * 100));
                    t.setFillStyle(Phaser.Display.Color.GetColor(c.r, c.g, c.b));
                    if (local >= 1 && !t.sparkled) {
                        t.sparkled = true;
                        FX.burst(this, t.x, t.y, 0xffffff, 6, 50);
                    }
                });
                if (k >= 1) { Juice.flash(this, 0xffffff, 0.45, 240); this.win(); }
            }
        }
        this.lastX = p.x;
    }
}

// BOSS GAMES
class BossGame extends BaseMicrogame {
    constructor() { super({ key: 'BossGame' }); }
    create() {
        super.create();
        this.markAsBoss();
        this.gradientBackground(0x000000, 0x000000);

        // Anleitung
        this.add.text(400, 560, '← → Bewegen | SPACE Schießen', { font: '14px Orbitron', fill: '#888' }).setOrigin(0.5);

        // Spieler
        this.player = this.add.rectangle(400, 520, 50, 50, 0x00ff88);
        this.physics.add.existing(this.player);
        this.player.body.setCollideWorldBounds(true);
        this.cursors = this.input.keyboard.createCursorKeys();

        // Boss
        this.boss = this.add.rectangle(400, 100, 100, 80, 0xff0000);
        this.boss.health = Math.floor(10 * this.gameSpeed);
        this.bossMaxHealth = this.boss.health;
        this.tweens.add({
            targets: this.boss,
            x: { from: 100, to: 700 },
            duration: 2000,
            ease: 'Sine.easeInOut',
            yoyo: true,
            repeat: -1
        });

        // Health Bar
        this.healthBar = this.add.graphics();
        this.updateHealthBar();

        // Bullet Arrays
        this.playerBullets = [];
        this.bossBullets = [];

        // Input
        this.input.keyboard.on('keydown-SPACE', () => this.shoot());

        // Boss schießt regelmäßig
        this.time.addEvent({
            delay: 1200 / this.gameSpeed,
            callback: this.bossShoot,
            callbackScope: this,
            loop: true
        });
    }
    updateHealthBar() {
        this.drawBossHealth(this.healthBar, this.boss.health, this.bossMaxHealth, 200, 20);
    }
    shoot() {
        if (this.hasEnded) return;
        const bullet = this.add.rectangle(this.player.x, this.player.y - 30, 8, 24, 0x00ffff);
        this.physics.add.existing(bullet);
        bullet.body.setVelocityY(-500);
        this.playerBullets.push(bullet);
    }
    bossShoot() {
        if (this.hasEnded) return;
        const bullet = this.add.circle(this.boss.x, this.boss.y + 50, 12, 0xff00ff);
        this.physics.add.existing(bullet);
        // Richtung zum Spieler berechnen
        const angle = Phaser.Math.Angle.Between(this.boss.x, this.boss.y, this.player.x, this.player.y);
        const speed = 250 * this.gameSpeed;
        bullet.body.setVelocity(Math.cos(angle) * speed, Math.sin(angle) * speed);
        this.bossBullets.push(bullet);
    }
    hitBoss(bullet) {
        bullet.destroy();
        this.boss.health--;
        this.updateHealthBar();
        this.cameras.main.shake(50, 0.01);
        if (this.boss.health <= 0) this.win();
    }
    win() {
        if (this.hasEnded) return;
        this.hasEnded = true;
        this.cameras.main.flash(400, 255, 215, 0);
        musicEngine.playSFX('win');
        if (this.parentScene) { this.parentScene.bossWon(); this.scene.stop(); }
    }
    lose() {
        if (this.hasEnded) return;
        this.hasEnded = true;
        this.cameras.main.shake(200, 0.02);
        this.cameras.main.flash(150, 255, 0, 0);
        musicEngine.playSFX('lose');
        if (this.parentScene) { this.parentScene.microgameLost('BossGame'); this.scene.stop(); }
    }
    update() {
        if (this.hasEnded) return;

        // Spieler Bewegung
        this.player.body.setVelocityX(0);
        if (this.isLeft()) this.player.body.setVelocityX(-400);
        else if (this.isRight()) this.player.body.setVelocityX(400);

        // Spieler-Bullets prüfen
        for (let i = this.playerBullets.length - 1; i >= 0; i--) {
            const b = this.playerBullets[i];
            if (!b.active) { this.playerBullets.splice(i, 1); continue; }
            if (b.y < 0) { b.destroy(); this.playerBullets.splice(i, 1); continue; }
            // Kollision mit Boss
            if (Phaser.Geom.Intersects.RectangleToRectangle(b.getBounds(), this.boss.getBounds())) {
                this.hitBoss(b);
                this.playerBullets.splice(i, 1);
            }
        }

        // Boss-Bullets prüfen
        for (let i = this.bossBullets.length - 1; i >= 0; i--) {
            const b = this.bossBullets[i];
            if (!b.active) { this.bossBullets.splice(i, 1); continue; }
            if (b.y > 600 || b.x < 0 || b.x > 800) { b.destroy(); this.bossBullets.splice(i, 1); continue; }
            // Kollision mit Spieler
            const dist = Phaser.Math.Distance.Between(b.x, b.y, this.player.x, this.player.y);
            if (dist < 35) {
                this.lose();
            }
        }
    }
    exitToMenu() { this.hasEnded = true; musicEngine.stopMusic(); this.scene.stop(); if (this.parentScene) this.parentScene.scene.stop(); this.scene.start('StartScreen'); }
}

class BoxingBoss extends BaseMicrogame {

        this.glove.setStrokeStyle(3, 0xffffff);
        this.input.on('pointermove', (p) => { this.glove.x = p.x; this.glove.y = p.y; });

        // Boss
        this.boss = this.add.rectangle(400, 300, 180, 180, 0x8b0000);
        this.boss.setStrokeStyle(4, 0xffffff);
        this.bossMaxHealth = Math.floor(12 * this.gameSpeed);
        this.boss.health = this.bossMaxHealth;
        this.boss.isBlocking = false;

        // Health Bar
        this.healthBar = this.add.graphics();
        this.updateHealthBar();

        // Block Text
        this.blockText = this.add.text(400, 300, 'BLOCK!', { font: 'bold 64px Orbitron', fill: '#ffff00' }).setOrigin(0.5).setVisible(false).setDepth(11);

        // Boss blockt regelmäßig
        this.time.addEvent({
            delay: 2500 / this.gameSpeed,
            callback: this.bossAction,
            callbackScope: this,
            loop: true
        });

        this.input.on('pointerdown', this.punch, this);
    }
    updateHealthBar() {
        this.drawBossHealth(this.healthBar, this.boss.health, this.bossMaxHealth, 200, 70);
    }
    bossAction() {
        if (this.hasEnded || this.boss.isBlocking) return;

        let count = 3;
        const countText = this.add.text(400, 150, '3', { font: 'bold 56px Orbitron', fill: '#ffff00' }).setOrigin(0.5);

        this.time.addEvent({
            delay: 400 / this.gameSpeed,
            callback: () => {
                count--;
                if (count > 0) {
                    countText.setText(count.toString());
                } else {
                    countText.destroy();
                    this.boss.isBlocking = true;
                    this.boss.setFillStyle(0xaaaaaa);
                    this.blockText.setVisible(true);
                    this.time.delayedCall(800 / this.gameSpeed, () => {
                        this.boss.isBlocking = false;
                        this.boss.setFillStyle(0x8b0000);
                        this.blockText.setVisible(false);
                    });
                }
            },
            repeat: 2
        });
    }
    punch(pointer) {
        if (this.hasEnded) return;
        if (Phaser.Geom.Rectangle.Contains(this.boss.getBounds(), pointer.x, pointer.y)) {
            if (this.boss.isBlocking) {
                this.lose();
            } else {
                this.boss.health--;
                this.updateHealthBar();
                this.cameras.main.shake(50, 0.01);
                // Treffer-Effekt
                this.boss.setFillStyle(0xff4444);
                this.time.delayedCall(100, () => {
                    if (!this.boss.isBlocking) this.boss.setFillStyle(0x8b0000);
                });
                if (this.boss.health <= 0) this.win();
            }
        }
    }
    win() {
        if (this.hasEnded) return;
        this.hasEnded = true;
        this.cameras.main.flash(400, 255, 215, 0);
        musicEngine.playSFX('win');
        if (this.parentScene) { this.parentScene.bossWon(); this.scene.stop(); }
    }
    lose() {
        if (this.hasEnded) return;
        this.hasEnded = true;
        this.cameras.main.shake(200, 0.02);
        this.cameras.main.flash(150, 255, 0, 0);
        musicEngine.playSFX('lose');
        if (this.parentScene) { this.parentScene.microgameLost('BoxingBoss'); this.scene.stop(); }
    }
    exitToMenu() { this.hasEnded = true; musicEngine.stopMusic(); this.scene.stop(); if (this.parentScene) this.parentScene.scene.stop(); this.scene.start('StartScreen'); }
}

            });

        this.add.text(400, 560, '← ↑ → ↓ Bewegen | SPACE Schießen', { font: '14px Orbitron', fill: '#888' }).setOrigin(0.5);

        // Swaggy (Spieler)
        this.swaggyX = 100;
        this.swaggyY = 300;
        if (this.textures.exists('swaggy')) {
            this.swaggy = this.add.image(this.swaggyX, this.swaggyY, 'swaggy').setScale(0.1);
        } else {
            this.swaggy = this.add.container(this.swaggyX, this.swaggyY);
            const fish = this.add.graphics();
            fish.fillStyle(0xFFA500, 1);
            fish.fillEllipse(0, 0, 50, 25);
            fish.fillTriangle(-25, 0, -40, -12, -40, 12);
            fish.fillStyle(0x000000, 1);
            fish.fillCircle(12, -3, 4);
            this.swaggy.add(fish);
        }

        // Boss - Großer Hai
        this.boss = this.add.container(600, 300);
        const sharkBody = this.add.graphics();
        sharkBody.fillStyle(0x4a4a4a, 1);
        sharkBody.fillEllipse(0, 0, 150, 60);
        sharkBody.fillTriangle(-75, 0, -110, -30, -110, 30);
        sharkBody.fillTriangle(0, -30, -20, -60, 20, -30);
        sharkBody.fillStyle(0xffffff, 1);
        sharkBody.fillEllipse(40, 5, 30, 20);
        sharkBody.fillStyle(0x000000, 1);
        sharkBody.fillCircle(50, 5, 8);
        // Zähne
        sharkBody.fillStyle(0xffffff, 1);
        for (let i = 0; i < 5; i++) {
            sharkBody.fillTriangle(60 + i * 8, 15, 64 + i * 8, 25, 68 + i * 8, 15);
        }
        this.boss.add(sharkBody);

        this.bossMaxHealth = Math.floor(8 * this.gameSpeed);
        this.bossHealth = this.bossMaxHealth;
        this.bossVX = 2;
        this.bossVY = 1.5;

        // Health Bar
        this.healthBar = this.add.graphics();
        this.updateHealthBar();

        // Projektile
        this.playerBullets = [];
        this.bossBullets = [];

        // Boss schießt
        this.time.addEvent({
            delay: 1500 / this.gameSpeed,
            callback: () => {
                if (this.hasEnded) return;
                const bullet = this.add.circle(this.boss.x - 80, this.boss.y, 8, 0xff0000);
                bullet.vx = -6;
                bullet.vy = (this.swaggyY - this.boss.y) * 0.02;
                this.bossBullets.push(bullet);
            },
            loop: true
        });

        // Steuerung
        this.cursors = this.input.keyboard.createCursorKeys();
        this.input.keyboard.on('keydown-SPACE', () => {
            if (this.hasEnded) return;
            const bullet = this.add.circle(this.swaggyX + 30, this.swaggyY, 6, 0x00ff00);
            bullet.vx = 8;
            this.playerBullets.push(bullet);
        });

    }

    updateHealthBar() {
        this.drawBossHealth(this.healthBar, this.bossHealth, this.bossMaxHealth, 200, 70, 400, 18, 0xff8800);
    }

    update() {
        if (this.hasEnded) return;

        // Swaggy bewegen
        const speed = 5;
        if (this.isLeft()) this.swaggyX -= speed;
        if (this.isRight()) this.swaggyX += speed;
        if (this.isUp()) this.swaggyY -= speed;
        if (this.isDown()) this.swaggyY += speed;

        this.swaggyX = Phaser.Math.Clamp(this.swaggyX, 30, 350);
        this.swaggyY = Phaser.Math.Clamp(this.swaggyY, 100, 520);
        this.swaggy.x = this.swaggyX;
        this.swaggy.y = this.swaggyY;

        // Boss bewegen
        this.boss.x += this.bossVX;
        this.boss.y += this.bossVY;
        if (this.boss.x < 450 || this.boss.x > 720) this.bossVX *= -1;
        if (this.boss.y < 150 || this.boss.y > 450) this.bossVY *= -1;

        // Spieler-Projektile (rückwärts, damit splice keine Einträge überspringt)
        for (let i = this.playerBullets.length - 1; i >= 0; i--) {
            const bullet = this.playerBullets[i];
            bullet.x += bullet.vx;
            if (bullet.x > 800) {
                bullet.destroy();
                this.playerBullets.splice(i, 1);
            } else if (Phaser.Math.Distance.Between(bullet.x, bullet.y, this.boss.x, this.boss.y) < 80) {
                Effects.burst(this, bullet.x, bullet.y, 0xffd93d, 8, 60);
                bullet.destroy();
                this.playerBullets.splice(i, 1);
                this.bossHealth--;
                this.updateHealthBar();
                this.cameras.main.shake(50, 0.005);
                if (this.bossHealth <= 0) { this.win(); return; }
            }
        }

        // Boss-Projektile
        for (let i = this.bossBullets.length - 1; i >= 0; i--) {
            const bullet = this.bossBullets[i];
            bullet.x += bullet.vx;
            bullet.y += bullet.vy;
            if (bullet.x < 0) {
                bullet.destroy();
                this.bossBullets.splice(i, 1);
            } else if (Phaser.Math.Distance.Between(bullet.x, bullet.y, this.swaggyX, this.swaggyY) < 25) {
                this.lose();
                return;
            }
        }
    }

    win() {
        if (this.hasEnded) return;
        this.hasEnded = true;
        this.cameras.main.flash(400, 255, 165, 0);
        musicEngine.playSFX('win');
        if (this.parentScene) { this.parentScene.bossWon(); this.scene.stop(); }
    }

    lose() {
        if (this.hasEnded) return;
        this.hasEnded = true;
        this.cameras.main.shake(200, 0.02);
        this.cameras.main.flash(150, 255, 0, 0);
        musicEngine.playSFX('lose');
        if (this.parentScene) { this.parentScene.microgameLost('SwaggyBoss'); this.scene.stop(); }
    }

    exitToMenu() {
        this.hasEnded = true;
        musicEngine.stopMusic();
        this.scene.stop();
        if (this.parentScene) this.parentScene.scene.stop();
        this.scene.start('StartScreen');
    }
}

        this.healthBar = this.add.graphics();
        this.updateHealthBar();

        // Äpfel zum Aufsammeln und Werfen
        this.apples = [];
        this.playerApples = 0;
        this.appleText = this.add.text(100, 560, 'Äpfel: 0', { font: '14px Orbitron', fill: '#ff0000' });

        // Äpfel spawnen
        this.time.addEvent({
            delay: 2000,
            callback: () => {
                if (this.hasEnded) return;
                const apple = this.add.circle(
                    Phaser.Math.Between(50, 350),
                    Phaser.Math.Between(100, 500),
                    10, 0xff0000
                );
                this.apples.push(apple);
            },
            loop: true
        });

        // Wolf greift an
        this.attacks = [];
        this.time.addEvent({
            delay: 1200,
            callback: () => {
                if (this.hasEnded) return;
                const attack = this.add.circle(this.bossX - 60, this.bossY, 12, 0x222222);
                attack.vx = -8;
                this.attacks.push(attack);
            },
            loop: true
        });

        this.cursors = this.input.keyboard.createCursorKeys();
        this.input.keyboard.on('keydown-SPACE', () => {
            if (this.hasEnded || this.playerApples <= 0) return;
            this.playerApples--;
            this.appleText.setText('Äpfel: ' + this.playerApples);
            const bullet = this.add.circle(this.playerX + 30, this.playerY, 8, 0xff0000);
            bullet.vx = 10;
            bullet.isPlayerBullet = true;
            this.attacks.push(bullet);
        });

    }

    updateHealthBar() {
        this.drawBossHealth(this.healthBar, this.bossHealth, this.bossMaxHealth, 550, 70, 200, 18);
    }

    // Ohne diese Überschreibungen wurde der Wolf-Sieg als normales Minispiel
    // gewertet: kein Extra-Leben, kein Bonus und vor allem kein Charakterwechsel.
    win() {
        if (this.hasEnded) return;
        this.hasEnded = true;
        this.cameras.main.flash(400, 230, 57, 70);
        Effects.burst(this, this.bossX, this.bossY, 0xE63946, 24, 240);
        musicEngine.playSFX('win');
        if (this.parentScene) { this.parentScene.bossWon(); this.scene.stop(); }
    }

    lose() {
        if (this.hasEnded) return;
        this.hasEnded = true;
        this.cameras.main.shake(200, 0.02);
        this.cameras.main.flash(150, 255, 0, 0);
        musicEngine.playSFX('lose');
        if (this.parentScene) { this.parentScene.microgameLost('KaeppchenBoss'); this.scene.stop(); }
    }

    update() {
        super.update();
        if (this.hasEnded) return;

        const speed = 5;
        if (this.isLeft()) {
            this.playerX -= speed;
            if (this.player.play) this.player.play('kaeppchen_left', true);
        } else if (this.isRight()) {
            this.playerX += speed;
            if (this.player.play) this.player.play('kaeppchen_right', true);
        } else if (this.isUp()) {
            this.playerY -= speed;
            if (this.player.play) this.player.play('kaeppchen_up', true);
        } else if (this.isDown()) {
            this.playerY += speed;
            if (this.player.play) this.player.play('kaeppchen_down', true);
        }

        this.playerX = Phaser.Math.Clamp(this.playerX, 30, 400);
        this.playerY = Phaser.Math.Clamp(this.playerY, 80, 530);
        this.player.x = this.playerX;
        this.player.y = this.playerY;

        // Wolf bewegt sich
        this.bossY += this.bossVY;
        if (this.bossY < 100 || this.bossY > 500) this.bossVY *= -1;
        this.boss.y = this.bossY;

        // Äpfel aufsammeln (rückwärts iterieren, sonst überspringt splice Einträge)
        for (let i = this.apples.length - 1; i >= 0; i--) {
            const apple = this.apples[i];
            if (Phaser.Math.Distance.Between(this.playerX, this.playerY, apple.x, apple.y) < 25) {
                apple.destroy();
                this.apples.splice(i, 1);
                this.playerApples++;
                this.appleText.setText('Äpfel: ' + this.playerApples);
                musicEngine.playSFX('click');
            }
        }

        // Angriffe bewegen
        for (let i = this.attacks.length - 1; i >= 0; i--) {
            const atk = this.attacks[i];
            atk.x += atk.vx || -8;

            if (atk.x < -20 || atk.x > 820) {
                atk.destroy();
                this.attacks.splice(i, 1);
                continue;
            }

            // Spieler getroffen
            if (!atk.isPlayerBullet && Phaser.Math.Distance.Between(this.playerX, this.playerY, atk.x, atk.y) < 25) {
                this.lose();
            }

            // Boss getroffen
            if (atk.isPlayerBullet && Phaser.Math.Distance.Between(this.bossX, this.bossY, atk.x, atk.y) < 60) {
                atk.destroy();
                this.attacks.splice(i, 1);
                this.bossHealth--;
                this.updateHealthBar();
                this.cameras.main.shake(100, 0.01);
                if (this.bossHealth <= 0) this.win();
            }
        }
    }

    exitToMenu() {
        this.hasEnded = true;
        musicEngine.stopMusic();
        this.scene.stop();
        if (this.parentScene) this.parentScene.scene.stop();
        this.scene.start('StartScreen');
    }
}

// Edgar Boss - Flipper/Pinball Boss
class EdgarBoss extends BaseMicrogame {
    constructor() { super({ key: 'EdgarBoss' }); }
    create() {
        super.create();
        this.markAsBoss();
        this.gradientBackground(0x1a1a2e, 0x1a1a2e);

        this.add.text(400, 30, 'EDGAR BOSS!', { font: 'bold 34px Orbitron', fill: '#9B59B6' }).setOrigin(0.5);
        this.add.text(400, 560, '← → Paddle bewegen | Triff den Boss!', { font: '14px Orbitron', fill: '#888' }).setOrigin(0.5);

        // Boss oben
        this.bossX = 400;
        this.bossY = 100;
        this.boss = this.add.rectangle(this.bossX, this.bossY, 120, 60, 0xe74c3c);
        this.bossVX = 3;

        this.bossMaxHealth = 5;
        this.bossHealth = this.bossMaxHealth;

        // Health Bar
        this.healthBar = this.add.graphics();
        this.updateHealthBar();

        // Paddle unten
        this.paddleX = 400;
        this.paddle = this.add.rectangle(this.paddleX, 520, 100, 15, 0x3498db);

        // Edgar (der Ball)
        this.edgarX = 400;
        this.edgarY = 450;
        this.edgarVX = 4;
        this.edgarVY = -5;

        if (this.textures.exists('edgar')) {
            this.edgar = this.add.image(this.edgarX, this.edgarY, 'edgar').setScale(2.0);
        } else {
            this.edgar = this.add.circle(this.edgarX, this.edgarY, 20, 0x9B59B6);
        }

        this.cursors = this.input.keyboard.createCursorKeys();
    }

    updateHealthBar() {
        this.drawBossHealth(this.healthBar, this.bossHealth, this.bossMaxHealth, 300, 70, 200, 18, 0xe74c3c);
    }

    update() {
        super.update();
        if (this.hasEnded) return;

        // Paddle bewegen
        if (this.isLeft()) {
            this.paddleX -= 8;
        } else if (this.isRight()) {
            this.paddleX += 8;
        }
        this.paddleX = Phaser.Math.Clamp(this.paddleX, 60, 740);
        this.paddle.x = this.paddleX;

        // Boss bewegen
        this.bossX += this.bossVX;
        if (this.bossX < 80 || this.bossX > 720) this.bossVX *= -1;
        this.boss.x = this.bossX;

        // Edgar (Ball) bewegen
        this.edgarX += this.edgarVX;
        this.edgarY += this.edgarVY;
        this.edgar.x = this.edgarX;
        this.edgar.y = this.edgarY;
        this.edgar.angle += this.edgarVX * 2;

        // Wand-Kollision
        if (this.edgarX < 30 || this.edgarX > 770) {
            this.edgarVX *= -1;
        }
        if (this.edgarY < 50) {
            this.edgarVY *= -1;
        }

        // Paddle-Kollision
        if (this.edgarY > 500 && this.edgarY < 530 &&
            this.edgarX > this.paddleX - 60 && this.edgarX < this.paddleX + 60) {
            this.edgarVY = -Math.abs(this.edgarVY);
            // Winkel basierend auf Aufprallpunkt
            const diff = (this.edgarX - this.paddleX) / 50;
            this.edgarVX = diff * 6;
            musicEngine.playSFX('click');
        }

        // Ball verloren
        if (this.edgarY > 580) {
            this.lose();
        }

        // Boss-Kollision
        if (this.edgarY < 140 && this.edgarY > 60 &&
            this.edgarX > this.bossX - 70 && this.edgarX < this.bossX + 70) {
            this.edgarVY = Math.abs(this.edgarVY);
            this.bossHealth--;
            this.updateHealthBar();
            this.cameras.main.shake(100, 0.01);
            if (this.bossHealth <= 0) this.win();
        }
    }

    win() {
        if (this.hasEnded) return;
        this.hasEnded = true;
        this.cameras.main.flash(200, 0, 255, 136);
        musicEngine.playSFX('win');
        if (this.parentScene) { this.parentScene.bossWon(); this.scene.stop(); }
    }

    exitToMenu() {
        this.hasEnded = true;
        musicEngine.stopMusic();
        this.scene.stop();
        if (this.parentScene) this.parentScene.scene.stop();
        this.scene.start('StartScreen');
    }
}

// ======================================================================
// LEVELAUFBAU
// Eine Stage besteht aus Wellen. Jede Welle hat mehr Spiele, eine höhere
// Schwierigkeitsstufe und mehr Tempo. Am Ende wartet der Boss.
// ======================================================================
const Director = {
    // Aufbau einer Charakter-Stage
    stagePlan: [
        { games: 4, level: 1, speed: 1.00, name: 'AUFWÄRMEN' },
        { games: 5, level: 2, speed: 1.16, name: 'ERNST WIRD ES' },
        { games: 5, level: 3, speed: 1.34, name: 'VOLLGAS' }
    ],

    // Endlos-Aufbau für den Wilden Mix: Wellen à 5 Spiele, Boss alle 3 Wellen
    mixWave(waveIndex) {
        return {
            games: 5,
            level: Math.min(3, 1 + Math.floor(waveIndex / 2)),
            speed: 1 + waveIndex * 0.11,
            name: 'WELLE ' + (waveIndex + 1),
            boss: waveIndex > 0 && (waveIndex + 1) % 3 === 0
        };
    }
};

        this.load.image('characters', 'characters.png');
    }

        Quality.detect(this.game);
        // Bildrate im Blick behalten und notfalls Effekte reduzieren

        const overlay = document.getElementById('boot-overlay');

            anim('kaeppchen_idle', 'kaeppchen', 0, 0, 1, 0);
        }
        this.scene.start('StartScreen');
    }
}

class PauseScene extends Phaser.Scene {
    constructor() { super({ key: 'PauseScene' }); }
    init(data) {
        this.resumeKeys = (data && data.resumeKeys) || [];
        this.returnScene = (data && data.returnScene) || 'StartScreen';
    }
    create() {
        Art.build(this);
        this.add.rectangle(400, 300, 800, 600, 0x04050c, 0.9);
        UI.panel(this, 400, 310, 430, 350, UI.GREEN, 0.08);
        const t = this.add.text(400, 176, 'PAUSE', { font: 'bold 48px Orbitron', fill: '#ffffff' }).setOrigin(0.5);
        t.setShadow(0, 0, '#00ff88', 20, false, true).setStroke('#00ff88', 3);

        UI.button(this, 400, 266, 270, 52, 'WEITER', { onClick: () => this.resumeGame() });
        UI.button(this, 400, 330, 270, 52, musicEngine.musicEnabled ? 'MUSIK: AN' : 'MUSIK: AUS', {
            color: UI.CYAN, filled: false,
            onClick: () => { musicEngine.toggleMusic(); this.scene.restart({ resumeKeys: this.resumeKeys, returnScene: this.returnScene }); }
        });
        UI.button(this, 400, 394, 270, 52, musicEngine.sfxEnabled ? 'SOUND: AN' : 'SOUND: AUS', {
            color: UI.CYAN, filled: false,
            onClick: () => { musicEngine.toggleSFX(); this.scene.restart({ resumeKeys: this.resumeKeys, returnScene: this.returnScene }); }
        });
        UI.button(this, 400, 458, 270, 52, 'AUFGEBEN', { color: UI.RED, onClick: () => this.quitToMenu() });
        this.add.text(400, 512, 'Handheld-Optik: ' + (Handheld.enabled() ? 'AN' : 'AUS') + '  (im Menü umschaltbar)',
            { font: '11px Orbitron', fill: '#6c7590' }).setOrigin(0.5);
        this.add.text(400, 530, 'ESC = weiterspielen', { font: '11px Orbitron', fill: '#4d5468' }).setOrigin(0.5);

        this.input.keyboard.on('keydown-ESC', () => this.resumeGame());
        this.input.keyboard.on('keydown-P', () => this.resumeGame());
    }
    resumeGame() {
        this.resumeKeys.forEach(k => { const s = this.scene.get(k); if (s) { s.isPaused = false; this.scene.resume(k); } });
        musicEngine.resumeMusic();
        this.scene.stop();
    }
    quitToMenu() {
        musicEngine.stopMusic(); musicEngine.wasPlaying = false;
        this.resumeKeys.forEach(k => { const s = this.scene.get(k); if (s) { s.isPaused = false; s.hasEnded = true; } this.scene.stop(k); });
        this.scene.stop();
        this.scene.start(this.returnScene);
    }
}

            this.add.text(s.x + 4, 360, String(s.v), { font: 'bold 15px Orbitron', fill: s.c }).setOrigin(0, 0.5);
        });
    }

    menuButtons() {
        UI.button(this, 400, 428, 290, 60, '▶  SPIELEN', { fontSize: 25, onClick: () => this.scene.start('CityScene') });
        [
            { t: 'ALBUM', x: 175, c: UI.CYAN, s: 'AlbumScene' },
            { t: 'SHOP', x: 400, c: UI.YELLOW, s: 'ShopScene' },
            { t: 'ERFOLGE', x: 625, c: UI.PURPLE, s: 'AchievementsScene' }
        ].forEach(b => UI.button(this, b.x, 498, 190, 46, b.t, { color: b.c, fontSize: 17, onClick: () => this.scene.start(b.s) }));
    }

    toggle(x, y, emoji, fn, state, reload) {
        const bg = this.add.circle(x, y, 20, state ? 0x00ff88 : 0x333a4d).setInteractive({ useHandCursor: true });
        bg.setStrokeStyle(2, 0xffffff, 0.4);
        this.add.text(x, y, emoji, { font: '16px Arial' }).setOrigin(0.5);
        bg.on('pointerdown', () => {
            musicEngine.initialize();
            const on = fn();
            bg.setFillStyle(on ? 0x00ff88 : 0x333a4d);
            // Der Bildlook haengt an der Kamera - Szene neu aufbauen
            if (reload) this.time.delayedCall(0, () => this.scene.restart());
        });
    }
}


// ======================================================================
// ZOBEL-STADT
// ======================================================================
class CityScene extends Phaser.Scene {
    constructor() { super({ key: 'CityScene' }); }
    init(data) { this.justCleared = (data && data.justCleared) || null; }

    create() {
        Art.build(this);
        this.cameras.main.setBackgroundColor('#06070f');
        PostFX.apply(this, { bloomStrength: 0.6, vignetteStrength: 0.42 });
        this.order = CharacterManager.characters;
        this.buildings = {};

        Sky.gradient(this, 0x1c1140, 0x05060f);
        UI.starfield(this, 60, 0xffffff);
        this.moon();
        this.skyline();
        this.street();
        FX.ambient(this, 0x88aaff, 16);

        this.mixTower();
        this.drawBuildings();
        this.infoBar();
        this.topBar();
        Sky.grain(this);

        Handheld.overlay(this);
        if (this.justCleared) this.celebrateUnlock(this.justCleared);
        this.input.keyboard.on('keydown-ESC', () => this.scene.start('StartScreen'));
    }

    moon() {
        this.add.image(690, 80, 'fx-glow').setTint(0xfff6d0).setBlendMode(Phaser.BlendModes.ADD)
            .setScale(1.5).setAlpha(0.35).setDepth(-960);
        this.add.circle(690, 80, 30, 0xf7f2d8, 0.95).setDepth(-950);
        this.add.circle(682, 72, 7, 0xe4dcbb, 0.5).setDepth(-949);
        this.add.circle(700, 90, 5, 0xe4dcbb, 0.4).setDepth(-949);
    }

    skyline() {
        // Zwei Ebenen Häuser für Tiefenwirkung
        for (let layer = 0; layer < 2; layer++) {
            const g = this.add.graphics().setDepth(-940 + layer * 10);
            const shade = layer === 0 ? 0x0d1230 : 0x141a3c;
            const maxH = layer === 0 ? 200 : 150;
            let x = -20;
            while (x < 830) {
                const w = Phaser.Math.Between(44, 92);
                const h = Phaser.Math.Between(70, maxH);
                g.fillStyle(shade, 1);
                g.fillRect(x, 340 - h, w, h + 120);
                for (let wy = 340 - h + 12; wy < 330; wy += 18) {
                    for (let wx = x + 8; wx < x + w - 8; wx += 16) {
                        if (Math.random() < 0.32) {
                            g.fillStyle(Math.random() < 0.5 ? 0xffd93d : 0x00d4ff, 0.45 + layer * 0.2);
                            g.fillRect(wx, wy, 5, 7);
                        }
                    }
                }
                x += w + Phaser.Math.Between(2, 12);
            }
        }
    }

    street() {
        const g = this.add.graphics().setDepth(-900);
        g.fillStyle(0x0d1024, 1); g.fillRect(0, 468, 800, 132);
        g.fillStyle(0x00ff88, 0.10); g.fillRect(0, 468, 800, 3);
        g.fillStyle(0x2b3160, 0.9);
        for (let x = 10; x < 800; x += 46) g.fillRect(x, 528, 24, 4);
        // Straßenlaternen mit Lichtkegel
        [60, 300, 540, 770].forEach(x => {
            this.add.image(x, 500, 'fx-glow').setTint(0xffd08a).setBlendMode(Phaser.BlendModes.ADD)
                .setScale(1.1, 0.55).setAlpha(0.16).setDepth(-890);
        });
    }

    mixTower() {
        const cx = 400, baseY = 448;
        const c = this.add.container(cx, 0).setDepth(-880);
        const glow = this.add.image(0, 240, 'fx-glow').setTint(0xff00cc)
            .setBlendMode(Phaser.BlendModes.ADD).setDisplaySize(280, 460).setAlpha(0.2);
        const g = this.add.graphics();
        g.fillStyle(0x160b34, 1); g.fillRect(-58, 120, 116, baseY - 120);
        g.lineStyle(2, 0xff00cc, 0.55); g.strokeRect(-58, 120, 116, baseY - 120);
        for (let y = 140; y < baseY - 10; y += 26) {
            g.fillStyle((y / 26) % 2 < 1 ? 0x00d4ff : 0xff00cc, 0.5);
            g.fillRect(-48, y, 96, 5);
        }
        g.fillStyle(0x160b34, 1); g.fillTriangle(-58, 120, 58, 120, 0, 60);
        g.lineStyle(2, 0xffd93d, 0.85); g.strokeTriangle(-58, 120, 58, 120, 0, 60);
        c.add([glow, g]);

        const beacon = this.add.image(0, 56, 'fx-glow').setTint(0xffd93d)
            .setBlendMode(Phaser.BlendModes.ADD).setScale(0.5);
        c.add(beacon);
        this.tweens.add({ targets: beacon, scale: 1.1, alpha: 0.3, duration: 700, yoyo: true, repeat: -1 });

        const sign = this.add.text(0, 178, 'WILDER\nMIX', {
            font: 'bold 22px Orbitron', fill: '#ffffff', align: 'center'
        }).setOrigin(0.5);
        sign.setShadow(0, 0, '#ff00cc', 16, false, true).setStroke('#ff00cc', 3);
        c.add(sign);
        this.tweens.add({ targets: sign, alpha: 0.7, duration: 900, yoyo: true, repeat: -1 });
        c.add(this.add.text(0, 232, 'alle Figuren gemischt', { font: '10px Orbitron', fill: '#9aa3c8' }).setOrigin(0.5));
        c.add(this.add.text(0, 252, 'Rekord ' + (playerData.modeHighScores.classic || 0), { font: '10px Orbitron', fill: '#ffd93d' }).setOrigin(0.5));

        const hit = this.add.rectangle(cx, 190, 130, 270, 0xffffff, 0.001).setInteractive({ useHandCursor: true }).setDepth(-870);
        hit.on('pointerover', () => { this.showInfo('WILDER MIX', 'Endlose Wellen mit allen Figuren - Boss alle drei Wellen', UI.PURPLE); c.setScale(1.03); });
        hit.on('pointerout', () => { this.clearInfo(); c.setScale(1); });
        hit.on('pointerdown', () => {
            musicEngine.initialize(); musicEngine.playSFX('click');
            Juice.flash(this, 0xff00cc, 0.5, 260);
            this.time.delayedCall(170, () => this.scene.start('ModeSelectScene'));
        });
    }

    drawBuildings() {
        const xs = [95, 245, 400, 555, 705];
        this.order.forEach((key, i) => {
            const char = CharacterManager.data[key];
            this.drawBuilding(xs[i], 450, char, key,
                playerData.isStageUnlocked(key, this.order), playerData.hasCleared(key));
        });
    }

    drawBuilding(x, y, char, key, unlocked, cleared) {
        const c = this.add.container(x, y).setDepth(10);
        const w = 128, h = 108;

        if (unlocked) {
            c.add(this.add.image(0, 6, 'fx-glow').setTint(char.color)
                .setBlendMode(Phaser.BlendModes.ADD).setDisplaySize(w * 1.7, h * 2).setAlpha(0.16));
        }
        const g = this.add.graphics();
        g.fillStyle(0x000000, 0.5); g.fillRoundedRect(-w / 2 + 4, -h / 2 + 7, w, h, 11);
        g.fillStyle(unlocked ? char.buildingColor : 0x1b1f35, 0.96); g.fillRoundedRect(-w / 2, -h / 2, w, h, 11);
        g.fillStyle(unlocked ? char.color : 0x2b3150, 1);
        g.fillTriangle(-w / 2 - 8, -h / 2, w / 2 + 8, -h / 2, 0, -h / 2 - 30);
        g.lineStyle(2, unlocked ? 0xffffff : 0x3d4568, unlocked ? 0.85 : 0.5);
        g.strokeRoundedRect(-w / 2, -h / 2, w, h, 11);
        c.add(g);

        if (unlocked) {
            c.add(this.add.image(0, 34, 'fx-shadow').setDisplaySize(80, 22).setAlpha(0.5));
            let sp;
            if (char.image === 'dude' && this.textures.exists('dude')) sp = this.add.sprite(0, -4, 'dude', 4).setScale(char.scale * 0.75);
            else if (this.textures.exists(char.image)) sp = this.add.image(0, -4, char.image).setScale(char.scale * 0.62);
            else sp = Zobel.draw(this, 0, -4, 0.34, char.color);
            c.add(sp);
            this.tweens.add({ targets: sp, y: -11, duration: Phaser.Math.Between(900, 1500), yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
            c.add(this.add.text(0, -h / 2 - 44, char.genre, { font: 'bold 9px Orbitron', fill: UI.hex(char.color) }).setOrigin(0.5));
        } else {
            c.add(this.add.text(0, -4, '🔒', { font: '34px Arial' }).setOrigin(0.5).setAlpha(0.7));
        }

        const plate = this.add.graphics();
        plate.fillStyle(0x000000, 0.7); plate.fillRoundedRect(-w / 2 + 6, h / 2 - 26, w - 12, 20, 5);
        c.add(plate);
        c.add(this.add.text(0, h / 2 - 16, unlocked ? char.name : '???', {
            font: 'bold 12px Orbitron', fill: unlocked ? '#ffffff' : '#6c7590'
        }).setOrigin(0.5));

        if (cleared) {
            const star = this.add.text(w / 2 - 14, -h / 2 - 6, '⭐', { font: '18px Arial' }).setOrigin(0.5);
            c.add(star);
            this.tweens.add({ targets: star, angle: { from: -12, to: 12 }, duration: 1400, yoyo: true, repeat: -1 });
        }

        const hit = this.add.rectangle(x, y - 8, w + 16, h + 44, 0xffffff, 0.001)
            .setInteractive({ useHandCursor: true }).setDepth(11);
        hit.on('pointerover', () => {
            c.setScale(1.05);
            if (unlocked) {
                this.showInfo(char.stageName.toUpperCase(),
                    char.location + '  •  ' + char.genre + '  •  Rekord ' + (playerData.stageHighScores[key] || 0) +
                    (cleared ? '  •  geschafft ⭐' : ''), char.color);
            } else {
                const prev = CharacterManager.data[this.order[this.order.indexOf(key) - 1]];
                this.showInfo('NOCH VERSCHLOSSEN', 'Schaffe zuerst ' + prev.stageName, 0x6c7590);
            }
        });
        hit.on('pointerout', () => { c.setScale(1); this.clearInfo(); });
        hit.on('pointerdown', () => {
            if (!unlocked) {
                musicEngine.playSFX('lose');
                Juice.shake(this, 0.4, 140);
                this.tweens.add({ targets: c, x: { from: x - 5, to: x + 5 }, duration: 50, yoyo: true, repeat: 2, onComplete: () => { c.x = x; } });
                return;
            }
            musicEngine.initialize(); musicEngine.playSFX('click');
            FX.shockwave(this, x, y, char.color, 260);
            Juice.flash(this, char.color, 0.55, 280);
            this.time.delayedCall(230, () => {
                if (!playerData.hasSeenStory(key + '_intro')) this.scene.start('StoryScene', { character: key, type: 'intro' });
                else this.scene.start('GameScene', { mode: 'stage', soloCharacter: key });
            });
        });
        this.buildings[key] = c;
    }

    topBar() {
        const g = this.add.graphics().setDepth(2600);
        g.fillStyle(0x000000, 0.6); g.fillRoundedRect(8, 8, 784, 42, 11);
        g.lineStyle(2, 0x00ff88, 0.25); g.strokeRoundedRect(8, 8, 784, 42, 11);
        const t = this.add.text(24, 29, 'ZOBEL-STADT', { font: 'bold 20px Orbitron', fill: '#ffffff' }).setOrigin(0, 0.5).setDepth(2601);
        t.setShadow(0, 0, '#00ff88', 12, false, true);
        this.add.text(400, 29, playerData.clearedStages.length + ' / ' + this.order.length + ' Stages geschafft',
            { font: '12px Orbitron', fill: '#9aa3c8' }).setOrigin(0.5).setDepth(2601);
        this.add.text(776, 29, '💰 ' + playerData.coins, { font: 'bold 14px Orbitron', fill: '#ffd93d' }).setOrigin(1, 0.5).setDepth(2601);
        UI.button(this, 62, 570, 108, 34, '← MENÜ', { color: UI.RED, filled: false, fontSize: 12, onClick: () => this.scene.start('StartScreen') });
        UI.button(this, 738, 570, 108, 34, 'ALBUM', { color: UI.CYAN, filled: false, fontSize: 12, onClick: () => this.scene.start('AlbumScene') });
    }

    infoBar() {
        this.infoBg = this.add.graphics().setDepth(2590);
        this.infoTitle = this.add.text(400, 556, '', { font: 'bold 14px Orbitron', fill: '#ffffff' }).setOrigin(0.5).setDepth(2601);
        this.infoText = this.add.text(400, 578, '', { font: '11px Orbitron', fill: '#9aa3c8' }).setOrigin(0.5).setDepth(2601);
        this.clearInfo();
    }
    showInfo(title, text, color) {
        this.infoBg.clear();
        this.infoBg.fillStyle(0x000000, 0.65); this.infoBg.fillRoundedRect(170, 542, 460, 48, 10);
        this.infoBg.lineStyle(2, color, 0.7); this.infoBg.strokeRoundedRect(170, 542, 460, 48, 10);
        this.infoTitle.setText(title).setColor(color === 0x6c7590 ? '#ffffff' : UI.hex(color));
        this.infoText.setText(text);
    }
    clearInfo() {
        this.infoBg.clear();
        this.infoTitle.setText('Wähle ein Gebäude').setColor('#ffffff');
        this.infoText.setText('Jede Figur hat ihre eigene Stage - in der Mitte wartet der wilde Mix');
    }

    celebrateUnlock(clearedKey) {
        const next = this.order[this.order.indexOf(clearedKey) + 1];
        if (!next || !this.buildings[next]) return;
        const target = this.buildings[next];
        const ch = CharacterManager.data[next];
        this.time.delayedCall(420, () => {
            musicEngine.playSFX('win');
            FX.burst(this, target.x, target.y, ch.color, 30, 300);
            FX.shockwave(this, target.x, target.y, ch.color, 320);
            const t = this.add.text(target.x, target.y - 112, 'NEU!', {
                font: 'bold 28px Orbitron', fill: '#ffd93d', stroke: '#000000', strokeThickness: 6
            }).setOrigin(0.5).setDepth(2700).setScale(0);
            this.tweens.add({ targets: t, scale: 1, duration: 320, ease: 'Back.easeOut' });
            this.tweens.add({ targets: target, scaleX: 1.12, scaleY: 1.12, duration: 260, yoyo: true, repeat: 3 });
            this.time.delayedCall(2200, () => this.tweens.add({ targets: t, alpha: 0, duration: 300, onComplete: () => t.destroy() }));
        });
    }
}

// ======================================================================
// STORY
// ======================================================================
class StoryScene extends Phaser.Scene {
    constructor() { super({ key: 'StoryScene' }); }
    init(data) {
        this.charKey = data.character;
        this.type = data.type || 'intro';
        this.stageScore = data.score || 0;
        this.playLog = data.log || null;
        this.isFinishing = false;
    }
    create() {
        Art.build(this);
        const char = CharacterManager.data[this.charKey];
        this.char = char;
        this.panels = char.story[this.type];
        this.index = 0;

        this.cameras.main.setBackgroundColor('#05060d');
        PostFX.apply(this, { bloomStrength: 0.5 });
        Sky.build(this, this.charKey, { grain: true });

        // Strahlenkranz hinter der Figur
        const rays = this.add.graphics().setDepth(-500);
        rays.fillStyle(char.color, 0.09);
        for (let i = 0; i < 14; i++) {
            const a = (Math.PI * 2 * i) / 14;
            rays.fillTriangle(0, 0, Math.cos(a) * 700, Math.sin(a) * 700, Math.cos(a + 0.12) * 700, Math.sin(a + 0.12) * 700);
        }
        rays.setPosition(400, 264);
        this.tweens.add({ targets: rays, angle: 360, duration: 44000, repeat: -1 });

        const shade = this.add.graphics().setDepth(1500);
        shade.fillStyle(0x000000, 0.6); shade.fillRect(0, 0, 800, 112);
        const title = this.add.text(400, 54, char.stageName.toUpperCase(), {
            font: 'bold 30px Orbitron', fill: '#ffffff'
        }).setOrigin(0.5).setDepth(1600);
        title.setShadow(0, 3, '#000000', 8).setStroke(UI.hex(char.color), 5);
        this.add.text(400, 88, char.genre + '  •  ' + char.location, { font: '12px Orbitron', fill: '#9aa3c8' }).setOrigin(0.5).setDepth(1600);

        this.add.image(400, 356, 'fx-shadow').setDisplaySize(180, 44).setAlpha(0.45).setDepth(9);
        this.sprite = this.makeSprite(char, 400, 268);
        this.tweens.add({ targets: this.sprite, y: 254, duration: 1100, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

        const box = UI.panel(this, 400, 440, 630, 112, char.color, 0.1);
        box.setDepth(1500);
        this.panelText = this.add.text(400, 432, '', {
            font: '17px Orbitron', fill: '#ffffff', align: 'center', wordWrap: { width: 560 }
        }).setOrigin(0.5).setDepth(1600);
        this.pageDots = this.add.graphics().setDepth(1600);
        this.nextHint = this.add.text(676, 478, '▶', { font: 'bold 18px Orbitron', fill: UI.hex(char.color) }).setOrigin(0.5).setDepth(1600);
        this.tweens.add({ targets: this.nextHint, alpha: 0.3, duration: 600, yoyo: true, repeat: -1 });
        this.add.text(400, 532, 'Klick / SPACE = weiter    •    ESC = überspringen', { font: '11px Orbitron', fill: '#4d5468' }).setOrigin(0.5).setDepth(1600);

        this.showPanel();
        CharacterManager.setCharacter(this.charKey);
        CharacterManager.playJingle(1.0);

        this.input.on('pointerdown', () => this.advance());
        this.input.keyboard.on('keydown-SPACE', () => this.advance());
        this.input.keyboard.on('keydown-ENTER', () => this.advance());
        this.input.keyboard.on('keydown-ESC', () => this.finish());
    }

    makeSprite(char, x, y) {
        if (char.image === 'dude' && this.textures.exists('dude')) {
            const s = this.add.sprite(x, y, 'dude', 4).setScale(char.scale * 1.5).setDepth(10);
            if (s.play) s.play('dude_idle');
            return s;
        }
        if (this.textures.exists(char.image)) return this.add.image(x, y, char.image).setScale(char.scale * 1.2).setDepth(10);
        return Zobel.draw(this, x, y, 0.8, char.color).setDepth(10);
    }

    showPanel() {
        this.panelText.setText(this.panels[this.index]).setAlpha(0);
        this.tweens.add({ targets: this.panelText, alpha: 1, duration: 220 });
        Juice.squash(this, this.sprite, 0.12, 220);
        musicEngine.playSFX('click');
        this.pageDots.clear();
        const n = this.panels.length, gap = 16, sx = 400 - ((n - 1) * gap) / 2;
        for (let i = 0; i < n; i++) {
            this.pageDots.fillStyle(i === this.index ? this.char.color : 0x39405c, 1);
            this.pageDots.fillCircle(sx + i * gap, 478, i === this.index ? 5 : 3.5);
        }
        this.nextHint.setText(this.index < n - 1 ? '▶' : '▶▶');
    }

    advance() {
        this.index++;
        if (this.index >= this.panels.length) this.finish(); else this.showPanel();
    }

    finish() {
        if (this.isFinishing) return;
        this.isFinishing = true;
        playerData.markStorySeen(this.charKey + '_' + this.type);
        const veil = this.add.rectangle(400, 300, 800, 600, 0x000000, 0).setDepth(9000);
        this.tweens.add({ targets: veil, alpha: 1, duration: 220 });
        this.time.delayedCall(240, () => {
            if (this.type === 'intro') this.scene.start('GameScene', { mode: 'stage', soloCharacter: this.charKey });
            else this.scene.start('StageClearScene', { character: this.charKey, score: this.stageScore, log: this.playLog });
        });
    }
}

            { font: 'bold 13px Orbitron', fill: '#00d4ff' }).setOrigin(0.5);

        UI.button(this, 250, 508, 210, 50, '🏙  ZUR STADT', { fontSize: 17, onClick: () => this.scene.start('CityScene', { justCleared: this.charKey }) });
        UI.button(this, 550, 508, 210, 50, '↻ NOCHMAL', { color: UI.CYAN, fontSize: 17, onClick: () => this.scene.start('GameScene', { mode: 'stage', soloCharacter: this.charKey }) });
        UI.button(this, 400, 566, 170, 36, '← MENÜ', { color: UI.RED, filled: false, fontSize: 13, onClick: () => this.scene.start('StartScreen') });

        this.input.keyboard.on('keydown-ESC', () => this.scene.start('CityScene', { justCleared: this.charKey }));
        this.input.keyboard.on('keydown-ENTER', () => this.scene.start('CityScene', { justCleared: this.charKey }));
    }

    // Reihe kleiner Felder: jedes gespielte Minispiel mit Haken oder Kreuz.
    // Sie tauchen nacheinander auf - der kleine Rueckblick am Stage-Ende.
    drawPlayLog() {
        const log = this.playLog;
        if (!log || !log.length) return;
        const shown = log.slice(-16);
        const cols = Math.min(shown.length, 8);
        const rows = Math.ceil(shown.length / 8);
        const cell = 30, gap = 4;
        const startX = 400 - ((cols - 1) * (cell + gap)) / 2;
        const startY = 458 - ((rows - 1) * (cell + gap)) / 2;

        this.add.text(400, 414, 'DEIN LAUF', { font: 'bold 10px Orbitron', fill: '#8b93aa' }).setOrigin(0.5);

        shown.forEach((entry, i) => {
            const x = startX + (i % 8) * (cell + gap);
            const y = startY + Math.floor(i / 8) * (cell + gap);
            const box = this.add.container(x, y).setAlpha(0).setScale(0.3);
            const g = this.add.graphics();
            const col = entry.won ? 0x00ff88 : 0xff5c7a;
            g.fillStyle(col, entry.won ? 0.24 : 0.16);
            g.fillRoundedRect(-cell / 2, -cell / 2, cell, cell, 5);
            g.lineStyle(2, col, 0.9);
            g.strokeRoundedRect(-cell / 2, -cell / 2, cell, cell, 5);
            box.add(g);
            box.add(this.add.text(0, 0, entry.won ? '✓' : '✕', {
                font: 'bold 15px Orbitron', fill: entry.won ? '#00ff88' : '#ff5c7a'
            }).setOrigin(0.5));
            // Kleine Punkte zeigen die Schwierigkeitsstufe
            for (let d = 0; d < entry.level; d++) {
                box.add(this.add.circle(-6 + d * 6, cell / 2 - 4, 1.6, 0xffd93d));
            }
            this.tweens.add({
                targets: box, alpha: 1, scale: 1, duration: 220,
                delay: 700 + i * 55, ease: 'Back.easeOut'
            });
        });
    }
}
